<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>自检 · Content Studio</title>
  <style>
    html { background:linear-gradient(135deg,#0d6efd,#6610f2); min-height:100%; }
    body { font-family:system-ui,sans-serif; margin:0; padding:56px 16px 32px; }
    .card { background:#fff; border-radius:18px; padding:28px; max-width:600px; margin:0 auto; box-shadow:0 16px 50px rgba(0,0,0,.22); }
    h1 { margin:0 0 20px 0; color:#2a2a3a; }
    .back { position:fixed; top:12px; left:12px; z-index:10; background:rgba(255,255,255,.9); color:#333; text-decoration:none; padding:6px 14px; border-radius:6px; font-size:20px; }
    .check-item { display:flex; align-items:center; gap:12px; padding:16px 0; border-bottom:1px solid #f0f0f0; }
    .check-item:last-child { border:none; }
    .icon { font-size:24px; width:32px; text-align:center; }
    .info h3 { margin:0 0 2px 0; font-size:15px; }
    .info p { margin:0; font-size:13px; color:#888; }
    .status-pending { color:#999; }
    .status-ok { color:#2d8; }
    .status-fail { color:#e55; }
    .status-skip { color:#b80; }
    .actions { margin-top:20px; text-align:center; }
    .actions button { padding:10px 28px; font-size:15px; border:none; border-radius:8px; cursor:pointer; background:#6610f2; color:#fff; }
    .actions button:hover { background:#5a0ed1; }
    .actions a { margin-left:12px; color:#6610f2; text-decoration:none; font-size:14px; }
  </style>
</head>
<body>
  <a href="/" class="back" title="返回">←</a>
  <div class="card">
    <h1>🔍 环境自检</h1>
    <div class="check-item" id="row-llm">
      <div class="icon status-pending">⏳</div>
      <div class="info"><h3>LLM 文本接口</h3><p>检测中…</p></div>
    </div>
    <div class="check-item" id="row-comfy">
      <div class="icon status-pending">⏳</div>
      <div class="info"><h3>ComfyUI 图像接口</h3><p>检测中…</p></div>
    </div>
    <div class="check-item" id="row-wechat">
      <div class="icon status-pending">⏳</div>
      <div class="info"><h3>公众号草稿箱</h3><p>检测中…</p></div>
    </div>
    <div class="actions">
      <button onclick="runCheck()">重新检测</button>
      <a href="/settings">去设置</a>
    </div>
  </div>
  <script>
    async function runCheck(){
      const rows = {llm:'row-llm', comfy:'row-comfy', wechat:'row-wechat'};
      const labels = {llm:'LLM 文本接口', comfy:'ComfyUI 图像接口', wechat:'公众号草稿箱'};
      // reset
      Object.values(rows).forEach(id => {
        const el = document.getElementById(id);
        el.querySelector('.icon').className = 'icon status-pending';
        el.querySelector('.icon').textContent = '⏳';
        el.querySelector('p').textContent = '检测中…';
      });
      try {
        const r = await fetch('/api/check');
        const data = await r.json();
        for (const [key, id] of Object.entries(rows)) {
          const item = data[key];
          const el = document.getElementById(id);
          const icon = el.querySelector('.icon');
          const p = el.querySelector('p');
          if (item.ok === true) {
            icon.className = 'icon status-ok'; icon.textContent = '✅';
          } else if (item.ok === null) {
            icon.className = 'icon status-skip'; icon.textContent = '⏭️';
          } else {
            icon.className = 'icon status-fail'; icon.textContent = '❌';
          }
          p.textContent = item.detail;
        }
      } catch(e) {
        Object.values(rows).forEach(id => {
          const el = document.getElementById(id);
          el.querySelector('.icon').className = 'icon status-fail';
          el.querySelector('.icon').textContent = '❌';
          el.querySelector('p').textContent = '检测失败：' + e.message;
        });
      }
    }
    runCheck();
  </script>
</body>
</html>
