<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>历史 · Content Studio</title>
  <style>
    html { background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%); min-height: 100%; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 56px 16px 32px; }
    .card { background:#fff; border-radius:18px; padding:24px; max-width:820px; margin:0 auto; box-shadow:0 16px 50px rgba(0,0,0,0.22); }
    h1 { margin:0 0 4px 0; color:#2a2a3a; }
    .toolbar { display:flex; align-items:center; gap:12px; padding:8px 0 12px; border-bottom:2px solid #f0f0f0; margin-bottom:4px; }
    .toolbar button { background:#e55; color:#fff; border:none; border-radius:6px; padding:5px 14px; cursor:pointer; font-size:14px; }
    .toolbar button:hover { background:#c44; }
    .toolbar label { font-size:14px; color:#555; cursor:pointer; }
    .item { padding:12px 0; border-bottom:1px solid #eee; display:flex; align-items:flex-start; gap:10px; }
    .item input[type=checkbox] { margin-top:4px; flex-shrink:0; }
    .item .body { flex:1; }
    .item a { color:#2575fc; text-decoration:none; font-weight:600; font-size:16px; }
    .meta { color:#888; font-size:13px; }
    .back { position:fixed; top:12px; left:12px; z-index:10; background:rgba(255,255,255,0.9); color:#333; text-decoration:none; padding:6px 14px; border-radius:6px; font-size:20px; }
    .tag { display:inline-block; background:#eef; color:#6a11cb; border-radius:4px; padding:1px 7px; font-size:12px; margin-right:6px; }
    .empty { color:#999; padding:24px 0; text-align:center; }
    .del-btn { background:#e55; color:#fff; border:none; border-radius:4px; padding:2px 10px; cursor:pointer; font-size:13px; flex-shrink:0; }
  </style>
</head>
<body>
  <a href="/" class="back" title="返回">←</a>
  <div class="card">
    <h1>历史记录</h1>
    {% if not items %}
      <div class="empty">还没有生成过文章。</div>
    {% else %}
    <div class="toolbar">
      <label><input type="checkbox" id="selectAll" onchange="toggleAll(this)"> 全选</label>
      <button onclick="delSelected()">删除选中</button>
    </div>
    {% endif %}
    {% for it in items %}
      <div class="item" id="item-{{ it.id }}">
        <input type="checkbox" class="row-check" data-id="{{ it.id }}">
        <div class="body">
          <a href="/job/{{ it.id }}/preview">{{ it.title }}</a>
          <span class="tag">{{ "公众号" if it.target == "wechat" else ("小红书" if it.target == "xhs" else it.target) }}</span>
          {% if it.stage != "done" %}<span class="tag" style="background:#fee;color:#b00">{{ it.stage }}</span>{% endif %}
          <button class="del-btn" onclick="del('{{ it.id }}', this)">删除</button>
          <div class="meta">{{ it.created_at }}</div>
        </div>
      </div>
    {% endfor %}
  </div>
  <script>
    function del(id, btn){
      if(!confirm('确定删除这篇文章？')) return;
      fetch('/job/'+id, {method:'DELETE'}).then(r=>{
        if(r.ok) document.getElementById('item-'+id)?.remove();
        else alert('删除失败');
      });
    }
    function toggleAll(cb){
      document.querySelectorAll('.row-check').forEach(c => c.checked = cb.checked);
    }
    async function delSelected(){
      const ids = [...document.querySelectorAll('.row-check:checked')].map(c => c.dataset.id);
      if(!ids.length){ alert('请先勾选要删除的'); return; }
      if(!confirm('确定删除选中的 ' + ids.length + ' 篇？')) return;
      for(const id of ids){
        await fetch('/job/'+id, {method:'DELETE'});
        document.getElementById('item-'+id)?.remove();
      }
      document.getElementById('selectAll').checked = false;
    }
  </script>
</body>
</html>
