<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8"><title>设置 · Content Studio</title>
  <style>
    html { background: linear-gradient(135deg, #fde047 0%, #4ade80 100%); min-height: 100%; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 56px 16px 32px; }
    .card { background: #fff; border-radius: 18px; padding: 28px; max-width: 620px; margin: 0 auto; box-shadow: 0 16px 50px rgba(0,0,0,0.22); }
    h1 { margin: 0 0 8px 0; color: #2a2a3a; }
    h3 { margin-top: 22px; color: #333; }
    input, select { width: 100%; border: 1px solid #ccc; border-radius: 6px; padding: 7px; box-sizing: border-box; }
    input:focus, select:focus { outline: none; border-color: #16a34a; }
    .row { margin: 10px 0; }
    button { padding: 9px 18px; background: #16a34a; color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
    button:hover { background: #15803d; }
    .back { position: fixed; top: 12px; left: 12px; z-index: 10; background: rgba(255,255,255,0.9); color: #333; text-decoration: none; padding: 6px 14px; border-radius: 6px; font-size: 20px; }
  </style>
</head>
<body>
  <a href="/" class="back" title="返回">←</a>
  <div class="card">
    <h1>设置</h1>
    <form id="f">
      <h3>文本 LLM (OpenAI 兼容)</h3>
      <div class="row"><label>当前 Provider</label>
        <select name="active_provider">
          {% for p in cfg.providers %}<option value="{{ p.name }}" {% if p.name==cfg.active_provider %}selected{% endif %}>{{ p.name }}</option>{% endfor %}
        </select>
      </div>
      {% for p in cfg.providers %}
      <div class="row"><label>{{ p.name }} · Base URL</label><input name="base_url_{{ p.name }}" value="{{ p.base_url }}"></div>
      <div class="row"><label>{{ p.name }} · API Key</label><input name="key_{{ p.name }}" value="{{ p.api_key }}" type="password"></div>
      <div class="row"><label>{{ p.name }} · 模型</label><input name="model_{{ p.name }}" value="{{ p.model }}"></div>
      {% endfor %}
      <h3>ComfyUI (本地 AMD GPU)</h3>
      <div class="row"><label>Base URL</label><input name="comfy_url" value="{{ cfg.comfy.base_url }}"></div>
      <h3>公众号草稿箱</h3>
      <div class="row"><label>AppID</label><input name="app_id" value="{{ cfg.wechat.app_id }}"></div>
      <div class="row"><label>AppSecret</label><input name="app_secret" value="{{ cfg.wechat.app_secret }}" type="password"></div>
      <div class="row"><button type="submit">保存</button></div>
    </form>
    <pre id="msg"></pre>
  </div>
  <script>
    document.getElementById('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const r = await fetch('/settings', { method: 'POST', body: fd });
      document.getElementById('msg').textContent = r.ok ? '已保存' : '保存失败';
    });
  </script>
</body>
</html>
