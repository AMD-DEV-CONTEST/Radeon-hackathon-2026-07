<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Content Studio · Article Generator</title>
  <style>
    html { background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%); min-height: 100%; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 32px 16px; }
    .card { background: #fff; border-radius: 18px; padding: 28px; max-width: 820px; margin: 0 auto; box-shadow: 0 16px 50px rgba(0,0,0,0.22); }
    h1 { margin: 0 0 4px 0; color: #2a2a3a; }
    .lead { color: #666; margin-top: 0; }
    textarea { width: 100%; height: 120px; min-height: 120px; box-sizing: border-box; overflow: hidden; resize: none; }
    .row { margin: 12px 0; }
    button { padding: 9px 18px; background: #2575fc; color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
    button:hover { background: #1a66e8; }
    .prow { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
    .prow img { width: 64px; height: 64px; object-fit: cover; border: 1px solid #ccc; border-radius: 6px; }
    .prow select { padding: 4px; }
    input, textarea, select { border: 1px solid #ccc; border-radius: 6px; padding: 7px; box-sizing: border-box; }
    input:focus, textarea:focus { outline: none; border-color: #6a11cb; }
    input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal.hidden { display: none; }
    .modal-panel { background: #fff; border-radius: 14px; padding: 24px; width: 760px; max-width: 94vw; max-height: 86vh; overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .modal-panel input { font-size: 13px; width: 100%; }
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .close-btn { background: #eee; color: #333; border: none; border-radius: 6px; cursor: pointer; padding: 4px 10px; font-size: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Content Studio</h1>
    <p class="lead">Theme + Photos + Text → Generate WeChat article & publish to draft box (per-photo style selection)</p>
    <form id="f" enctype="multipart/form-data">
      <div class="row"><label>Theme</label><br><input name="theme" style="width:100%" placeholder="e.g. Hardware Burn-in Testing"></div>
      <div class="row"><label>Material Text</label><br><textarea name="text" id="text"></textarea></div>
      <div class="row"><label>Photos (multiple selections accumulate; per-photo style)</label><br><input name="images" type="file" multiple accept="image/*" id="fileinput"></div>
      <div class="row" id="photos"></div>
      <div class="row"><label><input type="checkbox" id="unify"> Unify all photo styles</label>
        <select id="unify_style" disabled></select>
      </div>
      <div class="row"><label><input type="checkbox" name="ocr"> Extract text from images (OCR)</label></div>
      <div class="row"><label><input type="checkbox" id="t2i"> Generate images via ComfyUI (requires ComfyUI)</label>
        <input type="number" id="t2i_count" value="2" min="1" max="6" style="width:48px"> images
      </div>
      <div class="row" id="t2i_prompt_row" style="display:none;margin-left:20px;border-left:2px solid #ddd;padding-left:12px">
        <label>Image Prompts (one per line, English, e.g.: "a futuristic city skyline at sunset, digital art, 4k")</label><br>
        <textarea id="t2i_prompt" style="height:80px" placeholder="a gaming PC with RGB lights, cyberpunk style, neon&#10;a hardware test bench with monitors, professional photography&#10;a sleek smartphone on dark background, product shot"></textarea>
      </div>
      <div class="row"><label>Publish to</label>
        <select name="target">
          <option value="wechat">WeChat (draft box)</option>
          <option value="xhs">Xiaohongshu (copy)</option>
        </select>
        <label style="margin-left:16px">Template</label>
        <select name="template">
          <option value="">Default</option>
          <option value="review">Product Review</option>
          <option value="event">Event Promo</option>
          <option value="tutorial">Tutorial</option>
          <option value="analysis">Industry Analysis</option>
        </select>
      </div>
      <div class="row"><button type="submit">Generate</button> <a href="#" onclick="openSettings();return false;">Settings</a> <a href="/history">History</a></div>
    </form>
    <pre id="status"></pre>
  </div>

  <div id="settingsModal" class="modal hidden">
    <div class="modal-panel">
      <div class="modal-head"><b>Settings</b><button type="button" class="close-btn" onclick="closeSettings()">✕</button></div>
      <form id="settingsForm"><div id="settingsBody"></div>
        <div class="row"><button type="button" onclick="saveSettings()">Save</button> <span id="saveMsg" style="color:#16a34a"></span></div>
      </form>
    </div>
  </div>

  <script>
    const OPTIONS = {{ options | tojson }};
    const fileinput = document.getElementById('fileinput');
    const photos = document.getElementById('photos');
    const status = document.getElementById('status');
    let chosen = [];
    function applyUnified(val){ chosen.forEach(c => { c.styleId = val; }); renderRows(); }

    const unify = document.getElementById('unify');
    const unifySel = document.getElementById('unify_style');
    OPTIONS.forEach((o) => { const op = document.createElement('option'); op.value = o.id; op.textContent = o.name; unifySel.appendChild(op); });
    unifySel.value = OPTIONS[0].id;
    unify.addEventListener('change', () => {
      unifySel.disabled = !unify.checked;
      if (unify.checked) applyUnified(unifySel.value);
    });
    unifySel.addEventListener('change', () => { if (unify.checked) applyUnified(unifySel.value); });

    const txt = document.getElementById('text');
    const t2iCb = document.getElementById('t2i');
    const t2iPromptRow = document.getElementById('t2i_prompt_row');
    t2iCb.addEventListener('change', () => {
      t2iPromptRow.style.display = t2iCb.checked ? 'block' : 'none';
    });
    function autoGrow(el){ el.style.height = 'auto'; el.style.height = Math.max(120, el.scrollHeight) + 'px'; }
    txt.addEventListener('input', () => autoGrow(txt));
    autoGrow(txt);

    function renderRows() {
      photos.innerHTML = '';
      chosen.forEach((c, idx) => {
        const row = document.createElement('div');
        row.className = 'prow';
        const img = document.createElement('img');
        img.src = URL.createObjectURL(c.file);
        const sel = document.createElement('select');
        OPTIONS.forEach((o) => {
          const op = document.createElement('option');
          op.value = o.id; op.textContent = o.name;
          sel.appendChild(op);
        });
        sel.value = c.styleId;
        sel.addEventListener('change', () => { c.styleId = sel.value; });
        const name = document.createElement('span');
        name.textContent = c.file.name;
        name.style.cssText = 'font-size:13px; color:#666; flex:1;';
        const rm = document.createElement('button');
        rm.type = 'button'; rm.textContent = '✕';
        rm.style.cssText = 'background:#e55; color:#fff; border:none; border-radius:6px; padding:4px 9px; cursor:pointer; font-size:13px';
        rm.addEventListener('click', () => { chosen.splice(idx, 1); renderRows(); });
        row.appendChild(img); row.appendChild(sel); row.appendChild(name); row.appendChild(rm);
        photos.appendChild(row);
      });
    }
    fileinput.addEventListener('change', () => {
      const files = Array.from(fileinput.files);
      files.forEach((file) => {
        if (chosen.some(c => c.file.name === file.name && c.file.size === file.size)) return;
        chosen.push({ file, styleId: OPTIONS[0].id });
      });
      fileinput.value = '';
      renderRows();
    });

    document.getElementById('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!chosen.length) { status.textContent = 'Please select at least one photo'; return; }
      status.textContent = 'Submitting...';
      const fd = new FormData();
      fd.append('theme', e.target.theme.value);
      fd.append('text', e.target.text.value);
      fd.append('ocr', e.target.ocr.checked ? 'true' : '');
      fd.append('target', e.target.elements['target'].value);
      fd.append('template', e.target.elements['template'].value);
      fd.append('t2i_count', document.getElementById('t2i').checked ? document.getElementById('t2i_count').value : '0');
      fd.append('t2i_prompt', document.getElementById('t2i_prompt').value);
      chosen.forEach((c) => { fd.append('images', c.file); fd.append('styles', c.styleId); });
      const r = await fetch('/generate', { method: 'POST', body: fd });
      const data = await r.json();
      if (!r.ok) { status.textContent = 'Error: ' + (data.detail || r.status); return; }
      status.textContent = 'Generating... This may take 1-3 minutes depending on the API';
      stream(data.job_id);
    });
    function stream(jobId) {
      const startTime = Date.now();
      const es = new EventSource('/job/' + jobId + '/stream');
      es.onmessage = (ev) => {
        const j = JSON.parse(ev.data);
        const elapsed = Math.round((Date.now() - startTime) / 1000);
        const name = {llm:'Writing article', images:'Processing images'}[j.stage] || (j.stage || '');
        status.textContent = name + ' ' + Math.round((j.progress||0)*100) + '% (elapsed ' + elapsed + 's)';
        if (j.stage === 'done') { es.close(); location.href = '/job/' + jobId + '/preview'; }
        if (j.stage === 'error') { es.close(); status.textContent = 'Error: ' + (j.error||''); }
      };
      es.onerror = () => { es.close(); };
    }
    async function openSettings(){
      const cfg = await (await fetch('/api/config')).json();
      let h = '<h3>LLM (OpenAI-compatible)</h3>';
      h += '<div class="row"><label>Active Provider</label><select name="active_provider">';
      cfg.providers.forEach(p => { h += `<option value="${p.name}" ${p.name===cfg.active_provider?'selected':''}>${p.name}</option>`; });
      h += '</select></div>';
      cfg.providers.forEach(p => {
        h += `<div class="row"><label>${p.name} · Base URL</label><input name="base_url_${p.name}" value="${p.base_url}"></div>`;
        h += `<div class="row"><label>${p.name} · API Key</label><input name="key_${p.name}" value="${p.api_key}" type="password"></div>`;
        h += `<div class="row"><label>${p.name} · Model</label><input name="model_${p.name}" value="${p.model}"></div>`;
      });
      h += '<h3>ComfyUI (AMD GPU)</h3>';
      h += `<div class="row"><label>Base URL</label><input name="comfy_url" value="${cfg.comfy_url}"></div>`;
      h += '<h3>WeChat Draft Box</h3>';
      h += `<div class="row"><label>AppID</label><input name="app_id" value="${cfg.app_id}"></div>`;
      h += `<div class="row"><label>AppSecret</label><input name="app_secret" value="${cfg.app_secret}" type="password"></div>`;
      document.getElementById('settingsBody').innerHTML = h;
      document.getElementById('settingsModal').classList.remove('hidden');
    }
    function closeSettings(){ document.getElementById('settingsModal').classList.add('hidden'); }
    async function saveSettings(){
      const fd = new FormData(document.getElementById('settingsForm'));
      const r = await fetch('/settings', { method: 'POST', body: fd });
      if (r.ok) { closeSettings(); }
      else { const msg = document.getElementById('saveMsg'); msg.style.color = '#b00'; msg.textContent = 'Save failed'; }
    }
  </script>
</body>
</html>
