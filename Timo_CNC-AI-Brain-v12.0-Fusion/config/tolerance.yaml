# 公差等级配置 v1.0
# 对应手工报价表的精度等级
# 2026-05-30

tolerance_grades:
  # IT公差等级 (ISO 286)
  IT4:
    name: "超精密级"
    it_value: 0.003  # mm (基本尺寸≤3mm)
    coef: 1.8
    description: "超精密配合，需精密磨削"

  IT5:
    name: "高精密级"
    it_value: 0.004  # mm
    coef: 1.6
    description: "高精密配合，需精磨或坐标镗"

  IT6:
    name: "精密级"
    it_value: 0.006  # mm (基本尺寸≤3mm)
    coef: 1.4
    description: "精密配合，用于重要定位"

  IT7:
    name: "标准级"
    it_value: 0.010
    coef: 1.2
    description: "通用加工，普通配合"

  IT8:
    name: "普通级"
    it_value: 0.014
    coef: 1.0
    description: "一般加工，非精密配合"

  IT9:
    name: "粗糙级"
    it_value: 0.025
    coef: 0.85
    description: "粗加工，非配合尺寸"

  IT10:
    name: "最粗级"
    it_value: 0.040
    coef: 0.7
    description: "毛坯余量，未加工面"

  # 表面粗糙度 Ra 值
  surface_roughness:
    Ra0.2:
      value: 0.2
      name: "镜面"
      coef: 2.5
      process: "研磨、抛光"

    Ra0.4:
      value: 0.4
      name: "超精"
      coef: 1.8
      process: "精磨、精密车"

    Ra0.8:
      value: 0.8
      name: "精密"
      coef: 1.4
      process: "精车、铣"

    Ra1.6:
      value: 1.6
      name: "标准"
      coef: 1.0
      process: "普通车、铣"

    Ra3.2:
      value: 3.2
      name: "半精"
      coef: 0.85
      process: "粗车、粗铣"

    Ra6.3:
      value: 6.3
      name: "粗糙"
      coef: 0.7
      process: "粗加工"

    Ra12.5:
      value: 12.5
      name: "最粗"
      coef: 0.5
      process: "毛坯状态"

  # 常用公差标注对应
  common_tolerances:
    "±0.005": "IT4"
    "±0.008": "IT5"
    "±0.01": "IT6"
    "±0.02": "IT7"
    "±0.05": "IT8"
    "±0.1": "IT9"
    "±0.2": "IT10"
    "0/-0.01": "IT5"
    "0/-0.02": "IT6"
    "0/-0.05": "IT7"
    "0/-0.1": "IT8"
    "H5": "IT5"
    "H6": "IT6"
    "H7": "IT7"
    "h5": "IT5"
    "h6": "IT6"
    "h7": "IT7"
    "g5": "IT5"
    "g6": "IT6"
    "m6": "IT7"

# 工艺复杂度系数
process_complexity:
  三轴CNC: 1.0
  四轴CNC: 1.3
  五轴CNC: 1.8
  车加工: 0.8
  铣加工: 1.0
  线切割: 1.2
  放电: 1.5
  磨加工: 1.3
  抛光: 1.4
  喷砂: 1.1