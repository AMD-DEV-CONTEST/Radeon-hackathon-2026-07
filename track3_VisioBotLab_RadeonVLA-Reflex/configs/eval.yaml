base_config: configs/base.yaml

evaluation:
  # 20k-29k is reserved for Physical-1K training collection.
  seed_start: 50000
  episodes_per_task: 5
  max_retries: 1
  save_video: true
  keep_failures: true
  # Primary L1 benchmark: 20 tasks. Advanced suites enable L2–L4 explicitly.
  suite: basic
  tasks: null

interrupt:
  enabled: true
  demo_on_first_episode: true

metrics:
  - task_success_rate
  - object_accuracy
  - target_accuracy
  - first_attempt_success
  - final_success
  - recovery_success
  - completion_time
  - inference_latency
  - simulation_throughput
  - peak_vram
  - safe_interrupt_rate
  - interrupt_response_steps
  - success_by_scenario
