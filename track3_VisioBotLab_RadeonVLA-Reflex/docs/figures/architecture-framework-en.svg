<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" role="img" aria-labelledby="title desc">
  <title id="title">RadeonVLA-Reflex system architecture</title>
  <desc id="desc">Language, world RGB, wrist RGB, and proprioception enter SmolVLA. Actions pass through SafetyMonitor before Genesis. CommandSession and FailureDetector with RecoveryPolicy supervise execution.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfcf8"/>
      <stop offset="1" stop-color="#f2f5ea"/>
    </linearGradient>
    <linearGradient id="policy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#263300"/>
      <stop offset="1" stop-color="#455b08"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#263300" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#20251a"/>
    </marker>
  </defs>

  <rect width="1600" height="480" rx="28" fill="url(#background)"/>
  <text x="64" y="58" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="3" fill="#68705e">MULTIMODAL INPUTS</text>
  <text x="602" y="58" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="3" fill="#68705e">LEARNED POLICY</text>
  <text x="1015" y="58" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="3" fill="#68705e">EXECUTION BOUNDARY</text>

  <g font-family="Inter, Arial, sans-serif" font-size="25" font-weight="600" fill="#20251a">
    <rect x="64" y="91" width="335" height="58" rx="14" fill="#ffffff" stroke="#cbd1c0"/>
    <circle cx="92" cy="120" r="7" fill="#b7db28"/>
    <text x="116" y="131" font-size="23">Language command</text>

    <rect x="64" y="163" width="335" height="58" rx="14" fill="#ffffff" stroke="#cbd1c0"/>
    <circle cx="92" cy="192" r="7" fill="#6f9d20"/>
    <text x="116" y="203">World RGB</text>

    <rect x="64" y="235" width="335" height="58" rx="14" fill="#ffffff" stroke="#cbd1c0"/>
    <circle cx="92" cy="264" r="7" fill="#4f7cc2"/>
    <text x="116" y="275">Wrist RGB</text>

    <rect x="64" y="307" width="335" height="58" rx="14" fill="#ffffff" stroke="#cbd1c0"/>
    <circle cx="92" cy="336" r="7" fill="#d1a51b"/>
    <text x="116" y="347">Proprioception</text>
  </g>

  <path d="M399 120 H456 M399 192 H456 M399 264 H456 M399 336 H456 M456 120 V336" fill="none" stroke="#20251a" stroke-width="4"/>
  <path d="M456 228 H548" fill="none" stroke="#20251a" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="566" y="151" width="270" height="154" rx="24" fill="url(#policy)"/>
    <text x="701" y="219" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800" fill="#ffffff">SmolVLA</text>
    <text x="701" y="258" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.2" fill="#dcebb0">VISION · LANGUAGE · ACTION</text>
  </g>

  <path d="M836 228 H952" fill="none" stroke="#20251a" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="894" y="205" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#68705e">action</text>

  <g filter="url(#shadow)">
    <rect x="970" y="151" width="310" height="154" rx="24" fill="#ffffff" stroke="#91ad35" stroke-width="3"/>
    <text x="1125" y="218" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="800" fill="#263300">SafetyMonitor</text>
    <text x="1125" y="258" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.2" fill="#68705e">VALIDATE · INTERRUPT · RECOVER</text>
  </g>

  <path d="M1280 228 H1390" fill="none" stroke="#20251a" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="1408" y="151" width="146" height="154" rx="24" fill="#151811"/>
    <text x="1481" y="219" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="800" fill="#ffffff">Genesis</text>
    <text x="1481" y="256" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="0.7" fill="#c9d995">SIMULATION</text>
  </g>

  <path d="M1125 305 V344" fill="none" stroke="#91ad35" stroke-width="4"/>
  <g>
    <rect x="882" y="344" width="486" height="96" rx="20" fill="#f7f9f2" stroke="#91ad35" stroke-width="2"/>
    <text x="1125" y="382" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#263300">CommandSession (version)</text>
    <text x="1125" y="414" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#68705e">FailureDetector + RecoveryPolicy</text>
  </g>
</svg>
