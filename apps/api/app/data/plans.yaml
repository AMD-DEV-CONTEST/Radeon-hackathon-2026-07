# BotverseX subscription plans — single source for entitlements (Phase 1+).
# $9/mo and ¥68/mo both map to tier "pro"; ¥128/mo maps to "creator".

plans:
  free:
    display_name: 免费版
    storage_bytes: 2147483648          # 2 GB
    training_local_monthly: 5
    training_qualia_monthly: 0
    training_concurrent_max: 1
    skill_runs_monthly: 50
    inference_priority: 0
    qualia_max_hours: 0
    workflow_nodes:
      # Qualia Studio
      - hf_dataset
      - ego_dataset
      - camera_noise
      - trajectory_noise
      - depth_estimator
      - pose_action_extractor
      - world_model_generator
      - urdf_inpaint
      - idm_inverse_dynamics
      - output_dataset
      - merge_datasets
      - qualia_finetune
      - reward_model_tuning
      - job_monitor
      # Legacy compat
      - dataset_load
      - camera_map
      - finetune_job
      - skill_invoke
    verbs:
      - teleop
      - record
      - inference
      - wave
    can_publish_paid_skills: false
    commercial_license: false
    batch_jobs: false
    show_legacy_workflow_nodes: false

  pro:
    display_name: 个人会员
    storage_bytes: 21474836480         # 20 GB
    training_local_monthly: -1         # unlimited (-1)
    training_qualia_monthly: 10
    training_concurrent_max: 2
    skill_runs_monthly: 500
    inference_priority: 10
    qualia_max_hours: 24
    workflow_nodes:
      # Qualia Studio
      - hf_dataset
      - ego_dataset
      - camera_noise
      - trajectory_noise
      - depth_estimator
      - pose_action_extractor
      - world_model_generator
      - urdf_inpaint
      - idm_inverse_dynamics
      - output_dataset
      - merge_datasets
      - qualia_finetune
      - reward_model_tuning
      - job_monitor
      # Legacy compat
      - dataset_load
      - camera_map
      - finetune_job
      - skill_invoke
      - camera_denoise
      - trajectory_optimize
    verbs:
      - teleop
      - record
      - inference
      - wave
      - pick
      - place
      - grasp
      - release
    can_publish_paid_skills: false
    commercial_license: false
    batch_jobs: false
    show_legacy_workflow_nodes: true

  creator:
    display_name: 高级创作者版
    inherits: pro
    storage_bytes: 107374182400        # 100 GB
    training_local_monthly: -1
    training_qualia_monthly: 50
    training_concurrent_max: 4
    skill_runs_monthly: 2000
    inference_priority: 20
    qualia_max_hours: 48
    can_publish_paid_skills: true
    commercial_license: true
    batch_jobs: true
    show_legacy_workflow_nodes: true

tier_order:
  free: 0
  pro: 1
  creator: 2
