# ========== Pekko Actor System Configuration ==========
pekko {
  actor {
    # Default timeout for actor ask patterns (used by SupervisorActorEngine & AgentTools)
    ask-timeout = 10s

    # Default dispatcher — controls thread pool for all actors
    default-dispatcher {
      type = Dispatcher
      # Number of threads in the pool (parallelism)
      fork-join-executor {
        parallelism-min = 4
        parallelism-factor = 2.0
        parallelism-max = 16
      }
      # Throughput: max messages processed per actor before switching
      throughput = 20
    }

    # Dedicated dispatcher for blocking I/O workers (ParcelTrackingWorker, RagRetrievalWorker)
    blocking-io-dispatcher {
      type = Dispatcher
      executor = thread-pool-executor
      thread-pool-executor {
        core-pool-size-min = 2
        core-pool-size-factor = 2.0
        core-pool-size-max = 8
      }
      throughput = 5
    }

    # Dedicated dispatcher for ingestion actors (CPU-heavy embedding computation)
    ingestion-dispatcher {
      type = Dispatcher
      executor = thread-pool-executor
      thread-pool-executor {
        core-pool-size-min = 1
        core-pool-size-factor = 1.0
        core-pool-size-max = 4
      }
      throughput = 1
    }

    # Supervisor actor dispatcher — low latency, high throughput
    supervisor-dispatcher {
      type = Dispatcher
      fork-join-executor {
        parallelism-min = 2
        parallelism-factor = 1.0
        parallelism-max = 8
      }
      throughput = 50
    }
  }

  # Remote / cluster settings (disabled for single-node deployment)
  remote {
    enabled = false
  }
}