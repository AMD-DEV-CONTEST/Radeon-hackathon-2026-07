# ========== Pekko Actor System — Production Overrides ==========
# These values override the defaults in application.conf for production deployment.
pekko {
  actor {
    # Increase timeout for production workloads
    ask-timeout = 30s

    # Increase thread pool for production throughput
    default-dispatcher {
      fork-join-executor {
        parallelism-min = 8
        parallelism-factor = 3.0
        parallelism-max = 32
      }
      throughput = 50
    }

    # Increase blocking I/O dispatcher for production
    blocking-io-dispatcher {
      thread-pool-executor {
        core-pool-size-min = 4
        core-pool-size-factor = 3.0
        core-pool-size-max = 16
      }
    }

    # Increase ingestion dispatcher for production
    ingestion-dispatcher {
      thread-pool-executor {
        core-pool-size-min = 2
        core-pool-size-factor = 2.0
        core-pool-size-max = 8
      }
    }

    # Increase supervisor dispatcher for production
    supervisor-dispatcher {
      fork-join-executor {
        parallelism-min = 4
        parallelism-factor = 2.0
        parallelism-max = 16
      }
      throughput = 100
    }
  }
}