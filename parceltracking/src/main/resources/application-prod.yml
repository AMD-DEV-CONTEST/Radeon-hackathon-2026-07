spring:
  # Prod profile: PostgreSQL with pgvector (used in Docker deployment)
  datasource:
    url: jdbc:postgresql://db:5432/parceltracking
    username: parcel
    password: secret
    driver-class-name: org.postgresql.Driver

  h2:
    console:
      enabled: false

  jpa:
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        '[format_sql]': false