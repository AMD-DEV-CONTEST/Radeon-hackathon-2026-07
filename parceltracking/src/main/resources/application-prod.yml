spring:
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
  # Prod profile: PostgreSQL with pgvector (used in Docker deployment)
  datasource:
    url: jdbc:postgresql://db:5432/parceltracking
    username: postgres
    password: secret
    driver-class-name: org.postgresql.Driver

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        '[format_sql]': false

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

  ai:
    openai:
      embedding:
        enabled: false
    embedding:
      transformer:
        enabled: true
        gpu-acceleration: true
        model:
          uri: file:/app/models/onnx/model.onnx
        tokenizer:
          uri: file:/app/models/onnx/tokenizer.json
        metadata:
          model-name: sentence-transformers/all-MiniLM-L6-v2