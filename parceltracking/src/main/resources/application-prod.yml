spring:
  # Prod profile: PostgreSQL with pgvector (used in Docker deployment)
  datasource:
    url: jdbc:postgresql://db:5432/parceltracking # parcel tracking is your db name
    username: postgres # should just be postgres
    password: secret
    driver-class-name: org.postgresql.Driver

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: update #automatically creates tables from you jpa entities
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        '[format_sql]': false
      