spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true

  sql:
    init:
      mode: never

  ai:
    openai:
      api-key: test-key
      base-url: http://localhost:9999/v1
      chat:
        model: test-model
      embedding:
        enabled: false
    embedding:
      transformer:
        enabled: false

admin:
  api-key: test-admin-key