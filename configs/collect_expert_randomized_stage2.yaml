# Stage 2: expanded reachable workspace and wider object dynamics.
seed: 84
episodes: 50
output_dir: datasets/expert_randomized_stage2_release
genesis_backend: gpu
task:
  object_position: [0.65, 0.0, 0.04]
  goal_position: [0.45, 0.25, 0.04]
  control_decimation: 4
  max_episode_steps: 400
  success_threshold: 0.03
  require_release_for_success: true
  assist_grasp: true
  grasp_distance: 0.15
  grasp_offset: [0.0, 0.0, -0.07]
expert:
  approach_height: 0.12
  lift_height: 0.16
  retreat_height: 0.16
  position_tolerance: 0.025
  place_tolerance: 0.01
  grasp_tolerance: 0.075
  open_gripper: 0.04
  closed_gripper: 0.0
domain_randomization:
  mass_range: [0.05, 0.25]
  friction_range: [0.5, 1.2]
  object_position_low: [0.56, -0.12, 0.04]
  object_position_high: [0.70, 0.12, 0.04]
  goal_position_low: [0.40, 0.16, 0.04]
  goal_position_high: [0.54, 0.30, 0.04]
