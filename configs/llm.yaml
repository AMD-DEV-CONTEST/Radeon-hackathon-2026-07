llm:
  mode: mock
  endpoint: http://127.0.0.1:8080/v1
  model: local-model
  api_key: null
  timeout_seconds: 30.0
  allowed_hosts:
    - localhost
    - 127.0.0.1
    - "::1"
  max_tokens: 64
  temperature: 0.0
  retry_attempts: 2
  retry_wait_seconds: 0.1
  generation_profiles:
    structured_plan:
      thinking: false
      temperature: 0.2
      top_p: 0.8
      max_tokens: 768
    normal_dialogue:
      thinking: false
      temperature: 0.7
      top_p: 0.8
      max_tokens: 768
    complex_replan:
      thinking: true
      temperature: 0.6
      top_p: 0.95
      max_tokens: 1200
