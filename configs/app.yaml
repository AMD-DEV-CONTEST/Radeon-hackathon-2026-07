app:
  name: BuildGuard-Radeon
  environment: development
  log_level: INFO
  seed: 42
  data_dir: data
  workspace_dir: workspace
  database_path: workspace/database/buildguard.db
  retention:
    enabled: false
    event_images_days: 30
    event_clips_days: 30
    normal_frames_days: 7
    performance_logs_days: 30
    audit_logs_days: 90
  agent:
    max_plan_steps: 6
    max_replans: 1
    registered_tools:
      - echo
      - inspect_single_image
      - inspect_image_batch
      - inspect_image_batch_structured
      - search_construction_standards
      - assess_risk
      - query_task_history
      - generate_inspection_report
      - generate_event_report
      - inspect_image
      - search_memory
    confirmation_tools:
      - inspect_image_batch
      - inspect_image_batch_structured
      - generate_inspection_report
      - generate_event_report
  tools:
    inspection_image_max_items: 100
    default_timeout_seconds: 10
llm_config_path: llm.yaml
permission_config_path: permissions.yaml
monitoring_config_path: monitoring.yaml
rag_config_path: rag.yaml
vision_config_path: vision.yaml
realtime_config_path: realtime.yaml
reporting_config_path: reporting.yaml
services_config_path: services.yaml
runtime_config_path: runtime.yaml
evaluation_config_path: evaluation.yaml
