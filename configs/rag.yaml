rag:
  embedding_mode: mock
  embedding_model_path: null
  embedding_device: cpu
  embedding_batch_size: 16
  embedding_dimension: 128
  embedding_model_revision: unreported
  embedding_tokenizer_revision: unreported
  embedding_model_sha256: unreported
  embedding_query_instruction: "Represent this query for retrieval:"
  embedding_query_instruction_version: v1
  embedding_pooling: last_token
  embedding_normalize: true
  reranker_mode: mock
  reranker_model_path: null
  reranker_architecture: cross_encoder
  reranker_device: cpu
  reranker_batch_size: 8
  reranker_model_revision: unreported
  reranker_model_sha256: unreported
  reranker_enabled: true
  index_dir: workspace/indexes/construction_standards
  allowed_source_roots:
    - workspace/knowledge
  chunk_min_chars: 300
  chunk_max_chars: 700
  chunk_overlap_chars: 60
  chunker_version: structure-aware-v1
  bm25_top_k: 20
  dense_top_k: 20
  fusion_top_k: 15
  final_top_k: 5
  rrf_k: 60
  min_top_score: 0.1
  min_keyword_coverage: 0.15
  advanced:
    enabled: true
    use_llm_gate: true
    use_llm_rewriter: true
    required_retrieval_terms:
      - 规范
      - 条款
      - 依据
      - 历史
      - 风险等级
    professional_term_mappings:
      安全帽: 个体防护装备 安全帽
      临边: 临边作业 防护栏杆
      漏电: 剩余电流动作保护器 漏电保护
    entity_terms:
      - 安全帽
      - 临边
      - 洞口
      - 脚手架
      - 配电箱
      - 漏电保护
      - 高处作业
    quality_generate_threshold: 0.75
    quality_correct_threshold: 0.45
    initial_top_k: 5
    corrective_top_k: 15
    max_corrections: 1
    initial_bm25_weight: 1.0
    initial_dense_weight: 1.0
    corrective_bm25_weight: 1.25
    corrective_dense_weight: 0.75
    grounding_min_coverage: 0.25
    refusal_message: 现有本地检索证据不足，无法安全回答该问题。
