# End-to-end PPO plumbing check. This is not a final training budget.
seed: 42
device: cuda
genesis_backend: gpu
num_envs: 1
total_timesteps: 4096
residual_scale: 0.03
checkpoint: checkpoints/residual_ppo/smoke.pt
resume: null
log_dir: logs/residual_ppo_smoke
task:
  object_position: [0.65, 0.0, 0.04]
  goal_position: [0.45, 0.25, 0.04]
  control_decimation: 4
  max_episode_steps: 400
  success_threshold: 0.03
  assist_grasp: true
  grasp_distance: 0.15
  grasp_offset: [0.0, 0.0, -0.07]
ppo:
  num_steps: 128
  update_epochs: 4
  num_minibatches: 4
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
