realtime:
  allowed_video_roots:
    - workspace/cameras
  event_image_dir: workspace/events/images
  event_clip_dir: workspace/events/clips
  buffer_seconds: 20
  buffer_max_frames: 600
  buffer_memory_mb: 256
  inference_queue_size: 32
  event_queue_size: 64
  max_concurrent_cameras: 4
  static_fps: 1
  low_motion_fps: 3
  normal_fps: 2
  active_fps: 5
  suspected_fps: 8
  tracker_iou_threshold: 0.30
  tracker_max_age: 10
  tracker_min_hits: 2
  reconnect_failure_threshold: 3
  reconnect_initial_seconds: 0.25
  reconnect_multiplier: 2
  reconnect_max_seconds: 30
  event_cooldown_seconds: 10
  event_resolve_seconds: 15
  event_region_iou_threshold: 0.40
  evidence_before_seconds: 5
  evidence_after_seconds: 5
  save_event_clips: false
  clip_codec: VP80
  clip_fps: 10
  event_class_map:
    missing_helmet: helmet_missing
    unsafe_edge: dangerous_zone
    exposed_wiring: static_defect
    emergency: emergency
  event_severity:
    helmet_missing: high
    dangerous_zone: critical
    static_defect: normal
    emergency: critical
  temporal_rules:
    helmet_missing:
      m: 3
      n: 5
      alpha: 0.60
    dangerous_zone:
      m: 2
      n: 3
      alpha: 0.60
    static_defect:
      m: 2
      n: 4
      alpha: 0.60
    emergency:
      m: 1
      n: 2
      alpha: 0.75
  ppe:
    person_head_iou: 0.5
    head_helmet_iou: 0.5
    m: 3
    n: 5
    cooldown_seconds: 10
    track_max_age: 10
    person_confidence: 0.5
    head_confidence: 0.5
    helmet_confidence: 0.5
    smoothing_alpha: 0.6
  optimization:
    enabled: false
  cameras: []
  camera_policies: {}
