monitoring:
  enabled: true
  sample_interval_seconds: 1.0
  command_timeout_seconds: 5.0
  output_path: data/hardware.jsonl
  dashboard_log_path: workspace/logs/performance/dashboard.jsonl
  export_dir: workspace/logs/performance/exports
  dashboard_history_size: 1000
  scheduler:
    max_concurrent_inference: 1
    max_gpu_utilization_percent: 95
    reserved_vram_mb: 512
    oom_batch_reduction_factor: 0.5
    allow_cpu_fallback: true
    task_priorities:
      emergency_vision: 1
      risk_confirmation: 2
      normal_monitoring: 3
      agent_response: 4
      report_generation: 5
      background_indexing: 6
