# Held-out protocol: do not reuse this seed/configuration for policy training.
seed: 2026
genesis_backend: gpu
results_path: results/robustness_ik.json
task:
  object_position: [0.65, 0.0, 0.04]
  goal_position: [0.45, 0.25, 0.04]
  control_decimation: 4
  max_episode_steps: 500
  success_threshold: 0.03
  require_release_for_success: true
  require_lift_for_success: true
  lift_success_height: 0.03
  assist_grasp: true
  require_dual_finger_contact_for_assist: true
  assist_contact_steps: 3
  grasp_distance: 0.15
  grasp_offset: [0.0, 0.0, -0.07]
  robot_friction: 1.5
  gripper_kp: 300.0
  gripper_kv: 15.0
  gripper_force_limit: 100.0
  camera_enabled: true
  camera_resolution: [96, 96]
  camera_position: [1.2, -1.2, 0.9]
  camera_lookat: [0.5, 0.1, 0.1]
  camera_fov: 50.0
expert:
  approach_height: 0.12
  lift_height: 0.16
  retreat_height: 0.16
  position_tolerance: 0.025
  place_tolerance: 0.01
  grasp_tolerance: 0.075
  close_hold_steps: 16
  min_dual_finger_contact_steps: 3
  open_gripper: 0.04
  closed_gripper: 0.0
scenarios:
  - name: nominal_held_out
    episodes: 20
    domain_randomization:
      mass_range: [0.04, 0.30]
      friction_range: [0.4, 1.3]
      object_position_low: [0.54, -0.16, 0.04]
      object_position_high: [0.72, 0.16, 0.04]
      goal_position_low: [0.36, 0.12, 0.04]
      goal_position_high: [0.56, 0.34, 0.04]
  - name: physics_ood
    episodes: 20
    domain_randomization:
      mass_range: [0.03, 0.36]
      friction_range: [0.30, 1.50]
      object_position_low: [0.50, -0.18, 0.04]
      object_position_high: [0.74, 0.18, 0.04]
      goal_position_low: [0.34, 0.10, 0.04]
      goal_position_high: [0.58, 0.36, 0.04]
  - name: observation_noise
    episodes: 20
    domain_randomization:
      mass_range: [0.04, 0.30]
      friction_range: [0.4, 1.3]
      object_position_low: [0.54, -0.16, 0.04]
      object_position_high: [0.72, 0.16, 0.04]
      goal_position_low: [0.36, 0.12, 0.04]
      goal_position_high: [0.56, 0.34, 0.04]
    observation_noise:
      joint_position: 0.003
      end_effector_pose: 0.003
      object_pose: 0.008
      target_pose: 0.008
  - name: action_noise
    episodes: 20
    domain_randomization:
      mass_range: [0.04, 0.30]
      friction_range: [0.4, 1.3]
      object_position_low: [0.54, -0.16, 0.04]
      object_position_high: [0.72, 0.16, 0.04]
      goal_position_low: [0.36, 0.12, 0.04]
      goal_position_high: [0.56, 0.34, 0.04]
    action_noise:
      joint_position_std: 0.008
