app:
  name: BuildGuard-Radeon
  environment: competition
  log_level: INFO
  seed: 42
  data_dir: /persistent/BuildGuard-Radeon-backup/data
  workspace_dir: /persistent/BuildGuard-Radeon-backup/workspace
  database_path: /persistent/BuildGuard-Radeon-backup/workspace/database/buildguard.db
  retention:
    enabled: true
    event_images_days: 30
    event_clips_days: 14
    normal_frames_days: 1
    performance_logs_days: 30
    audit_logs_days: 90
    interval_seconds: 3600
  agent:
    max_plan_steps: 6
    max_replans: 1
    registered_tools:
      - echo
      - list_inspection_images
      - inspect_single_image
      - inspect_image_batch
      - inspect_image_batch_structured
      - inspect_conditionally
      - search_construction_standards
      - assess_risk
      - generate_inspection_report
      - generate_event_report
      - query_task_history
      - start_camera_monitoring
      - stop_camera_monitoring
      - query_recent_events
      - acknowledge_event
      - close_event
      - list_camera_status
      - inspect_image
      - search_memory
    confirmation_tools:
      - list_inspection_images
      - inspect_image_batch
      - inspect_image_batch_structured
      - inspect_conditionally
      - generate_inspection_report
      - generate_event_report
      - start_camera_monitoring
      - stop_camera_monitoring
      - acknowledge_event
      - close_event
      - inspect_image
  tools:
    inspection_image_max_items: 100
    default_timeout_seconds: 10
llm_config_path: llm.yaml
permission_config_path: permissions.yaml
monitoring_config_path: monitoring.yaml
rag_config_path: rag.yaml
vision_config_path: vision.yaml
realtime_config_path: realtime.yaml
reporting_config_path: reporting.yaml
services_config_path: services.yaml
runtime_config_path: runtime.yaml
evaluation_config_path: evaluation.yaml
competition_config_path: competition.yaml
