<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen-AI — Offline</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .offline-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 16px;
            padding: 40px;
            max-width: 400px;
            text-align: center;
        }
        .icon { font-size: 48px; margin-bottom: 16px; }
        h1 { font-size: 1.4rem; margin-bottom: 12px; color: #fff; }
        p { color: #999; line-height: 1.6; margin-bottom: 16px; }
        .retry-btn {
            background: #3b82f6;
            color: #fff;
            border: none;
            padding: 12px 32px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 8px;
        }
        .retry-btn:hover { background: #2563eb; }
        .queued {
            margin-top: 20px;
            padding: 12px;
            background: #111;
            border-radius: 8px;
            font-size: 0.85rem;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="icon">📡</div>
        <h1>You're Offline</h1>
        <p>
            Can't reach the Screen-AI server. Commands are saved as local
            drafts only; reconnect and press Send again when you are ready.
        </p>
        <button class="retry-btn" onclick="location.reload()">Try Again</button>
        <div class="queued" id="queued-count"></div>
    </div>
    <script>
        // Show saved draft count
        const req = indexedDB.open('screenai-command-drafts', 1);
        req.onsuccess = function(e) {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('drafts')) {
                document.getElementById('queued-count').textContent = 'No saved drafts';
                return;
            }
            const tx = db.transaction('drafts', 'readonly');
            const store = tx.objectStore('drafts');
            const countReq = store.count();
            countReq.onsuccess = function() {
                const el = document.getElementById('queued-count');
                if (countReq.result > 0) {
                    el.textContent = countReq.result + ' command draft(s) saved';
                } else {
                    el.textContent = 'No saved drafts';
                }
            };
        };
    </script>
</body>
</html>
