<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#0b1120"/>
  <g font-family="Inter,Arial,sans-serif"><text x="100" y="110" fill="#fff" font-size="54" font-weight="700">From 20 expert demos to 300 labeled rollouts</text><text x="100" y="165" fill="#9eafc9" font-size="28">LIBERO-Spatial Task 7: pick up the black bowl and place it on the plate</text>
  <g transform="translate(100,250)"><rect width="470" height="550" rx="34" fill="#202c45" stroke="#405275" stroke-width="3"/><text x="45" y="90" fill="#fff" font-size="38" font-weight="700">SmolVLA Base</text><text x="45" y="160" fill="#b8c5db" font-size="29">450M VLA parameters</text><text x="45" y="215" fill="#b8c5db" font-size="29">20 expert episodes</text><text x="45" y="270" fill="#b8c5db" font-size="29">2 camera views</text><text x="45" y="325" fill="#b8c5db" font-size="29">proprioception + language</text><rect x="45" y="395" width="380" height="100" rx="22" fill="#526b99"/><text x="235" y="458" text-anchor="middle" fill="#fff" font-size="32" font-weight="700">42% success</text></g>
  <text x="690" y="530" fill="#f04b55" font-size="90" font-weight="700">→</text>
  <g transform="translate(830,250)"><rect width="990" height="550" rx="34" fill="#171f34" stroke="#f04b55" stroke-width="3"/><text x="55" y="90" fill="#fff" font-size="38" font-weight="700">Perturbed policy experience</text><g font-size="31" fill="#c6d0e2"><text x="55" y="175">50 reset states × 6 rollouts</text><text x="55" y="235">Noise: 0.00 / 0.01 / 0.03 / 0.03 / 0.05 / 0.05</text><text x="55" y="295">Labels: simulator reward and terminal success</text></g><rect x="55" y="365" width="270" height="120" rx="24" fill="#f04b55" fill-opacity=".15"/><text x="190" y="415" text-anchor="middle" fill="#ff737b" font-size="44" font-weight="700">300</text><text x="190" y="455" text-anchor="middle" fill="#c6d0e2" font-size="23">episodes</text><rect x="360" y="365" width="270" height="120" rx="24" fill="#f04b55" fill-opacity=".15"/><text x="495" y="415" text-anchor="middle" fill="#ff737b" font-size="44" font-weight="700">60,505</text><text x="495" y="455" text-anchor="middle" fill="#c6d0e2" font-size="23">transitions</text><rect x="665" y="365" width="270" height="120" rx="24" fill="#f04b55" fill-opacity=".15"/><text x="800" y="415" text-anchor="middle" fill="#ff737b" font-size="44" font-weight="700">36 / 50</text><text x="800" y="455" text-anchor="middle" fill="#c6d0e2" font-size="23">mixed outcomes</text></g>
  <text x="960" y="920" text-anchor="middle" fill="#9eafc9" font-size="31">Outcome diversity reveals which nearby action directions change success.</text></g>
</svg>
