<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1160" viewBox="0 0 1900 1160" role="img" aria-labelledby="title desc">
  <title id="title">Q-Forge system architecture</title>
  <desc id="desc">Academic pipeline diagram showing SmolVLA initialization, self-labeled rollout collection, compact state and action construction, conservative Q ensemble training, and three policy-improvement paths.</desc>
  <defs>
    <style>
      .font { font-family: Inter, "Helvetica Neue", Arial, sans-serif; }
      .title { font-size: 42px; font-weight: 750; fill: #172033; }
      .subtitle { font-size: 20px; fill: #5f6b7d; }
      .section { font-size: 17px; font-weight: 750; letter-spacing: 1.8px; }
      .card-title { font-size: 24px; font-weight: 750; fill: #172033; }
      .body { font-size: 18px; fill: #445066; }
      .small { font-size: 15px; fill: #667085; }
      .metric { font-size: 21px; font-weight: 750; }
      .badge { font-size: 17px; font-weight: 750; fill: #ffffff; }
      .arrow { fill: none; stroke: #7b8799; stroke-width: 3; marker-end: url(#arrow); }
      .arrow-blue { fill: none; stroke: #3d68c4; stroke-width: 3.5; marker-end: url(#arrowBlue); }
      .arrow-red { fill: none; stroke: #c43d4f; stroke-width: 3.5; marker-end: url(#arrowRed); }
    </style>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14213d" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 z" fill="#7b8799"/>
    </marker>
    <marker id="arrowBlue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 z" fill="#3d68c4"/>
    </marker>
    <marker id="arrowRed" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 z" fill="#c43d4f"/>
    </marker>
  </defs>

  <rect width="1900" height="1160" fill="#f7f9fc"/>
  <rect x="35" y="30" width="1830" height="1100" rx="24" fill="#ffffff" stroke="#dce2eb" stroke-width="2"/>

  <g class="font">
    <text x="80" y="92" class="title">Q-Forge: self-labeled value guidance for a flow-matching VLA policy</text>
    <text x="80" y="130" class="subtitle">The simulator turns local policy perturbations into action-sensitive value supervision; the learned critic then improves action chunks directly or through distillation.</text>

    <rect x="80" y="166" width="1710" height="40" rx="10" fill="#edf3ff"/>
    <text x="100" y="192" class="section" fill="#315aa9">OFFLINE EXPERIENCE GENERATION AND CRITIC LEARNING</text>

    <!-- A. Base policy -->
    <g filter="url(#shadow)">
      <rect x="80" y="235" width="330" height="300" rx="20" fill="#ffffff" stroke="#b7c7e7" stroke-width="2"/>
      <rect x="80" y="235" width="330" height="8" rx="4" fill="#5577bd"/>
      <circle cx="118" cy="280" r="20" fill="#5577bd"/>
      <text x="118" y="286" text-anchor="middle" class="badge">A</text>
      <text x="150" y="288" class="card-title">SmolVLA Base policy</text>
      <rect x="110" y="320" width="270" height="58" rx="12" fill="#eef3fc"/>
      <text x="245" y="346" text-anchor="middle" class="metric" fill="#315aa9">20 expert demonstrations</text>
      <text x="245" y="367" text-anchor="middle" class="small">supervised initialization</text>
      <text x="112" y="417" class="body">Frozen vision-language backbone</text>
      <text x="112" y="451" class="body">Trainable flow Action Expert</text>
      <text x="112" y="485" class="body">5-step, 7-D action chunks</text>
      <text x="112" y="515" class="small">Base closed-loop success: 21/50 (42%)</text>
    </g>

    <!-- B. Rollouts -->
    <g filter="url(#shadow)">
      <rect x="465" y="235" width="390" height="300" rx="20" fill="#ffffff" stroke="#b7c7e7" stroke-width="2"/>
      <rect x="465" y="235" width="390" height="8" rx="4" fill="#4d87a8"/>
      <circle cx="503" cy="280" r="20" fill="#4d87a8"/>
      <text x="503" y="286" text-anchor="middle" class="badge">B</text>
      <text x="535" y="288" class="card-title">Self-labeled interaction</text>
      <text x="497" y="333" class="body">50 reset states x 6 rollouts</text>
      <text x="497" y="367" class="body">Local arm-action perturbations</text>
      <text x="497" y="401" class="small">sigma = 0 / .01 / .03 / .03 / .05 / .05</text>
      <rect x="497" y="430" width="326" height="72" rx="12" fill="#edf7fa"/>
      <text x="660" y="458" text-anchor="middle" class="metric" fill="#28718f">Simulator supervision</text>
      <text x="660" y="483" text-anchor="middle" class="small">reward + terminal success, no new experts</text>
      <text x="497" y="522" class="small">36/50 states contain both success and failure</text>
    </g>

    <!-- C. Dataset -->
    <g filter="url(#shadow)">
      <rect x="910" y="235" width="400" height="300" rx="20" fill="#ffffff" stroke="#c8bfdf" stroke-width="2"/>
      <rect x="910" y="235" width="400" height="8" rx="4" fill="#7867a8"/>
      <circle cx="948" cy="280" r="20" fill="#7867a8"/>
      <text x="948" y="286" text-anchor="middle" class="badge">C</text>
      <text x="980" y="288" class="card-title">Compact offline dataset</text>
      <rect x="942" y="320" width="336" height="64" rx="12" fill="#f3f0f8"/>
      <text x="1110" y="348" text-anchor="middle" class="metric" fill="#665391">300 episodes / 60,505 transitions</text>
      <text x="1110" y="371" text-anchor="middle" class="small">episode-safe H-step construction</text>
      <text x="942" y="422" class="body">Primary fixed projection</text>
      <text x="1248" y="422" text-anchor="end" class="body" fill="#665391">z in R^512</text>
      <text x="942" y="456" class="body">Optional frozen RLT</text>
      <text x="1248" y="456" text-anchor="end" class="body" fill="#665391">z in R^2048</text>
      <text x="942" y="490" class="body">Executed action chunk</text>
      <text x="1248" y="490" text-anchor="end" class="body" fill="#665391">a in R^(5x7)</text>
      <text x="942" y="519" class="small">MC return + H-step reward + bootstrap mask</text>
    </g>

    <!-- D. Critic -->
    <g filter="url(#shadow)">
      <rect x="1365" y="235" width="425" height="300" rx="20" fill="#ffffff" stroke="#e6c18c" stroke-width="2"/>
      <rect x="1365" y="235" width="425" height="8" rx="4" fill="#c98224"/>
      <circle cx="1403" cy="280" r="20" fill="#c98224"/>
      <text x="1403" y="286" text-anchor="middle" class="badge">D</text>
      <text x="1435" y="288" class="card-title">Action-sensitive Q ensemble</text>
      <text x="1397" y="334" class="body">5 critics; proprio 8 -> 256</text>
      <path d="M1400 365 H1755" stroke="#ead9bd" stroke-width="2"/>
      <text x="1397" y="399" class="body">1. MC regression</text>
      <text x="1755" y="399" text-anchor="end" class="small">5,000 steps</text>
      <text x="1397" y="433" class="body">2. H-step TD + Cal-QL</text>
      <text x="1755" y="433" text-anchor="end" class="small">2,000 steps</text>
      <rect x="1397" y="458" width="358" height="48" rx="10" fill="#fff6e9"/>
      <text x="1576" y="488" text-anchor="middle" class="metric" fill="#a66312">Critic gate: all checks pass</text>
      <text x="1397" y="526" class="small">TD loss .00627; Q(success) &gt; Q(failure)</text>
    </g>

    <!-- Top arrows -->
    <path d="M410 385 H450" class="arrow-blue"/>
    <path d="M855 385 H895" class="arrow-blue"/>
    <path d="M1310 385 H1350" class="arrow-blue"/>
    <text x="430" y="366" text-anchor="middle" class="small">roll out</text>
    <text x="875" y="366" text-anchor="middle" class="small">encode</text>
    <text x="1330" y="366" text-anchor="middle" class="small">fit Q</text>

    <!-- Lower section -->
    <rect x="80" y="584" width="1710" height="40" rx="10" fill="#fff0f2"/>
    <text x="100" y="610" class="section" fill="#a52d3d">POLICY IMPROVEMENT AND PAIRED CLOSED-LOOP EVALUATION</text>

    <!-- Inputs -->
    <g filter="url(#shadow)">
      <rect x="80" y="665" width="350" height="260" rx="20" fill="#ffffff" stroke="#b7c7e7" stroke-width="2"/>
      <text x="112" y="708" class="card-title">Inputs at each replan</text>
      <rect x="112" y="742" width="286" height="62" rx="12" fill="#eef3fc"/>
      <text x="255" y="768" text-anchor="middle" class="metric" fill="#315aa9">Base action chunk a_ref</text>
      <text x="255" y="791" text-anchor="middle" class="small">sampled by frozen SmolVLA</text>
      <rect x="112" y="827" width="286" height="62" rx="12" fill="#fff6e9"/>
      <text x="255" y="853" text-anchor="middle" class="metric" fill="#a66312">Q(z, p, a)</text>
      <text x="255" y="876" text-anchor="middle" class="small">ensemble mean + action gradient</text>
    </g>

    <!-- Junction -->
    <circle cx="505" cy="795" r="18" fill="#ffffff" stroke="#7b8799" stroke-width="3"/>
    <path d="M430 795 H487" class="arrow"/>
    <path d="M523 795 H585" class="arrow"/>
    <text x="505" y="801" text-anchor="middle" font-size="18" font-weight="700" fill="#596579">+</text>

    <!-- Method labels -->
    <g filter="url(#shadow)">
      <rect x="585" y="650" width="1205" height="105" rx="18" fill="#f8fafc" stroke="#cfd6e0" stroke-width="2"/>
      <rect x="585" y="650" width="10" height="105" rx="5" fill="#7b8799"/>
      <text x="620" y="690" class="card-title">Q selection</text>
      <text x="620" y="724" class="body">Sample N=4 complete chunks and execute the highest ensemble-mean Q candidate.</text>
      <rect x="1580" y="671" width="170" height="58" rx="12" fill="#edf0f4"/>
      <text x="1665" y="697" text-anchor="middle" class="metric" fill="#556174">36% (18/50)</text>
      <text x="1665" y="718" text-anchor="middle" class="small">-3 vs. Base</text>

      <rect x="585" y="775" width="1205" height="125" rx="18" fill="#fff7f8" stroke="#d95062" stroke-width="3"/>
      <rect x="585" y="775" width="10" height="125" rx="5" fill="#c43d4f"/>
      <text x="620" y="817" class="card-title" fill="#9e2737">Constrained Q-guidance (primary)</text>
      <text x="620" y="851" class="body">Projected, gradient-clipped Q ascent from a_ref; trust region and per-sample keep-best.</text>
      <text x="620" y="879" class="small">10 steps / step size .02 / max delta .05 / optimize 5 x 7 executable prefix</text>
      <rect x="1540" y="797" width="210" height="78" rx="13" fill="#c43d4f"/>
      <text x="1645" y="829" text-anchor="middle" class="metric" fill="#ffffff">68% (34/50)</text>
      <text x="1645" y="854" text-anchor="middle" font-size="16" font-weight="700" fill="#ffe9ec">+13 states; p=.0146</text>

      <rect x="585" y="920" width="1205" height="105" rx="18" fill="#f7f5fb" stroke="#b9acd2" stroke-width="2"/>
      <rect x="585" y="920" width="10" height="105" rx="5" fill="#7867a8"/>
      <text x="620" y="960" class="card-title">QVGM residual distillation</text>
      <text x="620" y="994" class="body">Distill detached critic-guided velocity corrections; deploy SmolVLA without the critic.</text>
      <rect x="1580" y="941" width="170" height="58" rx="12" fill="#eeeaf6"/>
      <text x="1665" y="967" text-anchor="middle" class="metric" fill="#665391">64% (32/50)</text>
      <text x="1665" y="988" text-anchor="middle" class="small">+11; no regressions</text>
    </g>

    <path d="M523 795 C555 795 545 702 570 702" class="arrow"/>
    <path d="M523 795 H570" class="arrow-red"/>
    <path d="M523 795 C555 795 545 972 570 972" class="arrow"/>

    <!-- Footer -->
    <rect x="80" y="1065" width="1710" height="36" rx="9" fill="#172033"/>
    <text x="935" y="1089" text-anchor="middle" font-size="16" font-weight="650" fill="#ffffff">
      Single AMD Radeon gfx1100 GPU: SFT, EGL simulation, rollout collection, critic training, guided evaluation, residual distillation
    </text>
  </g>
</svg>
