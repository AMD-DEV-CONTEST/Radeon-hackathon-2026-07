<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="980" viewBox="0 0 1900 980" role="img" aria-labelledby="title desc">
  <title id="title">Q-Forge state encoder and Q ensemble</title>
  <desc id="desc">Detailed architecture of the primary fixed projection, optional RL-token Transformer, proprioceptive encoder, repeated-action Q heads, and staged training procedure.</desc>
  <defs>
    <style>
      .font { font-family: Inter, "Helvetica Neue", Arial, sans-serif; }
      .title { font-size: 40px; font-weight: 750; fill: #172033; }
      .subtitle { font-size: 19px; fill: #5f6b7d; }
      .section { font-size: 18px; font-weight: 750; letter-spacing: 1.4px; }
      .card-title { font-size: 23px; font-weight: 750; fill: #172033; }
      .body { font-size: 17px; fill: #445066; }
      .small { font-size: 14px; fill: #667085; }
      .metric { font-size: 20px; font-weight: 750; }
      .arrow { fill: none; stroke: #758399; stroke-width: 3; marker-end: url(#arrow); }
      .blue-arrow { fill: none; stroke: #4169b2; stroke-width: 3; marker-end: url(#blueArrow); }
    </style>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#14213d" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 z" fill="#758399"/>
    </marker>
    <marker id="blueArrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 z" fill="#4169b2"/>
    </marker>
  </defs>

  <rect width="1900" height="980" fill="#f7f9fc"/>
  <rect x="35" y="30" width="1830" height="920" rx="24" fill="#ffffff" stroke="#dce2eb" stroke-width="2"/>

  <g class="font">
    <text x="80" y="90" class="title">Q-Forge state representation and action-sensitive Q ensemble</text>
    <text x="80" y="126" class="subtitle">The primary result uses a frozen 512-D random projection; a separately trained 2048-D RL-token Transformer is available as an optional representation path.</text>

    <!-- Frozen prefix -->
    <g filter="url(#shadow)">
      <rect x="80" y="180" width="285" height="300" rx="18" fill="#ffffff" stroke="#b9c8e5" stroke-width="2"/>
      <rect x="80" y="180" width="285" height="8" rx="4" fill="#5577bd"/>
      <text x="110" y="228" class="card-title">Frozen VLA prefix</text>
      <text x="110" y="270" class="body">Images + language + state</text>
      <rect x="110" y="300" width="225" height="60" rx="11" fill="#eef3fc"/>
      <text x="222" y="327" text-anchor="middle" class="metric" fill="#315aa9">H in R^(177x960)</text>
      <text x="222" y="348" text-anchor="middle" class="small">valid-token mask m</text>
      <text x="110" y="397" class="body">SmolVLA remains frozen</text>
      <text x="110" y="429" class="body">Prefix tokens cached in BF16</text>
      <text x="110" y="459" class="small">Same context as the Action Expert</text>
    </g>

    <!-- Primary projection -->
    <g filter="url(#shadow)">
      <rect x="435" y="165" width="355" height="190" rx="18" fill="#f4f7fd" stroke="#7d9bd2" stroke-width="3"/>
      <rect x="435" y="165" width="355" height="8" rx="4" fill="#4169b2"/>
      <text x="465" y="210" class="card-title" fill="#315aa9">Primary: fixed projection</text>
      <text x="465" y="249" class="body">token LN -> masked mean</text>
      <text x="465" y="280" class="body">fixed Gaussian P: 960 x 512</text>
      <rect x="465" y="301" width="295" height="35" rx="9" fill="#dfe9fa"/>
      <text x="612" y="325" text-anchor="middle" class="metric" fill="#315aa9">z_proj in R^512</text>
    </g>

    <!-- RLT -->
    <g filter="url(#shadow)">
      <rect x="435" y="385" width="355" height="260" rx="18" fill="#f7f5fb" stroke="#a896c9" stroke-width="2"/>
      <rect x="435" y="385" width="355" height="8" rx="4" fill="#7867a8"/>
      <text x="465" y="430" font-size="21" font-weight="750" fill="#172033">Optional: RL-token Transformer</text>
      <text x="465" y="468" class="body">1 learned RL token</text>
      <text x="465" y="499" class="body">2-layer encoder-decoder; 8 heads</text>
      <text x="465" y="530" class="body">MLP ratio 4; masked reconstruction</text>
      <rect x="465" y="551" width="295" height="42" rx="9" fill="#ebe6f4"/>
      <text x="612" y="578" text-anchor="middle" class="metric" fill="#665391">z_rlt in R^2048</text>
      <text x="465" y="624" class="small">Pretrain 5,000 steps, then freeze in this repository</text>
    </g>

    <path d="M365 290 C400 290 400 260 420 260" class="blue-arrow"/>
    <path d="M365 330 C400 330 400 510 420 510" class="arrow"/>

    <!-- State and action -->
    <g filter="url(#shadow)">
      <rect x="865" y="180" width="350" height="465" rx="18" fill="#ffffff" stroke="#c9c1df" stroke-width="2"/>
      <rect x="865" y="180" width="350" height="8" rx="4" fill="#7867a8"/>
      <text x="895" y="228" class="card-title">State and action inputs</text>
      <text x="895" y="274" class="body">Proprioception p in R^8</text>
      <rect x="895" y="295" width="290" height="64" rx="11" fill="#f1eef7"/>
      <text x="1040" y="321" text-anchor="middle" class="body">Linear 8 -> 256</text>
      <text x="1040" y="346" text-anchor="middle" class="small">LayerNorm + SiLU</text>
      <text x="895" y="397" class="body">Concatenate z and proprio feature</text>
      <rect x="895" y="418" width="290" height="72" rx="11" fill="#f1eef7"/>
      <text x="1040" y="446" text-anchor="middle" class="metric" fill="#665391">joint LayerNorm state</text>
      <text x="1040" y="473" text-anchor="middle" class="small">768-D primary / 2304-D RLT</text>
      <text x="895" y="531" class="body">Masked action chunk A in R^(5x7)</text>
      <rect x="895" y="552" width="290" height="64" rx="11" fill="#fff6e9"/>
      <text x="1040" y="579" text-anchor="middle" class="metric" fill="#a66312">flattened action a in R^35</text>
      <text x="1040" y="603" text-anchor="middle" class="small">padding is zeroed before flattening</text>
    </g>

    <path d="M790 260 H850" class="blue-arrow"/>
    <path d="M790 572 H850" class="arrow"/>

    <!-- Q head -->
    <g filter="url(#shadow)">
      <rect x="1290" y="180" width="500" height="465" rx="18" fill="#ffffff" stroke="#e5bd82" stroke-width="2"/>
      <rect x="1290" y="180" width="500" height="8" rx="4" fill="#c98224"/>
      <text x="1320" y="228" class="card-title">Repeated-action Q head x 5</text>
      <rect x="1320" y="268" width="440" height="72" rx="12" fill="#fff7eb"/>
      <text x="1540" y="297" text-anchor="middle" class="metric" fill="#a66312">[state ; action] -> 1024</text>
      <text x="1540" y="323" text-anchor="middle" class="small">Linear + LayerNorm + SiLU</text>
      <path d="M1540 340 V372" class="arrow"/>
      <rect x="1320" y="372" width="440" height="72" rx="12" fill="#fff7eb"/>
      <text x="1540" y="401" text-anchor="middle" class="metric" fill="#a66312">[hidden_1 ; action] -> 512</text>
      <text x="1540" y="427" text-anchor="middle" class="small">Linear + LayerNorm + SiLU</text>
      <path d="M1540 444 V476" class="arrow"/>
      <rect x="1320" y="476" width="440" height="62" rx="12" fill="#fff1dd"/>
      <text x="1540" y="514" text-anchor="middle" class="metric" fill="#a66312">[hidden_2 ; action] -> scalar Q_i</text>
      <text x="1320" y="576" class="body">Ensemble mean: guidance and TD bootstrap</text>
      <text x="1320" y="608" class="body">Ensemble std.: disagreement diagnostic</text>
      <text x="1320" y="634" class="small">Primary linear input widths: 803 -> 1059 -> 547</text>
    </g>
    <path d="M1215 412 H1275" class="arrow"/>

    <!-- Training -->
    <rect x="80" y="700" width="1710" height="38" rx="9" fill="#edf3ff"/>
    <text x="100" y="725" class="section" fill="#315aa9">TRAINING ORDER AND PARAMETER BOUNDARY</text>

    <g filter="url(#shadow)">
      <rect x="80" y="770" width="470" height="125" rx="16" fill="#f7f5fb" stroke="#b9acd2" stroke-width="2"/>
      <text x="110" y="809" class="card-title">0. Optional RLT pretraining</text>
      <text x="110" y="841" class="body">Masked prefix reconstruction MSE</text>
      <text x="110" y="872" class="small">5,000 steps; batch 4; LR 2.5e-5; clip 1.0</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="610" y="770" width="520" height="125" rx="16" fill="#f3f6fc" stroke="#a9bde2" stroke-width="2"/>
      <text x="640" y="809" class="card-title">1. Monte-Carlo Q initialization</text>
      <text x="640" y="841" class="body">Regress all five heads to empirical MC return</text>
      <text x="640" y="872" class="small">5,000 steps; batch 256; LR 3e-4; weight decay 1e-4</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="1190" y="770" width="600" height="125" rx="16" fill="#fff7eb" stroke="#e4bd86" stroke-width="2"/>
      <text x="1220" y="809" class="card-title">2. H-step TD + Cal-QL refinement</text>
      <text x="1220" y="841" class="body">Dataset next chunk; target EMA; random + local OOD actions</text>
      <text x="1220" y="872" class="small">2,000 steps; LR 1e-4; tau .005; alpha .05; MC calibration floor</text>
    </g>
    <path d="M550 833 H595" class="arrow"/>
    <path d="M1130 833 H1175" class="arrow"/>

    <text x="80" y="930" class="small">Primary reported path: fixed 512-D projection + 256-D proprio feature -> 768-D state. SmolVLA and the selected feature extractor remain frozen throughout Q training.</text>
  </g>
</svg>
