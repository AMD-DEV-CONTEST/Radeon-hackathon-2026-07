[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smolvla-qvgm-rlinf"
version = "0.1.0"
description = "SmolVLA and Q-VGM adapters for RLinf"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=1.26,<2",
  "omegaconf>=2.3",
  "safetensors>=0.4.3",
  "torch>=2.8,<2.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
