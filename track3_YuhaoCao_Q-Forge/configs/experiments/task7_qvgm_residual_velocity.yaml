seed: 1000
device: cuda
base_checkpoint: checkpoints/smolvla_libero_task0/public_recipe_20k/checkpoint-final/pretrained_model
critic_checkpoint: checkpoints/qvgm_critic/task7_qvgm_paper_h5_rlt2048_calql_a005_n005_v1/checkpoint-final.pt
output_dir: checkpoints/qvgm_policy/task7_residual_velocity_v1

data:
  observation_cache: data/qvgm_buffers/task7_qvgm_paper_h5_rlt2048_v1/policy_observations.pt
  observation_manifest: data/qvgm_buffers/task7_qvgm_paper_h5_rlt2048_v1/policy_observations_manifest.json
  feature_cache: data/qvgm_buffers/task7_qvgm_paper_h5_rlt2048_v1/feature_cache.pt

# Matches the held-out-safe Phase 17 Q-ascent operator.  Q is used only to
# construct offline targets and is absent from the exported inference policy.
residual:
  denoising_steps: 10
  horizon: 5
  action_dim: 7
  gate_power: 1.0
  guidance_steps: 5
  guidance_step_size: 0.005
  guidance_max_delta: 0.02
  guidance_max_gradient_norm: 1.0
  action_min: -1.0
  action_max: 1.0

training:
  # The 500-step checkpoint scored 41/50; extending the same run to step 1000
  # fell to 38/50, so the paired full-state protocol selects this early stop.
  steps: 500
  scheduler_decay_steps: 5000
  # Batch 8 was measured at 6.43 GiB peak and 1.39 s/update on the local GPU.
  batch_size: 8
  gradient_accumulation_steps: 1
  learning_rate: 1.0e-5
  minimum_learning_rate: 1.0e-6
  warmup_steps: 250
  betas: [0.9, 0.95]
  weight_decay: 1.0e-10
  max_gradient_norm: 10.0
  log_interval: 10
  save_interval: 250
