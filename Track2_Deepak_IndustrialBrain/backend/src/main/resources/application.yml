spring:
  application:
    name: indusmind-api
  profiles:
    default: postgres
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_MB:40}MB
      max-request-size: ${MAX_UPLOAD_MB:40}MB
  jpa:
    hibernate:
      # Schema is owned by Flyway migrations (see db/migration). "validate"
      # catches drift between the entities and the real schema at startup
      # instead of letting Hibernate silently alter tables in place.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/indusmind}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:1234}

server:
  port: ${SERVER_PORT:8081}

indusmind:
  ai-base-url: ${AI_BASE_URL:http://localhost:8000}
  upload-dir: ${UPLOAD_DIR:../data/uploads}
  jwt-secret: ${JWT_SECRET:change-this-development-secret-before-production}
  demo-mode: ${DEMO_MODE:false}
  # Comma-separated list of origins allowed to call this API from a browser.
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081}
  ai-connect-timeout-ms: ${AI_CONNECT_TIMEOUT_MS:15000}
  ai-read-timeout-ms: ${AI_READ_TIMEOUT_MS:120000}

---
spring:
  config:
    activate:
      on-profile: demo
  datasource:
    url: jdbc:h2:file:../data/indusmind-demo;MODE=PostgreSQL;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

indusmind:
  demo-mode: true
