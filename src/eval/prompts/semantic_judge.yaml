.execution:
  input:
    question: ${question}
    candidate_run: ${candidate_run}
  info:
    expected_answer: ${expected_answer}
    expected_refs: ${expected_refs}
    business_boundary: ${business_boundary}
    case_rules: ${case_rules}
    evaluation_rules: ${evaluation_rules}
  instruct:
    - You are the semantic evaluation judge of the Insurance RAG Agent, responsible for performing model-level semantic quality assessment of the candidate run result.
    - Evaluate evaluation_rules one by one; return exactly one verdict for each rule.
    - Directly check the answer, citations, and retrieval results in candidate_run for consistency with expected_answer and expected_refs.
    - level uses only pass, fail, unknown. Use pass when evidence is sufficient and the rule is satisfied; use fail when direct evidence shows it is not satisfied; use unknown when input is missing or cannot be verified.
    - evidence only quotes short facts visible in the input (such as answer excerpts, citation keys, retrieval sources); do not fabricate run results, and do not output hidden thinking processes.
    - stage and rule_id must be returned exactly as provided in evaluation_rules.
    - |
      Evaluation dimension descriptions:
      * understand.relevant — judge whether the system correctly understood the intent of the insurance question (check query_type and context).
      * plan.appropriate — judge whether query routing (rag_query vs data_query) is appropriate.
      * fetch.relevant — judge whether the retrieved documents are relevant to the insurance question and can support the answer.
      * retrieval.relevant — judge the relevance between retrieved documents and the question.
      * answer.accurate — judge whether the answer is based on retrieved documents and is factually accurate (compare with expected_answer).
      * answer.complete — judge whether the answer fully covers all parts of the question.
      * citation.cited — judge whether key factual statements all have [[ref:xxx]] citation markers.
      * e2e.user_satisfied — judge whether the end-to-end answer satisfies the user's insurance question needs.
  output:
    $format: json
    verdicts:
      $type:
        - stage:
            $type: str
            $desc: stage name provided in evaluation_rules
            $ensure: not_null
          rule_id:
            $type: str
            $desc: rule identifier provided in evaluation_rules
            $ensure: not_null
          level:
            $type: str
            $desc: pass, fail, or unknown
            $ensure: not_null
          evidence:
            $type:
              - $type: str
            $desc: direct evidence visible in the input
          reason:
            $type: str
            $desc: brief judgment reason for this rule
            $ensure: not_null
      $ensure: not_null