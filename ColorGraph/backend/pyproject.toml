[project]
name = "colorgraph-backend"
version = "0.1.0"
description = "Local video analysis and deterministic grading backend for ColorGraph"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "aiofiles>=24.1,<26",
  "easydict==1.13",
  "einops==0.4.1",
  "fastapi>=0.128,<1",
  "hydra-core>=1.3.2,<2",
  "httpx>=0.28,<1",
  "numpy>=2.2,<3",
  "opencolorio==2.5.2",
  "opencv-python-headless>=4.11,<5",
  "pillow>=11,<13",
  "pydantic>=2.12,<3",
  "python-multipart>=0.0.20,<1",
  "scipy>=1.15,<2",
  "scenedetect-headless==0.7.1",
  "torch>=2.9.1,<2.13",
  "torchvision>=0.24,<0.28",
  "transformers>=4.57,<6",
  "uvicorn[standard]>=0.40,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
colorgraph = "colorgraph.cli:main"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest-temp"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["colorgraph"]
