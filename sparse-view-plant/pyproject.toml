[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[project]
name = "sparse-view-plant"
version = "0.1.0"
description = "Interactive sparse-view plant 3D reconstruction demo: uncalibrated RGB photos to a plant point cloud and refined 2D Gaussians."
readme = "README.md"
license = "MIT"
authors = [
    { name = "xvyv99", email = "xvyv99@163.com" }
]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.0.0",
    "httpx[socks]>=0.28.0",
    "numpy>=2.0.0",
    "pillow>=11.0.0",
    "tqdm>=4.66.0",
    "scipy>=1.18.0",
    "plyfile>=1.1.5",
    "omegaconf>=2.3.1",
    "opencv-python-headless>=5.0.0.93",
    "gsplat>=1.5.3",
    "accelerate>=1.14.0",
    "wandb>=0.28.1",
    "transformers[gpu]>=5.14.1",
    "timm[gpu]>=1.0.28",
    "kornia[gpu]>=0.8.3",
    "lpips[gpu]>=0.1.4",
    "gradio>=6.22.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "einops>=0.8.0",
    "dacite>=1.9.2",
    "lightning>=2.6.5",
    "e3nn>=0.6.0",
    "colorspacious>=1.1.2",
    "matplotlib>=3.11.1",
]

[dependency-groups]
dev = [
    "hf-transfer>=0.1.9",
    "pytest>=8.0.0",
    "ruff>=0.15.0",
    "ty>=0.0.62",
]

[project.scripts]
sparse-view-plant = "sparse_view_plant:main"

[tool.uv]
default-groups = ["dev"]
