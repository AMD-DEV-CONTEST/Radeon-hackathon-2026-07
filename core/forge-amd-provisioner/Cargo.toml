[package]
name = "forge-amd-provisioner"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
playwright-rs = "0.15.1"
hex = "0.4"
reqwest = { version = "0.12", features = ["json"] }


[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
