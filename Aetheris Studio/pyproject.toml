[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aetheris-cli"
version = "0.1.0"
description = "Aetheris CLI client for Aetheris Studio"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
]

[project.scripts]
aetheris = "aetheris_cli.cli:main"

[tool.setuptools.packages.find]
include = ["aetheris_cli*", "core*"]

[tool.pytest.ini_options]
markers = [
    "gpu_required: marks tests that require a physical AMD GPU and a running vte-server stack (same convention as VTE/pytest.ini).",
]
