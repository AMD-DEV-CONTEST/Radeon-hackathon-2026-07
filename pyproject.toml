[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "xianglens"
version = "0.1.0"
description = "A private, source-backed profile-image agent for AMD Radeon and ROCm."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langgraph>=1.0,<2",
  "opencv-python-headless>=4.10,<5",
  "pillow>=11,<13",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pymilvus[milvus-lite]>=2.6,<3",
  "python-multipart>=0.0.20,<1",
  "pyyaml>=6,<7",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
semantic = ["fastembed>=0.7,<1"]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
]

[project.scripts]
xianglens-api = "xianglens.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/xianglens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
