port = 5003
backend = "cpu"
template = "qwen2.5"

[fallback]
enabled = true
binary = "/home/cesarops/llama.cpp/build/bin/llama-server"
port = 5001
native_quants = ["Q4_0", "Q4_K_M", "Q6_K", "Q8_0", "F16", "F32", "BF16"]

