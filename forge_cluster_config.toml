hardware = "P100 #0+#1 (T440)"
role = "Main coder"
model = "Qwen3.6-35B-A3B-MTP"

[[agent]]
name = "marvin"
endpoint = "http://100.102.158.111:5555"
hardware = "GTX 1070 (cesarops2)"
role = "Corrector/Reviewer"
model = "14B Coder"

[[agent]]
name = "scout"
endpoint = "http://100.105.77.74:5570"
hardware = "GTX 1060 (cesarops3)"
role = "Thinker"
model = "R1 7B"

[[agent]]
name = "nautik"
endpoint = "http://100.110.214.86:5571"
hardware = "ThinkPad M2200 4GB (Maxwell)"
role = "Validator/Corrector — TinyLlama when online"
model = "TinyLlama-1.1B-Chat-v1.0-Q4_K_M"
notes = "Windows — launch manually with scripts/launch_laptop_m2200.sh validator"

[[agent]]
name = "picasso"
endpoint = "http://100.102.158.111:5571"
hardware = "P1000 (cesarops2)"
role = "Speed+Accuracy Validator — TinyLlama 1.1B Q4_K_M reference canary"
model = "TinyLlama-1.1B-Chat-v1.0-Q4_K_M"
validator = true
validator_api = "http://localhost:9100/validate"
engine = "llama-server"
backend = "cuda"
inject_vectors = false
corrector_functions = { json_fixer = true, loop_detector = true, translator = true, think_harder = false, auto_remember = true }

# Stable role → endpoint map (address in Forge lanes via lane role)
[roles]
coding = "http://10.0.0.201:5305"
coder = "http://10.0.0.201:5201"
thinker = "http://10.0.0.201:5200"
reviewer = "http://10.0.0.201:5571"
corrector = "http://10.0.0.201:5202"
polisher = "http://10.0.0.201:5203"
validator = "http://100.110.214.86:5571"
general = "http://10.0.0.201:5201"
bootstrap = "http://127.0.0.1:5003"
idle = ""

[monitoring]
# T440 Netdata (Forge monitor panel on :9100)
netdata_url = "http://127.0.0.1:19999"
# Optional: install Netdata on cesarops2 to embed remote GPU charts
netdata_cesarops2_url = "http://127.0.0.1:19999"

[routing]
default_mode = "auto"

[[routing_preset]]
id = "pamp-moe-predict"
name = "PAMP MoE predictor (n8n)"
description = "Predictive Async MoE — needs n8n on :5678 with /webhook/pamp-route"
chat_agent = "picasso"
coder_endpoint = "http://127.0.0.1:5001"
reviewer_endpoint = "http://127.0.0.1:5571"
thinker_endpoint = "http://127.0.0.1:5200"
corrector_endpoint = "http://127.0.0.1:5200"
draft_endpoint = "http://127.0.0.1:5571"
workers_start = []
workers_stop = []
fleet_node = "cesarops2"
fleet_action = "sync_llm_endpoints"
baseline_id = "pamp_moe_test"

[orchestration]
tools_backend = "n8n"
n8n_pamp_url = "http://127.0.0.1:5678/webhook/pamp-route"
n8n_fleet_url = "http://127.0.0.1:5678/webhook/fleet-ops"
pamp_shadow = true

[tuning]
# How many think-only rounds before declaring the model stuck
max_think_rounds = 50
# Main generation timeout in seconds
generation_timeout_secs = 1200
# Thinker preflight timeout in seconds
thinker_timeout_secs = 60
# Max tokens for main generation
max_generation_tokens = 16384
# Starting temperature
temperature = 0.4
# Disable corrector for heavy tasks (set true to skip correction pass)
skip_corrector = false

# Worker nicknames — human-friendly names mapped to endpoints
[nicknames]
coder = "http://127.0.0.1:5001"
thinker = "http://100.105.77.74:5570"
corrector = "http://100.102.158.111:5555"
scout = "http://100.110.214.86:5002"
bootstrap = "http://127.0.0.1:5002"
r1-cpu = "http://127.0.0.1:5557"
mcp-local = "http://127.0.0.1:8090"

[[agent]]
