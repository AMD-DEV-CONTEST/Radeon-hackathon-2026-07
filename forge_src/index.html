<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CESAROPS Forge v2</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: #16213e;
            padding: 1rem 2rem;
            border-bottom: 2px solid #0f3460;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 { color: #00d4ff; font-size: 1.5rem; }
        .status { color: #4caf50; font-size: 0.9rem; }
        .subtitle { color: #888; font-size: 0.8rem; }
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 1rem 2rem;
            overflow: hidden;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 0;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .msg {
            max-width: 85%;
            padding: 1rem 1.5rem;
            border-radius: 16px;
            font-size: 1.05rem;
            line-height: 1.6;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .msg-user {
            align-self: flex-end;
            background: #0f3460;
            color: #e0e0e0;
            border-bottom-right-radius: 4px;
        }
        .msg-assistant {
            align-self: flex-start;
            background: #1b4332;
            color: #e0e0e0;
            border-bottom-left-radius: 4px;
        }
        .msg-diagnosis {
            align-self: flex-start;
            background: #4a1500;
            color: #ffb380;
            border-radius: 8px;
            font-size: 0.85rem;
            padding: 0.5rem 1rem;
        }
        .tool-badge {
            padding: 0.4rem 0.8rem;
            background: #2d1b4e;
            border-radius: 8px;
            font-size: 0.8rem;
            color: #d4a5ff;
            margin: 0.2rem 0;
            align-self: flex-start;
        }
        .input-area {
            display: flex;
            gap: 0.5rem;
            padding: 1rem 0;
        }
        .input-area input {
            flex: 1;
            padding: 1rem 1.5rem;
            font-size: 1.05rem;
            border: 2px solid #0f3460;
            border-radius: 12px;
            background: #16213e;
            color: #e0e0e0;
            outline: none;
        }
        .input-area input:focus { border-color: #00d4ff; }
        .input-area button {
            padding: 1rem 2rem;
            font-size: 1.05rem;
            font-weight: bold;
            background: #00d4ff;
            color: #1a1a2e;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }
        .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
        .loading { color: #00d4ff; font-style: italic; padding: 0.5rem; }
        .btn-clear {
            padding: 0.5rem 1rem;
            background: #4a1500;
            color: #ffb380;
            border: 1px solid #ff6600;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>CESAROPS FORGE v2</h1>
            <span class="subtitle">Self-Healing Knowledge Translator — Qwen3.6-35B on P100s</span>
        </div>
        <div>
            <button class="btn-clear" onclick="clearChat()">CLEAR</button>
            <button style="background:#f44336; color:white; border:none; padding:0.5rem 1rem; border-radius:8px; cursor:pointer; font-weight:bold; margin-left:0.5rem;" onclick="interruptAgent()">STOP</button>
            <button style="background:#ff9800; color:white; border:none; padding:0.5rem 1rem; border-radius:8px; cursor:pointer; font-weight:bold; margin-left:0.5rem;" onclick="steerAgent()">STEER</button>
            <span class="status" id="status">Connecting...</span>
        </div>
    </header>

    <div class="chat-container">
        <div class="messages" id="messages">
            <div class="msg msg-assistant">Forge v2 online. Self-healing translator active. Tools: write_file, read_file, cargo_check, think_harder, remember, run_command. Prefix /fast to skip thinker pre-flight.</div>
        </div>
        <div class="input-area">
            <input type="text" id="input" placeholder="Type your message... (/fast to skip thinker)" onkeydown="if(event.key==='Enter')sendMessage()" aria-label="Message input">
            <button id="sendBtn" onclick="sendMessage()">SEND</button>
        </div>
    </div>

    <script>
        fetch('/health').then(r => r.json()).then(d => {
            document.getElementById('status').textContent = 'Online — ' + d.service;
            document.getElementById('status').style.color = '#4caf50';
        }).catch(() => {
            document.getElementById('status').textContent = 'Offline';
            document.getElementById('status').style.color = '#f44336';
        });

        async function sendMessage() {
            const input = document.getElementById('input');
            const msg = input.value.trim();
            if (!msg) return;

            input.value = '';
            addMessage('user', msg);

            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            addLoading();

            try {
                const resp = await fetch('/send', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: msg})
                });
                const data = await resp.json();
                removeLoading();

                if (data.tool_actions && data.tool_actions.length > 0) {
                    addToolBadge(data.tool_actions);
                }
                if (data.diagnosis) {
                    addDiagnosis(data.diagnosis);
                }
                addMessage('assistant', data.response);
            } catch(e) {
                removeLoading();
                addMessage('assistant', 'Error: ' + e.message);
            }

            sendBtn.disabled = false;
            input.focus();
        }

        function addMessage(role, content) {
            const div = document.createElement('div');
            div.className = 'msg msg-' + role;
            div.textContent = content;
            document.getElementById('messages').appendChild(div);
            div.scrollIntoView({behavior: 'smooth'});
        }

        function addToolBadge(actions) {
            const div = document.createElement('div');
            div.className = 'tool-badge';
            div.textContent = 'Tools: ' + actions.join(' → ');
            document.getElementById('messages').appendChild(div);
        }

        function addDiagnosis(text) {
            const div = document.createElement('div');
            div.className = 'msg msg-diagnosis';
            div.textContent = '🔧 Diagnosis: ' + text;
            document.getElementById('messages').appendChild(div);
        }

        function addLoading() {
            const div = document.createElement('div');
            div.className = 'loading';
            div.id = 'loading';
            div.textContent = 'Working... (35B generating on P100s)';
            document.getElementById('messages').appendChild(div);
            div.scrollIntoView({behavior: 'smooth'});
        }

        function removeLoading() {
            const el = document.getElementById('loading');
            if (el) el.remove();
        }

        async function clearChat() {
            await fetch('/clear', {method: 'POST'});
            document.getElementById('messages').innerHTML =
                '<div class="msg msg-assistant">Conversation cleared. Ready.</div>';
        }

        async function interruptAgent() {
            const resp = await fetch('/interrupt', {method: 'POST'});
            const text = await resp.text();
            const msgs = document.getElementById('messages');
            msgs.innerHTML += '<div class="msg msg-assistant" style="color:#f44336;">[STOP] ' + text + '</div>';
            msgs.scrollTop = msgs.scrollHeight;
        }

        async function steerAgent() {
            const msg = prompt('Steering message (injected into next round):');
            if (!msg) return;
            const resp = await fetch('/steer', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: msg})
            });
            const result = await resp.json();
            const msgs = document.getElementById('messages');
            msgs.innerHTML += '<div class="msg msg-assistant" style="color:#ff9800;">[STEER] ' + (result.message || result.error) + '</div>';
            msgs.scrollTop = msgs.scrollHeight;
        }
    </script>
</body>
</html>
