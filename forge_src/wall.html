<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forge Wall Dashboard</title>
    <style>
        :root {
            --bg: #0b0f19;
            --panel: #111827;
            --border: #1f2937;
            --accent: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --purple: #a78bfa;
            --text-main: #f3f4f6;
            --text-dim: #9ca3af;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            height: 100vh;
            display: grid;
            grid-template-columns: 1fr 320px;
            grid-template-rows: auto 1fr;
            gap: 0;
            overflow: hidden;
        }

        /* ── Header ─────────────────────────────────────────── */
        header {
            grid-column: 1 / -1;
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            background: var(--panel);
        }
        header h1 { font-size: 1.1rem; font-weight: 700; color: var(--accent); letter-spacing: 1.5px; }
        #clock { color: var(--text-dim); font-family: monospace; font-size: 0.85rem; }
        .active-route-pill {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(16,185,129,0.15); color: var(--success);
            padding: 3px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 600;
        }
        .active-route-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); animation: blink 1.5s infinite; }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
        .wall-controls {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-left: 12px;
        }
        .wall-controls select, .wall-controls button {
            background: rgba(255,255,255,0.06);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 4px 6px;
            font-size: 0.72rem;
        }
        .wall-controls button { cursor: pointer; }
        .wall-controls .ok { color: var(--success); }
        .wall-controls .err { color: var(--danger); }

        /* ── Main GPU Area ──────────────────────────────────── */
        #main-area {
            padding: 16px 20px;
            overflow-y: auto;
            display: flex; flex-direction: column; gap: 18px;
        }

        /* ── GPU Group ──────────────────────────────────────── */
        .gpu-group {
            background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
            padding: 14px 16px;
        }
        .gpu-group-header {
            display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
            font-size: 0.95rem; font-weight: 600; color: var(--accent);
        }
        .gpu-group-header .dot-indicator {
            width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
        }
        .gpu-group-header .host-tag {
            font-size: 0.72rem; color: var(--text-dim); background: rgba(255,255,255,0.06);
            padding: 2px 8px; border-radius: 4px; margin-left: auto;
        }
        .gpu-group-header .model-tag {
            font-size: 0.72rem; color: var(--purple); background: rgba(167,139,250,0.12);
            padding: 2px 8px; border-radius: 4px;
        }
        .gpu-group-header .lane-tag {
            font-size: 0.72rem; font-weight: 700; padding: 2px 8px; border-radius: 4px;
        }
        .lane-tag.coder  { background: rgba(59,130,246,0.2); color: var(--accent); }
        .lane-tag.thinker { background: rgba(245,158,11,0.2); color: var(--warning); }
        .lane-tag.idle { background: rgba(156,163,175,0.15); color: var(--text-dim); }
        .lane-tag.other { background: rgba(167,139,250,0.2); color: var(--purple); }

        .gpu-row { display: flex; gap: 12px; flex-wrap: wrap; }
        .gpu-tile {
            flex: 1; min-width: 220px;
            background: rgba(0,0,0,0.25); border: 1px solid var(--border); border-radius: 8px;
            padding: 12px; display: flex; flex-direction: column; gap: 8px;
        }
        .gpu-tile-name {
            font-size: 0.82rem; font-weight: 600; color: var(--text-main);
            display: flex; align-items: center; gap: 6px;
        }
        .gpu-tile-name .pcie-badge {
            font-size: 0.65rem; color: var(--accent); background: rgba(59,130,246,0.12);
            padding: 1px 6px; border-radius: 3px;
        }

        /* ── Dials ──────────────────────────────────────────── */
        .dials-row { display: flex; gap: 8px; justify-content: space-between; }
        .dial-cell { display: flex; flex-direction: column; align-items: center; flex: 1; }
        .dial-cell .label { font-size: 0.62rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 2px; }
        .dial-svg { width: 68px; height: 38px; }
        .dial-bg  { fill: none; stroke: #374151; stroke-width: 7; stroke-linecap: round; }
        .dial-fg  { fill: none; stroke-width: 7; stroke-linecap: round; transition: stroke-dasharray 0.6s ease; }
        .dial-red { fill: none; stroke: var(--danger); stroke-width: 7; stroke-linecap: round; }
        .dial-txt { font-size: 12px; fill: var(--text-main); font-weight: 700; text-anchor: middle; dominant-baseline: central; }

        /* ── Idle / Other Jobs ──────────────────────────────── */
        .idle-section { margin-top: 4px; }
        .idle-section h3 {
            font-size: 0.82rem; color: var(--text-dim); font-weight: 600;
            margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px;
        }
        .idle-card {
            background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
            padding: 12px 16px; display: flex; align-items: center; gap: 14px;
        }
        .idle-card + .idle-card { margin-top: 10px; }
        .idle-icon {
            width: 36px; height: 36px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1rem; flex-shrink: 0;
        }
        .idle-info { flex: 1; }
        .idle-info .name { font-weight: 600; font-size: 0.85rem; }
        .idle-info .desc { font-size: 0.72rem; color: var(--text-dim); margin-top: 2px; }
        .idle-status {
            font-size: 0.68rem; font-weight: 700; padding: 2px 8px; border-radius: 10px;
        }
        .wall-btn {
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.05);
            color: var(--text-main);
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 0.7rem;
            cursor: pointer;
        }
        .wall-btn.start {
            border-color: rgba(16,185,129,0.4);
            color: var(--success);
        }
        .wall-btn.stop {
            border-color: rgba(239,68,68,0.4);
            color: var(--danger);
        }
        .wall-btn:hover { filter: brightness(1.1); }

        /* ── Right Sidebar ──────────────────────────────────── */
        #sidebar {
            background: var(--panel); border-left: 1px solid var(--border);
            display: flex; flex-direction: column;
            overflow: hidden;
        }
        .sidebar-header {
            padding: 12px 14px; font-size: 0.8rem; font-weight: 700; color: var(--accent);
            border-bottom: 1px solid var(--border); text-transform: uppercase; letter-spacing: 1px;
        }
        #sidebar-content {
            flex: 1; overflow-y: auto; padding: 10px 12px;
            display: flex; flex-direction: column; gap: 10px;
        }

        /* ── Feed Items ─────────────────────────────────────── */
        .feed-item {
            background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 8px;
            padding: 10px 12px; font-size: 0.78rem;
        }
        .feed-item .feed-head {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;
        }
        .feed-item .feed-lane {
            font-weight: 700; color: var(--accent); font-size: 0.75rem; text-transform: uppercase;
        }
        .feed-item .feed-ts {
            font-size: 0.65rem; color: var(--text-dim); font-family: monospace;
        }
        .feed-item .feed-route {
            display: flex; align-items: center; gap: 5px;
            font-size: 0.7rem; color: var(--text-dim); margin-bottom: 4px; flex-wrap: wrap;
        }
        .feed-route .arrow { color: var(--accent); }
        .feed-item .feed-log {
            font-family: monospace; font-size: 0.72rem; color: var(--purple);
            line-height: 1.4; white-space: pre-wrap;
            max-height: 60px; overflow-y: auto;
        }

        .feed-empty {
            color: var(--text-dim); font-size: 0.78rem; text-align: center;
            padding: 20px 0; font-style: italic;
        }
    </style>
</head>
<body>

<header>
    <h1>FORGE CLUSTER WALL</h1>
    <div style="display:flex;gap:10px;align-items:center;">
        <div id="active-route-summary" style="display:flex;gap:10px;align-items:center;"></div>
        <div class="wall-controls">
            <select id="wall-routing-select" title="Routing preset"></select>
            <button onclick="wallApplyPreset()">Apply preset</button>
            <select id="wall-dispatch-node" title="Dispatch node">
                <option value="cesarops2">cesarops2</option>
                <option value="cesarops3">cesarops3</option>
                <option value="t440">t440</option>
            </select>
            <select id="wall-dispatch-action" title="Dispatch action">
                <option value="sync_llm_endpoints">sync_llm_endpoints</option>
                <option value="pamp_route">pamp_route</option>
            </select>
            <button onclick="wallDispatch()">Dispatch</button>
            <span id="wall-control-status" style="font-size:0.7rem;color:var(--text-dim);"></span>
        </div>
    </div>
    <div id="clock"></div>
</header>

<div id="main-area">
    <div style="color:var(--text-dim)">Probing cluster...</div>
</div>

<div id="sidebar">
    <div class="sidebar-header">Live Route Feed</div>
    <div id="sidebar-content">
        <div class="feed-empty">Waiting for activity...</div>
    </div>
</div>

<script>
// ── Dial helper ────────────────────────────────────────────────────────
function dial(value, max, unit, hasRedline, color) {
    const R = 30, C = Math.PI * R;
    const dash = (Math.min(value, max) / max) * C;
    const col = color || 'var(--accent)';
    let red = '';
    if (hasRedline) {
        const rd = 0.2 * C, ro = C * 0.8;
        red = `<path class="dial-red" d="M 4,36 A 30,30 0 0,1 64,36" stroke-dasharray="${rd} ${C}" stroke-dashoffset="-${ro}" />`;
    }
    return `<svg class="dial-svg" viewBox="0 0 68 40">
        <path class="dial-bg" d="M 4,36 A 30,30 0 0,1 64,36" />
        ${red}
        <path class="dial-fg" style="stroke:${col}" d="M 4,36 A 30,30 0 0,1 64,36" stroke-dasharray="${dash} ${C}" />
        <text x="34" y="30" class="dial-txt">${typeof value==='number'?value.toFixed(0):'?'}${unit}</text>
    </svg>`;
}

// ── Cluster state ──────────────────────────────────────────────────────
let prevGpuData = null;
let wallRoutingPresets = [];
let lakeWorkerRunning = false;

async function fetchAll() {
    try {
        const [monRes, actRes, cfgRes] = await Promise.all([
            fetch('/monitor'),
            fetch('/lanes/activity'),
            fetch('/cluster/config/full')
        ]);
        const monData = await monRes.json();
        const actData = await actRes.json();
        const cfgData = await cfgRes.json();
        renderMain(monData, cfgData);
        renderSidebar(actData, monData);
    } catch(e) { console.error('fetchAll', e); }
}

async function fetchWallRoutingPresets() {
    try {
        const res = await fetch('/cluster/routing');
        const data = await res.json();
        wallRoutingPresets = data.presets || [];
        const active = data.active_preset_id || '';
        const sel = document.getElementById('wall-routing-select');
        if (!sel) return;
        sel.innerHTML = '<option value="">preset...</option>' +
            wallRoutingPresets.map(p => `<option value="${p.id}">${p.name || p.id}</option>`).join('');
        if (active && wallRoutingPresets.some(p => p.id === active)) {
            sel.value = active;
        }
    } catch (e) {
        console.error('fetchWallRoutingPresets', e);
    }
}

function setWallControlStatus(text, ok) {
    const el = document.getElementById('wall-control-status');
    if (!el) return;
    el.textContent = text;
    el.className = ok === true ? 'ok' : ok === false ? 'err' : '';
}

async function wallApplyPreset() {
    const sel = document.getElementById('wall-routing-select');
    const id = sel?.value || '';
    if (!id) {
        setWallControlStatus('select preset', false);
        return;
    }
    setWallControlStatus('applying...', null);
    try {
        const r = await fetch(`/cluster/routing/preset/${encodeURIComponent(id)}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ start_workers: true })
        });
        const d = await r.json();
        if (d.error) {
            setWallControlStatus(`error: ${d.error}`, false);
        } else {
            setWallControlStatus(`applied: ${id}`, true);
        }
    } catch (e) {
        setWallControlStatus(`error: ${e.message}`, false);
    }
    await fetchAll();
}

async function wallDispatch() {
    const node = document.getElementById('wall-dispatch-node')?.value || 'cesarops2';
    const action = document.getElementById('wall-dispatch-action')?.value || 'sync_llm_endpoints';
    setWallControlStatus('dispatching...', null);
    try {
        const r = await fetch('/cluster/fleet/dispatch', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ node, action })
        });
        const d = await r.json();
        if (d.error) {
            setWallControlStatus(`error: ${d.error}`, false);
        } else {
            setWallControlStatus(`dispatched: ${node}/${action}`, true);
        }
    } catch (e) {
        setWallControlStatus(`error: ${e.message}`, false);
    }
}

// ── Determine which model is loaded on a GPU ───────────────────────────
function modelsOnGpu(gpu, workers) {
    // Check VRAM: if used > 500MB, something is loaded
    const loaded = gpu.memory_used_mb > 500;
    const matched = workers.filter(w => {
        if (!w.model) return false;
        const gIdx = parseInt(w.gpu);
        return gIdx === gpu.index;
    });
    if (matched.length) return matched;
    return loaded ? [{ name: 'unknown-process', model: '(process using VRAM)', role: '?' }] : [];
}

// ── Group GPUs by model ────────────────────────────────────────────────
function groupGpusByModel(gpus, workers) {
    // Build a map: gpu-index -> best-match worker
    const gpuWorkerMap = {};
    // Prefer enabled workers, then any worker with a model
    for (const w of workers) {
        const gIdx = parseInt(w.gpu);
        if (isNaN(gIdx)) continue;
        if (!gpuWorkerMap[gIdx] || (w.enabled && !gpuWorkerMap[gIdx].enabled)) {
            gpuWorkerMap[gIdx] = w;
        }
    }

    // Group GPUs that share the same model file
    const modelGroups = {};  // key = modelfile or 'idle', value = {worker, gpus[]}
    const idleGpus = [];

    for (const g of gpus) {
        const w = gpuWorkerMap[g.index];
        const hasVram = g.memory_used_mb > 500;
        if (w && w.model && hasVram) {
            const key = w.model;
            if (!modelGroups[key]) modelGroups[key] = { worker: w, gpus: [] };
            modelGroups[key].gpus.push(g);
        } else if (hasVram && w) {
            // Has VRAM usage but model path present on disabled worker
            const key = w.model || `worker-${w.name}`;
            if (!modelGroups[key]) modelGroups[key] = { worker: w, gpus: [] };
            modelGroups[key].gpus.push(g);
        } else if (hasVram) {
            // VRAM in use, no worker matched — unknown process
            const key = `unknown-gpu-${g.index}`;
            modelGroups[key] = { worker: { name: g.name, role: 'unknown', model: '(process using VRAM)' }, gpus: [g] };
        } else {
            idleGpus.push(g);
        }
    }

    return { modelGroups, idleGpus };
}

// ── Host name from GPU name ────────────────────────────────────────────
function hostOf(gpu) {
    if (gpu.name.includes('cesarops2')) return 'Cesarops2 (ML350e)';
    if (gpu.name.includes('cesarops3')) return 'Cesarops3 (Scout)';
    return 'T440 (local)';
}

// ── Role → lane tag class ──────────────────────────────────────────────
function laneClass(role) {
    if (!role) return 'idle';
    if (role.includes('code') || role.includes('coder')) return 'coder';
    if (role.includes('think')) return 'thinker';
    if (role === 'idle') return 'idle';
    return 'other';
}

// ── Render main area ───────────────────────────────────────────────────
function renderMain(data, cfgData) {
    const gpus = data.gpus || [];
    const workers = cfgData?.workers || data.workers || [];
    const { modelGroups, idleGpus } = groupGpusByModel(gpus, workers);

    // Active route summary in header
    const enabledWorkers = workers.filter(w => w.enabled && w.model);
    const routeHtml = enabledWorkers.map(w => {
        const shortModel = w.model ? w.model.split('/').pop().replace('.gguf','') : '?';
        return `<span class="active-route-pill"><span class="dot"></span>${w.role}: ${shortModel}</span>`;
    }).join('');
    document.getElementById('active-route-summary').innerHTML = routeHtml || '<span style="color:var(--text-dim);font-size:0.75rem;">No active routes</span>';

    let html = '';

    // ── Active Model Groups ──
    for (const [modelPath, group] of Object.entries(modelGroups)) {
        const w = group.worker;
        const shortModel = (w.model || modelPath).split('/').pop().replace('.gguf','');
        const isSplit = group.gpus.length > 1;
        const splitBadge = isSplit ? `<span style="font-size:0.68rem;background:rgba(59,130,246,0.15);color:var(--accent);padding:1px 6px;border-radius:4px;">TP×${group.gpus.length}</span>` : '';
        const host = hostOf(group.gpus[0]);
        const lc = laneClass(w.role);

        html += `<div class="gpu-group">
            <div class="gpu-group-header">
                <div class="dot-indicator" style="background:${w.enabled?'var(--success)':'var(--warning)'}"></div>
                <span>${shortModel}</span>
                ${splitBadge}
                <span class="lane-tag ${lc}">${(w.role||'idle').toUpperCase()}</span>
                <span class="model-tag">${w.name}</span>
                ${w.name ? `<button class="wall-btn stop" onclick="workerAction('${w.name}','stop')">Stop worker</button>` : ''}
                <span class="host-tag">${host}</span>
            </div>
            <div class="gpu-row">
                ${group.gpus.map(g => renderGpuTile(g)).join('')}
            </div>
        </div>`;
    }

    // ── Idle / Other Jobs section ──
    html += `<div class="idle-section"><h3>Idle GPUs & Other Jobs</h3>`;

    for (const g of idleGpus) {
        html += `<div class="idle-card">
            <div class="idle-icon" style="background:rgba(156,163,175,0.1);">🎮</div>
            <div class="idle-info">
                <div class="name">${g.name.replace(/ \(cesarops[23]\)/,'')} <span style="font-size:0.68rem;color:var(--text-dim);">(GPU ${g.index})</span></div>
                <div class="desc">${hostOf(g)} · PCIe Gen${g.pcie_gen||'?'} x${g.pcie_width||'?'} · ${g.memory_total_mb}MB VRAM · ${g.temperature_c}°C</div>
            </div>
            <span class="idle-status" style="background:rgba(156,163,175,0.15);color:var(--text-dim);">IDLE</span>
        </div>`;
    }


    // CPU jobs
    if (data.numa) {
        html += `<div class="idle-card" style="margin-top:10px;">
            <div class="idle-icon" style="background:rgba(245,158,11,0.12);">⚙️</div>
            <div class="idle-info">
                <div class="name">Xeon CPU · Qdrant Vector DB</div>
                <div class="desc">Socket 0: ${data.numa.socket_0}</div>
                <div class="desc">Socket 1: ${data.numa.socket_1}</div>
            </div>
            <span class="idle-status" style="background:rgba(16,185,129,0.15);color:var(--success);">RUNNING</span>
        </div>`;

        html += `<div class="idle-card">
            <div class="idle-icon" style="background:rgba(167,139,250,0.12);">🛰️</div>
            <div class="idle-info">
                <div class="name">CPU Idle Worker · Satellite Tile Processing</div>
                <div class="desc">Background task using spare Xeon cycles for GDAL/raster work</div>
                <div class="desc" id="lake-worker-detail" style="margin-top:2px;">${lakeWorkerRunning?'lake_coverage_service.py active':'Not running — click Launch to start'}</div>
            </div>
            <div style="display:flex;gap:6px;align-items:center;">
                <span class="idle-status" id="lake-worker-status" style="background:${lakeWorkerRunning?'rgba(16,185,129,0.15)':'rgba(245,158,11,0.15)'};color:${lakeWorkerRunning?'var(--success)':'var(--warning)'};">${lakeWorkerRunning?'RUNNING':'STANDBY'}</span>
                ${lakeWorkerRunning
                    ? `<button class="wall-btn stop" onclick="lakeWorkerAction('stop')">Stop</button>`
                    : `<button class="wall-btn start" onclick="lakeWorkerAction('start')">Launch</button>`
                }
            </div>
        </div>`;
    }

    html += `</div>`; // close idle-section
    document.getElementById('main-area').innerHTML = html;
}

// ── Render a single GPU tile with dials ────────────────────────────────
function renderGpuTile(g) {
    const tempC = g.temperature_c || 0;
    const tempF = (tempC * 9/5) + 32;
    const util = g.utilization_pct || 0;
    const watts = g.power_draw_w || 0;
    const memPct = g.memory_total_mb > 0 ? (g.memory_used_mb / g.memory_total_mb) * 100 : 0;
    const memGB = (g.memory_used_mb / 1024).toFixed(1);
    const totalGB = (g.memory_total_mb / 1024).toFixed(0);

    let tempColor = 'var(--accent)';
    if (tempF > 185) tempColor = 'var(--danger)';
    else if (tempF > 165) tempColor = 'var(--warning)';

    let memColor = 'var(--accent)';
    if (memPct > 90) memColor = 'var(--danger)';
    else if (memPct > 75) memColor = 'var(--warning)';

    const cleanName = g.name.replace(/ \(cesarops[23]\)/, '');
    const pcieBadge = g.pcie_gen ? `<span class="pcie-badge">Gen${g.pcie_gen} x${g.pcie_width}</span>` : '';

    return `<div class="gpu-tile">
        <div class="gpu-tile-name">GPU ${g.index}: ${cleanName} ${pcieBadge}</div>
        <div class="dials-row">
            <div class="dial-cell">
                <div class="label">Temp</div>
                ${dial(tempC, 100, '°', true, tempColor)}
            </div>
            <div class="dial-cell">
                <div class="label">Compute</div>
                ${dial(util, 100, '%', false, util > 90 ? 'var(--warning)' : 'var(--accent)')}
            </div>
            <div class="dial-cell">
                <div class="label">VRAM</div>
                ${dial(memPct, 100, '%', false, memColor)}
            </div>
            <div class="dial-cell">
                <div class="label">Power</div>
                ${dial(watts, 300, 'W', true, watts > 200 ? 'var(--danger)' : 'var(--accent)')}
            </div>
        </div>
        <div style="font-size:0.68rem;color:var(--text-dim);text-align:center;">${memGB}GB / ${totalGB}GB VRAM</div>
    </div>`;
}

// ── Render sidebar ─────────────────────────────────────────────────────
function renderSidebar(actData, monData) {
    const activity = actData.activity || [];
    const workers = (monData.workers || []).filter(w => w.enabled);
    const el = document.getElementById('sidebar-content');

    // Build active route card at top
    let routeCard = '';
    if (workers.length) {
        const routeItems = workers.map(w => {
            const shortModel = w.model ? w.model.split('/').pop().replace('.gguf','') : 'none';
            const lc = laneClass(w.role);
            return `<div style="display:flex;justify-content:space-between;align-items:center;padding:3px 0;">
                <span class="lane-tag ${lc}" style="font-size:0.68rem;">${(w.role||'?').toUpperCase()}</span>
                <span style="font-size:0.7rem;color:var(--text-main);max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${shortModel}">${shortModel}</span>
            </div>`;
        }).join('');
        routeCard = `<div class="feed-item" style="border-color:var(--success);">
            <div class="feed-head"><span class="feed-lane" style="color:var(--success);">Active Routes</span></div>
            ${routeItems}
        </div>`;
    }

    // Activity feed
    let feedHtml = '';
    if (Array.isArray(activity) && activity.length) {
        // Group by lane, show latest few
        const byLane = {};
        activity.forEach(a => {
            if (!byLane[a.lane]) byLane[a.lane] = [];
            byLane[a.lane].push(a);
        });
        for (const [lane, logs] of Object.entries(byLane)) {
            const latest = logs.slice(-5);
            const logText = latest.map(l => `> ${l.text}`).join('\n');
            feedHtml += `<div class="feed-item">
                <div class="feed-head">
                    <span class="feed-lane">${lane.toUpperCase()}</span>
                    <span class="feed-ts">${latest.length} events</span>
                </div>
                <div class="feed-log">${logText}</div>
            </div>`;
        }
    }

    if (!routeCard && !feedHtml) {
        el.innerHTML = '<div class="feed-empty">No active routes or events.</div>';
    } else {
        el.innerHTML = routeCard + feedHtml;
    }
}

// ── Clock ──────────────────────────────────────────────────────────────
function updateClock() {
    document.getElementById('clock').innerText = new Date().toISOString().replace('T', ' ').substring(0, 19) + ' UTC';
}

async function workerAction(name, action) {
    try {
        await fetch(`/cluster/worker/${encodeURIComponent(name)}/${action}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({})
        });
    } catch (e) {
        console.error(`workerAction ${action} failed`, e);
    }
    await fetchAll();
}

// ── Lake Worker (CPU Idle Satellite Tile Processing) ───────────────────
async function checkLakeWorker() {
    try {
        const r = await fetch('/cluster/lake-worker');
        const d = await r.json();
        lakeWorkerRunning = d.running || false;
        const detail = document.getElementById('lake-worker-detail');
        const status = document.getElementById('lake-worker-status');
        if (status) {
            status.textContent = lakeWorkerRunning ? 'RUNNING' : 'STANDBY';
            status.style.background = lakeWorkerRunning ? 'rgba(16,185,129,0.15)' : 'rgba(245,158,11,0.15)';
            status.style.color = lakeWorkerRunning ? 'var(--success)' : 'var(--warning)';
        }
        if (detail) {
            detail.textContent = lakeWorkerRunning ? 'lake_coverage_service.py active' : 'Not running — click Launch to start';
        }
        return lakeWorkerRunning;
    } catch (e) {
        console.error('checkLakeWorker', e);
        return false;
    }
}

async function lakeWorkerAction(action) {
    try {
        const r = await fetch('/cluster/lake-worker', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: action })
        });
        const d = await r.json();
        const detail = document.getElementById('lake-worker-detail');
        if (detail && d.message) {
            detail.textContent = d.message;
        }
    } catch (e) {
        console.error('lakeWorkerAction ' + action, e);
    }
    setTimeout(() => { checkLakeWorker(); fetchAll(); }, 1000);
}

// ── Init ───────────────────────────────────────────────────────────────
async function init() {
    await fetchWallRoutingPresets();
    fetchAll();
    setTimeout(checkLakeWorker, 2000);
    setInterval(updateClock, 1000);
    setInterval(fetchAll, 5000);
    setInterval(fetchWallRoutingPresets, 20000);
    setInterval(checkLakeWorker, 5000);
}
init();
</script>

</html>
