# BeaverBeaver Radeon inference gateway
#
# Qwen3-ASR (8000) and VoxCPM (5001) run on the Radeon Cloud node. The LLM
# upstream uses AMD's Radeon API. Expose only this Nginx server (8080) through
# the Radeon Cloud rc-tunnel.

upstream beaver_llm {
    server developer.amd.com.cn:443;
    keepalive 16;
}

upstream beaver_asr {
    server 127.0.0.1:8000;
    keepalive 8;
}

upstream beaver_tts {
    server 127.0.0.1:5001;
    keepalive 8;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    client_max_body_size 64m;
    client_body_timeout 120s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    location = /healthz {
        default_type application/json;
        return 200 '{"status":"ok","service":"beaverbeaver-radeon-gateway"}';
    }

    # External: POST /llm/v1/chat/completions
    # Upstream: POST https://developer.amd.com.cn/radeon/api/v1/chat/completions
    location /llm/ {
        proxy_pass https://beaver_llm/radeon/api/;
        proxy_http_version 1.1;
        proxy_set_header Host developer.amd.com.cn;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_ssl_server_name on;
        proxy_ssl_name developer.amd.com.cn;
        proxy_buffering off;
        proxy_cache off;
    }

    # External: POST /asr/v1/audio/transcriptions
    # Upstream: POST /v1/audio/transcriptions
    location /asr/ {
        proxy_pass http://beaver_asr/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_request_buffering on;
    }

    # External: POST /tts/generate_tts
    # Upstream: POST /generate_tts
    location /tts/ {
        proxy_pass http://beaver_tts/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
    }
}
