<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>长期待办 · Beaver Memory</title>
    <link rel="stylesheet" href="/assets/beaver-memory.css" />
    <style>
      *{box-sizing:border-box}button,input,select{font:inherit}.page{width:100%;max-width:1320px;padding:38px}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px}.eyebrow{color:#8b642f;font-size:12px;font-weight:850;letter-spacing:.13em}.head h1{margin:7px 0 0;font-size:clamp(34px,4vw,58px);letter-spacing:-.05em}.head p{max-width:760px;margin:12px 0 0;color:var(--bm-muted);line-height:1.65}.health{padding:9px 13px;border:1px solid var(--bm-line);border-radius:999px;background:#fffaf0aa;font-size:12px}.health.error{color:var(--bm-danger)}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px}.metric{padding:16px;border:1px solid var(--bm-line);border-radius:18px;background:#fffaf0c9}.metric small{display:block;color:var(--bm-muted)}.metric strong{display:block;margin-top:4px;font-size:27px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.filters{display:flex;flex-wrap:wrap;gap:7px}.filter{padding:9px 12px;border:1px solid var(--bm-line);border-radius:11px;color:var(--bm-ink);background:#fffaf0;font-weight:750;cursor:pointer}.filter.active{color:white;background:var(--bm-sidebar)}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.card{display:grid;gap:10px;padding:17px;border:1px solid var(--bm-line);border-radius:18px;background:var(--bm-panel-strong);box-shadow:0 15px 42px rgba(37,30,19,.06)}.card.attention{border-color:rgba(215,150,56,.55);box-shadow:0 18px 48px rgba(215,150,56,.13)}.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.card h3{margin:0;font-size:16px;line-height:1.45}.meta,.refs,.actions{display:flex;flex-wrap:wrap;gap:7px}.meta{color:var(--bm-muted);font-size:12px}.quote{margin:0;padding:10px;border-left:3px solid #d7963870;color:#625d54;background:#f6efe4;font-size:12px;line-height:1.55}.refs{font-size:10px;overflow-wrap:anywhere}.empty{padding:38px;border:1px dashed var(--bm-line);border-radius:20px;color:var(--bm-muted);text-align:center}.dialog-layer{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:18px;background:#111a16aa;backdrop-filter:blur(5px)}.dialog-layer[hidden]{display:none}.dialog{width:min(560px,100%);padding:24px;border-radius:22px;background:var(--bm-panel);box-shadow:var(--bm-shadow)}.dialog h2{margin:0 0 18px}.form{display:grid;gap:13px}.field{display:grid;gap:6px}.field label{font-size:12px;font-weight:800}.field input,.field select{width:100%;min-height:43px;padding:10px 12px;border:1px solid var(--bm-line);border-radius:12px;background:white}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:7px}@media(max-width:1000px){.page{padding:25px 15px}.summary{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}.toolbar{align-items:flex-start;flex-direction:column}}
    </style>
    <script defer src="/assets/beaver-memory.js"></script>
  </head>
  <body class="bm-app">
    <div class="bm-shell">
      <aside class="bm-sidebar">
        <a class="bm-brand" href="/memory"><span class="bm-brand-mark">B</span><span class="bm-brand-copy"><strong>Beaver Memory</strong><small>Long-lived Todos</small></span></a>
        <nav class="bm-nav" aria-label="主导航">
          <a href="/memory"><span class="bm-nav-icon">◎</span><span class="bm-nav-label">记忆卡片</span></a>
          <a href="/memory/capsules"><span class="bm-nav-icon">◫</span><span class="bm-nav-label">多模态 Capsule</span></a>
          <a href="/memory/search"><span class="bm-nav-icon">⌕</span><span class="bm-nav-label">记忆搜索</span></a>
          <a href="/daily"><span class="bm-nav-icon">日</span><span class="bm-nav-label">每日回顾</span></a>
          <a href="/people"><span class="bm-nav-icon">人</span><span class="bm-nav-label">人物</span></a>
          <a href="/objects/search"><span class="bm-nav-icon">□</span><span class="bm-nav-label">物品搜索</span></a>
          <a class="active" href="/commitments"><span class="bm-nav-icon">◇</span><span class="bm-nav-label">长期待办</span></a>
          <a href="/memory/corrections"><span class="bm-nav-icon">✓</span><span class="bm-nav-label">修正历史</span></a>
          <a href="/integrations"><span class="bm-nav-icon">↗</span><span class="bm-nav-label">采集接入</span></a>
        </nav>
        <div style="position:absolute;left:20px;right:20px;bottom:24px"><label for="token" style="display:block;margin-bottom:7px;font-size:12px">本地调试令牌</label><input id="token" data-bm-token style="width:100%;padding:9px;border:1px solid #ffffff22;border-radius:10px;color:white;background:#0004" /></div>
      </aside>
      <main class="page">
        <header class="head"><div><div class="eyebrow">CONTINUOUS TODO MEMORY</div><h1>记住承诺，也记住有没有做到。</h1><p>记忆中提取的承诺和你手动添加的事项共用一份长期账本。Episode 可以提供进展或“疑似完成”证据，但只有你能最终确认完成。</p></div><div class="health" id="health">正在读取待办账本</div></header>
        <section class="summary" id="summary"></section>
        <div class="toolbar"><div class="filters" id="filters"><button class="filter active" data-status="">全部</button><button class="filter" data-status="candidate">待确认</button><button class="filter" data-status="open">待完成</button><button class="filter" data-status="in_progress">进行中</button><button class="filter" data-status="suspected_completed">疑似完成</button><button class="filter" data-status="completed">已完成</button></div><div><button class="bm-button-primary" id="newTodo">新增待办</button> <button class="bm-button-secondary" id="refresh">刷新</button></div></div>
        <div class="cards" id="cards"><div class="empty">尚无长期待办。</div></div>
      </main>
    </div>
    <div class="dialog-layer" id="dialog" hidden>
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
        <h2 id="dialogTitle">新增待办</h2>
        <form class="form" id="todoForm">
          <input id="editingId" type="hidden" />
          <div class="field"><label for="todoText">待办内容</label><input id="todoText" maxlength="800" required placeholder="例如：明天下午发送市场报告" /></div>
          <div class="field"><label for="todoDue">截止时间（可选）</label><input id="todoDue" type="datetime-local" /></div>
          <div class="field"><label for="todoPriority">优先级</label><select id="todoPriority"><option value="normal">普通</option><option value="high">重要</option><option value="urgent">紧急</option><option value="low">较低</option></select></div>
          <div class="dialog-actions"><button class="bm-button-secondary" type="button" id="cancelDialog">取消</button><button class="bm-button-primary" type="submit">保存</button></div>
        </form>
      </div>
    </div>
    <script>
      const state={items:[],status:""};const $=id=>document.getElementById(id);const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));const token=()=>window.BeaverMemoryUI?.getToken?.()||localStorage.getItem("beaver-memory.token")||"dev-token";const auth=(extra={})=>({...extra,authorization:`Bearer ${token()}`});
      const labels={candidate:"待确认",confirmed:"待完成",open:"待完成",in_progress:"进行中",suspected_completed:"疑似完成",done:"已完成",completed:"已完成",dismissed:"已取消",cancelled:"已取消"};const pillClass={suspected_completed:"warning",completed:"success",done:"success",cancelled:"danger",dismissed:"danger"};
      async function api(url,options={}){const response=await fetch(url,options);const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.detail||`HTTP ${response.status}`);return data}
      function due(value){if(!value)return "未设置截止时间";const date=new Date(value);return Number.isNaN(date.valueOf())?String(value):new Intl.DateTimeFormat("zh-CN",{dateStyle:"medium",timeStyle:"short",timeZone:"Asia/Shanghai"}).format(date)}
      function renderSummary(){const active=state.items.filter(i=>!["completed","done","cancelled","dismissed"].includes(i.status));$("summary").innerHTML=[["全部",state.items.length],["待处理",active.length],["进行中",state.items.filter(i=>i.status==="in_progress").length],["疑似完成",state.items.filter(i=>i.status==="suspected_completed").length],["已完成",state.items.filter(i=>["completed","done"].includes(i.status)).length]].map(([l,v])=>`<div class="metric"><small>${l}</small><strong>${v}</strong></div>`).join("")}
      function buttons(item){const s=item.status;if(s==="candidate")return `<button class="bm-button-primary" data-action="confirm">确认待办</button><button class="bm-button-secondary" data-action="edit">编辑</button><button class="bm-button-danger" data-action="cancel">取消</button>`;if(["confirmed","open"].includes(s))return `<button class="bm-button-primary" data-action="start">开始处理</button><button class="bm-button-secondary" data-action="complete">手动完成</button><button class="bm-button-secondary" data-action="edit">编辑</button><button class="bm-button-danger" data-action="delete">删除</button>`;if(s==="in_progress")return `<button class="bm-button-primary" data-action="complete">手动完成</button><button class="bm-button-secondary" data-action="edit">编辑</button><button class="bm-button-danger" data-action="delete">删除</button>`;if(s==="suspected_completed")return `<button class="bm-button-primary" data-action="confirm_completion">确认已完成</button><button class="bm-button-secondary" data-action="reject_completion">还没完成</button><button class="bm-button-secondary" data-action="edit">编辑</button>`;return `<button class="bm-button-secondary" data-action="reopen">重新打开</button><button class="bm-button-danger" data-action="delete">删除</button>`}
      function card(item){const id=item.todo_id||item.id||item.commitment_id;const progress=(item.progress_events||[])[0];return `<article class="card ${item.status==="suspected_completed"?"attention":""}" data-id="${esc(id)}"><div class="card-top"><h3>${esc(item.text)}</h3><span class="bm-pill ${pillClass[item.status]||""}">${esc(labels[item.status]||item.status)}</span></div><div class="meta"><span>${item.source_type==="user_created"?"我手动添加":"从记忆中识别"}</span><span>截止：${esc(due(item.normalized_due_at))}</span><span>优先级：${esc(item.priority||"normal")}</span></div>${progress?`<p class="quote">${progress.event_type==="suspected_completed"?"疑似完成证据":"最近进展"}：“${esc(progress.evidence_text)}”</p>`:`<p class="quote">“${esc(item.source_quote||item.source_quotes?.[0]||"由我手动创建")}”</p>`}<div class="refs">${(item.evidence_refs||[]).slice(-4).map(ref=>`<span class="bm-pill">${esc(ref)}</span>`).join("")}</div><div class="actions">${buttons(item)}</div></article>`}
      function render(){renderSummary();const visible=state.status?state.items.filter(item=>item.status===state.status||(state.status==="open"&&item.status==="confirmed")||(state.status==="completed"&&item.status==="done")):state.items;visible.sort((a,b)=>(a.status==="suspected_completed"?-1:0)-(b.status==="suspected_completed"?-1:0));$("cards").innerHTML=visible.length?visible.map(card).join(""):'<div class="empty">当前筛选下没有待办。</div>'}
      async function load(){try{const data=await api("/v1/memory/todos",{headers:auth()});state.items=data.todos||[];render();$("health").textContent="长期待办已连接";$("health").classList.remove("error")}catch(error){$("health").textContent=`暂时无法刷新：${error.message}（保留上次内容）`;$("health").classList.add("error")}}
      function openDialog(item=null){$("editingId").value=item?.todo_id||item?.id||"";$("dialogTitle").textContent=item?"编辑待办":"新增待办";$("todoText").value=item?.text||"";$("todoPriority").value=item?.priority||"normal";$("todoDue").value=item?.normalized_due_at?String(item.normalized_due_at).slice(0,16):"";$("dialog").hidden=false;$("todoText").focus()}
      function closeDialog(){$("dialog").hidden=true;$("todoForm").reset();$("editingId").value=""}
      async function save(event){event.preventDefault();const id=$("editingId").value;const dueValue=$("todoDue").value;const body={text:$("todoText").value.trim(),normalized_due_at:dueValue?new Date(dueValue).toISOString():null,priority:$("todoPriority").value};await api(id?`/v1/memory/todos/${encodeURIComponent(id)}`:"/v1/memory/todos",{method:id?"PATCH":"POST",headers:auth({"content-type":"application/json","Idempotency-Key":window.BeaverMemoryUI.idempotencyKey()}),body:JSON.stringify(body)});closeDialog();await load()}
      async function act(id,action){const item=state.items.find(v=>(v.todo_id||v.id||v.commitment_id)===id);if(!item)return;if(action==="edit"){openDialog(item);return}if(action==="delete"){if(!confirm("确定删除这条待办？删除后不会继续出现在日报或搜索中。"))return;await api(`/v1/memory/todos/${encodeURIComponent(id)}`,{method:"DELETE",headers:auth({"Idempotency-Key":window.BeaverMemoryUI.idempotencyKey()})})}else await api(`/v1/memory/todos/${encodeURIComponent(id)}/actions`,{method:"POST",headers:auth({"content-type":"application/json","Idempotency-Key":window.BeaverMemoryUI.idempotencyKey()}),body:JSON.stringify({action})});await load()}
      $("filters").addEventListener("click",event=>{const button=event.target.closest("button[data-status]");if(!button)return;state.status=button.dataset.status;document.querySelectorAll(".filter").forEach(item=>item.classList.toggle("active",item===button));render()});$("cards").addEventListener("click",async event=>{const button=event.target.closest("button[data-action]");if(!button)return;button.disabled=true;try{await act(button.closest(".card").dataset.id,button.dataset.action)}catch(error){$("health").textContent=`操作失败：${error.message}`;$("health").classList.add("error")}finally{button.disabled=false}});$("newTodo").addEventListener("click",()=>openDialog());$("refresh").addEventListener("click",load);$("cancelDialog").addEventListener("click",closeDialog);$("todoForm").addEventListener("submit",event=>save(event).catch(error=>{$("health").textContent=`保存失败：${error.message}`;$("health").classList.add("error")}));load();setInterval(load,30000);
    </script>
  </body>
</html>
