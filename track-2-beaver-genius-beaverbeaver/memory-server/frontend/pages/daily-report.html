<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>每日回顾 · Beaver Memory</title>
    <link rel="stylesheet" href="/assets/beaver-memory.css" />
    <style>
      *{box-sizing:border-box}button,input,select{font:inherit}.page{width:100%;max-width:1320px;padding:38px}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px}.eyebrow{color:#8b642f;font-size:12px;font-weight:850;letter-spacing:.13em}.head h1{margin:7px 0 0;font-size:clamp(34px,4vw,58px);letter-spacing:-.05em}.head p{max-width:760px;margin:12px 0 0;color:var(--bm-muted);line-height:1.65}.status{padding:9px 13px;border:1px solid var(--bm-line);border-radius:999px;background:#fffaf0aa;font-size:12px}.status.error{color:var(--bm-danger)}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-bottom:18px}.toolbar input,.toolbar select{min-height:42px;padding:9px 12px;border:1px solid var(--bm-line);border-radius:12px;color:var(--bm-ink);background:var(--bm-panel-strong)}.archive{margin-bottom:18px;padding:18px;border:1px solid var(--bm-line);border-radius:22px;background:rgba(255,250,240,.72)}.archive-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.archive-head h2{margin:0;font-size:16px}.archive-head span{color:var(--bm-muted);font-size:12px}.days{display:flex;gap:10px;overflow-x:auto;padding:1px 1px 8px;scrollbar-width:thin}.day{min-width:190px;padding:13px 14px;border:1px solid var(--bm-line);border-radius:16px;color:var(--bm-ink);background:var(--bm-panel-strong);text-align:left;cursor:pointer;transition:border-color .16s,background .16s,transform .16s}.day:hover{transform:translateY(-1px);border-color:#a88755}.day.active{border-color:#8b642f;background:#f4ead7;box-shadow:0 0 0 2px rgba(139,100,47,.1)}.day strong,.day span,.day small{display:block}.day strong{font-size:14px}.day span{margin-top:5px;color:#586a5e;font-size:11px}.day small{max-width:165px;margin-top:6px;overflow:hidden;color:var(--bm-muted);font-size:11px;text-overflow:ellipsis;white-space:nowrap}.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}.report{display:grid;gap:16px}.hero,.section{border:1px solid var(--bm-line);border-radius:24px;background:rgba(255,250,240,.88);box-shadow:var(--bm-shadow)}.hero{padding:26px}.hero h2{margin:0 0 10px;font-size:26px}.hero p{margin:0;color:#444b43;font-size:16px;line-height:1.8}.hero-actions{display:flex;gap:8px;margin-top:18px}.section{padding:20px}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.section h2{margin:0;font-size:18px}.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.item{padding:16px;border:1px solid var(--bm-line);border-radius:17px;background:var(--bm-panel-strong)}.item p{margin:0;line-height:1.7}.item footer{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px}.source{padding:5px 8px;border-radius:999px;color:#586a5e;background:#e5ebe3;font-size:10px;text-decoration:none}.empty{padding:38px;border:1px dashed var(--bm-line);border-radius:22px;color:var(--bm-muted);text-align:center}.failed{padding:14px;border:1px solid rgba(183,92,85,.3);border-radius:16px;color:var(--bm-danger);background:rgba(183,92,85,.06)}@media(max-width:900px){.page{padding:25px 15px}.head{align-items:flex-start;flex-direction:column}.items{grid-template-columns:1fr}.day{min-width:170px}}
    </style>
    <script defer src="/assets/beaver-memory.js"></script>
  </head>
  <body class="bm-app">
    <div class="bm-shell">
      <aside class="bm-sidebar">
        <a class="bm-brand" href="/memory"><span class="bm-brand-mark">B</span><span class="bm-brand-copy"><strong>Beaver Memory</strong><small>Daily Review</small></span></a>
        <nav class="bm-nav" aria-label="主导航">
          <a href="/memory"><span class="bm-nav-icon">◎</span><span class="bm-nav-label">记忆卡片</span></a>
          <a href="/memory/capsules"><span class="bm-nav-icon">◫</span><span class="bm-nav-label">多模态 Capsule</span></a>
          <a href="/memory/search"><span class="bm-nav-icon">⌕</span><span class="bm-nav-label">记忆搜索</span></a>
          <a class="active" href="/daily"><span class="bm-nav-icon">日</span><span class="bm-nav-label">每日回顾</span></a>
          <a href="/people"><span class="bm-nav-icon">人</span><span class="bm-nav-label">人物</span></a>
          <a href="/objects/search"><span class="bm-nav-icon">□</span><span class="bm-nav-label">物品搜索</span></a>
          <a href="/commitments"><span class="bm-nav-icon">◇</span><span class="bm-nav-label">长期待办</span></a>
          <a href="/memory/corrections"><span class="bm-nav-icon">✓</span><span class="bm-nav-label">修正历史</span></a>
          <a href="/integrations"><span class="bm-nav-icon">↗</span><span class="bm-nav-label">采集接入</span></a>
        </nav>
        <div style="position:absolute;left:20px;right:20px;bottom:24px"><label for="token" style="display:block;margin-bottom:7px;font-size:12px">本地调试令牌</label><input id="token" data-bm-token style="width:100%;padding:9px;border:1px solid #ffffff22;border-radius:10px;color:white;background:#0004" /></div>
      </aside>
      <main class="page">
        <header class="head">
          <div><div class="eyebrow">GROUNDED DAILY REVIEW</div><h1>今天，我经历了什么？</h1><p>每晚 22:00 根据真实 Episode 自动生成。每条结论都能回到来源记忆；没有足够特别的瞬间时，系统会诚实地留空。</p></div>
          <div class="status" id="health">正在读取日报</div>
        </header>
        <div class="toolbar">
          <input id="date" type="date" aria-label="日报日期" />
          <button class="bm-button-primary" id="generate">立即生成 / 重新生成</button>
          <button class="bm-button-secondary" id="refresh">刷新</button>
          <select id="versions" aria-label="历史版本"><option value="">当前版本</option></select>
        </div>
        <section class="archive" aria-label="多日回顾">
          <div class="archive-head"><h2>多日回顾</h2><span id="dayCount">正在读取已有日报</span></div>
          <div class="days" id="days"><div class="empty">正在读取日报日期……</div></div>
        </section>
        <div class="meta" id="meta"></div>
        <div class="report" id="report"><div class="empty">选择日期后生成或查看日报。</div></div>
      </main>
    </div>
    <script>
      const state={current:null,displayed:null,versions:[],days:[],generating:false};const $=id=>document.getElementById(id);const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
      const token=()=>window.BeaverMemoryUI?.getToken?.()||localStorage.getItem("beaver-memory.token")||"dev-token";const auth=(extra={})=>({...extra,authorization:`Bearer ${token()}`});
      function shanghaiDate(){return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Shanghai",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date())}
      async function api(url,options={}){const response=await fetch(url,options);const data=await response.json().catch(()=>({}));if(!response.ok){const error=new Error(data.detail||`HTTP ${response.status}`);error.status=response.status;throw error}return data}
      function fmt(value){if(!value)return "—";const date=new Date(value);return Number.isNaN(date.valueOf())?String(value):new Intl.DateTimeFormat("zh-CN",{dateStyle:"medium",timeStyle:"short",timeZone:"Asia/Shanghai"}).format(date)}
      function refs(item){return (item.source_episode_ids||[]).map(id=>`<a class="source" href="/memory?episode=${encodeURIComponent(id)}">查看来源 · ${esc(id)}</a>`).join("")}
      function dayLabel(value){const date=new Date(`${value}T12:00:00+08:00`);return Number.isNaN(date.valueOf())?value:new Intl.DateTimeFormat("zh-CN",{timeZone:"Asia/Shanghai",month:"long",day:"numeric",weekday:"short"}).format(date)}
      function renderDays(){const selected=$("date").value;$("dayCount").textContent=state.days.length?`最近 ${state.days.length} 天有日报`:"暂时还没有日报";$("days").innerHTML=state.days.length?state.days.map(day=>`<button type="button" class="day${day.date===selected?" active":""}" data-date="${esc(day.date)}"><strong>${esc(dayLabel(day.date))}</strong><span>v${esc(day.current_version||"—")} · ${esc(day.timeline_count||0)} 件事 · ${esc(day.special_moment_count||0)} 个特别瞬间</span><small>${esc(day.overview||"这一天暂无足够记忆")}</small></button>`).join(""):'<div class="empty">还没有可回看的日期。选择任意日期后可立即生成。</div>';$("days").querySelectorAll("[data-date]").forEach(button=>button.addEventListener("click",()=>selectDate(button.dataset.date)))}
      async function loadDays(){const data=await api("/v1/memory/daily-reports?limit=90",{headers:auth()});state.days=data.days||[];renderDays();return state.days}
      function selectDate(date){if(!/^\d{4}-\d{2}-\d{2}$/.test(date||""))return;$("date").value=date;history.replaceState(null,"",`/daily?date=${encodeURIComponent(date)}`);renderDays();$("versions").value="";load()}
      function section(title,items,emptyText){return `<section class="section"><div class="section-head"><h2>${esc(title)}</h2><span class="bm-pill">${items.length} 条</span></div>${items.length?`<div class="items">${items.map(item=>`<article class="item"><p>${esc(item.text)}</p><footer>${refs(item)}${(item.todo_ids||[]).map(id=>`<a class="source" href="/commitments?todo=${encodeURIComponent(id)}">待办 · ${esc(id)}</a>`).join("")}</footer></article>`).join("")}</div>`:`<div class="empty">${esc(emptyText)}</div>`}</section>`}
      function render(report){state.displayed=report;const content=report?.content||{};$("meta").innerHTML=[`<span class="bm-pill ${report?.status==="ready"||report?.status==="closed"?"success":"warning"}">${esc(report?.status||"未生成")}</span>`,`<span class="bm-pill">版本 ${esc(report?.version||"—")}</span>`,`<span class="bm-pill">${report?.generation_type==="scheduled"?"22:00 自动生成":"手动生成"}</span>`,`<span class="bm-pill">${esc(fmt(report?.completed_at||report?.updated_at))}</span>`].join("");if(!report){$("report").innerHTML='<div class="empty">这一天还没有日报。你可以立即生成；晚上 22:00 也会自动生成。</div>';return}if(report.status==="failed"){$("report").innerHTML=`<div class="failed">本次生成失败：${esc(report.error||"未知错误")}。上一份成功日报不会被覆盖，请稍后重试。</div>`;return}$("report").innerHTML=`<section class="hero"><h2>${esc(content.title||`我的 ${report.date} 日报`)}</h2><p>${esc(content.overview||"今天暂无足够记忆。")}</p><div class="hero-actions"><button class="bm-button-secondary" id="correctOverview">修正这段回顾</button></div></section>${section("今天做了什么",content.timeline||[],"今天暂无可整理的完整事件。")}${section("值得留意",content.notable_items||[],"今天没有需要特别留意的内容。")}${section("特别瞬间",content.special_moments||[],"今天没有足够明确的特别瞬间，不会为了填满而编写。")}${section("待办动态",content.todo_changes||[],"今天没有待办状态变化。")}`;document.getElementById("correctOverview")?.addEventListener("click",()=>window.BeaverMemoryUI.openCorrection({targetType:"daily_report",targetId:report.id,fieldPath:"content.overview",originalValue:content.overview||"",evidenceRefs:(report.input_snapshot?.episode_ids||[]).map(id=>`everos://episode/${id}`),title:"修正这份日报",onApplied:load}))}
      async function loadVersions(){const date=$("date").value;const data=await api(`/v1/memory/daily-reports/${encodeURIComponent(date)}/versions`,{headers:auth()});state.versions=data.versions||[];$("versions").innerHTML='<option value="">当前版本</option>'+state.versions.map(item=>`<option value="${esc(item.id)}">v${esc(item.version)} · ${esc(item.generation_type==="scheduled"?"自动":"手动")} · ${esc(fmt(item.completed_at||item.updated_at))}${item.status==="failed"?" · 失败":""}</option>`).join("")}
      async function load(){const date=$("date").value;renderDays();try{const data=await api(`/v1/memory/daily-reports/${encodeURIComponent(date)}`,{headers:auth()});state.current=data.daily_report;render(state.current);$("health").textContent="真实日报已连接";$("health").classList.remove("error")}catch(error){if(error.status===404){state.current=null;render(null);$("health").textContent="等待生成"}else{$("health").textContent=`暂时无法刷新：${error.message}（保留上次内容）`;$("health").classList.add("error")}}try{await loadVersions()}catch(error){if(error.status!==404)$("health").textContent=`版本读取失败：${error.message}`}}
      async function generate(){if(state.generating)return;state.generating=true;$("generate").disabled=true;$("health").textContent="正在读取 Episode 并生成…";try{const data=await api(`/v1/memory/daily-reports/${encodeURIComponent($("date").value)}/generate`,{method:"POST",headers:auth({"content-type":"application/json","Idempotency-Key":window.BeaverMemoryUI.idempotencyKey()}),body:JSON.stringify({generation_type:"manual"})});if(data.daily_report.status==="failed")throw new Error(data.daily_report.error||"生成失败");state.current=data.daily_report;render(state.current);await Promise.all([loadVersions(),loadDays()]);$("health").textContent="日报已生成"}catch(error){$("health").textContent=`生成失败：${error.message}（旧版本仍保留）`;$("health").classList.add("error")}finally{state.generating=false;$("generate").disabled=false}}
      async function init(){const requestedDate=new URLSearchParams(location.search).get("date");try{await loadDays()}catch(error){$("dayCount").textContent=`日期索引读取失败：${error.message}`}$("date").value=/^\d{4}-\d{2}-\d{2}$/.test(requestedDate||"")?requestedDate:(state.days[0]?.date||shanghaiDate());history.replaceState(null,"",`/daily?date=${encodeURIComponent($("date").value)}`);renderDays();await load()}
      $("date").addEventListener("change",()=>selectDate($("date").value));$("refresh").addEventListener("click",async()=>{await load();try{await loadDays()}catch(error){$("dayCount").textContent=`日期索引读取失败：${error.message}`}});$("generate").addEventListener("click",generate);$("versions").addEventListener("change",event=>{const item=state.versions.find(row=>row.id===event.target.value);render(item||state.current)});init();
    </script>
  </body>
</html>
