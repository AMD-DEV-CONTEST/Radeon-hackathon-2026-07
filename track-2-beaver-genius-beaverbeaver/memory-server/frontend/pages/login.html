<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 · Beaver Memory</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/assets/beaver-memory.css" />
    <style>
      *{box-sizing:border-box} body{min-height:100vh;margin:0;color:#17231d;background:radial-gradient(circle at 18% 15%,#fff8e9 0,transparent 34%),linear-gradient(135deg,#eee6d8,#dce7dc);font-family:Inter,"Noto Sans SC",system-ui,sans-serif} .wrap{display:grid;min-height:100vh;place-items:center;padding:24px}.card{width:min(460px,100%);padding:38px;border:1px solid #d8cebd;border-radius:30px;background:#fffaf0eF;box-shadow:0 24px 70px #33483a24}.mark{display:grid;width:52px;height:52px;margin-bottom:26px;place-items:center;border-radius:17px;color:#fff;background:#253b30;font-size:24px;font-weight:900}h1{margin:0 0 12px;font-size:38px;letter-spacing:-.04em}.lead{margin:0 0 28px;color:#657067;line-height:1.7}.field{display:grid;gap:9px}label{font-size:13px;font-weight:850}input{width:100%;padding:14px 15px;border:1px solid #cfc5b4;border-radius:14px;background:#fff;font:inherit;outline:none}input:focus{border-color:#658371;box-shadow:0 0 0 4px #65837120}button{width:100%;margin-top:15px;padding:14px;border:0;border-radius:14px;color:#fff;background:#253b30;font:inherit;font-weight:850;cursor:pointer}.error{min-height:22px;margin-top:12px;color:#a43e34;font-size:13px}.hint{margin-top:23px;padding-top:18px;border-top:1px solid #ded4c4;color:#778078;font-size:12px;line-height:1.6}
    </style>
  </head>
  <body>
    <main class="wrap"><section class="card">
      <div class="mark">B</div><h1>进入你的记忆空间</h1>
      <p class="lead">输入分配给你的用户 Token。设备上传、人物、物品、日报、待办和 EverOS 记忆都会按用户隔离。</p>
      <form id="loginForm"><div class="field"><label for="token">用户 Token</label><input id="token" type="password" autocomplete="current-password" autofocus required placeholder="请输入 Token" /></div><button id="submit" type="submit">登录 Beaver Memory</button><div id="error" class="error" role="alert"></div></form>
      <div class="hint">Token 只用于建立 HttpOnly 登录会话，不会写入 URL。公共设备应使用自己的设备 Token，不要共享其他用户的 Token。</div>
    </section></main>
    <script>
      const form=document.getElementById("loginForm"),error=document.getElementById("error"),submit=document.getElementById("submit");
      form.addEventListener("submit",async event=>{event.preventDefault();error.textContent="";submit.disabled=true;try{const token=document.getElementById("token").value.trim();const response=await fetch("/v1/auth/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({token})});const payload=await response.json().catch(()=>({}));if(!response.ok)throw new Error(payload.detail||"登录失败");for(const key of ["beaver-memory.token","everlens.token"]){localStorage.removeItem(key)}const next=new URLSearchParams(location.search).get("next")||"/memory";location.replace(next.startsWith("/")?next:"/memory")}catch(exc){error.textContent=exc.message}finally{submit.disabled=false}});
    </script>
  </body>
</html>
