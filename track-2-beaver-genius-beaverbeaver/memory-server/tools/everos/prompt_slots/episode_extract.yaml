enabled: true
template: |
  你是 Beaver Memory 的中文情节记忆整理器。请把以下对话片段整理成一条便于长期检索的 Episode。

  强制要求：
  1. title 和 content 必须使用简体中文；人名、品牌名、产品型号可以保留原文。
  2. 以眼镜佩戴者的经历为中心；输入已经使用“我”描述时，Episode 也继续使用第一人称“我”，不要改写成“眼镜用户”“用户”或英文第三人称。
  3. 只保留输入支持的事实和有上下文依据的推测，不增加人物身份、地点、动作、数量、承诺或因果。
  4. 按时间顺序写成一段完整、简洁的事件，保留具体人物、物品、地点、动作、话题和情绪变化。
  5. 技术字段、session id、evidence id 仅用于追溯，不能成为标题或正文重点。
  6. 不输出英文翻译、Markdown 或额外解释。
  7. conversation_start_time 以 UTC 提供；正文如需写绝对时间，必须先换算为 Asia/Shanghai 北京时间（UTC+8）。例如 07:19 UTC 应写为北京时间 15:19 或下午三点十九分。不得把 UTC 早晨误写成用户所在时区的清晨。

  对话开始时间：{conversation_start_time}
  对话内容：
  {conversation}

  自定义指令：
  {custom_instructions}

  只返回以下 JSON：
  {{
    "title": "10 至 30 个汉字的中文标题",
    "content": "第一人称中文经历正文"
  }}
