<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFF"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="device" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D5DFB"/>
      <stop offset="1" stop-color="#4B43C5"/>
    </linearGradient>
    <linearGradient id="gateway" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3478F6"/>
      <stop offset="1" stop-color="#1456C0"/>
    </linearGradient>
    <linearGradient id="memory" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12A879"/>
      <stop offset="1" stop-color="#087658"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#25315B" flood-opacity="0.13"/>
    </filter>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#6658E8"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2771E8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0A8E68"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#72809F"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
      .title { font-size: 38px; font-weight: 700; fill: #14213D; }
      .subtitle { font-size: 18px; fill: #687391; }
      .section { font-size: 17px; font-weight: 700; fill: #FFFFFF; }
      .sectionDark { font-size: 17px; font-weight: 700; fill: #1A2746; }
      .cardTitle { font-size: 20px; font-weight: 700; fill: #17213B; }
      .boxTitle { font-size: 16px; font-weight: 700; fill: #25314D; }
      .body { font-size: 14px; fill: #5D6882; }
      .small { font-size: 12px; fill: #6C7894; }
      .mini { font-size: 11px; fill: #6C7894; }
      .whiteBody { font-size: 14px; fill: #F5F7FF; }
      .whiteSmall { font-size: 12px; fill: #E5E9FF; }
      .tag { font-size: 11px; font-weight: 600; }
      .flowLabel { font-size: 12px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1510" cy="40" r="190" fill="#DDE5FF" opacity="0.45"/>
  <circle cx="80" cy="840" r="160" fill="#E5DFFF" opacity="0.42"/>

  <text x="52" y="57" class="title">小智 × Beaver Memory｜随身多模态记忆系统</text>
  <text x="54" y="88" class="subtitle">持续采集 → 可靠传输 → 多模态理解 → 长期记忆 → 可追溯召回</text>

  <!-- Top lane label -->
  <rect x="52" y="112" width="170" height="32" rx="16" fill="#6D5DFB"/>
  <text x="137" y="134" class="section" text-anchor="middle">后台记忆链 · 持续</text>
  <text x="240" y="134" class="small">原始音画是一级证据；模型结果均可重跑、可核对</text>

  <!-- Device card -->
  <g filter="url(#shadow)">
    <rect x="52" y="160" width="245" height="510" rx="24" fill="url(#device)"/>
  </g>
  <text x="76" y="195" class="section">01  小智设备端</text>
  <text x="76" y="219" class="whiteSmall">M5Stack CoreS3 · ESP32-S3</text>

  <rect x="72" y="242" width="205" height="67" rx="14" fill="#FFFFFF" opacity="0.14"/>
  <text x="174" y="267" class="section" text-anchor="middle">Application</text>
  <text x="174" y="290" class="whiteSmall" text-anchor="middle">状态机 · 任务调度 · 资源协调</text>

  <rect x="72" y="326" width="96" height="72" rx="14" fill="#FFFFFF" opacity="0.96"/>
  <circle cx="95" cy="350" r="11" fill="#6658E8" opacity="0.14"/>
  <path d="M89 346 h12 a4 4 0 0 1 4 4 v7 a4 4 0 0 1-4 4 H89 a4 4 0 0 1-4-4 v-7 a4 4 0 0 1 4-4z M101 346 l4-5 h-7 l-3 5" fill="none" stroke="#6658E8" stroke-width="2"/>
  <text x="120" y="354" class="boxTitle">相机</text>
  <text x="120" y="379" class="small" text-anchor="middle">JPEG · 5s/帧</text>

  <rect x="181" y="326" width="96" height="72" rx="14" fill="#FFFFFF" opacity="0.96"/>
  <circle cx="204" cy="350" r="11" fill="#6658E8" opacity="0.14"/>
  <path d="M204 342 v14 M199 348 v3 a5 5 0 0 0 10 0 v-3 M204 356 v6 M199 362 h10" fill="none" stroke="#6658E8" stroke-width="2" stroke-linecap="round"/>
  <text x="229" y="354" class="boxTitle">麦克风</text>
  <text x="229" y="379" class="small" text-anchor="middle">PCM/WAV · 30s</text>

  <rect x="72" y="416" width="205" height="74" rx="14" fill="#FFFFFF" opacity="0.96"/>
  <text x="88" y="443" class="boxTitle">后台记忆采集服务</text>
  <text x="88" y="468" class="small">状态感知 · 切片 · 序列元数据</text>

  <rect x="72" y="508" width="205" height="80" rx="14" fill="#221B73" opacity="0.42"/>
  <text x="88" y="535" class="section">SD 持久队列</text>
  <text x="88" y="558" class="whiteSmall">原子落盘 · SHA-256 · 断网续传</text>
  <text x="88" y="577" class="whiteSmall">音频/图片独立序列 · ACK 后清理</text>

  <rect x="72" y="610" width="64" height="24" rx="12" fill="#FFFFFF" opacity="0.16"/>
  <text x="104" y="627" class="whiteSmall" text-anchor="middle">FreeRTOS</text>
  <rect x="143" y="610" width="48" height="24" rx="12" fill="#FFFFFF" opacity="0.16"/>
  <text x="167" y="627" class="whiteSmall" text-anchor="middle">ESP-IDF</text>
  <rect x="198" y="610" width="79" height="24" rx="12" fill="#FFFFFF" opacity="0.16"/>
  <text x="237" y="627" class="whiteSmall" text-anchor="middle">Board HAL</text>

  <!-- Device to gateway -->
  <path d="M297 386 C318 386 320 386 342 386" fill="none" stroke="#6658E8" stroke-width="4" marker-end="url(#arrowPurple)"/>
  <text x="319" y="370" class="flowLabel" fill="#6658E8" text-anchor="middle">HTTPS</text>
  <path d="M297 445 C318 445 320 445 342 445" fill="none" stroke="#72809F" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowGray)"/>
  <text x="319" y="468" class="mini" text-anchor="middle">WS 心跳</text>

  <!-- Gateway card -->
  <g filter="url(#shadow)">
    <rect x="345" y="160" width="275" height="510" rx="24" fill="#FFFFFF"/>
  </g>
  <rect x="345" y="160" width="275" height="58" rx="24" fill="url(#gateway)"/>
  <rect x="345" y="193" width="275" height="25" fill="url(#gateway)"/>
  <text x="369" y="195" class="section">02  Beaver Gateway</text>
  <text x="369" y="236" class="small">FastAPI 桥接层 · 不加载 GPU 模型</text>

  <rect x="367" y="258" width="231" height="69" rx="14" fill="#EDF4FF"/>
  <text x="385" y="285" class="boxTitle">可靠媒体入口</text>
  <text x="385" y="308" class="small">/media/upload · Bearer Token · 幂等 ACK</text>

  <rect x="367" y="343" width="231" height="92" rx="14" fill="#F7F9FD" stroke="#DDE4F2"/>
  <text x="385" y="371" class="boxTitle">完整性与顺序</text>
  <text x="385" y="394" class="small">长度/SHA-256 校验 · 去重 · 乱序等待</text>
  <text x="385" y="416" class="small">fsync → 原子 rename → SQLite 提交</text>

  <rect x="367" y="451" width="231" height="92" rx="14" fill="#F7F9FD" stroke="#DDE4F2"/>
  <text x="385" y="479" class="boxTitle">时间对齐与技术窗口</text>
  <text x="385" y="502" class="small">单调时钟校正 · 音画跨流对齐</text>
  <text x="385" y="524" class="small">约 30 秒窗口 · 最多 5 张关键帧</text>

  <rect x="367" y="560" width="231" height="72" rx="14" fill="#EAF8F3"/>
  <text x="385" y="587" class="boxTitle" fill="#087658">一级证据库</text>
  <text x="385" y="610" class="small">原始 WAV/JPEG + 元数据 + 事件日志</text>

  <!-- Gateway to AI -->
  <path d="M620 386 C642 386 644 386 665 386" fill="none" stroke="#6658E8" stroke-width="4" marker-end="url(#arrowPurple)"/>
  <text x="643" y="370" class="flowLabel" fill="#6658E8" text-anchor="middle">窗口</text>

  <!-- Perception card -->
  <g filter="url(#shadow)">
    <rect x="668" y="160" width="405" height="510" rx="24" fill="#FFFFFF"/>
  </g>
  <rect x="668" y="160" width="405" height="58" rx="24" fill="#252E51"/>
  <rect x="668" y="193" width="405" height="25" fill="#252E51"/>
  <text x="692" y="195" class="section">03  多模态理解与稳定</text>
  <text x="692" y="236" class="small">四条链路共享证据，但独立失败、互不阻塞</text>

  <!-- Experience branch -->
  <rect x="690" y="258" width="361" height="110" rx="16" fill="#F0EEFF" stroke="#CFC9FF"/>
  <rect x="704" y="272" width="70" height="24" rx="12" fill="#6658E8"/>
  <text x="739" y="289" class="tag" fill="#FFFFFF" text-anchor="middle">经历主链</text>
  <text x="704" y="322" class="boxTitle">VAD → 完整窗口 ASR + 尾部复查</text>
  <text x="704" y="346" class="body">MiMo 第一人称 Caption → 语义边界 → Capsule</text>
  <circle cx="1023" cy="284" r="12" fill="#6658E8" opacity="0.14"/>
  <path d="M1018 284 l4 4 7-9" fill="none" stroke="#6658E8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Object branch -->
  <rect x="690" y="384" width="174" height="105" rx="16" fill="#FFF5E8" stroke="#FFD7A5"/>
  <rect x="704" y="398" width="66" height="24" rx="12" fill="#F08A24"/>
  <text x="737" y="415" class="tag" fill="#FFFFFF" text-anchor="middle">物品链</text>
  <text x="704" y="449" class="boxTitle">YOLOE 检测</text>
  <text x="704" y="473" class="small">MiMo 物品卡 → Observation</text>

  <!-- Identity branch -->
  <rect x="877" y="384" width="174" height="105" rx="16" fill="#EAF8FB" stroke="#B9E7EE"/>
  <rect x="891" y="398" width="66" height="24" rx="12" fill="#1597A8"/>
  <text x="924" y="415" class="tag" fill="#FFFFFF" text-anchor="middle">人物链</text>
  <text x="891" y="449" class="boxTitle">人脸 + 声纹</text>
  <text x="891" y="473" class="small">匿名候选 · 人/声不强绑定</text>

  <!-- Commitment branch -->
  <rect x="690" y="505" width="174" height="105" rx="16" fill="#FFFBE7" stroke="#F5DE8B"/>
  <rect x="704" y="519" width="66" height="24" rx="12" fill="#D6A318"/>
  <text x="737" y="536" class="tag" fill="#FFFFFF" text-anchor="middle">承诺链</text>
  <text x="704" y="570" class="boxTitle">明确承诺抽取</text>
  <text x="704" y="594" class="small">候选 → 用户确认 → 待办</text>

  <!-- Resilience box -->
  <rect x="877" y="505" width="174" height="105" rx="16" fill="#F4F6FA" stroke="#DCE2ED"/>
  <rect x="891" y="519" width="66" height="24" rx="12" fill="#72809F"/>
  <text x="924" y="536" class="tag" fill="#FFFFFF" text-anchor="middle">降级策略</text>
  <text x="891" y="570" class="boxTitle">原始证据不丢</text>
  <text x="891" y="594" class="small">失败显式化 · Outbox 重试</text>

  <!-- AI to memory -->
  <path d="M1073 326 C1095 326 1098 326 1119 326" fill="none" stroke="#6658E8" stroke-width="4" marker-end="url(#arrowPurple)"/>
  <text x="1096" y="309" class="flowLabel" fill="#6658E8" text-anchor="middle">Capsule</text>
  <path d="M1073 460 C1095 460 1098 460 1119 460" fill="none" stroke="#F08A24" stroke-width="3" marker-end="url(#arrowGray)"/>

  <!-- Long-term memory card -->
  <g filter="url(#shadow)">
    <rect x="1122" y="160" width="220" height="510" rx="24" fill="#FFFFFF"/>
  </g>
  <rect x="1122" y="160" width="220" height="58" rx="24" fill="url(#memory)"/>
  <rect x="1122" y="193" width="220" height="25" fill="url(#memory)"/>
  <text x="1146" y="195" class="section">04  记忆与索引</text>
  <text x="1146" y="236" class="small">单一事实源 + 专用投影</text>

  <rect x="1144" y="258" width="176" height="130" rx="18" fill="#E9F8F2"/>
  <circle cx="1172" cy="287" r="15" fill="#0A8E68" opacity="0.16"/>
  <path d="M1164 283 c0-5 16-5 16 0 v11 c0 5-16 5-16 0z M1164 283 c0 5 16 5 16 0 M1164 289 c0 5 16 5 16 0" fill="none" stroke="#0A8E68" stroke-width="2"/>
  <text x="1194" y="293" class="cardTitle" fill="#087658">EverOS</text>
  <text x="1160" y="326" class="body">Episode · Atomic Fact</text>
  <text x="1160" y="349" class="body">Profile · 长期聚合</text>
  <text x="1160" y="372" class="small">唯一长期记忆引擎</text>

  <rect x="1144" y="406" width="176" height="84" rx="16" fill="#FFF5E8"/>
  <text x="1160" y="435" class="boxTitle" fill="#B46110">Object Observation</text>
  <text x="1160" y="459" class="small">物品最后位置 · 独立索引</text>
  <text x="1160" y="479" class="mini">不回写历史 Episode</text>

  <rect x="1144" y="507" width="176" height="103" rx="16" fill="#F3F6FC"/>
  <text x="1160" y="536" class="boxTitle">检索与投影</text>
  <text x="1160" y="560" class="small">Embedding + Rerank</text>
  <text x="1160" y="581" class="small">人物候选 · 待办 · 纠错</text>
  <text x="1160" y="600" class="mini">所有结果指回原始证据</text>

  <!-- Memory to product -->
  <path d="M1342 386 C1363 386 1366 386 1387 386" fill="none" stroke="#0A8E68" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <text x="1364" y="369" class="flowLabel" fill="#0A8E68" text-anchor="middle">召回</text>

  <!-- Product card -->
  <g filter="url(#shadow)">
    <rect x="1390" y="160" width="158" height="510" rx="24" fill="#FFFFFF"/>
  </g>
  <rect x="1390" y="160" width="158" height="58" rx="24" fill="#16213E"/>
  <rect x="1390" y="193" width="158" height="25" fill="#16213E"/>
  <text x="1412" y="195" class="section">05  用户体验</text>
  <text x="1412" y="236" class="small">看见、找回、纠正</text>

  <rect x="1410" y="258" width="118" height="67" rx="14" fill="#EEF2FF"/>
  <text x="1469" y="285" class="boxTitle" text-anchor="middle">记忆时间线</text>
  <text x="1469" y="307" class="small" text-anchor="middle">Episode + 证据</text>

  <rect x="1410" y="341" width="118" height="67" rx="14" fill="#EAF8F3"/>
  <text x="1469" y="368" class="boxTitle" text-anchor="middle">自然语言搜索</text>
  <text x="1469" y="390" class="small" text-anchor="middle">经历 / 物品</text>

  <rect x="1410" y="424" width="118" height="67" rx="14" fill="#EAF8FB"/>
  <text x="1469" y="451" class="boxTitle" text-anchor="middle">人物与证据</text>
  <text x="1469" y="473" class="small" text-anchor="middle">确认 / 纠错</text>

  <rect x="1410" y="507" width="118" height="67" rx="14" fill="#FFFBE7"/>
  <text x="1469" y="534" class="boxTitle" text-anchor="middle">日报与待办</text>
  <text x="1469" y="556" class="small" text-anchor="middle">来源可追溯</text>

  <rect x="1410" y="590" width="118" height="44" rx="14" fill="#16213E"/>
  <text x="1469" y="617" class="whiteBody" text-anchor="middle">Web / 设备问答</text>

  <!-- Feedback loop -->
  <path d="M1468 670 C1468 691 1390 692 1354 692 L351 692 C318 692 310 652 310 624" fill="none" stroke="#0A8E68" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrowGreen)"/>
  <rect x="772" y="678" width="207" height="27" rx="13" fill="#E9F8F2"/>
  <text x="875" y="696" class="flowLabel" fill="#087658" text-anchor="middle">记忆问题 / 纠正结果回流</text>

  <!-- Bottom real-time lane -->
  <rect x="52" y="730" width="1496" height="118" rx="24" fill="#FFFFFF" filter="url(#shadow)"/>
  <rect x="52" y="730" width="230" height="118" rx="24" fill="#EAF2FF"/>
  <text x="76" y="765" class="sectionDark">小智基础框架</text>
  <text x="76" y="789" class="body">前台实时交互 · 按需唤醒</text>
  <rect x="76" y="806" width="81" height="24" rx="12" fill="#2771E8"/>
  <text x="116" y="823" class="tag" fill="#FFFFFF" text-anchor="middle">低延迟蓝线</text>
  <text x="166" y="823" class="mini">与记忆链并行</text>

  <rect x="310" y="756" width="145" height="62" rx="15" fill="#EDF4FF"/>
  <text x="382" y="781" class="boxTitle" text-anchor="middle">麦克风 / 唤醒词</text>
  <text x="382" y="803" class="small" text-anchor="middle">AFE · AEC · VAD</text>
  <path d="M455 787 H495" fill="none" stroke="#2771E8" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <rect x="498" y="756" width="145" height="62" rx="15" fill="#EDF4FF"/>
  <text x="570" y="781" class="boxTitle" text-anchor="middle">AudioService</text>
  <text x="570" y="803" class="small" text-anchor="middle">PCM ↔ Opus</text>
  <path d="M643 787 H683" fill="none" stroke="#2771E8" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <rect x="686" y="756" width="154" height="62" rx="15" fill="#EDF4FF"/>
  <text x="763" y="781" class="boxTitle" text-anchor="middle">WebSocket / MQTT</text>
  <text x="763" y="803" class="small" text-anchor="middle">实时双向音频流</text>
  <path d="M840 787 H880" fill="none" stroke="#2771E8" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <rect x="883" y="756" width="179" height="62" rx="15" fill="#EDF4FF"/>
  <text x="972" y="781" class="boxTitle" text-anchor="middle">流式 ASR + LLM + TTS</text>
  <text x="972" y="803" class="small" text-anchor="middle">听懂 → 思考 → 说话</text>
  <path d="M1062 787 H1102" fill="none" stroke="#2771E8" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <rect x="1105" y="756" width="172" height="62" rx="15" fill="#EDF4FF"/>
  <text x="1191" y="781" class="boxTitle" text-anchor="middle">设备端 MCP</text>
  <text x="1191" y="803" class="small" text-anchor="middle">屏幕 · 灯光 · GPIO · 相机</text>

  <rect x="1302" y="756" width="214" height="62" rx="15" fill="#16213E"/>
  <text x="1409" y="781" class="section" text-anchor="middle">Speaker + Display</text>
  <text x="1409" y="803" class="whiteSmall" text-anchor="middle">语音回复 · 卡片 · 情绪反馈</text>

  <!-- Footer legend -->
  <circle cx="54" cy="875" r="5" fill="#6658E8"/>
  <text x="66" y="880" class="mini">紫色：后台记忆主链</text>
  <circle cx="199" cy="875" r="5" fill="#2771E8"/>
  <text x="211" y="880" class="mini">蓝色：前台实时交互</text>
  <circle cx="347" cy="875" r="5" fill="#0A8E68"/>
  <text x="359" y="880" class="mini">绿色：长期记忆与召回</text>
  <text x="1548" y="880" class="mini" text-anchor="end">PPT 版 · 16:9 · 2026-08</text>
</svg>
