robot:
  kinematics: 'diff'
  length: 0.70
  width: 0.40
  name: 'go2_diff_070_040'

# PyTorch keeps the `cuda` device spelling when the backend is AMD ROCm.
device: 'cuda'

train:
  direct_train: true
  model_name: 'go2_diff_070_040'
  data_size: 100000
  data_range: [-6, -6, 6, 6]
  batch_size: 256
  epoch: 2000
  valid_freq: 250
  save_freq: 500
  lr: 5e-5
  lr_decay: 0.5
  decay_freq: 1500
