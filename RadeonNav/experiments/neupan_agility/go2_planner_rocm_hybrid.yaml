receding: 10
step_time: 0.1
ref_speed: 0.8
device: 'cpu'
time_print: False
collision_threshold: 0.1

robot:
  kinematics: 'diff'
  max_speed: [2.0, 3.0]
  max_acce: [2.0, 3.0]
  length: 0.70
  width: 0.40

ipath:
  waypoints: [[-4, 0, 0], [4, 0, 0]]
  curve_style: 'line'
  min_radius: 1.0
  loop: False
  arrive_threshold: 0.4
  close_threshold: 0.1
  ind_range: 10
  arrive_index_threshold: 1

pan:
  iter_num: 2
  dune_max_num: 100
  nrmp_max_num: 10
  iter_threshold: 0.1
  dune_checkpoint: 'example/model/go2_diff_070_040/model_2000.pth'
  dune_device: 'cuda'
  dune_dtype: 'float32'
  nrmp_backend: 'cvxpylayers_cpu'

adjust:
  q_s: 0.5
  p_u: 1.0
  eta: 15.0
  d_max: 1.0
  d_min: 0.1
  bk: 1.0
  solver: 'ECOS'
