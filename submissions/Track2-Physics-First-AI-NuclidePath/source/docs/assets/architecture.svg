<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">NuclidePath private agent architecture</title>
  <desc id="desc">Local UI and CLI enter a permission gate, an allow-listed planner coordinates site, retrieval, deterministic physics and local memory, then reporting and uncertainty produce checksummed artifacts on AMD ROCm.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#94a3b8"/></marker>
    <marker id="orangeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#fb923c"/></marker>
    <style>
      .title{font:700 32px Liberation Mono,DejaVu Sans Mono,monospace;fill:#f8fafc}.sub{font:400 16px Liberation Mono,DejaVu Sans Mono,monospace;fill:#94a3b8}.label{font:700 15px Liberation Mono,DejaVu Sans Mono,monospace;fill:#f8fafc}.small{font:400 12px Liberation Mono,DejaVu Sans Mono,monospace;fill:#cbd5e1}.tiny{font:400 10px Liberation Mono,DejaVu Sans Mono,monospace;fill:#94a3b8}.arrow{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}.flow{fill:none;stroke:#fb923c;stroke-width:3;marker-end:url(#orangeArrow)}.dash{fill:none;stroke:#fb7185;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#020617"/><rect width="1600" height="900" fill="url(#grid)"/>
  <text x="60" y="58" class="title">NuclidePath · Private Physics-First Agent</text>
  <text x="60" y="87" class="sub">Every physical number comes from deterministic tools; the LLM only proposes an allow-listed plan.</text>
  <circle cx="1510" cy="54" r="8" fill="#34d399"/><text x="1530" y="59" class="tiny">LOCAL</text>

  <rect x="35" y="115" width="1530" height="720" rx="14" fill="rgba(15,23,42,.65)" stroke="#fbbf24" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="55" y="143" class="tiny" fill="#fbbf24">AMD LOCAL COMPUTE BOUNDARY · Radeon gfx1100 · ROCm 7.2.1 · localhost only</text>

  <!-- arrows behind nodes -->
  <path class="flow" d="M235 240H315"/><path class="flow" d="M520 240H600"/><path class="flow" d="M805 240H885"/>
  <path class="arrow" d="M1025 290V360H270V405"/><path class="arrow" d="M1025 290V360H610V405"/><path class="arrow" d="M1025 290V360H950V405"/><path class="arrow" d="M1025 290V360H1290V405"/>
  <path class="arrow" d="M950 535V585H805"/><path class="arrow" d="M610 535V585H745"/><path class="arrow" d="M1290 535V585H865"/>
  <path class="arrow" d="M805 665V710H1120"/><path class="arrow" d="M1120 650V710"/>
  <path class="dash" d="M420 290V710H1040"/>

  <!-- top row -->
  <g><rect x="75" y="180" width="160" height="110" rx="6" fill="#0f172a"/><rect x="75" y="180" width="160" height="110" rx="6" fill="rgba(8,51,68,.45)" stroke="#22d3ee" stroke-width="2"/><text x="95" y="214" class="label">UI / CLI</text><text x="95" y="242" class="small">dashboard</text><text x="95" y="263" class="small">JSON scenario</text></g>
  <g><rect x="315" y="180" width="205" height="110" rx="6" fill="#0f172a"/><rect x="315" y="180" width="205" height="110" rx="6" fill="rgba(136,19,55,.42)" stroke="#fb7185" stroke-width="2"/><text x="335" y="214" class="label">Permission Gate</text><text x="335" y="242" class="small">role allowlist</text><text x="335" y="263" class="small">privacy redaction</text></g>
  <g><rect x="600" y="180" width="205" height="110" rx="6" fill="#0f172a"/><rect x="600" y="180" width="205" height="110" rx="6" fill="rgba(120,53,15,.4)" stroke="#fb923c" stroke-width="2"/><text x="620" y="214" class="label">Safe Planner</text><text x="620" y="242" class="small">offline baseline or</text><text x="620" y="263" class="small">Qwen3.5-9B Q8</text></g>
  <g><rect x="885" y="180" width="280" height="110" rx="6" fill="#0f172a"/><rect x="885" y="180" width="280" height="110" rx="6" fill="rgba(6,78,59,.43)" stroke="#34d399" stroke-width="2"/><text x="905" y="214" class="label">Workflow Orchestrator</text><text x="905" y="242" class="small">6 ordered allow-listed steps</text><text x="905" y="263" class="small">fail closed on unsafe plans</text></g>
  <g><rect x="1245" y="180" width="250" height="110" rx="6" fill="#0f172a"/><rect x="1245" y="180" width="250" height="110" rx="6" fill="rgba(120,53,15,.28)" stroke="#fbbf24" stroke-width="2"/><text x="1265" y="214" class="label">llama.cpp / HIP</text><text x="1265" y="242" class="small">127.0.0.1:8000</text><text x="1265" y="263" class="small">all layers on GPU</text></g>

  <!-- agent row -->
  <g><rect x="120" y="405" width="300" height="130" rx="6" fill="#0f172a"/><rect x="120" y="405" width="300" height="130" rx="6" fill="rgba(6,78,59,.4)" stroke="#34d399" stroke-width="2"/><text x="142" y="440" class="label">Site Agent</text><text x="142" y="469" class="small">source &amp; event validation</text><text x="142" y="491" class="small">missing characterization data</text><text x="142" y="513" class="tiny">never invents site measurements</text></g>
  <g><rect x="460" y="405" width="300" height="130" rx="6" fill="#0f172a"/><rect x="460" y="405" width="300" height="130" rx="6" fill="rgba(76,29,149,.4)" stroke="#a78bfa" stroke-width="2"/><text x="482" y="440" class="label">Local Knowledge RAG</text><text x="482" y="469" class="small">transparent TF-IDF retrieval</text><text x="482" y="491" class="small">bundled scientific sources</text><text x="482" y="513" class="tiny">returns excerpts + URLs + scores</text></g>
  <g><rect x="800" y="405" width="300" height="130" rx="6" fill="#0f172a"/><rect x="800" y="405" width="300" height="130" rx="6" fill="rgba(6,78,59,.4)" stroke="#34d399" stroke-width="2"/><text x="822" y="440" class="label">Environment Agent</text><text x="822" y="469" class="small">validated JSON contract</text><text x="822" y="491" class="small">invokes transport tool</text><text x="822" y="513" class="tiny">LLM cannot edit tool outputs</text></g>
  <g><rect x="1140" y="405" width="300" height="130" rx="6" fill="#0f172a"/><rect x="1140" y="405" width="300" height="130" rx="6" fill="rgba(76,29,149,.4)" stroke="#a78bfa" stroke-width="2"/><text x="1162" y="440" class="label">Private Memory</text><text x="1162" y="469" class="small">local JSONL, mode 0600</text><text x="1162" y="491" class="small">multi-turn session context</text><text x="1162" y="513" class="tiny">sensitive fields recursively redacted</text></g>

  <!-- physics / reporting -->
  <g><rect x="535" y="585" width="270" height="80" rx="6" fill="#0f172a"/><rect x="535" y="585" width="270" height="80" rx="6" fill="rgba(251,146,60,.28)" stroke="#fb923c" stroke-width="2"/><text x="557" y="617" class="label">Physics Core v0.3</text><text x="557" y="642" class="small">Cs-137 · K+ · reactive Ogata-Banks</text></g>
  <g><rect x="895" y="585" width="300" height="80" rx="6" fill="#0f172a"/><rect x="895" y="585" width="300" height="80" rx="6" fill="rgba(251,146,60,.28)" stroke="#fb923c" stroke-width="2"/><text x="917" y="617" class="label">Sensitivity + Uncertainty</text><text x="917" y="642" class="small">OAT · seeded Monte Carlo · provenance</text></g>
  <g><rect x="1040" y="710" width="400" height="90" rx="6" fill="#0f172a"/><rect x="1040" y="710" width="400" height="90" rx="6" fill="rgba(8,51,68,.42)" stroke="#22d3ee" stroke-width="2"/><text x="1062" y="744" class="label">Verifiable Artifacts</text><text x="1062" y="771" class="small">JSON · Markdown · CSV · SVG · SHA-256 manifest</text></g>

  <!-- legend -->
  <g transform="translate(70 770)"><circle r="6" fill="#22d3ee"/><text x="14" y="4" class="tiny">interface</text><circle cx="100" r="6" fill="#34d399"/><text x="114" y="4" class="tiny">agents/tools</text><circle cx="225" r="6" fill="#a78bfa"/><text x="239" y="4" class="tiny">local data</text><circle cx="340" r="6" fill="#fb923c"/><text x="354" y="4" class="tiny">compute</text><circle cx="445" r="6" fill="#fb7185"/><text x="459" y="4" class="tiny">security</text></g>
  <text x="60" y="870" class="tiny">Track 2 · Physics-First AI · NuclidePath · all external network and operational-control actions denied by default</text>
</svg>
