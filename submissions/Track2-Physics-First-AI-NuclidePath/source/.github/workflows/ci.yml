name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: ".python-version"
          check-latest: false
      - name: Verify Python version
        run: |
          python --version
          test "$(python -c 'import platform; print(platform.python_version())')" = "$(cat .python-version)"
      - name: Install hash-locked CI tools
        run: |
          python -m pip install --disable-pip-version-check --no-input --only-binary=:all: --require-hashes -r requirements/ci.txt
          python -m pip install --disable-pip-version-check --no-input --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Verify workflow security policy
        run: python scripts/check_workflow_security.py
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Run dependency-light suite
        run: python -m pytest -q
      - name: Build wheel without dependency resolution
        run: python -m build --wheel --no-isolation
      - name: Check editorial toolchain (deck generator syntax + pptxgenjs resolution)
        run: |
          node --check scripts/generate_deck.js
          node --check scripts/generate_spec_pdf.js
          npm ci --no-audit --no-fund
          node -e "require('pptxgenjs'); console.log('pptxgenjs resolvable')"
      - name: Check patch whitespace
        run: git diff --check
