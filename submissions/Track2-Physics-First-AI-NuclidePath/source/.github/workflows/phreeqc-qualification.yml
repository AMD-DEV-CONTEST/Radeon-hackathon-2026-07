name: PHREEQC qualification

on:
  workflow_dispatch:
    inputs:
      phreeqc_executable:
        description: Absolute path to the trusted PHREEQC executable
        required: true
        type: string
      phreeqc_database:
        description: Absolute path to the trusted PHREEQC database
        required: true
        type: string
      phreeqc_executable_sha256:
        description: Expected SHA-256 of the PHREEQC executable
        required: true
        type: string
      phreeqc_database_sha256:
        description: Expected SHA-256 of the PHREEQC database
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: phreeqc-qualification
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:
  qualify:
    runs-on: [self-hosted, nuclidepath]
    timeout-minutes: 20
    steps:
      - name: Require trusted main invocation
        env:
          CHECKED_REF: ${{ github.ref }}
        run: test "$CHECKED_REF" = "refs/heads/main"
      - name: Check out without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: ".python-version"
          check-latest: false
      - name: Verify Python version
        run: |
          python --version
          test "$(python -c 'import platform; print(platform.python_version())')" = "$(cat .python-version)"
      - name: Validate qualification inputs
        env:
          PHREEQC_EXECUTABLE: ${{ inputs.phreeqc_executable }}
          PHREEQC_DATABASE: ${{ inputs.phreeqc_database }}
          PHREEQC_EXECUTABLE_SHA256: ${{ inputs.phreeqc_executable_sha256 }}
          PHREEQC_DATABASE_SHA256: ${{ inputs.phreeqc_database_sha256 }}
        run: |
          python - <<'PY'
          import hashlib, hmac, os, pathlib, re, stat
          pairs = (
              ("PHREEQC_EXECUTABLE", "PHREEQC_EXECUTABLE_SHA256"),
              ("PHREEQC_DATABASE", "PHREEQC_DATABASE_SHA256"),
          )
          for path_name, digest_name in pairs:
              raw_path = os.environ.get(path_name, "")
              expected = os.environ.get(digest_name, "")
              if not raw_path or any(ord(char) < 32 or ord(char) == 127 for char in raw_path):
                  raise SystemExit(f"invalid {path_name}")
              if re.fullmatch(r"[0-9a-f]{64}", expected) is None:
                  raise SystemExit(f"invalid {digest_name}")
              path = pathlib.Path(raw_path)
              if not path.is_absolute() or path.is_symlink():
                  raise SystemExit(f"unsafe {path_name}")
              info = path.stat(follow_symlinks=False)
              if not stat.S_ISREG(info.st_mode):
                  raise SystemExit(f"non-regular {path_name}")
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if not hmac.compare_digest(actual, expected):
                  raise SystemExit(f"digest mismatch for {path_name}")
          PY
      - name: Install hash-locked CI tools
        run: |
          python -m pip install --disable-pip-version-check --no-input --only-binary=:all: --require-hashes -r requirements/ci.txt
          python -m pip install --disable-pip-version-check --no-input --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Verify workflow security policy
        run: python scripts/check_workflow_security.py
      - name: Run bounded external qualification test
        env:
          PHREEQC_EXECUTABLE: ${{ inputs.phreeqc_executable }}
          PHREEQC_DATABASE: ${{ inputs.phreeqc_database }}
          PHREEQC_EXECUTABLE_SHA256: ${{ inputs.phreeqc_executable_sha256 }}
          PHREEQC_DATABASE_SHA256: ${{ inputs.phreeqc_database_sha256 }}
        run: python -m pytest -q tests/test_phreeqc_external.py --run-external-solver
