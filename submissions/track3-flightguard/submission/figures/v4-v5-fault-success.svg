<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="730" viewBox="0 0 1180 730" role="img" aria-labelledby="title desc">
  <title id="title">v4 and v5 fault-episode success comparison</title>
  <desc id="desc">Fault successes derived from frozen v4 and v5 JSON summaries.</desc>
  <rect width="1180" height="730" fill="#0f151b"/>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
  </style>
  <text x="54" y="58" font-size="24" font-weight="700" fill="#eef3f7" text-anchor="start">FAULT-EPISODE SUCCESS · FROZEN SUMMARIES</text>
  <text x="54" y="88" font-size="15" font-weight="400" fill="#9eabb5" text-anchor="start">Bar length is success rate; labels retain exact counts.</text>
  <text x="54" y="140" font-size="19" font-weight="700" fill="#eef3f7" text-anchor="start">v4 · scientific FAIL</text>
  <text x="66" y="193" font-size="15" font-weight="600" fill="#eef3f7" text-anchor="start">CausalIMUPatch</text>
  <rect x="330" y="170" width="760" height="34" rx="6" fill="#18212a"/>
  <rect x="330" y="170" width="232.22222222222223" height="34" rx="6" fill="#59a5f5"/>
  <text x="342" y="193" font-size="14" font-weight="700" fill="#eef3f7" text-anchor="start">11 / 36</text>
  <text x="1090" y="193" font-size="14" font-weight="700" fill="#eef3f7" text-anchor="end">30.6%</text>
  <text x="66" y="245" font-size="15" font-weight="600" fill="#eef3f7" text-anchor="start">ActionOnly</text>
  <rect x="330" y="222" width="760" height="34" rx="6" fill="#18212a"/>
  <text x="342" y="245" font-size="14" font-weight="700" fill="#eef3f7" text-anchor="start">0 / 36</text>
  <text x="1090" y="245" font-size="14" font-weight="700" fill="#eef3f7" text-anchor="end">0.0%</text>
  <text x="66" y="297" font-size="15" font-weight="600" fill="#eef3f7" text-anchor="start">RawStrapdown</text>
  <rect x="330" y="274" width="760" height="34" rx="6" fill="#18212a"/>
  <rect x="330" y="274" width="696.6666666666666" height="34" rx="6" fill="#b794f6"/>
  <text x="342" y="297" font-size="14" font-weight="700" fill="#eef3f7" text-anchor="start">33 / 36</text>
  <text x="1090" y="297" font-size="14" font-weight="700" fill="#eef3f7" text-anchor="end">91.7%</text>
  <text x="66" y="349" font-size="15" font-weight="600" fill="#eef3f7" text-anchor="start">CalibratedStrapdown</text>
  <rect x="330" y="326" width="760" height="34" rx="6" fill="#18212a"/>
  <rect x="330" y="326" width="675.5555555555555" height="34" rx="6" fill="#58d68d"/>
  <text x="342" y="349" font-size="14" font-weight="700" fill="#eef3f7" text-anchor="start">32 / 36</text>
  <text x="1090" y="349" font-size="14" font-weight="700" fill="#eef3f7" text-anchor="end">88.9%</text>
  <text x="54" y="408" font-size="19" font-weight="700" fill="#eef3f7" text-anchor="start">v5 · development PASS, award-ineligible</text>
  <text x="66" y="461" font-size="15" font-weight="600" fill="#eef3f7" text-anchor="start">CausalIMUPatch</text>
  <rect x="330" y="438" width="760" height="34" rx="6" fill="#18212a"/>
  <rect x="330" y="438" width="633.3333333333334" height="34" rx="6" fill="#59a5f5"/>
  <text x="342" y="461" font-size="14" font-weight="700" fill="#eef3f7" text-anchor="start">10 / 12</text>
  <text x="1090" y="461" font-size="14" font-weight="700" fill="#eef3f7" text-anchor="end">83.3%</text>
  <text x="66" y="513" font-size="15" font-weight="600" fill="#eef3f7" text-anchor="start">ActionOnly</text>
  <rect x="330" y="490" width="760" height="34" rx="6" fill="#18212a"/>
  <text x="342" y="513" font-size="14" font-weight="700" fill="#eef3f7" text-anchor="start">0 / 12</text>
  <text x="1090" y="513" font-size="14" font-weight="700" fill="#eef3f7" text-anchor="end">0.0%</text>
  <text x="66" y="565" font-size="15" font-weight="600" fill="#eef3f7" text-anchor="start">CalibratedStrapdown</text>
  <rect x="330" y="542" width="760" height="34" rx="6" fill="#18212a"/>
  <rect x="330" y="542" width="633.3333333333334" height="34" rx="6" fill="#58d68d"/>
  <text x="342" y="565" font-size="14" font-weight="700" fill="#eef3f7" text-anchor="start">10 / 12</text>
  <text x="1090" y="565" font-size="14" font-weight="700" fill="#eef3f7" text-anchor="end">83.3%</text>
  <text x="54" y="665" font-size="14" font-weight="400" fill="#9eabb5" text-anchor="start">v4 Patch improvement over ActionOnly did not establish superiority over Raw or Cal.</text>
  <text x="54" y="691" font-size="14" font-weight="400" fill="#9eabb5" text-anchor="start">v5 Patch tied Cal and was post-onset raw-bit exact across 19 operational fields: incremental capability = 0.</text>
</svg>
