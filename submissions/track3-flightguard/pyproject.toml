[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flightguard-amd"
version = "0.1.0"
description = "Real-trace VIO fault injection and single-Radeon drone safety experiments."
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
sim = ["genesis-world==1.2.3"]
test = ["pytest>=8", "ruff>=0.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/flightguard"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

