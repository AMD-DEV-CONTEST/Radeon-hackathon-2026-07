<svg viewBox="0 0 680 556" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Memloom Agent architecture</title>
<desc>Agent sources flow through capture adapters into the desktop main-process pipeline Distill to Merge to Review to Canonical, then reuse via Retrieve and Recall, backed by local vLLM inference on AMD GPU and local-first storage</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<g>
<rect x="40" y="40" width="360" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="220" y="62" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#0C447C">AI Agent sources</text>
<text x="220" y="80" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">Claude Code · Codex sessions (.jsonl)</text>
</g>
<g>
<rect x="420" y="40" width="220" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="530" y="62" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#0C447C">Session adapters</text>
<text x="530" y="80" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">incremental cursor · main sessions only</text>
</g>
<path d="M220 96 L220 112" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<g>
<rect x="40" y="116" width="600" height="196" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="136" font-family="sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">Memloom desktop client — main process (Electron)</text>
<g>
<rect x="60" y="152" width="120" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="120" y="172" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#0C447C">Distill</text>
<text x="120" y="190" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#185FA5">extract candidates</text>
</g>
<g>
<rect x="195" y="152" width="120" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="255" y="172" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#0C447C">Merge</text>
<text x="255" y="190" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#185FA5">new · link · update · dup</text>
</g>
<g>
<rect x="330" y="152" width="120" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="390" y="172" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#0C447C">Review</text>
<text x="390" y="190" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#185FA5">accept · edit · reject</text>
</g>
<g>
<rect x="465" y="152" width="155" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="542" y="172" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#0C447C">Canonical</text>
<text x="542" y="190" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#185FA5">only trusted source</text>
</g>
<path d="M180 180 L191 180" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M315 180 L326 180" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M450 180 L461 180" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<text x="390" y="222" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#854F0B">↑ human review gate — AI proposes, human decides</text>
<text x="60" y="290" font-family="sans-serif" font-size="11" fill="#5F5E5A">bounded staged pipeline · structural validation · no bypass</text>
</g>
<g>
<rect x="40" y="332" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="180" y="352" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#085041">Retrieve (Agent)</text>
<text x="180" y="370" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">AGENTS.md · CLAUDE.md · .memloom/</text>
</g>
<g>
<rect x="360" y="332" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="500" y="352" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#085041">Recall (Human)</text>
<text x="500" y="370" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">active recall · re-expression</text>
</g>
<path d="M430 312 L220 328" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M620 312 L540 328" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<g>
<rect x="40" y="408" width="600" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="430" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#0C447C">Local model service — OpenAI-compatible API (loopback)</text>
<text x="340" y="450" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">vLLM on AMD GPU · gfx1100 (RDNA3) · ROCm 7.2.1 · BF16 · 8192 ctx</text>
</g>
<path d="M340 312 L340 404" fill="none" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="352" y="362" font-family="sans-serif" font-size="11" fill="#5F5E5A">model calls for distill/merge</text>
<g>
<rect x="40" y="492" width="600" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="514" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="500" fill="#085041">Local-first storage (atomic writes): canonical · pending · rejected · duplicates · run records · recall state</text>
</g>
</svg>
