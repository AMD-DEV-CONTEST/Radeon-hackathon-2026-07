# Week-1 gate config for the granted cloud Radeon (Linux, ROCm).
# TBD values are marked; fill them in the first session on the instance.
# The only intended differences from local_4060.toml: paths, the real
# teacher, capacity numbers, and (if the gate passes) backend = unsloth.

[task]
spec = "specs/triage.json"

[run]
seed = 17
out_root = "runs"

[teacher]
base_url = "http://127.0.0.1:8123/v1"
# 17.3 GB; fits 48GB gfx1100 with ~30GB headroom (probed July 17)
gguf = "models/teacher/Qwen3-30B-A3B-Instruct-2507-Q4_K_M.gguf"
server_exe = "/opt/llama.cpp/build/bin/llama-server"   # image prebuilt, b9766
n_gpu_layers = 99
parallel = 8
ctx_per_slot = 8192   # 48GB: room for agent chat + fast datagen
temperature = 0.9
max_tokens = 512

[orchestration]
free_gpu_for_training = false  # 48GB fits teacher + training together

[agent]
max_tool_iters = 20
temperature = 0.7
max_tokens = 1024

[datagen]
seed_doc = "seeds/triage_policy.md"
n_train = 900
n_holdout = 100
max_attempts_factor = 3

[student]
hf_path = "models/student/Qwen3-0.6B"
device = "cuda"       # torch on ROCm exposes HIP as "cuda" — do not change

[train]
backend = "peft"      # flip to "unsloth" only after the gate proves it on this image
lora_r = 16
lora_alpha = 32
lora_dropout = 0.05
lr = 1e-4
epochs = 3
batch_size = 4   # proven on 8GB; retune upward at the gate once VRAM is known
grad_accum = 4
max_seq_len = 512
bf16 = true

[eval]
max_new_tokens = 80

[export]
llama_src = "/opt/llama.cpp"
quant = "q8_0"
