# Pilot: tiny end-to-end shakeout run on the 4060. Same as
# local_4060.toml except dataset size. Delete-safe.

[task]
spec = "specs/triage.json"

[run]
seed = 17
out_root = "runs"

[teacher]
base_url = "http://127.0.0.1:8123/v1"
gguf = "models/teacher/Qwen3-4B-Instruct-2507-Q4_K_M.gguf"
server_exe = "tools/llama.cpp/llama-server.exe"
n_gpu_layers = 99
parallel = 2          # fewer, roomier slots: agent history needs headroom
ctx_per_slot = 9216
temperature = 0.9
max_tokens = 512

[orchestration]
free_gpu_for_training = true

[agent]
max_tool_iters = 20
temperature = 0.7
max_tokens = 1024

[datagen]
seed_doc = "seeds/triage_policy.md"
n_train = 54
n_holdout = 12
max_attempts_factor = 3

[student]
hf_path = "models/student/Qwen3-0.6B"
device = "cuda"

[train]
backend = "peft"
lora_r = 16
lora_alpha = 32
lora_dropout = 0.05
lr = 1e-4
epochs = 3
batch_size = 4   # aligned with local_4060 after the batch-8 OOM/flake findings
grad_accum = 4
max_seq_len = 512
bf16 = true

[eval]
max_new_tokens = 80

[export]
llama_src = "tools/llama.cpp-b10043"
quant = "q8_0"
