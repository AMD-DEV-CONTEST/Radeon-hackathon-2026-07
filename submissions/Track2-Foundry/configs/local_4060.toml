# Vertical slice on the dev box: RTX 4060 Laptop 8GB, CUDA backend.
# The teacher here is a stand-in (Qwen3-4B) — same family and chat
# template as the real 30B teacher, so cloud_radeon.toml differs only
# in paths and capacity numbers.

[task]
spec = "specs/triage.json"

[run]
seed = 17
out_root = "runs"

[teacher]
base_url = "http://127.0.0.1:8123/v1"
gguf = "models/teacher/Qwen3-4B-Instruct-2507-Q4_K_M.gguf"
server_exe = "tools/llama.cpp/llama-server.exe"
n_gpu_layers = 99
parallel = 3        # shared server: agent chat needs long slots (3 x 6144)
ctx_per_slot = 6144
temperature = 0.9
max_tokens = 512

[orchestration]
free_gpu_for_training = true   # 8GB: teacher and training don't coexist

[agent]
max_tool_iters = 20
temperature = 0.7
max_tokens = 1024

[datagen]
seed_doc = "seeds/triage_policy.md"
n_train = 900
n_holdout = 100
max_attempts_factor = 3

[student]
hf_path = "models/student/Qwen3-0.6B"
device = "cuda"

[train]
backend = "peft"      # peft | unsloth (unsloth decided at the Radeon gate)
lora_r = 16
lora_alpha = 32
lora_dropout = 0.05
lr = 1e-4
epochs = 3
batch_size = 4   # 8 OOMs in backward on 8GB (dense grad of gathered logits)
grad_accum = 4
max_seq_len = 512
bf16 = true

[eval]
max_new_tokens = 80

[export]
llama_src = "tools/llama.cpp-b10043"
quant = "q8_0"
