[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "parcel-sorter-rocm"
version = "0.3.0"
description = "Robust parcel picking and sorting on AMD Radeon GPUs"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "2658183739 / Parcel Sorter ROCm Contributors" }]
dependencies = [
  "numpy>=1.26",
  "pyarrow>=16",
  "pillow>=10",
  "imageio>=2.34",
  "av>=12",
  "opencv-python-headless>=4.9",
  "genesis-world==1.2.3",
]

[project.optional-dependencies]
lerobot = ["lerobot==0.6.1"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
