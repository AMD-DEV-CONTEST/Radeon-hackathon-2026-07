[metadata]
schema_version = 1
campaign_id = "parcel-sorter-reset-fallback-gate-validation-v1"
phase = "development_validation"
description = "Matched validation of collision-checked reset versus reset-risk-gated geometry planning"
frozen_date = "2026-07-25"

[platform]
backend = "rocm"
device = "cuda:0"
single_gpu = true
gpu_count = 1

[task]
control_hz = 30
max_contact_force_n = 35.0
