[metadata]
schema_version = 1
protocol_id = "controller-faithful-probe-v5-independent-confirmation"
frozen_date = "2026-07-26"
claim_boundary = "One independent confirmation of the frozen veto-static safety mechanism. Passing authorizes only an online Radeon-parallel probe pilot; it does not activate the runtime policy or open any V2 development/holdout data."

[platform]
backend = "rocm"
device = "cuda:0"
single_gpu = true
gpu_count = 1
gpu_architecture = "gfx1100"
rocm_version = "7.2"

[source]
manifest = "/workspace/parcel-sorter-opt-v1/outputs/controller-probe-v5/candidates/confirmation/manifest.json"
split = "confirmation"

[population]
catalog = "configs/catalog_v2.toml"
catalog_sha256 = "05bd0931cfb2ba48e15c1fbd83411220f99ca1ddc59c6991ef3255f682f73ca0"
selection_evidence = "evidence/training/controller-probe-v5-population-selection.json"
selection_evidence_sha256 = "b219bae159e7cb3b534fc6e4696f956dbea2f861a1f217504b9766d44f42bd61"
old_population_protocol = "configs/grasp_candidate_learning_v2.toml"
split = "confirmation"
episodes_per_profile = 10
expected_groups = 80
profile_ids = ["medium_carton", "shoe_box_proxy", "large_narrow_carton", "near_limit_box", "small_carton", "flat_mailer", "long_carton", "electronics_box"]
legacy_profiles = ["medium_carton", "shoe_box_proxy", "large_narrow_carton", "near_limit_box"]
unseen_profiles = ["small_carton", "flat_mailer", "long_carton", "electronics_box"]

[collection]
config = "configs/catalog_v2.toml"
runner = "scripts/run_controller_probe_confirmation_collection.py"
planning_activation_policy = "all-boxes"
max_candidates_per_episode = 6
repeats = 1
max_grasp_retries = 0
measured_force_abort_n = 35.0
fresh_scene_per_candidate = true
collision_checked_reset_enabled = true
only_intervention = "candidate allowlist plus preregistered all-rigid-box candidate enumeration scope"
v2_development_forbidden = true
v2_holdout_forbidden = true

[fixed]
policy = "veto-static"
probe_feature_schema_version = 1
latency_group_id = "large_narrow_carton:9300000"
latency_warmup = 10
latency_repeats = 100
safe_abstention_is_not_static_fallback = true

[gates]
require_zero_success_losses = true
require_zero_safety_abort_regressions = true
require_zero_drop_regressions = true
require_no_per_profile_success_loss = true
require_no_per_profile_safety_regression = true
min_safety_abort_reductions = 6
min_profiles_with_safety_reduction = 2
safety_one_sided_alpha = 0.05
max_selection_p95_ms = 5.0

[reporting]
binary_tests = "paired exact McNemar"
rate_intervals = "Wilson 95%"
continuous_effects = "paired bootstrap and sign-flip test on executed groups"
required_strata = ["profile_novelty", "yaw_band", "friction_band", "camera_noise_band", "mass_band"]
separate_metrics = ["success", "safety_abort", "drop", "max_contact_force_n", "duration_seconds", "probe_cost"]

[implementation]
module = "src/parcel_sorter/controller_probe_confirmation.py"
module_sha256 = "a2802ad112596476230838bbf02478dfabcbf6ea68ecbcdc1a7baf822d446e05"
