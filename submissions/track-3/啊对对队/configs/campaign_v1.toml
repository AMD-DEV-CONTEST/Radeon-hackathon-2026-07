[metadata]
schema_version = 1
campaign_id = "parcel-sorter-radeon-v1"
phase = "pre_collection"
description = "Frozen protocol for one-Radeon parcel sorting experiments"

[platform]
backend = "rocm"
device = "cuda:0"
single_gpu = true
gpu_count = 1

[task]
control_hz = 30
max_contact_force_n = 35.0
latency_clock = "torch.cuda.Event(enable_timing=True)"
latency_percentile = 0.95

[dataset]
catalog_path = "configs/catalog_v2.toml"
catalog_sha256 = "05bd0931cfb2ba48e15c1fbd83411220f99ca1ddc59c6991ef3255f682f73ca0"
sampling_seed = 42
randomization_seed = 42
split_seed = 7
sample_manifest_path = "outputs/radeon-dataset-v2/sample_manifest.json"
sample_manifest_sha256 = "PENDING"
dataset_split_path = "outputs/radeon-dataset-v2/dataset_split.json"
dataset_split_sha256 = "PENDING"

[evaluation]
split = "fixed_regression"
profile_id = "large_narrow_carton"
episode_ids = [7000000, 7000001, 7000002, 7000003, 7000004, 7000005, 7000006, 7000007, 7000008, 7000009, 7000010, 7000011, 7000012, 7000013, 7000014, 7000015, 7000016, 7000017, 7000018, 7000019]
sample_hash_policy = "record-full-sample-and-sha256-in-evidence"

[[experiments]]
id = "expert-controller"
kind = "expert"
model = "scripted-expert"
modality = "rgb-d-state"
seeds = [42]
training_steps = 0
train_on_radeon = true
infer_on_radeon = true
open_source = true
license = "MIT"
acceptance = { success_rate_min = 0.90, force_abort_rate_max = 0.05, drop_rate_max = 0.05, throughput_ratio_min = 0.85 }

[[experiments]]
id = "act-rgb"
kind = "policy"
model = "lerobot-act"
modality = "rgb-state"
seeds = [11, 22, 33]
training_steps = 30000
train_on_radeon = true
infer_on_radeon = true
open_source = true
license = "Apache-2.0 (LeRobot code; checkpoint terms recorded with artifact)"
acceptance = { success_rate_min = 0.60, force_abort_rate_max = 0.05, drop_rate_max = 0.05, throughput_ratio_min = 0.85 }

[[experiments]]
id = "act-rgbd"
kind = "policy"
model = "lerobot-act"
modality = "rgb-d-state"
seeds = [11, 22, 33]
training_steps = 30000
train_on_radeon = true
infer_on_radeon = true
open_source = true
license = "Apache-2.0 (LeRobot code; checkpoint terms recorded with artifact)"
acceptance = { success_rate_min = 0.60, force_abort_rate_max = 0.05, drop_rate_max = 0.05, throughput_ratio_min = 0.85 }

[[experiments]]
id = "compact-diffusion-rgbd"
kind = "policy"
model = "lerobot-diffusion"
modality = "rgb-d-state"
seeds = [11, 22, 33]
training_steps = 30000
train_on_radeon = true
infer_on_radeon = true
open_source = true
license = "Apache-2.0 (LeRobot code; checkpoint terms recorded with artifact)"
acceptance = { success_rate_min = 0.60, force_abort_rate_max = 0.05, drop_rate_max = 0.05, throughput_ratio_min = 0.85 }

