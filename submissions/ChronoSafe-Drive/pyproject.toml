[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chronosafe-drive"
version = "0.1.0"
description = "Self-diagnosis, risk calibration, and minimal-risk maneuvers under multi-sensor perception degradation"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["chronosafe*"]
