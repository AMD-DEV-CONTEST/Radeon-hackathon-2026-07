<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1350" viewBox="0 0 2400 1350" role="img" aria-labelledby="title desc">
  <title id="title">Accident Rights Agent architecture on AMD Radeon GPU and ROCm</title>
  <desc id="desc">User to UI, Case Orchestrator, evidence reconstruction and graph, three business agents with local legal RAG, Verifier, Human Approval, and Report. Local vLLM runs on AMD Radeon GPU with ROCm at 127.0.0.1:8000.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#10263b"/>
    </linearGradient>
    <linearGradient id="amd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3b30"/>
      <stop offset="1" stop-color="#ff765f"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123d56"/>
      <stop offset="1" stop-color="#0c2c43"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000" flood-opacity="0.34"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6fe7f7"/>
    </marker>
    <style>
      .title { font: 700 64px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #f7fbff; }
      .subtitle { font: 400 28px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #9fbbca; }
      .nodeTitle { font: 700 30px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #ffffff; text-anchor: middle; }
      .nodeSub { font: 400 19px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #bcd5df; text-anchor: middle; }
      .small { font: 600 21px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #e8f7fb; text-anchor: middle; }
      .label { font: 600 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #75e4f4; text-anchor: middle; }
      .computeTitle { font: 700 34px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #fff; }
      .computeText { font: 500 23px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #ffe7e2; }
      .line { stroke: #6fe7f7; stroke-width: 5; fill: none; marker-end: url(#arrow); }
      .support { stroke: #ff735f; stroke-width: 4; stroke-dasharray: 13 10; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="2400" height="1350" fill="url(#bg)"/>
  <circle cx="2190" cy="140" r="270" fill="#12344c" opacity="0.34"/>
  <circle cx="130" cy="1210" r="310" fill="#091a2d" opacity="0.65"/>

  <text class="title" x="120" y="105">Accident Rights Agent</text>
  <text class="subtitle" x="122" y="150">Private multimodal evidence, liability and rights workflow - entirely local on AMD Radeon + ROCm</text>

  <!-- primary flow, connectors first -->
  <path class="line" d="M 340 300 L 465 300"/>
  <path class="line" d="M 775 300 L 900 300"/>
  <path class="line" d="M 1310 300 L 1435 300"/>
  <path class="line" d="M 1795 300 L 1920 300"/>
  <path class="line" d="M 2105 385 L 2105 500"/>
  <path class="line" d="M 1915 620 L 1780 620"/>
  <path class="line" d="M 1460 620 L 1330 620"/>
  <path class="line" d="M 1010 620 L 880 620"/>
  <path class="line" d="M 560 620 L 430 620"/>
  <path class="line" d="M 280 705 L 280 820 L 730 820"/>
  <path class="line" d="M 1030 820 L 1160 820"/>
  <path class="line" d="M 1480 820 L 1610 820"/>
  <path class="line" d="M 1930 820 L 2060 820"/>

  <!-- Legal RAG support connections -->
  <path class="support" d="M 1210 1000 C 1100 900, 790 885, 720 705"/>
  <path class="support" d="M 1320 1000 C 1320 900, 1170 875, 1170 705"/>
  <path class="support" d="M 1430 1000 C 1510 900, 1620 875, 1620 705"/>

  <!-- top row nodes -->
  <g filter="url(#shadow)">
    <rect x="120" y="215" width="220" height="170" rx="30" fill="#16364d" stroke="#4e8098" stroke-width="3"/>
    <text class="nodeTitle" x="230" y="285">User</text>
    <text class="nodeSub" x="230" y="322">Case participant</text>
    <text class="nodeSub" x="230" y="350">Claims professional</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="465" y="215" width="310" height="170" rx="30" fill="#16455a" stroke="#64d9e9" stroke-width="3"/>
    <text class="nodeTitle" x="620" y="278">Gradio UI</text>
    <text class="nodeSub" x="620" y="322">Case overview · Actions</text>
    <text class="nodeSub" x="620" y="351">Evidence · Audit · Reports</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="900" y="205" width="410" height="190" rx="30" fill="#153f55" stroke="#64d9e9" stroke-width="4"/>
    <text class="nodeTitle" x="1105" y="270">Case Orchestrator</text>
    <text class="nodeSub" x="1105" y="312">LangGraph · NodeResult</text>
    <text class="nodeSub" x="1105" y="344">SQLite checkpoint · Retry</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1435" y="205" width="360" height="190" rx="30" fill="#153f55" stroke="#64d9e9" stroke-width="4"/>
    <text class="nodeTitle" x="1615" y="266">Evidence</text>
    <text class="nodeTitle" x="1615" y="306">Reconstruction</text>
    <text class="nodeSub" x="1615" y="345">PDF · Image · Video frames</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1920" y="215" width="370" height="170" rx="30" fill="#16455a" stroke="#64d9e9" stroke-width="3"/>
    <text class="nodeTitle" x="2105" y="280">Evidence Graph</text>
    <text class="nodeSub" x="2105" y="324">Facts · Timeline · Conflict</text>
    <text class="nodeSub" x="2105" y="353">Evidence ID · Source location</text>
  </g>

  <!-- business agent row -->
  <g filter="url(#shadow)">
    <rect x="1915" y="520" width="380" height="200" rx="30" fill="url(#agent)" stroke="#5aa9c3" stroke-width="3"/>
    <text class="nodeTitle" x="2105" y="583">Case Intake Agent</text>
    <text class="nodeSub" x="2105" y="628">Completeness · Gap routing</text>
    <text class="nodeSub" x="2105" y="664">Immutable sources</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1460" y="520" width="320" height="200" rx="30" fill="url(#agent)" stroke="#5aa9c3" stroke-width="3"/>
    <text class="nodeTitle" x="1620" y="578">Vehicle Agent</text>
    <text class="nodeSub" x="1620" y="622">Four classes · Parameters</text>
    <text class="nodeSub" x="1620" y="658">Hypotheses · Uncertainty</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1010" y="520" width="320" height="200" rx="30" fill="url(#agent)" stroke="#5aa9c3" stroke-width="3"/>
    <text class="nodeTitle" x="1170" y="578">Liability Agent</text>
    <text class="nodeSub" x="1170" y="612">Violations · Causality</text>
    <text class="nodeSub" x="1170" y="644">Liability hypotheses</text>
    <text class="nodeSub" x="1170" y="676">Compensation split</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="560" y="520" width="320" height="200" rx="30" fill="url(#agent)" stroke="#5aa9c3" stroke-width="3"/>
    <text class="nodeTitle" x="720" y="578">Rights Agent</text>
    <text class="nodeSub" x="720" y="622">Deadlines · Evidence · Drafts</text>
    <text class="nodeSub" x="720" y="658">Versioned rules</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="100" y="520" width="330" height="200" rx="30" fill="#174154" stroke="#ff735f" stroke-width="4"/>
    <text class="nodeTitle" x="265" y="578">Verifier</text>
    <text class="nodeSub" x="265" y="622">Evidence · Law · Consistency</text>
    <text class="nodeSub" x="265" y="658">Risk · ProtectedField</text>
  </g>

  <!-- output row -->
  <g filter="url(#shadow)">
    <rect x="730" y="750" width="300" height="140" rx="28" fill="#183d4d" stroke="#ff735f" stroke-width="4"/>
    <text class="nodeTitle" x="880" y="808">Human Approval</text>
    <text class="nodeSub" x="880" y="850">Version + input hash</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1160" y="750" width="320" height="140" rx="28" fill="#16455a" stroke="#64d9e9" stroke-width="3"/>
    <text class="nodeTitle" x="1320" y="808">Report</text>
    <text class="nodeSub" x="1320" y="842">Traceable draft</text>
    <text class="nodeSub" x="1320" y="868">Audit record</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1610" y="750" width="320" height="140" rx="28" fill="#16364d" stroke="#4e8098" stroke-width="3"/>
    <text class="nodeTitle" x="1770" y="808">Manual Use</text>
    <text class="nodeSub" x="1770" y="842">No automatic filing</text>
    <text class="nodeSub" x="1770" y="868">or sending</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="2060" y="750" width="230" height="140" rx="28" fill="#16364d" stroke="#4e8098" stroke-width="3"/>
    <text class="nodeTitle" x="2175" y="808">Audit</text>
    <text class="nodeSub" x="2175" y="850">SQLite + logs</text>
  </g>

  <!-- local RAG -->
  <g filter="url(#shadow)">
    <rect x="1070" y="1000" width="500" height="170" rx="34" fill="#132e42" stroke="#ff735f" stroke-width="4"/>
    <text class="nodeTitle" x="1320" y="1062">Local Legal RAG</text>
    <text class="nodeSub" x="1320" y="1104">BGE-M3 · Qdrant · Reranker</text>
    <text class="nodeSub" x="1320" y="1138">Versioned LegalCitation</text>
  </g>

  <!-- compute boundary -->
  <g filter="url(#shadow)">
    <rect x="120" y="1000" width="820" height="250" rx="42" fill="#281b21" stroke="url(#amd)" stroke-width="6"/>
    <rect x="120" y="1000" width="18" height="250" rx="9" fill="url(#amd)"/>
    <text class="computeTitle" x="175" y="1060">AMD Radeon Local Compute Boundary</text>
    <text class="computeText" x="175" y="1110">Navi31 / gfx1100 · 48 GB GDDR6 · ROCm 7.2.1</text>
    <text class="computeText" x="175" y="1150">vLLM + Qwen3-VL-8B-Instruct</text>
    <text class="computeText" x="175" y="1190">Local endpoint: http://127.0.0.1:8000/v1</text>
    <text class="computeText" x="175" y="1230">No public model API · Prefix Cache · Case Capsule</text>
  </g>

  <!-- data boundary -->
  <g filter="url(#shadow)">
    <rect x="1690" y="1000" width="600" height="250" rx="42" fill="#102b3c" stroke="#4e8098" stroke-width="4"/>
    <text class="computeTitle" x="1750" y="1060">Local Data Boundary</text>
    <text class="computeText" x="1750" y="1110">Per-case files + SHA256</text>
    <text class="computeText" x="1750" y="1150">Evidence Graph + Fact Memory</text>
    <text class="computeText" x="1750" y="1190">SQLite checkpoint + audit log</text>
    <text class="computeText" x="1750" y="1230">Human approval before external use</text>
  </g>

  <text class="label" x="1320" y="1288">Solid cyan: workflow · Dashed coral: Legal RAG support · All core inference and case data stay local</text>
</svg>
