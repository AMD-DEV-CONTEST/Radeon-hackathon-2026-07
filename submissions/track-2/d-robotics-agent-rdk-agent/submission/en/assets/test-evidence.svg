<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">RDK Agent repository verification evidence</title>
  <desc id="desc">A summary of 134 passing TypeScript tests, 62 passing Rust tests, Clippy, and release build, with a disclosed formatting follow-up.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f8fb"/>
      <stop offset="1" stop-color="#e8eef5"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39c77a"/>
      <stop offset="1" stop-color="#15925a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1d2633" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <text x="100" y="108" fill="#182230" font-family="Arial, sans-serif" font-size="56" font-weight="700">Repository Verification Snapshot</text>
  <text x="102" y="160" fill="#667085" font-family="Arial, sans-serif" font-size="24">Fresh evidence captured 2026-08-05 · tests use fakes, stubs, and temporary resources</text>

  <rect x="100" y="225" width="805" height="520" rx="30" fill="#ffffff" stroke="#d2d8e2" stroke-width="2" filter="url(#shadow)"/>
  <rect x="100" y="225" width="805" height="92" rx="30" fill="#1e2938"/>
  <rect x="100" y="287" width="805" height="30" fill="#1e2938"/>
  <text x="145" y="283" fill="#ffffff" font-family="Arial, sans-serif" font-size="29" font-weight="700">rdk-agent · TypeScript</text>
  <text x="145" y="372" fill="#667085" font-family="Menlo, Consolas, monospace" font-size="21">$ npm run check</text>
  <text x="690" y="372" fill="#15925a" font-family="Menlo, Consolas, monospace" font-size="21">PASS</text>
  <text x="145" y="426" fill="#667085" font-family="Menlo, Consolas, monospace" font-size="21">$ npm test</text>
  <text x="145" y="518" fill="#182230" font-family="Arial, sans-serif" font-size="102" font-weight="700">134</text>
  <text x="365" y="485" fill="#182230" font-family="Arial, sans-serif" font-size="34" font-weight="700">tests passed</text>
  <text x="365" y="531" fill="#667085" font-family="Arial, sans-serif" font-size="24">0 failed · 0 skipped</text>
  <rect x="145" y="603" width="715" height="76" rx="18" fill="#ecfdf3"/>
  <text x="182" y="651" fill="#087443" font-family="Arial, sans-serif" font-size="21" font-weight="700">Intent, workflow, security, deployment, TUI, Skill contracts</text>

  <rect x="1015" y="225" width="805" height="520" rx="30" fill="#ffffff" stroke="#d2d8e2" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1015" y="225" width="805" height="92" rx="30" fill="#1e2938"/>
  <rect x="1015" y="287" width="805" height="30" fill="#1e2938"/>
  <text x="1060" y="283" fill="#ffffff" font-family="Arial, sans-serif" font-size="29" font-weight="700">rdk-sophon · Rust</text>
  <text x="1060" y="372" fill="#667085" font-family="Menlo, Consolas, monospace" font-size="21">$ cargo test --workspace</text>
  <text x="1605" y="372" fill="#15925a" font-family="Menlo, Consolas, monospace" font-size="21">PASS</text>
  <text x="1060" y="426" fill="#667085" font-family="Menlo, Consolas, monospace" font-size="21">$ cargo clippy ... -D warnings</text>
  <text x="1605" y="426" fill="#15925a" font-family="Menlo, Consolas, monospace" font-size="21">PASS</text>
  <text x="1060" y="480" fill="#667085" font-family="Menlo, Consolas, monospace" font-size="21">$ cargo build --release --workspace</text>
  <text x="1605" y="480" fill="#15925a" font-family="Menlo, Consolas, monospace" font-size="21">PASS</text>
  <text x="1060" y="592" fill="#182230" font-family="Arial, sans-serif" font-size="102" font-weight="700">62</text>
  <text x="1240" y="559" fill="#182230" font-family="Arial, sans-serif" font-size="34" font-weight="700">tests passed</text>
  <text x="1240" y="605" fill="#667085" font-family="Arial, sans-serif" font-size="24">0 failed · includes socket E2E</text>
  <rect x="1060" y="639" width="715" height="62" rx="18" fill="#ecfdf3"/>
  <text x="1097" y="679" fill="#087443" font-family="Arial, sans-serif" font-size="21" font-weight="700">RPC, transports, policies, telemetry, plugins, collectors</text>

  <rect x="100" y="805" width="1720" height="145" rx="28" fill="#fff8e8" stroke="#f2c94c" stroke-width="2"/>
  <text x="145" y="856" fill="#8b5e00" font-family="Arial, sans-serif" font-size="25" font-weight="700">Disclosed follow-up</text>
  <text x="145" y="902" fill="#6d5a2a" font-family="Menlo, Consolas, monospace" font-size="22">cargo fmt --all -- --check</text>
  <text x="560" y="902" fill="#8b5e00" font-family="Arial, sans-serif" font-size="22">reported existing formatting differences</text>
  <text x="145" y="932" fill="#8a7a54" font-family="Arial, sans-serif" font-size="17">The submission does not describe the complete full_test.sh pipeline as green until this is resolved.</text>

  <rect x="1430" y="82" width="390" height="87" rx="22" fill="url(#green)"/>
  <text x="1625" y="119" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="25" font-weight="700">196 / 196 tests</text>
  <text x="1625" y="149" text-anchor="middle" fill="#eafff3" font-family="Arial, sans-serif" font-size="17">across both workspaces</text>
</svg>
