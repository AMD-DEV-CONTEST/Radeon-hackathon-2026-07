<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">RDK Agent 五节点研发工作流</title>
  <desc id="desc">意图门禁进入有界的测试、编码、验证循环，随后依次执行部署、Skill 安装、CLI 验收与自然语言验收。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f8fb"/>
      <stop offset="1" stop-color="#edf1f6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6a3d"/>
      <stop offset="1" stop-color="#d83b2d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1d2633" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#344054"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e54a2f"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <text x="100" y="105" fill="#182230" font-family="Arial, sans-serif" font-size="56" font-weight="700">一个受治理的交付闭环</text>
  <text x="102" y="156" fill="#667085" font-family="Arial, sans-serif" font-size="25">当前配置：一个有界 TDD 循环，随后执行四个确定性交付与验收节点。</text>

  <rect x="100" y="235" width="300" height="132" rx="26" fill="#ffffff" stroke="#d2d8e2" stroke-width="2" filter="url(#shadow)"/>
  <text x="250" y="285" text-anchor="middle" fill="#182230" font-family="Arial, sans-serif" font-size="26" font-weight="700">意图门禁</text>
  <text x="250" y="322" text-anchor="middle" fill="#667085" font-family="Arial, sans-serif" font-size="18">范围 + 置信度</text>
  <text x="250" y="349" text-anchor="middle" fill="#667085" font-family="Arial, sans-serif" font-size="18">或显式 /develop</text>

  <line x1="400" y1="301" x2="482" y2="301" stroke="#344054" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="495" y="205" width="820" height="400" rx="34" fill="#ffffff" stroke="#ff6a3d" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="550" cy="260" r="28" fill="url(#accent)"/>
  <text x="550" y="269" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="23" font-weight="700">1</text>
  <text x="600" y="270" fill="#182230" font-family="Arial, sans-serif" font-size="31" font-weight="700">动作包 TDD</text>
  <text x="600" y="303" fill="#667085" font-family="Arial, sans-serif" font-size="18">最多 3 轮，随后请求人工指导</text>

  <line x1="700" y1="428" x2="806" y2="428" stroke="#344054" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="1002" y1="428" x2="1108" y2="428" stroke="#344054" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="555" y="365" width="145" height="126" rx="22" fill="#fff4ef" stroke="#ff9c7f" stroke-width="2"/>
  <text x="627" y="414" text-anchor="middle" fill="#c4321f" font-family="Arial, sans-serif" font-size="22" font-weight="700">测试</text>
  <text x="627" y="451" text-anchor="middle" fill="#7a271a" font-family="Arial, sans-serif" font-size="17">行为优先</text>

  <rect x="815" y="365" width="187" height="126" rx="22" fill="#f1f4f9" stroke="#8995aa" stroke-width="2"/>
  <text x="909" y="414" text-anchor="middle" fill="#344054" font-family="Arial, sans-serif" font-size="22" font-weight="700">实现</text>
  <text x="909" y="451" text-anchor="middle" fill="#667085" font-family="Arial, sans-serif" font-size="17">最小改动</text>

  <rect x="1117" y="365" width="145" height="126" rx="22" fill="#edf9fa" stroke="#54c8d3" stroke-width="2"/>
  <text x="1189" y="414" text-anchor="middle" fill="#126975" font-family="Arial, sans-serif" font-size="22" font-weight="700">验证</text>
  <text x="1189" y="451" text-anchor="middle" fill="#266e77" font-family="Arial, sans-serif" font-size="17">执行证据</text>

  <path d="M1189 491 V540 H627 V501" fill="none" stroke="#e54a2f" stroke-width="4" stroke-dasharray="12 8" marker-end="url(#arrowRed)"/>
  <text x="908" y="570" text-anchor="middle" fill="#c4321f" font-family="Arial, sans-serif" font-size="17" font-weight="700">返工将重启完整循环</text>

  <path d="M1315 301 H1392 V680 H249" fill="none" stroke="#344054" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="100" y="670" width="330" height="173" rx="28" fill="#ffffff" stroke="#d2d8e2" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="150" cy="718" r="26" fill="#253b59"/>
  <text x="150" y="726" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="21" font-weight="700">2</text>
  <text x="195" y="727" fill="#182230" font-family="Arial, sans-serif" font-size="24" font-weight="700">板端 Release</text>
  <text x="195" y="760" fill="#182230" font-family="Arial, sans-serif" font-size="24" font-weight="700">部署</text>
  <text x="150" y="804" fill="#667085" font-family="Arial, sans-serif" font-size="17">构建 · 哈希 · 暂存 · 回滚</text>

  <line x1="430" y1="756" x2="490" y2="756" stroke="#344054" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="503" y="670" width="330" height="173" rx="28" fill="#ffffff" stroke="#d2d8e2" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="553" cy="718" r="26" fill="#253b59"/>
  <text x="553" y="726" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="21" font-weight="700">3</text>
  <text x="598" y="727" fill="#182230" font-family="Arial, sans-serif" font-size="24" font-weight="700">本地 Skill</text>
  <text x="598" y="760" fill="#182230" font-family="Arial, sans-serif" font-size="24" font-weight="700">安装</text>
  <text x="553" y="804" fill="#667085" font-family="Arial, sans-serif" font-size="17">已验证的运行时能力</text>

  <line x1="833" y1="756" x2="893" y2="756" stroke="#344054" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="906" y="670" width="330" height="173" rx="28" fill="#ffffff" stroke="#d2d8e2" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="956" cy="718" r="26" fill="#126975"/>
  <text x="956" y="726" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="21" font-weight="700">4</text>
  <text x="1001" y="727" fill="#182230" font-family="Arial, sans-serif" font-size="24" font-weight="700">CLI 硬件</text>
  <text x="1001" y="760" fill="#182230" font-family="Arial, sans-serif" font-size="24" font-weight="700">验收</text>
  <text x="956" y="804" fill="#667085" font-family="Arial, sans-serif" font-size="17">执行一次 sophonctl</text>

  <line x1="1236" y1="756" x2="1296" y2="756" stroke="#344054" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="1309" y="670" width="500" height="173" rx="28" fill="url(#accent)" filter="url(#shadow)"/>
  <circle cx="1360" cy="718" r="26" fill="#ffffff" opacity="0.22"/>
  <text x="1360" y="726" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="21" font-weight="700">5</text>
  <text x="1405" y="727" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="700">自然语言 Skill</text>
  <text x="1405" y="760" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="700">验收</text>
  <text x="1360" y="804" fill="#fff1ec" font-family="Arial, sans-serif" font-size="17">原始请求 · 一次受控执行</text>

  <rect x="100" y="910" width="1709" height="92" rx="24" fill="#182230"/>
  <text x="140" y="949" fill="#ffffff" font-family="Arial, sans-serif" font-size="21" font-weight="700">每个阶段均携带的控制</text>
  <text x="505" y="949" fill="#cdd5e1" font-family="Arial, sans-serif" font-size="18">工具白名单</text>
  <text x="700" y="949" fill="#cdd5e1" font-family="Arial, sans-serif" font-size="18">Skill 白名单</text>
  <text x="890" y="949" fill="#cdd5e1" font-family="Arial, sans-serif" font-size="18">写路径策略</text>
  <text x="1110" y="949" fill="#cdd5e1" font-family="Arial, sans-serif" font-size="18">离线测试</text>
  <text x="1270" y="949" fill="#cdd5e1" font-family="Arial, sans-serif" font-size="18">证据门禁</text>
  <text x="1455" y="949" fill="#cdd5e1" font-family="Arial, sans-serif" font-size="18">人工恢复</text>
  <text x="140" y="981" fill="#8792a6" font-family="Arial, sans-serif" font-size="16">物理动作仅限专用验收阶段或明确的应用请求。</text>
</svg>
