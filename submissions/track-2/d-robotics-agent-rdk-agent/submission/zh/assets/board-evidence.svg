<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">RDK X5 只读证据</title>
  <desc id="desc">已脱敏的终端输出，展示实时 ping、设备状态、温度、内存与 servo 插件发现结果。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e121a"/>
      <stop offset="1" stop-color="#182130"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <text x="100" y="106" fill="#ffffff" font-family="Arial, sans-serif" font-size="56" font-weight="700">RDK X5 实机：只读证据</text>
  <text x="102" y="158" fill="#9aa8bc" font-family="Arial, sans-serif" font-size="24">采集于 2026-08-05 · 未执行舵机动作 · 已移除网络标识</text>

  <rect x="100" y="220" width="1720" height="735" rx="28" fill="#090c12" stroke="#313b4d" stroke-width="2" filter="url(#shadow)"/>
  <rect x="100" y="220" width="1720" height="58" rx="28" fill="#1f2633"/>
  <rect x="100" y="250" width="1720" height="28" fill="#1f2633"/>
  <circle cx="142" cy="249" r="9" fill="#ff655a"/>
  <circle cx="174" cy="249" r="9" fill="#f5c451"/>
  <circle cx="206" cy="249" r="9" fill="#55c77a"/>
  <text x="960" y="257" text-anchor="middle" fill="#aeb9cc" font-family="Arial, sans-serif" font-size="17">sophonctl · x5 · 已脱敏</text>

  <text x="145" y="338" fill="#62e6f1" font-family="Menlo, Consolas, monospace" font-size="24">$ sophonctl --board x5 ping</text>
  <text x="145" y="382" fill="#79df91" font-family="Menlo, Consolas, monospace" font-size="24">pong: true</text>
  <text x="470" y="382" fill="#8290a6" font-family="Menlo, Consolas, monospace" font-size="22">时间戳：2026-08-05T11:02:17Z</text>

  <line x1="145" y1="424" x2="1775" y2="424" stroke="#222b3a" stroke-width="2"/>

  <text x="145" y="480" fill="#62e6f1" font-family="Menlo, Consolas, monospace" font-size="24">$ sophonctl --board x5 state</text>
  <text x="175" y="531" fill="#d6dde8" font-family="Menlo, Consolas, monospace" font-size="23">CPU</text>
  <text x="460" y="531" fill="#ffffff" font-family="Menlo, Consolas, monospace" font-size="23">8 个利用率条目 · 1500 MHz</text>
  <text x="175" y="577" fill="#d6dde8" font-family="Menlo, Consolas, monospace" font-size="23">内存</text>
  <text x="460" y="577" fill="#ffffff" font-family="Menlo, Consolas, monospace" font-size="23">总计 7.42 GB · 已用 3.55 GB</text>
  <text x="175" y="623" fill="#d6dde8" font-family="Menlo, Consolas, monospace" font-size="23">DDR 温度</text>
  <text x="460" y="623" fill="#ffb08f" font-family="Menlo, Consolas, monospace" font-size="23">55.113 C</text>
  <text x="175" y="669" fill="#d6dde8" font-family="Menlo, Consolas, monospace" font-size="23">CPU 温度</text>
  <text x="460" y="669" fill="#ffb08f" font-family="Menlo, Consolas, monospace" font-size="23">54.38 C</text>
  <text x="175" y="715" fill="#d6dde8" font-family="Menlo, Consolas, monospace" font-size="23">根磁盘</text>
  <text x="460" y="715" fill="#ffffff" font-family="Menlo, Consolas, monospace" font-size="23">总计 30.97 GB · 已用 66.74%</text>

  <line x1="145" y1="757" x2="1775" y2="757" stroke="#222b3a" stroke-width="2"/>

  <text x="145" y="813" fill="#62e6f1" font-family="Menlo, Consolas, monospace" font-size="24">$ sophonctl --board x5 plugins list</text>
  <text x="175" y="861" fill="#79df91" font-family="Menlo, Consolas, monospace" font-size="23">servo</text>
  <text x="330" y="861" fill="#d6dde8" font-family="Menlo, Consolas, monospace" font-size="23">MagicBox 舵机姿态控制</text>

  <rect x="1270" y="487" width="460" height="228" rx="24" fill="#121925" stroke="#2c3c52" stroke-width="2"/>
  <text x="1310" y="536" fill="#ffffff" font-family="Arial, sans-serif" font-size="23" font-weight="700">此证据证明</text>
  <circle cx="1320" cy="581" r="6" fill="#79df91"/>
  <text x="1340" y="589" fill="#bac4d3" font-family="Arial, sans-serif" font-size="19">板端服务可达</text>
  <circle cx="1320" cy="623" r="6" fill="#79df91"/>
  <text x="1340" y="631" fill="#bac4d3" font-family="Arial, sans-serif" font-size="19">实时采集器返回状态</text>
  <circle cx="1320" cy="665" r="6" fill="#79df91"/>
  <text x="1340" y="673" fill="#bac4d3" font-family="Arial, sans-serif" font-size="19">可发现动态 servo 插件</text>

  <text x="100" y="1021" fill="#76849a" font-family="Arial, sans-serif" font-size="18">证据边界：此操作不执行物理动作，也不证明 AMD 推理硬件。</text>
</svg>
