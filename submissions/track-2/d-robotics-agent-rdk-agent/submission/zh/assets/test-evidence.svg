<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">RDK Agent 仓库验证证据</title>
  <desc id="desc">汇总 134 项 TypeScript 测试、62 项 Rust 测试、Clippy 与 release 构建结果，并披露格式化后续事项。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f8fb"/>
      <stop offset="1" stop-color="#e8eef5"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39c77a"/>
      <stop offset="1" stop-color="#15925a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1d2633" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <text x="100" y="108" fill="#182230" font-family="Arial, sans-serif" font-size="56" font-weight="700">仓库验证快照</text>
  <text x="102" y="160" fill="#667085" font-family="Arial, sans-serif" font-size="24">2026-08-05 最新证据 · 测试使用伪实现、桩和临时资源</text>

  <rect x="100" y="225" width="805" height="520" rx="30" fill="#ffffff" stroke="#d2d8e2" stroke-width="2" filter="url(#shadow)"/>
  <rect x="100" y="225" width="805" height="92" rx="30" fill="#1e2938"/>
  <rect x="100" y="287" width="805" height="30" fill="#1e2938"/>
  <text x="145" y="283" fill="#ffffff" font-family="Arial, sans-serif" font-size="29" font-weight="700">rdk-agent · TypeScript</text>
  <text x="145" y="372" fill="#667085" font-family="Menlo, Consolas, monospace" font-size="21">$ npm run check</text>
  <text x="690" y="372" fill="#15925a" font-family="Menlo, Consolas, monospace" font-size="21">通过</text>
  <text x="145" y="426" fill="#667085" font-family="Menlo, Consolas, monospace" font-size="21">$ npm test</text>
  <text x="145" y="518" fill="#182230" font-family="Arial, sans-serif" font-size="102" font-weight="700">134</text>
  <text x="365" y="485" fill="#182230" font-family="Arial, sans-serif" font-size="34" font-weight="700">项测试通过</text>
  <text x="365" y="531" fill="#667085" font-family="Arial, sans-serif" font-size="24">0 失败 · 0 跳过</text>
  <rect x="145" y="603" width="715" height="76" rx="18" fill="#ecfdf3"/>
  <text x="182" y="651" fill="#087443" font-family="Arial, sans-serif" font-size="21" font-weight="700">意图、工作流、安全、部署、TUI、Skill 契约</text>

  <rect x="1015" y="225" width="805" height="520" rx="30" fill="#ffffff" stroke="#d2d8e2" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1015" y="225" width="805" height="92" rx="30" fill="#1e2938"/>
  <rect x="1015" y="287" width="805" height="30" fill="#1e2938"/>
  <text x="1060" y="283" fill="#ffffff" font-family="Arial, sans-serif" font-size="29" font-weight="700">rdk-sophon · Rust</text>
  <text x="1060" y="372" fill="#667085" font-family="Menlo, Consolas, monospace" font-size="21">$ cargo test --workspace</text>
  <text x="1605" y="372" fill="#15925a" font-family="Menlo, Consolas, monospace" font-size="21">通过</text>
  <text x="1060" y="426" fill="#667085" font-family="Menlo, Consolas, monospace" font-size="21">$ cargo clippy ... -D warnings</text>
  <text x="1605" y="426" fill="#15925a" font-family="Menlo, Consolas, monospace" font-size="21">通过</text>
  <text x="1060" y="480" fill="#667085" font-family="Menlo, Consolas, monospace" font-size="21">$ cargo build --release --workspace</text>
  <text x="1605" y="480" fill="#15925a" font-family="Menlo, Consolas, monospace" font-size="21">通过</text>
  <text x="1060" y="592" fill="#182230" font-family="Arial, sans-serif" font-size="102" font-weight="700">62</text>
  <text x="1240" y="559" fill="#182230" font-family="Arial, sans-serif" font-size="34" font-weight="700">项测试通过</text>
  <text x="1240" y="605" fill="#667085" font-family="Arial, sans-serif" font-size="24">0 失败 · 含套接字 E2E</text>
  <rect x="1060" y="639" width="715" height="62" rx="18" fill="#ecfdf3"/>
  <text x="1097" y="679" fill="#087443" font-family="Arial, sans-serif" font-size="21" font-weight="700">RPC、传输、策略、遥测、插件、采集器</text>

  <rect x="100" y="805" width="1720" height="145" rx="28" fill="#fff8e8" stroke="#f2c94c" stroke-width="2"/>
  <text x="145" y="856" fill="#8b5e00" font-family="Arial, sans-serif" font-size="25" font-weight="700">已披露的后续事项</text>
  <text x="145" y="902" fill="#6d5a2a" font-family="Menlo, Consolas, monospace" font-size="22">cargo fmt --all -- --check</text>
  <text x="560" y="902" fill="#8b5e00" font-family="Arial, sans-serif" font-size="22">检出既有格式差异</text>
  <text x="145" y="932" fill="#8a7a54" font-family="Arial, sans-serif" font-size="17">在问题解决前，提交材料不将完整 full_test.sh 流水线描述为全绿。</text>

  <rect x="1430" y="82" width="390" height="87" rx="22" fill="url(#green)"/>
  <text x="1625" y="119" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="25" font-weight="700">196 / 196 项测试</text>
  <text x="1625" y="149" text-anchor="middle" fill="#eafff3" font-family="Arial, sans-serif" font-size="17">覆盖两个工作区</text>
</svg>
