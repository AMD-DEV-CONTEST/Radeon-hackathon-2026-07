  <text x="102" y="154" fill="#aeb9cc" font-family="Arial, sans-serif" font-size="25">模型推理、确定性交付与物理执行分属独立信任边界。</text>

  <rect x="90" y="210" width="1040" height="674" rx="30" fill="#171c27" stroke="#374052" stroke-width="2"/>
