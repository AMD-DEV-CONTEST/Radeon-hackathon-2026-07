  <circle cx="306" cy="965" r="7" fill="#ff6a3d"/>
  <text x="615" y="971" fill="#aeb9cc" font-family="Arial, sans-serif" font-size="19">确定性交付</text>
  <circle cx="591" cy="965" r="7" fill="#ff6a3d"/>
  <text x="950" y="971" fill="#aeb9cc" font-family="Arial, sans-serif" font-size="19">设备契约</text>
  <circle cx="926" cy="965" r="7" fill="#64e7f2"/>
  <text x="1215" y="971" fill="#aeb9cc" font-family="Arial, sans-serif" font-size="19">物理验收</text>
  <circle cx="1191" cy="965" r="7" fill="#64e7f2"/>
  <text x="130" y="1001" fill="#78859b" font-family="Arial, sans-serif" font-size="16">任何模型均无权不受限地访问仓库或机器人。</text>
