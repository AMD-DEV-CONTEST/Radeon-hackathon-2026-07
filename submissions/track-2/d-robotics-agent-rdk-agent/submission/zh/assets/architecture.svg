  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1700" cy="60" r="280" fill="#ff5c35" opacity="0.05"/>
  <circle cx="120" cy="1040" r="360" fill="#48d8e8" opacity="0.04"/>

