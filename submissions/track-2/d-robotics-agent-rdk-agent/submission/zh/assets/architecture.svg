  <text x="1350" y="751" text-anchor="middle" fill="#aeb9cc" font-family="Arial, sans-serif" font-size="17">RPC · 遥测 · 审计</text>
  <text x="1350" y="783" text-anchor="middle" fill="#aeb9cc" font-family="Arial, sans-serif" font-size="17">TCP 7777</text>

