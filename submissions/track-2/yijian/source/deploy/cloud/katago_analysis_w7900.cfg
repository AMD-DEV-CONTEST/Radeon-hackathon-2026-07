# Yijian KataGo analysis service on the AMD Radeon PRO W7900.
# Win rate and score are always reported from Black's perspective so the
# existing server evidence schema remains stable.
logDir = /persistent/yijian/logs/katago-analysis
homeDataDir = /persistent/yijian/katago-home
reportAnalysisWinratesAs = BLACK

# The benchmark script replaces these two values while measuring the GPU.
# Production values are selected from the checked-in benchmark result rather
# than copied from another GPU family.
numAnalysisThreads = 64
numSearchThreadsPerAnalysisThread = 1

maxVisits = 32
nnMaxBatchSize = 64
nnCacheSizePowerOfTwo = 20
nnMutexPoolSizePowerOfTwo = 17
nnRandomize = true

openclGpuToUse = 0
openclUseFP16 = auto
