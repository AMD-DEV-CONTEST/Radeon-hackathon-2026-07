<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">YIJIAN private Go teaching agent architecture</title>
  <desc id="desc">A local-first browser and FastAPI control plane gathers rule, KataGo, retrieval and opt-in memory evidence before the validated 27B competition model produces a checked teaching answer on an AMD Radeon PRO W7900. The trained 14B LoRA candidate remains quarantined after its blind-review gate.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071715"/><stop offset="1" stop-color="#102b27"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".25"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#79d8c0"/></marker>
    <style>
      .title{font:700 36px Inter,Segoe UI,sans-serif;fill:#f5f0df}.subtitle{font:18px Inter,Segoe UI,sans-serif;fill:#b9cbc5}.zone{fill:#0d2421;stroke:#477d72;stroke-width:2}.cloud{fill:#17212e;stroke:#7d91b2;stroke-width:2}.authority{fill:#272316;stroke:#b8a05b;stroke-width:2}.box{fill:#16352f;stroke:#67a997;stroke-width:2}.box2{fill:#222f40;stroke:#7693b8;stroke-width:2}.safe{fill:#352b18;stroke:#c4a75c;stroke-width:2}.label{font:700 21px Inter,Segoe UI,sans-serif;fill:#f6f1e4}.small{font:15px Inter,Segoe UI,sans-serif;fill:#d2ded9}.tiny{font:13px Inter,Segoe UI,sans-serif;fill:#aebfba}.arrow{fill:none;stroke:#79d8c0;stroke-width:4;marker-end:url(#arrow)}.dashed{fill:none;stroke:#879995;stroke-width:2;stroke-dasharray:8 8}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="70" y="70" class="title">YIJIAN — Evidence-Grounded Private Go Teaching Agent</text>
  <text x="70" y="105" class="subtitle">KataGo calculates. The agent verifies, explains, follows up and remembers only with consent.</text>

  <rect x="55" y="145" width="690" height="690" rx="28" class="zone"/>
  <text x="85" y="188" class="label">Local privacy and control plane</text>
  <text x="85" y="215" class="tiny">Raw games, reports and learning records remain here by default.</text>
  <rect x="90" y="255" width="240" height="125" rx="18" class="box" filter="url(#shadow)"/>
  <text x="120" y="300" class="label">Review workspace</text><text x="120" y="332" class="small">SGF/GIB · board · chat</text><text x="120" y="358" class="tiny">Chinese teaching interface</text>
  <rect x="410" y="255" width="275" height="125" rx="18" class="box" filter="url(#shadow)"/>
  <text x="440" y="300" class="label">FastAPI orchestrator</text><text x="440" y="332" class="small">Context · planner · trace</text><text x="440" y="358" class="tiny">Maximum three allow-listed tools</text>
  <path d="M330 318H410" class="arrow"/>

  <rect x="90" y="455" width="175" height="120" rx="16" class="authority"/>
  <text x="115" y="495" class="label">Go rules</text><text x="115" y="525" class="small">Legality · capture</text><text x="115" y="550" class="small">Liberties · ko</text>
  <rect x="285" y="455" width="175" height="120" rx="16" class="box"/>
  <text x="312" y="495" class="label">Local RAG</text><text x="312" y="525" class="small">FTS5 / BM25</text><text x="312" y="550" class="tiny">Traceable heuristics</text>
  <rect x="480" y="455" width="205" height="120" rx="16" class="box"/>
  <text x="505" y="495" class="label">Opt-in memory</text><text x="505" y="525" class="small">Save · list · delete</text><text x="505" y="550" class="tiny">No implicit writes</text>
  <path d="M548 380V422H178V455" class="arrow"/><path d="M548 422H373V455" class="arrow"/><path d="M548 422H582V455" class="arrow"/>

  <rect x="175" y="650" width="440" height="125" rx="18" class="safe" filter="url(#shadow)"/>
  <text x="205" y="692" class="label">Server-authoritative evidence bundle</text>
  <text x="205" y="725" class="small">Position hash · subject move · source hashes · tool results</text>
  <text x="205" y="752" class="tiny">The language model cannot overwrite coordinates, engine values or rule facts.</text>
  <path d="M178 575V620H395V650" class="arrow"/><path d="M373 575V650" class="arrow"/><path d="M582 575V620H395V650" class="arrow"/>

  <rect x="805" y="145" width="740" height="690" rx="28" class="cloud"/>
  <text x="835" y="188" class="label">Radeon Cloud compute plane</text>
  <text x="835" y="215" class="tiny">AMD Radeon PRO W7900 48 GB · ROCm 7.2.1 · loopback-only services</text>
  <rect x="850" y="260" width="280" height="150" rx="18" class="authority" filter="url(#shadow)"/>
  <text x="880" y="305" class="label">KataGo v1.16.5</text><text x="880" y="338" class="small">Official b40 network</text><text x="880" y="368" class="small">128-visit authority</text><text x="880" y="393" class="tiny">Candidates · values · PV</text>
  <rect x="1210" y="260" width="280" height="150" rx="18" class="box2" filter="url(#shadow)"/>
  <text x="1240" y="305" class="label">Model release policy</text><text x="1240" y="338" class="small">Stable alias: Qwen3.6-27B</text><text x="1240" y="368" class="small">ROCm · evidence-bounded</text><text x="1240" y="393" class="tiny">14B LoRA trained; blind gate failed</text>
  <path d="M745 715H790V335H850" class="arrow"/><path d="M1130 335H1210" class="arrow"/>

  <rect x="990" y="515" width="350" height="125" rx="18" class="safe" filter="url(#shadow)"/>
  <text x="1020" y="558" class="label">Validation and repair</text><text x="1020" y="590" class="small">Target · coordinates · numbers · certainty</text><text x="1020" y="618" class="tiny">Unsafe output → deterministic fallback</text>
  <path d="M1350 410V475H1165V515" class="arrow"/>
  <path d="M990 578H770V790H630" class="arrow"/>
  <text x="850" y="715" class="small">Auditable outputs</text>
  <text x="850" y="744" class="tiny">agent-plan-v1 · tool trace · evidence hash · latency · fallback status</text>
  <path d="M805 760H745" class="dashed"/>
  <text x="70" y="875" class="tiny">Public architecture diagram · no private game records, credentials, model weights or sealed evaluation content</text>
</svg>
