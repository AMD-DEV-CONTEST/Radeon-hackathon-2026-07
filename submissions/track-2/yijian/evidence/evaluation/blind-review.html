<script id="payload" type="application/json">{"pack": {"schemaVersion": "yijian-blind-review-pack-v2", "cases": [{"caseId": "project-unseen-classic-22-074", "question": "轮到白棋，实战尚未落子。实战选择 N6 的主要作用和取舍是什么？", "answers": [{"alias": "A", "answer": "{\n  \"answer\": \"实战选择 N6 的主要作用是试图在中央或右侧进行防守或连接，但其胜率（3.7%）远低于最佳选点 B5（15.0%）和 L7（13.1%）。取舍在于：N6 未能抓住当前局面下价值最大的 B5（可能涉及左下角的急所或大场）或 L7（可能涉及中腹或右边的关键攻防），导致局面迅速恶化，目数领先从 -3.55 跌至 -7.91，属于严重的失误。\",\n  \"followUps\": [\n    \"B5 具体在左下角形成了什么样的威胁或机会？\",\n    \"L7 在右边或中腹起到了什么关键作用？\",\n    \"N6 之后黑棋 K6 的应对为何如此严厉？\"\n  ]\n}"}, {"alias": "B", "answer": "{\n  \"answer\": \"实战选择 N6 的主要作用是通过局部进攻牵制黑棋的势力，同时为白棋在左上角的扩张创造机会。取舍在于 N6 虽然能对黑棋形成一定压力，但相比最佳候选 B5，其胜率和目差均较低，因此属于次优选择。\",\n  \"followUps\": []\n}"}, {"alias": "C", "answer": "{\"answer\":\"实战选择 N6 的主要作用是通过局部战斗获取目数，但取舍是放弃局部的主动权，让黑棋在 B5 附近获得优势。\",\"followUps\":[]}"}]}, {"caseId": "project-unseen-classic-04-091", "question": "轮到黑棋，实战尚未落子。实战选择 E3 的主要作用和取舍是什么？", "answers": [{"alias": "A", "answer": "{\n  \"answer\": \"实战选择 E3 的主要作用是巩固黑棋在左下角的势力，同时为后续在中腹和右上角的扩张创造机会。取舍在于 E3 是当前局面下黑棋最有力的落子点，相较于其他候选点（如 S10、K2、L7），E3 更能直接提升黑棋的局部优势并限制白棋的扩张。\",\n  \"followUps\": []\n}"}, {"alias": "B", "answer": "{\n  \"answer\": \"实战选择 E3 是 KataGo 评估下的最佳着手（Best Move），其主要作用是确立极高的胜率优势（约 98.8%）并扩大目数领先（约 11.5 目）。该手棋通过后续变化（如 E4、S10 等）巩固了黑棋的局面控制，是兼顾胜率与目数效率的最优解。\",\n  \"followUps\": [\n    \"S10 作为第二候选手，其胜率（98.5%）与目数领先（10.4 目）略低于 E3，主要差异体现在后续变化（如 Q7、R5）对局面的影响上。\",\n    \"K2 和 L7 的胜率与目数领先显著低于 E3，表明它们在当前局面下的效率或安全性不如 E3。\"\n  ]\n}"}, {"alias": "C", "answer": "{\"answer\":\"E3 是黑棋在当前局面下的最佳选择，主要作用是通过连接和扩张来增强黑棋的势力范围，同时限制白棋的活动空间。取舍在于 E3 虽然能带来较大的胜率优势，但需要在后续的行棋中保持对白棋的压制，避免被白棋反击。\",\"followUps\":[]}"}]}, {"caseId": "project-unseen-classic-16-082", "question": "轮到白棋，实战尚未落子。实战选择 D6 的主要作用和取舍是什么？", "answers": [{"alias": "A", "answer": "{\n  \"answer\": \"实战选择 D6 是 KataGo 评估下的最佳着手（Best Move），其主要作用在于确立约 9.2 目的领先优势，并将白棋胜率稳定在 99.4% 以上。该手棋通过局部定型或攻击，有效巩固了白棋的实地或厚势，同时限制了黑棋在左下及中腹的发展潜力。相较于其他候选点，D6 在保持高胜率的同时，提供了最稳健的目数领先，避免了因追求微小胜率提升（如 S12）而可能带来的复杂变化或目数亏损风险。\",\n  \"followUps\": [\n    \"D6 之后，黑棋最可能的应对手段是什么？\",\n    \"如果白棋不走 D6 而选择 S12，局势会发生怎样的变化？\",\n    \"D6 这一手棋对左下角黑棋的眼位或出路有何具体影响？\"\n  ]\n}"}, {"alias": "B", "answer": "{\n  \"answer\": \"实战选择 D6 的主要作用是通过直接占据关键点，强化白棋在中腹的势力范围，同时限制黑棋的扩张。取舍在于放弃了一些其他可能的扩张路径，如 S12 或 K2，这些点虽然也能带来一定的优势，但不如 D6 在当前局面中对白棋的全局影响深远。\",\n  \"followUps\": []\n}"}, {"alias": "C", "answer": "{\"answer\":\"D6 是白棋在当前局面下的最佳选择，主要作用是通过占据 D6 这个关键点，对黑棋的棋形进行压制，同时为白棋的后续发展创造空间。取舍在于，虽然 D6 是当前局面下的最佳选择，但其他候选点如 S12、K2、L2 等也有一定的潜力，但它们的胜率和评分略低于 D6。\",\"followUps\":[]}"}]}, {"caseId": "project-unseen-classic-25-129", "question": "轮到黑棋，实战尚未落子。实战选择 J4 的主要作用和取舍是什么？", "answers": [{"alias": "A", "answer": "{\n  \"answer\": \"实战选择 J4 的主要作用是通过局部进攻或牵制白棋的布局，同时为黑棋在右上角（B16 等区域）的后续发展争取空间。取舍在于 J4 的落子可能暂时牺牲局部的效率，但通过牵制白棋的布局，为黑棋在右上角的更大潜力（如 B16）创造机会。\",\n  \"followUps\": []\n}"}, {"alias": "B", "answer": "{\n  \"answer\": \"实战选择 J4 的主要作用是试图在局部进行防守或连接，但其代价是忽略了全局最大的急所 B16。根据 KataGo 分析，J4 导致黑棋胜率仅为 0.07%，落后约 14.44 目，属于严重失误。相比之下，最佳着手 B16 虽也处于劣势（胜率 0.09%，落后 12.32 目），但能最大程度缩小差距。J4 的取舍在于牺牲了全局最大的官子或战略要点，换取了局部看似紧凑但实际价值较低的棋形，导致局势进一步恶化。\",\n  \"followUps\": [\n    \"B16 具体是如何改善黑棋局面的？\",\n    \"如果黑棋走 B16，白棋后续的最佳应对是什么？\",\n    \"J4 之后，白棋有哪些严厉的反击手段？\"\n  ]\n}"}, {"alias": "C", "answer": "{\"answer\":\"实战选择 J4 的主要作用是通过局部战斗获取目数，但取舍是放弃局部的主动权，让白棋在 B16 附近获得更大的空间。\",\"followUps\":[]}"}]}, {"caseId": "project-unseen-classic-02-117", "question": "轮到黑棋，实战尚未落子。实战选择 M16 的主要作用和取舍是什么？", "answers": [{"alias": "A", "answer": "{\"answer\":\"实战选择 M16 的主要作用是通过局部的厚势与黑棋的外围联络，形成对白棋的压迫，同时为黑棋的后续发展争取空间。取舍是放弃局部的直接进攻机会，选择更稳妥的布局，以确保整体的平衡。\",\"followUps\":[]}"}, {"alias": "B", "answer": "{\n  \"answer\": \"实战 M16 的主要作用是巩固上方黑棋阵势并获取实地，其取舍在于以微小的胜率损失（约 0.1%）换取局面的确定性与稳健，放弃了 Q14 等点可能带来的更高目数领先或更优的后续变化。\",\n  \"followUps\": [\n    \"Q14 与 R14 相比 M16 在目数领先上的具体优势是多少？\",\n    \"H5 和 H6 作为候选点，其变化图对全局厚薄有何影响？\",\n    \"M16 之后的主要变化图（PV）中，白棋的应对策略是什么？\"\n  ]\n}"}, {"alias": "C", "answer": "{\n  \"answer\": \"实战选择 M16 的主要作用是巩固黑棋在左上角的势力，同时限制白棋在该区域的扩张。取舍在于放弃了一些更激进的进攻机会（如 Q14、R14 等），选择了一步更为稳健的防守与局部平衡。\",\n  \"followUps\": []\n}"}]}, {"caseId": "project-unseen-classic-19-140", "question": "轮到白棋，实战尚未落子。实战选择 K15 的主要作用和取舍是什么？", "answers": [{"alias": "A", "answer": "{\n  \"answer\": \"实战选择 K15 的主要作用是通过局部进攻牵制黑棋的势力，同时为白棋在右上角的布局创造机会。取舍在于 K15 虽然在局部形成一定压力，但相较于最佳候选 S2，其胜率和目差略低，因此是次优选择。\",\n  \"followUps\": []\n}"}, {"alias": "B", "answer": "{\"answer\":\"K15 是白棋在当前局面下的次优选择，其主要作用是通过局部战斗削弱黑棋的外围势力，但取舍在于放弃了一些局部的主动权。K15 的胜率和目差均低于最佳选择 S2，但其在局部战斗中可能对黑棋形成一定压力。\",\"followUps\":[]}"}, {"alias": "C", "answer": "{\n  \"answer\": \"实战选择 K15 的主要作用是试图在中央或上边建立联系/势力，但其胜率（0.16%）和目数领先（-9.35目）均显著低于最佳选点 S2（胜率 0.20%，目数领先 -8.13目）。取舍在于：K15 放弃了右下角 S2 这一当前局面下价值最大、能最大限度缩小劣势的急所，转而追求其他方向的行棋，导致局面进一步恶化。\",\n  \"followUps\": [\n    \"S2 为何是此局面下的最佳选点？\",\n    \"K15 与 S2 在目数差距上的具体差异是多少？\"\n  ]\n}"}]}, {"caseId": "official-ladder-basic-07", "question": "黑棋从哪里开始征子？为什么不能只看第一步打吃？", "answers": [{"alias": "A", "answer": "{\n  \"answer\": \"黑棋从 F5 开始征子。不能只看第一步打吃，是因为征子（Ladder）是一个连续的、方向性的追逐过程，其成功与否取决于后续每一步的应对以及棋盘上是否存在接应子（Shield）。KataGo 的候选列表显示 F5 是最佳着手，其变化图（PV）展示了从 F5 开始，经过 E3、F4、F3 等一系列连续打吃直至捕获白棋的完整路径。如果仅看第一步，无法判断该方向是否会被白棋逃脱或反杀，必须依据后续线路的可行性来确认征子的成立。\",\n  \"followUps\": [\n    \"如果白棋在 E3 处有接应子，黑棋 F5 的征子还会成立吗？\",\n    \"KataGo 给出的 F4 候选着法与 F5 相比，在后续变化中有什么主要区别？\"\n  ]\n}"}, {"alias": "B", "answer": "{\"answer\":\"黑棋从F5开始征子。因为征子是连续的打吃，不能只看第一步打吃，而要看后续的步骤。\",\"followUps\":[]}"}, {"alias": "C", "answer": "{\n  \"answer\": \"黑棋从 F5 开始征子。不能只看第一步打吃，因为征子需要考虑后续的连环打吃和逃子路径。KataGo 的候选走法显示，F5 是最佳选择，因为它能形成连环打吃，而 F4 虽然也是一个方向，但不如 F5 有效。征子的判断需要综合考虑整个线路，而不仅仅是第一步。\",\n  \"followUps\": []\n}"}]}, {"caseId": "project-unseen-classic-07-116", "question": "轮到白棋，实战尚未落子。实战选择 L10 的主要作用和取舍是什么？", "answers": [{"alias": "A", "answer": "{\n  \"answer\": \"实战选择 L10 的主要作用是通过在 L10 落子，白棋可以加强自身在左上角的势力范围，同时对黑棋的布局形成一定的牵制。取舍在于，L10 是 KataGo 候选中胜率最高的落子点，相较于其他候选点（如 N10、L11 等），L10 的胜率更高，因此白棋选择 L10 是基于对当前局面的最优判断。\",\n  \"followUps\": []\n}"}, {"alias": "B", "answer": "{\n  \"answer\": \"实战选择 L10 是 KataGo 评估下的最佳应对（Best Move），其主要作用是通过占据要点来最大化白棋的胜率（约 0.98%）并最小化目数亏损（落后约 9 目）。相较于其他候选点，L10 在胜率上具有显著优势，是维持当前微弱劣势局面的最优解。\",\n  \"followUps\": [\n    \"如果白棋改走 N10，胜率将下降至约 0.57%，目数落后扩大至约 9.8 目，主要风险在于黑棋可能通过 N11 等手段强化自身或反击。\",\n    \"L10 之后的主要变化图（PV）显示黑棋可能应 H13，随后白棋 N9，黑棋 N8，白棋 N10，黑棋 M7，白棋 G13，这一序列是 AI 认为双方最优的后续应对。\"\n  ]\n}"}, {"alias": "C", "answer": "{\"answer\":\"L10 是白棋在当前局面下的最佳选择，主要作用是通过连接和扩张来增强白棋的势力范围，同时限制黑棋的活动空间。取舍在于，虽然 L10 是当前局面下的最佳选择，但其他候选点如 N10、L11、J13、L12、K14 和 R17 也提供了不同的策略方向，但它们的胜率和目差均低于 L10。\",\"followUps\":[]}"}]}, {"caseId": "official-yose-sente-01", "question": "黑棋现在应先下哪里？这手能否仅因抢先落子就称为先手官子？", "answers": [{"alias": "A", "answer": "{\"answer\":\"黑棋应先下 D5，这手不能仅因抢先落子就称为先手官子。\",\"followUps\":[]}"}, {"alias": "B", "answer": "{\n  \"answer\": \"黑棋应下 D5。这手棋不能仅因抢先落子就称为先手官子，因为 KataGo 的主变（PV）显示白棋后续脱先（PASS），且该处并非双方必应的急所，其价值判定依赖于具体的后续应对而非单纯的先手权利。\",\n  \"followUps\": [\n    \"D5 之后白棋脱先，黑棋是否还有后续手段？\",\n    \"如何区分‘先手官子’与‘逆收官子’在此局面下的差异？\"\n  ]\n}"}, {"alias": "C", "answer": "{\n  \"answer\": \"黑棋现在应先下 D5。这手不能仅因抢先落子就称为先手官子。\",\n  \"followUps\": []\n}"}]}, {"caseId": "official-joseki-sacrifice-02", "question": "黑棋切断后，白棋为什么考虑 D7 倚靠，而不是执着救 E10？", "answers": [{"alias": "A", "answer": "{\"answer\":\"白棋在 D7 倚靠，是基于弃子与倚靠机制的策略选择。虽然 E10 是白棋的棋子，但直接救 E10 可能会陷入局部战斗，而 D7 倚靠则可以利用黑棋的切断，形成更灵活的布局。\",\"followUps\":[]}"}, {"alias": "B", "answer": "{\n  \"answer\": \"白棋在 D7 倚靠，是因为该位置能形成弃子与倚靠的机制，从而在局部获得更好的形状与后续发展的潜力。相比之下，执着于救 E10 可能会陷入局部的被动，且无法有效利用周围的空点与大场。\",\n  \"followUps\": []\n}"}, {"alias": "C", "answer": "{\n  \"answer\": \"白棋选择 D7 倚靠而非执着救 E10，是基于弃子取势与效率的权衡。根据 KataGo 候选分析，D7 虽非全局最优（E11 胜率更高），但在局部候选中优于 C8 等恶手，且符合“倚靠”机制：通过弃掉 E10 一子，换取外围厚势与先手权利，避免陷入被动防守。\",\n  \"followUps\": [\n    \"D7 倚靠后，黑棋若继续攻击，白棋如何利用弃子形成的外势？\",\n    \"为何 KataGo 认为 E11 是全局最佳应手，其战略意图是什么？\"\n  ]\n}"}]}, {"caseId": "project-unseen-classic-14-140", "question": "轮到白棋，实战尚未落子。KataGo 首选在哪里，为什么？", "answers": [{"alias": "A", "answer": "{\n  \"answer\": \"KataGo 首选 H18。\",\n  \"followUps\": [\n    \"H18 的目数领先优势（10.63）高于实战 L12（9.51），且胜率（99.21%）与 L12（99.32%）处于同一极高区间，表明 H18 在保持高胜率的同时获得了更大 const evidenceHtml=caseId=>{const e=ev[caseId],color=e.actualColor==='B'?'黑':e.actualColor==='W'?'白':'—';return `<div class="evidence-panel"><div class="board-wrap"><canvas class="board" data-case="${esc(caseId)}" width="620" height="620"></canvas><div class="legend"><span class="red">● 红圈：${color}棋实战候选 ${esc(e.actualMove)}</span><span class="green">● 绿圈：同回合 KataGo 首选 ${esc(e.bestMove)}</span></div><div class="small">${esc(e.boardNote)}</div></div><div><div class="facts"><div class="fact">棋盘<strong>${e.boardSize} 路</strong></div><div class="fact">当前行棋方<strong>${e.toPlay==='B'?'黑':e.toPlay==='W'?'白':'—'}</strong></div><div class="fact">${color}棋实战候选<strong>${esc(e.actualMove||'—')}</strong></div><div class="fact">同回合 AI 首选<strong>${esc(e.bestMove||'—')}</strong></div></div><p><b>KataGo：</b>${esc(e.visits||'—')} visits</p><table class="candidate-table"><thead><tr><th>候选</th><th>本方胜率</th><th>本方目差</th><th>访问</th><th>主变化</th></tr></thead><tbody>${candidateRows(e)}</tbody></table>${e.referenceAnswer?`<p><b>官方/项目判分依据：</b>${esc(e.referenceAnswer)}</p>`:''}<p><b>规则事实：</b>${e.legalMove===null||e.legalMove===undefined?'未单列':e.legalMove?'目标手合法':'目标手异常'}${Array.isArray(e.capturedByTarget)?`；提子 ${e.capturedByTarget.length} 枚`:''}${e.targetGroupLibertiesAfter!==null&&e.targetGroupLibertiesAfter!==undefined?`；落子后目标棋块 ${e.targetGroupLibertiesAfter} 气`:''}</p><p><b>证据边界：</b>${esc(e.claimBoundary||'仅限当前重建局面与登记分析。')}</p></div></div>`;};
for(const c of p.cases) for(const a of c.answers){const id=c.caseId+'|'+a.alias, ai=suggestions.get(c.caseId).get(a.alias);d[id]=d[id]||{caseId:c.caseId,alias:a.alias,evidence:ai.evidence,depth:ai.depth,actionability:ai.actionability,severe:ai.severe};}
document.getElementById('cases').innerHTML=p.cases.map((c,i)=>`<section id="case-${esc(c.caseId)}" data-case="${esc(c.caseId)}"><h2>${i+1}. ${esc(c.question)}</h2>${evidenceHtml(c.caseId)}<div class="answers">${c.answers.map(a=>{const ai=suggestions.get(c.caseId).get(a.alias),row=d[c.caseId+'|'+a.alias];return `<article><h3>回答 ${esc(a.alias)}</h3><pre>${esc(a.answer)}</pre><div class="ai-reason"><strong>AI 预审理由：</strong>${esc(ai.reason||'未提供理由')}</div>${[['evidence','证据正确性'],['depth','教学深度'],['actionability','可执行性']].map(([f,l])=>`<label>${l}<select class="rating" data-case="${esc(c.caseId)}" data-alias="${esc(a.alias)}" data-field="${f}">${options(row[f])}</select></label>`).join('')}<label><span>严重坐标/首选/数值矛盾</span><input type="checkbox" class="severe" data-case="${esc(c.caseId)}" data-alias="${esc(a.alias)}" ${row.severe?'checked':''}></label></article>`}).join('')}</div><button class="case-confirm" data-case="${esc(c.caseId)}">确认本题三份评分</button></section>`).join('');
const drawBoard=canvas=>{const e=ev[canvas.dataset.case],ctx=canvas.getContext('2d'),size=e.boardSize,cols='ABCDEFGHJKLMNOPQRST'.slice(0,size),pad=48,gap=(canvas.width-pad*2)/(size-1);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#d5b26e';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#554b38';ctx.lineWidth=1.5;for(let i=0;i<size;i++){const v=pad+i*gap;ctx.beginPath();ctx.moveTo(pad,v);ctx.lineTo(canvas.width-pad,v);ctx.stroke();ctx.beginPath();ctx.moveTo(v,pad);ctx.lineTo(v,canvas.height-pad);ctx.stroke();}ctx.fillStyle='#263934';ctx.font=`${size===19?14:18}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';for(let i=0;i<size;i++){const v=pad+i*gap;ctx.fillText(cols[i],v,22);ctx.fillText(cols[i],v,canvas.height-20);ctx.fillText(String(size-i),22,v);ctx.fillText(String(size-i),canvas.width-22,v);}const stars=size===19?[3,9,15]:size===9?[2,4,6]:[];for(const x of stars)for(const y of stars){ctx.beginPath();ctx.arc(pad+x*gap,pad+y*gap,size===19?3.4:4.2,0,Math.PI*2);ctx.fill();}const xy=coord=>{if(!coord||coord==='PASS')return null;const x=cols.indexOf(coord[0]),row=Number(coord.slice(1));return x<0||row<1||row>size?null:[pad+x*gap,pad+(size-row)*gap];};const stone=(coord,color)=>{const pos=xy(coord);if(!pos)return;ctx.beginPath();ctx.arc(pos[0],pos[1],Math.max(9,gap*.44),0,Math.PI*2);ctx.fillStyle=color;ctx.fill();ctx.strokeStyle=color==='#111'?'#333':'#777';ctx.lineWidth=1.2;ctx.stroke();};(e.stones.black||[]).forEach(x=>stone(x,'#111'));(e.stones.white||[]).forEach(x=>stone(x,'#fafafa'));const ring=(coord,color,radius)=>{const pos=xy(coord);if(!pos)return;ctx.beginPath();ctx.arc(pos[0],pos[1],radius,0,Math.PI*2);ctx.strokeStyle=color;ctx.lineWidth=5;ctx.stroke();};ring(e.actualMove,'#c7463b',Math.max(12,gap*.51));ring(e.bestMove,'#16805f',Math.max(16,gap*.60));};
document.querySelectorAll('canvas.board').forEach(drawBoard);
const persist=()=>localStorage.setItem(storageKey,JSON.stringify({records:d,confirmed:[...confirmed]}));
const completeCase=caseId=>['A','B','C'].every(alias=>{const row=d[caseId+'|'+alias];return row&&['evidence','depth','actionability'].every(f=>Number.isInteger(row[f])&&row[f]>=1&&row[f]<=5);});
const update=()=>{for(const section of document.querySelectorAll('section[data-case]')){const ok=confirmed.has(section.dataset.case);section.classList.toggle('confirmed',ok);const b=section.querySelector('.case-confirm');b.classList.toggle('done',ok);b.textContent=ok?'✓ 本题已由你确认':'确认本题三份评分';}document.getElementById('progress').textContent=`已确认 ${confirmed.size} / 30 题`;};
const invalidate=caseId=>{confirmed.delete(caseId);persist();update();};
document.querySelectorAll('.rating').forEach(x=>x.onchange=()=>{const id=x.dataset.case+'|'+x.dataset.alias;d[id][x.dataset.field]=Number(x.value);invalidate(x.dataset.case);});
document.querySelectorAll('.severe').forEach(x=>x.onchange=()=>{const id=x.dataset.case+'|'+x.dataset.alias;d[id].severe=x.checked;invalidate(x.dataset.case);});
document.querySelectorAll('.case-confirm').forEach(button=>button.onclick=()=>{const caseId=button.dataset.case;if(!completeCase(caseId)){alert('本题仍有未完成评分。');return;}confirmed.add(caseId);persist();update();const section=button.closest('section');const next=section.nextElementSibling;if(next&&!next.classList.contains('confirmed'))next.scrollIntoView({behavior:'smooth',block:'start'});});
document.getElementById('export').onclick=()=>{const allCases=new Set(p.cases.map(c=>c.caseId));if(confirmed.size!==30||[...allCases].some(id=>!confirmed.has(id))){alert('请先逐题确认全部 30 题。');return;}const records=Object.values(d);if(records.length!==90||records.some(row=>!['evidence','depth','actionability'].every(f=>Number.isInteger(row[f])&&row[f]>=1&&row[f]<=5))){alert('评分记录不完整，无法导出。');return;}const value={schemaVersion:'yijian-blind-review-draft-v2',status:'human_scored',packSha256:p.packSha256,reviewMode:'ai_assisted_human_confirmation',assistance:{type:'ai_prescore',schemaVersion:s.schemaVersion,prescoreSha256:root.prescoreSha256,reviewEvidenceSha256:root.evidenceSha256,humanFinalDecision:true},humanConfirmedCases:[...confirmed].sort(),records};const blob=new Blob([JSON.stringify(value,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='yijian-blind-review-assisted.json';a.click();URL.revokeObjectURL(a.href);};
persist();update();
</script></body></html>
