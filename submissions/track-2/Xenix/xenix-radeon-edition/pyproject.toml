[project]
name = "xenix-native"
version = "1.3.3"
description = "Xenix native"
authors = [{ name = "Lan_zhijiang", email = "lanzhijiang@foxmail.com" }]
readme = "README.md"
requires-python = "==3.14.2"
dependencies = [
    "PySide6>=6.9.0",
    "sqlmodel>=0.0.24",
    "pydantic>=2.11.0",
    "pandas>=2.3.0",
    "openpyxl>=3.1.0",
    "joblib>=1.5.0",
    "scikit-learn>=1.7.0",
    "duckdb>=1.5.2",
    "qtawesome>=1.4.2",
    "xgboost>=3.2.0",
    "lightgbm>=4.6.0",
    "mlxtend>=0.24.0",
    "apyori>=1.1.2",
    "marko>=2.2.0",
    "statsmodels>=0.14.0",
    "vl-convert-python==1.9.0.post1",
    "wordcloud>=1.9.6",
    "jieba>=0.42.1",
    "opentelemetry-api>=1.42.1",
    "opentelemetry-sdk>=1.42.1",
    "opentelemetry-exporter-otlp>=1.42.1",
    "opentelemetry-instrumentation-logging>=0.63b1",
    "structlog>=26.1.0",
    "polars[calamine,rtcompat]==1.42.1",
    "xlsxwriter>=3.2.0",
    "velopack==1.2.0",
    "docling<3,>=2.114.0",
    "zstandard<1,>=0.23",
    "charset-normalizer<4,>=3.4",
    "lancedb<1,>=0.34",
    "pikepdf<11,>=10.10",
    "msoffcrypto-tool<7,>=6.0",
    "jsonschema<5,>=4.26",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.16.0",
    "pytest>=8.4.0",
    "PyYAML>=6.0.0",
    "ruff>=0.16.0",
    "mypy>=2.3.0",
    "types-jsonschema>=4.26.0.20260518",
]
[tool.pdm]
distribution = false

[tool.pdm.scripts]
agent-skills-check = "python scripts/agent_skills.py check"
agent-skills-generate = "python scripts/agent_skills.py generate"
knowledge-ocr-lock-check = "python scripts/build_knowledge_ocr_runtime.py --check-lock"
lint = "ruff check src tests scripts benchmarks"
typecheck = "mypy"
dev = { composite = ["agent-skills-generate", "python scripts/run_dev.py"] }
i18n-extract = "python scripts/update_translations.py"
i18n-compile = "python scripts/compile_translations.py"
package = { composite = ["agent-skills-generate", "agent-skills-check", "python scripts/package_app.py"] }
build-knowledge-ocr = "python scripts/build_knowledge_ocr_runtime.py"
smoke = { composite = ["agent-skills-generate", "python scripts/run_dev.py --smoke-test"] }
smoke-package = "python scripts/verify_packaged_smoke.py"
velopack = "python scripts/package_velopack.py"
dist = "python scripts/build_distribution_zip.py"
pytest = "python scripts/run_pytest.py"
test = { composite = ["i18n-compile", "python scripts/run_pytest.py {args}"] }
benchmark-agent-harness = "python scripts/run_agent_harness_benchmark.py"
benchmark-agent-harness-headed = "python scripts/run_agent_harness_headed_benchmark.py"
check = { composite = ["agent-skills-generate", "agent-skills-check", "lint", "typecheck", "knowledge-ocr-lock-check", "python -m compileall src tests benchmarks scripts"] }
diagnostic-bundle = "python scripts/create_diagnostic_bundle.py"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "agent_harness_live: explicit real-provider Agent Harness benchmark case",
]

[tool.ruff]
target-version = "py314"
line-length = 120
src = ["src"]
extend-exclude = ["tasks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "A"]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
"scripts/package_app.py" = ["E402"]
"scripts/run_packaged.py" = ["E402"]

[tool.mypy]
python_version = "3.14"
platform = "win32"
mypy_path = "src"
files = [
    "scripts/build_knowledge_ocr_runtime.py",
    "src/xenix/datetime_utils.py",
    "src/xenix/release_config.py",
    "src/xenix/trial_lock.py",
    "src/xenix/services/agent/knowledge_tool.py",
    "src/xenix/services/agent/skill_catalog.py",
    "src/xenix/services/agent/tool_inputs.py",
    "src/xenix/services/data_tokenization_contracts.py",
    "src/xenix/services/knowledge_content_store.py",
    "src/xenix/services/knowledge_document_lifecycle_service.py",
    "src/xenix/services/knowledge_formats.py",
    "src/xenix/services/knowledge_import_worker.py",
    "src/xenix/services/llm/tooling.py",
    "src/xenix/services/ml/contracts.py",
    "src/xenix/services/ml/registry.py",
    "src/xenix/services/ml/types.py",
    "src/xenix/services/ml/worker_settings.py",
    "src/xenix/services/trained_model_metadata.py",
]
plugins = ["pydantic.mypy"]
follow_imports = "silent"
strict = true
show_error_codes = true
pretty = true
warn_unused_configs = true

[tool.pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = true
