<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">Xenix Radeon Edition deployment architecture</title>
  <desc id="desc">Business files enter the Xenix Windows desktop control plane. A conversational agent uses capability-scoped providers projected from manifest-verified Chat, Embedding, and OCR runtimes on a private SSH Linux Radeon target. Local WSL is shown as a distinct, unaccepted path. Verifiable datasets and artifacts return to the business user.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#242429" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#111116" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#ED6609"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#15AABF"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #242429; }
      .eyebrow { font-size: 14px; font-weight: 800; letter-spacing: 2.5px; }
      .title { font-size: 30px; font-weight: 760; letter-spacing: -0.5px; }
      .label { font-size: 18px; font-weight: 750; }
      .body { font-size: 15px; font-weight: 500; }
      .small { font-size: 13px; font-weight: 600; }
      .tiny { font-size: 12px; font-weight: 650; }
      .white { fill: #FFFDF8; }
      .muted { fill: #69696F; }
      .orange { fill: #ED6609; }
      .cyan { fill: #0E91A5; }
      .red { fill: #CC2A31; }
    </style>
  </defs>

  <rect width="1600" height="820" fill="#F6F2E9"/>
  <rect width="1600" height="820" fill="url(#grid)"/>
  <rect x="0" y="0" width="18" height="820" fill="#ED6609"/>

  <text x="54" y="48" class="eyebrow orange">TRACK 2 · EDITABLE SYSTEM MAP</text>
  <text x="54" y="82" class="title">Private business data crosses explicit capability and trust boundaries.</text>
  <text x="1548" y="48" class="eyebrow muted" text-anchor="end">XENIX RADEON EDITION</text>

  <!-- Business input -->
  <g filter="url(#shadow)">
    <rect x="48" y="162" width="238" height="116" rx="14" fill="#FFFDF8" stroke="#D7D2C7" stroke-width="2"/>
  </g>
  <circle cx="80" cy="194" r="18" fill="#ED6609"/>
  <text x="80" y="200" class="label white" text-anchor="middle">1</text>
  <text x="111" y="200" class="label">Business files</text>
  <text x="72" y="233" class="body muted">Documents · tables · images</text>
  <text x="72" y="257" class="small muted">User-authorized private input</text>

  <!-- Verifiable output -->
  <g filter="url(#shadow)">
    <rect x="48" y="560" width="238" height="128" rx="14" fill="#FFFDF8" stroke="#ED6609" stroke-width="2"/>
  </g>
  <circle cx="80" cy="594" r="18" fill="#242429"/>
  <text x="80" y="600" class="label white" text-anchor="middle">4</text>
  <text x="111" y="590" class="label">Verifiable</text>
  <text x="111" y="612" class="label">datasets and artifacts</text>
  <text x="72" y="645" class="body muted">Source-linked, inspectable output</text>
  <text x="72" y="669" class="small orange">No fabricated performance claim</text>

  <!-- Windows control plane -->
  <rect x="330" y="112" width="600" height="604" rx="22" fill="#FFFDF8" stroke="#242429" stroke-width="2.5"/>
  <rect x="330" y="112" width="600" height="52" rx="22" fill="#242429"/>
  <rect x="330" y="142" width="600" height="22" fill="#242429"/>
  <circle cx="365" cy="138" r="8" fill="#ED6609"/>
  <text x="386" y="144" class="eyebrow white">WINDOWS DESKTOP CONTROL PLANE</text>
  <text x="902" y="144" class="tiny white" text-anchor="end">USER AUTHORITY</text>

  <rect x="366" y="190" width="528" height="136" rx="14" fill="#F0ECE3" stroke="#CBC5BA"/>
  <circle cx="398" cy="223" r="18" fill="#ED6609"/>
  <text x="398" y="229" class="label white" text-anchor="middle">2</text>
  <text x="429" y="229" class="label">Conversational Agent</text>
  <text x="398" y="261" class="body">RAG · tool calling · multi-step planning</text>
  <text x="398" y="286" class="body">multi-turn memory · privacy-aware workflows</text>
  <rect x="398" y="300" width="310" height="5" rx="2.5" fill="#ED6609"/>

  <rect x="366" y="354" width="248" height="156" rx="14" fill="#FFFDF8" stroke="#CBC5BA"/>
  <text x="390" y="386" class="eyebrow orange">CAPABILITY MANIFESTS</text>
  <text x="390" y="418" class="body">Chat · Embedding · Page OCR</text>
  <text x="390" y="446" class="small muted">Pinned runtime, model, artifacts</text>
  <text x="390" y="469" class="small muted">compatibility cell, hashes, checks</text>
  <text x="390" y="492" class="tiny red">Fixed profiles · no CPU/API fallback</text>

  <rect x="646" y="354" width="248" height="156" rx="14" fill="#242429"/>
  <text x="670" y="386" class="eyebrow orange">LIFECYCLE COORDINATOR</text>
  <text x="670" y="418" class="body white">Trust / inspect → preflight</text>
  <text x="670" y="445" class="body white">prepare → launch → self-test</text>
  <text x="670" y="472" class="body white">register → repair / retire</text>
  <text x="670" y="495" class="tiny" fill="#B9F3FA">Fail closed when identity or proof fails</text>

  <rect x="366" y="546" width="528" height="132" rx="14" fill="#FFF7ED" stroke="#ED6609" stroke-width="2"/>
  <text x="390" y="578" class="eyebrow orange">CAPABILITY-SCOPED PROVIDER PROJECTION</text>
  <text x="390" y="610" class="body">One managed provider per successful capability deployment</text>
  <text x="390" y="637" class="small muted">Registration never selects or overwrites the user's provider choice.</text>
  <text x="390" y="660" class="tiny muted">Only verified provider metadata crosses back into desktop state.</text>

  <!-- Private SSH target -->
  <rect x="984" y="112" width="568" height="348" rx="22" fill="#18181D" stroke="#CC2A31" stroke-width="2.5"/>
  <rect x="1018" y="144" width="500" height="54" rx="12" fill="#25252B"/>
  <circle cx="1045" cy="171" r="18" fill="#CC2A31"/>
  <text x="1045" y="177" class="label white" text-anchor="middle">3</text>
  <text x="1076" y="168" class="eyebrow white">PRIVATE SSH · LINUX RADEON TARGET</text>
  <text x="1076" y="188" class="tiny" fill="#F4A2A6">Confirmed remote server · not a same-PC or offline claim</text>

  <rect x="1018" y="222" width="150" height="98" rx="12" fill="#FFFDF8"/>
  <text x="1040" y="251" class="eyebrow orange">CHAT</text>
  <text x="1040" y="279" class="body">Qwen3.5 9B</text>
  <text x="1040" y="302" class="body">Qwen3.5 4B</text>

  <rect x="1184" y="222" width="150" height="98" rx="12" fill="#FFFDF8"/>
  <text x="1206" y="251" class="eyebrow orange">EMBEDDING</text>
  <text x="1206" y="279" class="body">BGE-M3</text>
  <text x="1206" y="302" class="small muted">1024-d vectors</text>

  <rect x="1350" y="222" width="168" height="98" rx="12" fill="#FFFDF8"/>
  <text x="1372" y="251" class="eyebrow orange">PAGE OCR</text>
  <text x="1372" y="279" class="body">RapidOCR</text>
  <text x="1372" y="302" class="small muted">PP-OCRv6</text>

  <rect x="1018" y="344" width="500" height="78" rx="12" fill="#301B1D" stroke="#CC2A31"/>
  <text x="1042" y="374" class="eyebrow" fill="#F4A2A6">EXACT ACCEPTED CELL</text>
  <text x="1042" y="404" class="title white">gfx1100 <tspan class="orange">/</tspan> ROCm 7.2.1</text>
  <text x="1492" y="390" class="tiny white" text-anchor="end">manifest + real workload self-test</text>

  <!-- Distinct Local WSL path -->
  <rect x="984" y="500" width="568" height="216" rx="22" fill="#EDF9FA" stroke="#15AABF" stroke-width="2.5" stroke-dasharray="10 8"/>
  <text x="1018" y="537" class="eyebrow cyan">DISTINCT LOCAL WSL PATH · THIS PC (WSL2)</text>
  <text x="1018" y="571" class="body">Explicitly selected existing distribution; direct Windows-to-WSL2 path.</text>
  <text x="1018" y="598" class="small muted">No SSH host, identity file, or server-key trust flow.</text>
  <rect x="1018" y="624" width="500" height="58" rx="10" fill="#D9F1F4"/>
  <text x="1040" y="650" class="eyebrow red">EVIDENCE BOUNDARY</text>
  <text x="1040" y="672" class="small">No accepted Local WSL hardware and no generic Radeon support claim.</text>

  <!-- Connectors -->
  <path d="M286 220H350" fill="none" stroke="#ED6609" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <text x="319" y="207" class="tiny orange" text-anchor="middle">input</text>

  <path d="M614 432H634" fill="none" stroke="#ED6609" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <path d="M770 326V344" fill="none" stroke="#ED6609" stroke-width="4" marker-end="url(#arrow-orange)"/>

  <path d="M894 410H952V286H974" fill="none" stroke="#ED6609" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <rect x="917" y="324" width="111" height="44" rx="9" fill="#FFFDF8" stroke="#ED6609"/>
  <text x="972" y="342" class="tiny orange" text-anchor="middle">pinned host key</text>
  <text x="972" y="358" class="tiny orange" text-anchor="middle">key-based SSH</text>

  <path d="M894 456H950V590H974" fill="none" stroke="#15AABF" stroke-width="3.5" stroke-dasharray="9 7" marker-end="url(#arrow-cyan)"/>
  <text x="946" y="563" class="tiny cyan" text-anchor="end">separate route</text>

  <path d="M984 436H948V610H904" fill="none" stroke="#ED6609" stroke-width="3.5" stroke-dasharray="8 6" marker-end="url(#arrow-orange)"/>
  <text x="950" y="487" class="tiny orange" text-anchor="end">verified endpoint</text>

  <path d="M630 546V326" fill="none" stroke="#242429" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow-orange)"/>
  <text x="618" y="534" class="tiny muted" text-anchor="end">selected provider</text>

  <path d="M366 614H304V624H296" fill="none" stroke="#ED6609" stroke-width="4" marker-end="url(#arrow-orange)"/>

  <!-- Boundary legend -->
  <line x1="54" y1="762" x2="108" y2="762" stroke="#ED6609" stroke-width="4"/>
  <text x="120" y="768" class="small">verified capability path</text>
  <line x1="342" y1="762" x2="396" y2="762" stroke="#15AABF" stroke-width="3" stroke-dasharray="9 7"/>
  <text x="408" y="768" class="small">distinct, independently admitted path</text>
  <text x="1548" y="768" class="small muted" text-anchor="end">Secrets and live process facts remain session-local · provider choice remains user-owned</text>
</svg>
