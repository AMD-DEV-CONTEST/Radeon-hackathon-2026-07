<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">PrivateOps Agent architecture</title>
  <desc id="desc">A browser trust console sends requests to an auditable Agent core connected to local evidence, guarded tools, memory, audit, benchmark storage, and a loopback ROCm model server.</desc>
  <defs>
    <style>
      .bg{fill:#0b0e14}.panel{fill:#151a24;stroke:#343c4d;stroke-width:2}.accent{fill:#ff5b35}.green{fill:#6fe2ac}.blue{fill:#76b7ff}.text{fill:#f3f0e8;font:700 24px Arial}.small{fill:#9aa2b2;font:18px Arial}.label{fill:#ff5b35;font:700 16px Arial;letter-spacing:2px}.line{stroke:#596579;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#596579"/></marker>
  </defs>
  <rect class="bg" width="1400" height="820" rx="28"/>
  <text x="70" y="70" class="label">PRIVATEOPS AGENT · PERMISSION-FIRST ARCHITECTURE</text>
  <rect x="70" y="125" width="270" height="560" rx="20" class="panel"/>
  <circle cx="112" cy="175" r="12" class="accent"/><text x="140" y="184" class="text">Trust Console</text>
  <text x="105" y="235" class="small">Conversation</text><text x="105" y="285" class="small">Evidence</text><text x="105" y="335" class="small">Visible plan</text><text x="105" y="385" class="small">Permission gate</text><text x="105" y="435" class="small">Audit ledger</text><text x="105" y="485" class="small">Radeon proof</text>
  <rect x="440" y="125" width="420" height="560" rx="20" class="panel"/>
  <circle cx="482" cy="175" r="12" class="green"/><text x="510" y="184" class="text">Permission Kernel</text>
  <rect x="485" y="225" width="330" height="70" rx="12" fill="#202735"/><text x="515" y="268" class="small">1 · Safe / confirm / blocked</text>
  <rect x="485" y="315" width="330" height="70" rx="12" fill="#202735"/><text x="515" y="358" class="small">2 · Evidence retrieval</text>
  <rect x="485" y="405" width="330" height="70" rx="12" fill="#202735"/><text x="515" y="448" class="small">3 · Plan + guarded tools</text>
  <rect x="485" y="495" width="330" height="70" rx="12" fill="#202735"/><text x="515" y="538" class="small">4 · Local model synthesis</text>
  <rect x="485" y="585" width="330" height="60" rx="12" fill="#2e1a17"/><text x="515" y="622" class="small">5 · Append audit evidence</text>
  <rect x="965" y="125" width="365" height="110" rx="18" class="panel"/><circle cx="1005" cy="165" r="9" class="blue"/><text x="1030" y="174" class="text">Local Knowledge</text><text x="1005" y="210" class="small">Files · chunks · stable evidence IDs</text>
  <rect x="965" y="260" width="365" height="110" rx="18" class="panel"/><circle cx="1005" cy="300" r="9" class="green"/><text x="1030" y="309" class="text">Guarded Tools</text><text x="1005" y="345" class="small">Confined · allow-listed · confirmed</text>
  <rect x="965" y="395" width="365" height="110" rx="18" class="panel"/><circle cx="1005" cy="435" r="9" class="accent"/><text x="1030" y="444" class="text">Local State</text><text x="1005" y="480" class="small">Memory · JSONL audit · benchmarks</text>
  <rect x="965" y="530" width="365" height="155" rx="18" fill="#241713" stroke="#713326" stroke-width="2"/><text x="1005" y="575" class="label">COMPETITION MODE</text><text x="1005" y="615" class="text">Radeon + ROCm</text><text x="1005" y="650" class="small">Loopback vLLM model server</text>
  <path d="M340 405 H425" class="line"/><path d="M860 270 H950" class="line"/><path d="M860 360 H950" class="line"/><path d="M860 450 H950" class="line"/><path d="M860 575 H950" class="line"/>
  <text x="70" y="755" class="small">Only same-instance loopback ROCm is competition-eligible. Shared APIs remain development-only.</text>
</svg>
