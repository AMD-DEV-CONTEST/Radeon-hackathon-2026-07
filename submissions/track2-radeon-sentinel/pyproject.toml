[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radeon-sentinel"
version = "0.1.0"
description = "Privacy-first local incident-response agent for AMD Radeon GPUs"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Yichun Deng" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
demo = ["gradio>=4.44,<6"]
dev = ["pytest>=8,<9"]

[project.scripts]
radeon-sentinel = "radeon_sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
