[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "policyseal"
version = "0.1.0"
description = "Local minimum-disclosure policy agent for enterprise documents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "PolicySeal Team" }]
dependencies = [
  "fastembed>=0.7",
  "fastapi>=0.116",
  "httpx>=0.28",
  "jinja2>=3.1",
  "langgraph>=0.6",
  "openpyxl>=3.1",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "pymupdf>=1.26",
  "python-docx>=1.2",
  "python-multipart>=0.0.20",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.35",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17",
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "ruff>=0.12",
  "types-pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/policyseal"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["policyseal"]
mypy_path = "src"
