<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1228" />
      <stop offset="100%" stop-color="#16213f" />
    </linearGradient>
    <style>
      .title { font: 700 44px Arial, sans-serif; fill: #ffffff; }
      .subtitle { font: 400 19px Arial, sans-serif; fill: #dbeafe; }
      .section { font: 700 26px Arial, sans-serif; fill: #93c5fd; }
      .body { font: 400 20px Arial, sans-serif; fill: #e5e7eb; }
      .small { font: 400 17px Arial, sans-serif; fill: #cbd5e1; }
      .xsmall { font: 400 15px Arial, sans-serif; fill: #cbd5e1; }
      .pill { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .white { fill: #ffffff; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)" />

  <!-- ===== HEADER: card tall enough for 3 subtitle lines + no overlap with first panel row
       Row1 panels moved down to y=210 (vs 180) -->
  <rect x="40" y="32" width="1520" height="160" rx="28" fill="#081122" opacity="0.75" />
  <text x="78" y="88" class="title">Video Voice Translator</text>
  <text x="78" y="122" class="subtitle">Track 1 Submission | 2026 AMD AI DevMaster Hackathon</text>
  <text x="78" y="150" class="subtitle">An AMD-oriented English/Chinese video dubbing workflow with ASR, LLM translation, voice cloning, and history replay.</text>

  <rect x="1176" y="52" width="344" height="44" rx="22" fill="#facc15" />
  <text x="1206" y="80" class="pill">AMD Radeon / ROCm Ready</text>

  <!-- ===== ROW 1 (Problem, Solution, Target Users): y=210 (gap 18 vs old 180, so no header touch) ===== -->
  <rect x="50"  y="210" width="480" height="278" rx="26" fill="url(#panel)" stroke="#60a5fa" stroke-width="2" />
  <text x="82" y="258" class="section">Problem</text>
  <text x="82" y="298" class="body">Creators often need multiple manual steps</text>
  <text x="82" y="324" class="body">to localize a video:</text>
  <text x="100" y="362" class="small">- transcription</text>
  <text x="100" y="388" class="small">- translation</text>
  <text x="100" y="414" class="small">- voice-over recording</text>
  <text x="100" y="440" class="small">- timing adjustment</text>
  <text x="100" y="466" class="small">- final rendering</text>

  <rect x="560" y="210" width="480" height="278" rx="26" fill="url(#panel)" stroke="#60a5fa" stroke-width="2" />
  <text x="592" y="258" class="section">Solution</text>
  <text x="592" y="298" class="body">A unified workflow that turns a single</text>
  <text x="592" y="324" class="body">source video into a translated dubbed output.</text>
  <text x="612" y="362" class="small">1. upload media</text>
  <text x="612" y="388" class="small">2. recognize speech</text>
  <text x="612" y="414" class="small">3. translate transcript</text>
  <text x="612" y="440" class="small">4. clone speaker voice</text>
  <text x="612" y="466" class="small">5. synthesize final video</text>

  <rect x="1070" y="210" width="480" height="278" rx="26" fill="url(#panel)" stroke="#60a5fa" stroke-width="2" />
  <text x="1102" y="258" class="section">Target Users</text>
  <text x="1102" y="296" class="small">- short-video creators</text>
  <text x="1102" y="322" class="small">- educators and trainers</text>
  <text x="1102" y="348" class="small">- bilingual media teams</text>
  <text x="1102" y="374" class="small">- developer marketing teams</text>
  <text x="1102" y="422" class="body">Main scenario:</text>
  <text x="1102" y="450" class="small">English &#8596; Chinese content localization</text>

  <!-- ===== ROW 2 (Pipeline, AMD Opt, Demo): y=514, h=360, bottom=874 margin 26 to viewport 900 ===== -->
  <rect x="50"  y="514" width="700" height="360" rx="26" fill="url(#panel)" stroke="#60a5fa" stroke-width="2" />
  <text x="82" y="562" class="section">Pipeline and Stack</text>
  <text x="82" y="604" class="small">Audio extraction &#8594; Vocal separation &#8594; ASR &#8594; LLM translation</text>
  <text x="82" y="628" class="small">&#8594; Reference audio extraction &#8594; IndexTTS2 voice cloning</text>
  <text x="82" y="652" class="small">&#8594; Audio merge &#8594; Final video synthesis</text>
  <!-- Label row 1 -->
  <text x="82"  y="708" class="body">Frontend:</text>
  <text x="220" y="708" class="small">React + TypeScript + Vite</text>
  <!-- Label row 2 -->
  <text x="82"  y="740" class="body">Backend:</text>
  <text x="220" y="740" class="small">FastAPI + worker process</text>
  <!-- Label row 3 / Value 2-lines all guaranteed end at x=688, y=852 inside panel (700 514..874 width700 box right=750-->
  <text x="82"  y="784" class="body">Media/Models:</text>
  <text x="220" y="784" class="xsmall">FFmpeg, Whisper, DeepSeek-V4-Flash</text>
  <text x="220" y="806" class="xsmall">(OpenAI-compatible), IndexTTS2</text>

  <rect x="780" y="514" width="370" height="360" rx="26" fill="url(#panel)" stroke="#60a5fa" stroke-width="2" />
  <text x="812" y="562" class="section">AMD Optimization</text>
  <text x="812" y="604" class="small">- native whisper as default on ROCm</text>
  <text x="812" y="630" class="small">- FP16 enabled for voice cloning</text>
  <text x="812" y="656" class="small">- CUDA-only kernels disabled</text>
  <text x="812" y="682" class="small">- install script prepares ROCm PyTorch</text>
  <text x="812" y="708" class="small">- worker-based task isolation for stability</text>
  <text x="812" y="790" class="body">Deliverable focus:</text>
  <text x="812" y="820" class="xsmall">practical demo workflow on AMD hardware</text>

  <rect x="1170" y="514" width="380" height="360" rx="26" fill="url(#panel)" stroke="#60a5fa" stroke-width="2" />
  <text x="1202" y="562" class="section">Demo Highlights</text>
  <text x="1202" y="604" class="small">- Web UI upload and translation flow</text>
  <text x="1202" y="630" class="small">- progress reporting across major steps</text>
  <text x="1202" y="656" class="small">- reopen completed jobs from history</text>
  <text x="1202" y="682" class="small">- output video replay in browser</text>
  <text x="1202" y="740" class="body">Artifacts in repo:</text>
  <text x="1202" y="772" class="small">README_EN.md</text>
  <text x="1202" y="796" class="small">track1-project-profile.pdf</text>
  <text x="1202" y="820" class="small">data/demo/demo.mp4</text>
</svg>
