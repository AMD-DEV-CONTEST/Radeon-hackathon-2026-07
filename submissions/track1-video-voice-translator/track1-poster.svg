<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1228" />
      <stop offset="100%" stop-color="#16213f" />
    </linearGradient>
    <style>
      .title { font: 700 44px Arial, sans-serif; fill: #ffffff; }
      .subtitle { font: 400 20px Arial, sans-serif; fill: #dbeafe; }
      .section { font: 700 26px Arial, sans-serif; fill: #93c5fd; }
      .body { font: 400 20px Arial, sans-serif; fill: #e5e7eb; }
      .small { font: 400 18px Arial, sans-serif; fill: #cbd5e1; }
      .pill { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .white { fill: #ffffff; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)" />

  <rect x="40" y="36" width="1520" height="110" rx="28" fill="#081122" opacity="0.72" />
  <text x="80" y="92" class="title">Video Voice Translator</text>
  <text x="80" y="126" class="subtitle">Track 1 Submission | 2026 AMD AI DevMaster Hackathon</text>
  <text x="80" y="156" class="subtitle">An AMD-oriented English/Chinese video dubbing workflow with ASR, LLM translation, voice cloning, and history replay.</text>

  <rect x="1180" y="56" width="320" height="44" rx="22" fill="#facc15" />
  <text x="1210" y="84" class="pill">AMD Radeon / ROCm Ready</text>

  <rect x="50" y="180" width="470" height="300" rx="26" fill="url(#panel)" stroke="#60a5fa" stroke-width="2" />
  <text x="82" y="230" class="section">Problem</text>
  <text x="82" y="276" class="body">Creators often need multiple manual steps</text>
  <text x="82" y="306" class="body">to localize a video:</text>
  <text x="102" y="348" class="small">- transcription</text>
  <text x="102" y="378" class="small">- translation</text>
  <text x="102" y="408" class="small">- voice-over recording</text>
  <text x="102" y="438" class="small">- timing adjustment</text>
  <text x="102" y="468" class="small">- final rendering</text>

  <rect x="565" y="180" width="470" height="300" rx="26" fill="url(#panel)" stroke="#60a5fa" stroke-width="2" />
  <text x="597" y="230" class="section">Solution</text>
  <text x="597" y="276" class="body">A unified workflow that turns a single</text>
  <text x="597" y="306" class="body">source video into a translated dubbed output.</text>
  <text x="617" y="348" class="small">1. upload media</text>
  <text x="617" y="378" class="small">2. recognize speech</text>
  <text x="617" y="408" class="small">3. translate transcript</text>
  <text x="617" y="438" class="small">4. clone speaker voice</text>
  <text x="617" y="468" class="small">5. synthesize final video</text>

  <rect x="1080" y="180" width="470" height="300" rx="26" fill="url(#panel)" stroke="#60a5fa" stroke-width="2" />
  <text x="1112" y="230" class="section">Target Users</text>
  <text x="1112" y="276" class="small">- short-video creators</text>
  <text x="1112" y="306" class="small">- educators and trainers</text>
  <text x="1112" y="336" class="small">- bilingual media teams</text>
  <text x="1112" y="366" class="small">- developer marketing teams</text>
  <text x="1112" y="420" class="body">Main scenario:</text>
  <text x="1112" y="452" class="small">English ↔ Chinese content localization</text>

  <rect x="50" y="520" width="700" height="320" rx="26" fill="url(#panel)" stroke="#60a5fa" stroke-width="2" />
  <text x="82" y="570" class="section">Pipeline and Stack</text>
  <text x="82" y="618" class="small">Audio extraction -> Vocal separation -> ASR -> LLM translation</text>
  <text x="82" y="648" class="small">-> Reference audio extraction -> IndexTTS2 voice cloning</text>
  <text x="82" y="678" class="small">-> Audio merge -> Final video synthesis</text>
  <text x="82" y="728" class="body">Frontend:</text>
  <text x="210" y="728" class="small">React + TypeScript + Vite</text>
  <text x="82" y="760" class="body">Backend:</text>
  <text x="210" y="760" class="small">FastAPI + worker process</text>
  <text x="82" y="792" class="body">Media/Models:</text>
  <text x="210" y="792" class="small">FFmpeg, Whisper, DeepSeek-V4-Flash (OpenAI-compatible), IndexTTS2</text>

  <rect x="785" y="520" width="365" height="320" rx="26" fill="url(#panel)" stroke="#60a5fa" stroke-width="2" />
  <text x="817" y="570" class="section">AMD Optimization</text>
  <text x="817" y="618" class="small">- native whisper as default on ROCm</text>
  <text x="817" y="650" class="small">- FP16 enabled for voice cloning</text>
  <text x="817" y="682" class="small">- CUDA-only kernels disabled</text>
  <text x="817" y="714" class="small">- install script prepares ROCm PyTorch</text>
  <text x="817" y="746" class="small">- worker-based task isolation for stability</text>
  <text x="817" y="798" class="body">Deliverable focus:</text>
  <text x="817" y="828" class="small">practical demo workflow on AMD hardware</text>

  <rect x="1185" y="520" width="365" height="320" rx="26" fill="url(#panel)" stroke="#60a5fa" stroke-width="2" />
  <text x="1217" y="570" class="section">Demo Highlights</text>
  <text x="1217" y="618" class="small">- Web UI upload and translation flow</text>
  <text x="1217" y="650" class="small">- progress reporting across major steps</text>
  <text x="1217" y="682" class="small">- reopen completed jobs from history</text>
  <text x="1217" y="714" class="small">- output video replay in browser</text>
  <text x="1217" y="768" class="body">Artifacts in repo:</text>
  <text x="1217" y="798" class="small">README_EN.md</text>
  <text x="1217" y="824" class="small">track1-project-profile.pdf</text>
  <text x="1217" y="850" class="small">data/demo/demo.mp4</text>
</svg>
