[loggers]
keys=root,app,error,access

[handlers]
keys=console,app_file,error_file,access_file

[formatters]
keys=detailed,simple,access

[logger_root]
level=INFO
handlers=console,app_file

[logger_app]
level=INFO
handlers=console,app_file
qualname=app
propagate=0

[logger_error]
level=ERROR
handlers=error_file
qualname=error
propagate=0

[logger_access]
level=INFO
handlers=access_file
qualname=access
propagate=0

[handler_console]
class=StreamHandler
level=INFO
formatter=simple
args=(sys.stdout,)

[handler_app_file]
class=handlers.RotatingFileHandler
level=DEBUG
formatter=detailed
args=('logs/app.log','a',10485760,5)

[handler_error_file]
class=handlers.RotatingFileHandler
level=ERROR
formatter=detailed
args=('logs/error.log','a',10485760,5)

[handler_access_file]
class=handlers.RotatingFileHandler
level=INFO
formatter=access
args=('logs/access.log','a',10485760,5)

[formatter_detailed]
format=%(asctime)s | %(levelname)-8s | %(name)s | %(message)s
datefmt=%Y-%m-%d %H:%M:%S

[formatter_simple]
format=%(asctime)s | %(levelname)-8s | %(message)s
datefmt=%H:%M:%S

[formatter_access]
format=%(asctime)s | %(message)s
datefmt=%Y-%m-%d %H:%M:%S
