[project]
name = "dukaan"
version = "0.1.0"
description = "One product photo in, a shop's worth of ready-to-post creatives out. Runs on AMD Radeon via ROCm."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "pillow>=10.0",
    "numpy>=1.24",
    "requests>=2.31",
    "websocket-client>=1.7",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
web = ["gradio>=4.44"]

[project.scripts]
dukaan = "dukaan.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dukaan"]
