<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>01 · Cover</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,500;1,6..72,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #FBFAF8; --ink: #1A1814; --muted: #6B6560; --rule: #E8E4DC;
    --accent: #C45C26; --ok: #2F6B4F;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); color: var(--ink);
    font-family: "Newsreader", Georgia, serif; }
  .slide { width: 1920px; height: 1080px; padding: 96px 120px; display: flex; flex-direction: column; }
  .kicker { font-family: Inter, sans-serif; font-size: 14px; font-weight: 500; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--accent); }
  .top { display: flex; justify-content: space-between; align-items: baseline; }
  h1 { margin-top: 88px; font-size: 92px; font-weight: 700; line-height: 1.06; letter-spacing: -0.02em; max-width: 14ch; }
  h1 em { font-style: italic; font-weight: 600; color: var(--accent); }
  .lede { margin-top: 44px; font-size: 28px; line-height: 1.55; color: var(--muted); max-width: 44ch; }
  .foot { margin-top: auto; padding-top: 56px; border-top: 1px solid var(--rule);
    display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 40px;
    font-family: Inter, sans-serif; font-size: 15px; color: var(--muted); }
  .foot strong { display: block; font-family: Newsreader, serif; font-size: 22px; color: var(--ink);
    font-weight: 600; margin-bottom: 8px; }
</style>
</head>
<body>
<section class="slide">
  <div class="top">
    <span class="kicker">AMD DevMaster · Track 2</span>
    <span class="kicker" style="color:var(--muted)">Private AI Agent</span>
  </div>
  <h1>拒绝<em>未验证</em>的完成叙事</h1>
  <p class="lede">Local Dev Evidence Agent（LDEA）——本地开发证据智能体。不复述聊天，只回答「到底做成了什么」。仅 status=<strong style="color:var(--ink);font-weight:600">verified</strong> 可写已完成；大模型不能自证。</p>
  <div class="foot">
    <div><strong>场景</strong>收工核验 · 空口完成 vs 证据完成</div>
    <div><strong>运行</strong>AMD Radeon + ROCm + vLLM · 127.0.0.1</div>
    <div><strong>交付</strong>CLI Agent · 账本 · 报告 · 演示视频</div>
  </div>
</section>
</body>
</html>
