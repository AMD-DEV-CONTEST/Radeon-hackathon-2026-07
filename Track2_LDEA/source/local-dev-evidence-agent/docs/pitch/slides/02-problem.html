<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>02 · Problem</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root { --paper:#FBFAF8; --ink:#1A1814; --muted:#6B6560; --rule:#E8E4DC; --accent:#C45C26; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); color: var(--ink);
    font-family: "Newsreader", Georgia, serif; }
  .slide { width: 1920px; height: 1080px; padding: 80px 120px; display: flex; flex-direction: column; }
  .kicker { font-family: Inter, sans-serif; font-size: 13px; font-weight: 500; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--accent); }
  h2 { margin-top: 20px; font-size: 52px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; max-width: 18ch; }
  .grid { margin-top: 56px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px; flex: 1; }
  .card { background: #fff; border: 1px solid var(--rule); padding: 36px 32px; display: flex; flex-direction: column; }
  .card .n { font-family: Inter, sans-serif; font-size: 12px; letter-spacing: 0.14em; color: var(--muted); font-weight: 600; }
  .card h3 { margin-top: 16px; font-size: 28px; font-weight: 600; line-height: 1.3; }
  .card p { margin-top: 18px; font-size: 20px; line-height: 1.55; color: var(--muted); }
  .pull { margin-top: auto; padding: 28px 0 0; border-top: 1px solid var(--rule);
    font-size: 26px; font-style: italic; color: var(--ink); max-width: 40ch; }
</style>
</head>
<body>
<section class="slide">
  <span class="kicker">01 · Problem</span>
  <h2>「做完了」变得廉价，却很难核验。</h2>
  <div class="grid">
    <div class="card">
      <div class="n">SIGNAL 01</div>
      <h3>模型口头「已修复」</h3>
      <p>对话里恭维式完成，没有绑定真实代码变更与测试结果。</p>
    </div>
    <div class="card">
      <div class="n">SIGNAL 02</div>
      <h3>收工空口总结</h3>
      <p>「今天都搞定了」写进日记/周报，账本上却是 claimed / abandoned。</p>
    </div>
    <div class="card">
      <div class="n">SIGNAL 03</div>
      <h3>云端 Agent 有顾虑</h3>
      <p>代码与日志不便上传公有云；需要本地私有推理与本地证据落盘。</p>
    </div>
  </div>
  <p class="pull">「差别不在文笔，在证据。」</p>
</section>
</body>
</html>
