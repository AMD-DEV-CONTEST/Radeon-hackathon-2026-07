[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "prooflaunch-agent-remix"
version = "1.0.0"
description = "Typed control plane for a Radeon-native multimodal GTM coworker"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "Pillow>=10.4,<13",
  "imageio>=2.37,<3",
  "imageio-ffmpeg>=0.6,<1",
  "numpy>=2.0,<3",
  "huggingface-hub==1.26.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "mlx==0.32.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "mlx-lm==0.31.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "transformers==5.14.1; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
social = [
  "atproto",
  "crawlee[beautifulsoup,playwright]",
  "feedparser==6.0.12",
  "gallery-dl",
  "Instaloader",
  "Mastodon.py",
  "praw",
  "yt-dlp==2026.7.4",
]
radeon = [
  "accelerate>=1.2",
  "av>=13",
  "diffusers>=0.35",
  "huggingface-hub>=0.27",
  "imageio>=2.37",
  "imageio-ffmpeg>=0.5",
  "librosa>=0.10",
  "numpy>=2.0",
  "peft>=0.14",
  "PyMuPDF>=1.24",
  "qwen-vl-utils>=0.0.14",
  "safetensors>=0.4",
  "tokenizers>=0.22,<0.23",
  "transformers>=5.5",
]

[project.scripts]
prooflaunch = "prooflaunch_remix.cli:main"
prooflaunch-mission = "prooflaunch_remix.mission_cli:main"
prooflaunch-tokenfactory = "prooflaunch_remix.tokenfactory_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prooflaunch_remix = [
  "model_registry.json",
  "model_supply_chain.json",
  "radeon_matrix_adapter.default.json",
]
