name: Feature request
description: Propose a focused capability or product improvement.
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: user_problem
    attributes:
      label: User problem
      description: Who is blocked, and what outcome do they need?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest inspectable solution.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Success evidence
      description: What test, human review, or production signal would validate it?
    validations:
      required: true
  - type: dropdown
    id: authority
    attributes:
      label: Does it affect publish, send, spend, approval, or learning promotion?
      options:
        - "No"
        - "Yes — requires security and governance review"
    validations:
      required: true
