<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- Agent box -->
  <rect x="40" y="110" width="200" height="120" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="140" y="136" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Agent</text>
  <text x="140" y="160" text-anchor="middle" font-size="11" fill="#1e40af">agent/test_agent.py</text>
  <text x="140" y="176" text-anchor="middle" font-size="11" fill="#1e40af">agent/live_demo.py</text>
  <text x="140" y="196" text-anchor="middle" font-size="10" fill="#3b82f6">sends requests,</text>
  <text x="140" y="210" text-anchor="middle" font-size="10" fill="#3b82f6">triggers scenarios</text>

  <!-- Model box -->
  <rect x="340" y="40" width="220" height="100" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="450" y="66" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">Local AI Model</text>
  <text x="450" y="88" text-anchor="middle" font-size="11" fill="#92400e">Qwen2.5-7B-Instruct via vLLM</text>
  <text x="450" y="106" text-anchor="middle" font-size="11" fill="#92400e">running on AMD Radeon GPU (ROCm)</text>
  <text x="450" y="124" text-anchor="middle" font-size="10" fill="#b45309">scripts/start_vllm.sh</text>

  <!-- ToolGuard box (outer) -->
  <rect x="340" y="180" width="320" height="230" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="500" y="204" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">ToolGuard</text>
  <text x="500" y="220" text-anchor="middle" font-size="10" fill="#166534">toolguard/</text>

  <rect x="360" y="232" width="130" height="50" rx="6" fill="#dcfce7" stroke="#22c55e"/>
  <text x="425" y="252" text-anchor="middle" font-size="11" font-weight="700" fill="#14532d">detector.py</text>
  <text x="425" y="268" text-anchor="middle" font-size="9" fill="#166534">identifies failure</text>

  <rect x="510" y="232" width="130" height="50" rx="6" fill="#dcfce7" stroke="#22c55e"/>
  <text x="575" y="252" text-anchor="middle" font-size="11" font-weight="700" fill="#14532d">fixer.py</text>
  <text x="575" y="268" text-anchor="middle" font-size="9" fill="#166534">repairs via model</text>

  <rect x="440" y="300" width="140" height="50" rx="6" fill="#bbf7d0" stroke="#15803d"/>
  <text x="510" y="320" text-anchor="middle" font-size="11" font-weight="700" fill="#052e16">guard.py</text>
  <text x="510" y="336" text-anchor="middle" font-size="9" fill="#166534">coordinates + logs</text>

  <text x="500" y="378" text-anchor="middle" font-size="9" fill="#166534">one-shot proof: toolguard/demo_guard.py</text>
  <text x="500" y="394" text-anchor="middle" font-size="9" fill="#166534">allow-list = permission control</text>

  <!-- Tools box -->
  <rect x="740" y="110" width="220" height="120" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
  <text x="850" y="136" text-anchor="middle" font-size="15" font-weight="700" fill="#831843">Tools</text>
  <text x="850" y="160" text-anchor="middle" font-size="11" fill="#9d174d">agent/fake_tools.py</text>
  <text x="850" y="180" text-anchor="middle" font-size="10" fill="#be185d">search, calculate,</text>
  <text x="850" y="196" text-anchor="middle" font-size="10" fill="#be185d">get_weather, read_file</text>

  <!-- Dashboard box -->
  <rect x="340" y="450" width="320" height="130" rx="10" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="500" y="476" text-anchor="middle" font-size="15" font-weight="700" fill="#581c87">Live Dashboard</text>
  <text x="500" y="500" text-anchor="middle" font-size="11" fill="#6b21a8">dashboard/logger.py</text>
  <text x="500" y="518" text-anchor="middle" font-size="11" fill="#6b21a8">dashboard/terminal_dashboard.py</text>
  <text x="500" y="540" text-anchor="middle" font-size="10" fill="#7e22ce">logs + displays every call</text>
  <text x="500" y="556" text-anchor="middle" font-size="10" fill="#7e22ce">(caught / fixed / normal)</text>

  <!-- One-command launcher note -->
  <rect x="40" y="450" width="260" height="130" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="170" y="474" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">scripts/</text>
  <text x="170" y="496" text-anchor="middle" font-size="10" fill="#4b5563">start_toolguard.sh - starts everything</text>
  <text x="170" y="512" text-anchor="middle" font-size="10" fill="#4b5563">stop_toolguard.sh - stops everything</text>
  <text x="170" y="528" text-anchor="middle" font-size="10" fill="#4b5563">bootstrap.sh - one-time setup</text>
  <text x="170" y="548" text-anchor="middle" font-size="9" fill="#6b7280">(one command brings the whole</text>
  <text x="170" y="562" text-anchor="middle" font-size="9" fill="#6b7280">diagram above to life)</text>

  <!-- Arrows -->
  <path d="M 240 160 L 340 160" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="290" y="152" text-anchor="middle" font-size="9" fill="#374151">request</text>

  <path d="M 450 140 L 450 180" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="470" y="164" text-anchor="middle" font-size="9" fill="#374151">response</text>

  <path d="M 490 257 L 510 257" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 425 282 L 425 300 L 440 315" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 575 282 L 575 300 L 580 315" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <path d="M 660 220 C 700 220 700 170 740 170" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="705" y="200" text-anchor="middle" font-size="9" fill="#374151">verified call</text>

  <path d="M 500 410 L 500 450" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="530" y="432" text-anchor="middle" font-size="9" fill="#374151">every outcome</text>

  <path d="M 300 500 L 340 500" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>
</svg>