[project]
name = "vulcan"
version = "0.1.0"
description = "Fully local developer-productivity agent with codebase RAG, running every token on AMD Radeon GPUs via ROCm"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
vulcan = "vulcan.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vulcan"]
