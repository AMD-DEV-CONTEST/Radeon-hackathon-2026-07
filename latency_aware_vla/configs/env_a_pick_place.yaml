# Env-A: Static kitchen pick-and-place (training + capability eval)
repo_id: local/franka-kitchen-fruit-place-120ep
n_episodes: 120
seed: 42
scene: rustic_kitchen
anchor: floor_origin
camera_layout: up_wrist
fps: 30
task: "Pick up the fruit and place it in the basket."

# Fruit spawn in robot-local frame (meters)
fruit_x_range: [0.40, 0.70]
fruit_y_range: [-0.15, 0.20]

# Fixed basket in robot-local frame (meters)
basket_local_xy: [0.48, -0.28]
basket_inner_xy: [0.12, 0.12]   # opening half-size for success check
basket_height: 0.06

# Success criteria
success_lift_m: 0.02
success_sustain_frames: 8
place_z_margin_m: 0.02
