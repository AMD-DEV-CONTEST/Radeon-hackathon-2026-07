name = "repair-loop"
description = "First response fails XML parsing; second response is valid."
repeat_last = true
default_latency_ms = 20

[[responses]]
id = "invalid-xml"
content = "<root><broken></root>"

[responses.usage]
prompt_tokens = 10000
completion_tokens = 100

[[responses]]
id = "repaired-ksml"
content_file = "../fixtures/valid-model.xml"

[responses.usage]
prompt_tokens = 14000
completion_tokens = 1500
