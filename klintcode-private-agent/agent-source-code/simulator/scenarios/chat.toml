name = "lightweight-chat"
description = "Reusable conversational response for testing TUI input routing without an LLM service."
repeat_last = true
default_latency_ms = 5

[[responses]]
id = "klint-identity"
when_contains = "You are Klint"
content = "I am Klint, an isolated-environment coding agent built by TeaQL."

[responses.usage]
prompt_tokens = 80
completion_tokens = 18
total_tokens = 98
