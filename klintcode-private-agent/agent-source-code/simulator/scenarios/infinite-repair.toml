name = "infinite-repair"
description = "Always returns an invalid domain XML to simulate the LLM not fixing it."
repeat_last = true
default_latency_ms = 20

[[responses]]
id = "invalid-domain-xml"
content = """<department org="example" _module="main">
</department>"""

[responses.usage]
prompt_tokens = 10000
completion_tokens = 410
