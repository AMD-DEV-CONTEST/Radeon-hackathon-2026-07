# KlintCode in-process simulator profile.
# No model HTTP service is contacted while simulator.enabled is true.

[model]
name = "klintcode-simulator"
endpoint_env = "KLINTCODE_UNUSED_SIMULATOR_ENDPOINT"
default_endpoint = "simulator://in-process"
api_path = "/v1/chat/completions"

[context]
model_context_tokens = 65536
max_prompt_tokens = 48000
max_completion_tokens = 4096
safety_tokens = 8192

[sampling]
temperature = 0.0
top_p = 1.0

[thinking]
enabled = false

[concurrency]
max_in_flight = 1

[timeouts]
health_secs = 1
model_secs = 10
domain_validation_secs = 120
build_secs = 300
test_secs = 300
cancel_grace_secs = 1

[run]
max_repairs = 5
retry_http_4xx = false
retry_http_5xx_count = 0
diagnostic_character_limit = 12000

[prompt]
max_system_prompt_tokens = 2000

[simulator]
enabled = true
scenario = "simulator/scenarios/happy-path.toml"
