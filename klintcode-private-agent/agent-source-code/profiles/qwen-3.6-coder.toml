# Qwen3.6-Coder-35B-A3B-FP8 Profile (DGX Spark)
# This profile targets the Qwen3.6-Coder-35B-A3B-FP8 model deployed on DGX Spark.

[model]
name = "qwen3.6-coder"
endpoint_env = "DGX_AGENT_BASE_URL"
default_endpoint = "http://222.128.77.232:30704"
api_path = "/v1/chat/completions"

[context]
model_context_tokens = 65536
max_prompt_tokens = 48000
max_completion_tokens = 4096
safety_tokens = 8192
# Agent usable limit = 48000 + 4096 + 8192 = 60288

[sampling]
temperature = 0.0
top_p = 1.0

[thinking]
enabled = false

[concurrency]
max_in_flight = 1

[timeouts]
health_secs = 10
model_secs = 300
domain_validation_secs = 120
build_secs = 300
test_secs = 300
cancel_grace_secs = 2

[run]
max_repairs = 1
retry_http_4xx = false
retry_http_5xx_count = 1
diagnostic_character_limit = 12000

[prompt]
max_system_prompt_tokens = 2000
