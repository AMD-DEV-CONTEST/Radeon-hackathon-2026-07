[model]
name = "z-ai/glm-5.2"
endpoint_env = "KLINTCODE_BASE_URL"
default_endpoint = "https://integrate.api.nvidia.com/v1"
api_path = "/chat/completions"
api_key_env = "NVIDIA_API_KEY"

[context]
model_context_tokens = 524288
max_prompt_tokens = 400000
max_completion_tokens = 8192
safety_tokens = 16384

[sampling]
temperature = 0.0
top_p = 1.0

[thinking]
enabled = false

[concurrency]
max_in_flight = 1

[timeouts]
health_secs = 10
model_secs = 300
domain_validation_secs = 120
build_secs = 300
test_secs = 300
cancel_grace_secs = 2

[run]
max_repairs = 5
retry_http_4xx = false
retry_http_5xx_count = 10
diagnostic_character_limit = 12000

[prompt]
max_system_prompt_tokens = 2000
