# MiMo v2.5 Pro Model Profile (Xiaomi Cloud API)
# Used for testing the agentic build pipeline with tool calling.

[model]
name = "mimo-v2.5-pro"
endpoint_env = "MIMO_BASE_URL"
default_endpoint = "https://token-plan-cn.xiaomimimo.com"
api_path = "/v1/chat/completions"
api_key_env = "MIMO_API_KEY"

[context]
model_context_tokens = 131072
max_prompt_tokens = 80000
max_completion_tokens = 32768
safety_tokens = 8192

[sampling]
temperature = 0.0
top_p = 1.0

[thinking]
enabled = true
# MiMo v2.5 Pro has native reasoning/thinking support

[concurrency]
max_in_flight = 1

[timeouts]
health_secs = 10
model_secs = 300
domain_validation_secs = 120
build_secs = 600
test_secs = 300
cancel_grace_secs = 2

[run]
max_repairs = 2
retry_http_4xx = false
retry_http_5xx_count = 1
diagnostic_character_limit = 12000

[prompt]
max_system_prompt_tokens = 4000
