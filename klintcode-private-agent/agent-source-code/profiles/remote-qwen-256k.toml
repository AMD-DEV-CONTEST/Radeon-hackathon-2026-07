[model]
name = "qwen3.6-35b-a3b-q4_k_m"
endpoint_env = "REMOTE_API_KEY"
default_endpoint = "http://api.doublechaintech.com:20001/v1"
api_path = "/chat/completions"
api_key_env = "LOCAL_API_KEY"

[context]
model_context_tokens = 262144
max_prompt_tokens = 200000
max_completion_tokens = 16384
safety_tokens = 32768

[sampling]
temperature = 0.0
top_p = 1.0

[thinking]
enabled = false

[concurrency]
max_in_flight = 1

[timeouts]
health_secs = 10
model_secs = 600
domain_validation_secs = 120
build_secs = 300
test_secs = 300
cancel_grace_secs = 2

[run]
max_repairs = 5
retry_http_4xx = false
retry_http_5xx_count = 10
diagnostic_character_limit = 24000

[prompt]
max_system_prompt_tokens = 2000
