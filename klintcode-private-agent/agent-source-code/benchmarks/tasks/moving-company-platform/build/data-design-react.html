    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const data = window.domainData;

        const WordCloud = ({ tables }) => {
            const chartRef = useRef(null);

            useEffect(() => {
                if (!chartRef.current) return;
                const myChart = echarts.init(chartRef.current);

                const cloudData = tables.map(t => ({
                    name: t.conceptName,
                    value: t.relationCount > 0 ? t.relationCount * 20 : 10
                }));

                const option = {
                    tooltip: { show: true },
                    series: [{
                        type: 'wordCloud',
                        shape: 'circle',
                        left: 'center',
                        top: 'center',
                        width: '100%',
                        height: '100%',
                        sizeRange: [14, 60],
                        rotationRange: [-45, 90],
                        gridSize: 8,
                        textStyle: {
                            fontFamily: 'sans-serif',
                            fontWeight: 'bold',
                            color: function () {
                                return 'rgb(' + [
                                    Math.round(Math.random() * 160),
                                    Math.round(Math.random() * 160),
                                    Math.round(Math.random() * 160)
                                ].join(',') + ')';
                            }
                        },
                        emphasis: {
                            focus: 'self',
                            textStyle: {
                                textShadowBlur: 10,
                                textShadowColor: '#333'
                            }
                        },
                        data: cloudData
                    }]
                };

                myChart.setOption(option);

                const handleResize = () => myChart.resize();
                window.addEventListener('resize', handleResize);
                return () => {
                    window.removeEventListener('resize', handleResize);
                    myChart.dispose();
                };
            }, [tables]);

            return <div ref={chartRef} style={{ width: '100%', height: '400px' }}></div>;
        };

        const Sidebar = () => (
            <div className="col-md-3 col-lg-2 d-md-block sidebar nav-sidebar p-3 border-end">
                <h5 className="mb-3 text-primary border-bottom pb-2">Tables Index</h5>
                <div className="list-group list-group-flush">
                    {data.tables.map((t, idx) => (
                        <a key={t.name} href={`#Table-${t.name}`} className="list-group-item list-group-item-action text-truncate py-2 border-0">
                            <small>{idx + 1}. {t.name}</small>
                        </a>
                    ))}
                </div>
            </div>
        );

        const TableIndex = () => (
            <div className="table-wrap page-break">
                <h3 className="mb-4 text-primary">Tables Index</h3>
                <table className="table table-bordered table-hover">
                    <thead>
                        <tr><th>#</th><th>Table Name</th><th>Columns</th><th>Relations</th></tr>
                    </thead>
                    <tbody>
                        {data.tables.map((t, idx) => (
                            <tr key={t.name}>
                                <td>{idx + 1}</td>
                                <td><a href={`#Table-${t.name}`} className="text-decoration-none">{t.name}</a></td>
                                <td>{t.columns.length}</td>
                                <td>{t.relationCount}</td>
                            </tr>
                        ))}
                    </tbody>
                </table>
            </div>
        );

        const TableDetail = ({ t, idx }) => (
            <div id={`Table-${t.name}`} className="table-wrap page-break">
                <h3 className="mb-4 text-primary">{idx + 1}. Table: {t.name}</h3>

                <h5 className="mt-4 text-secondary">Columns</h5>
                <table className="table table-bordered table-sm table-striped">
                    <thead>
                        <tr><th width="5%">#</th><th width="20%">Column Name</th><th width="25%">Name</th><th width="25%">Type</th><th width="25%">Sample</th></tr>
                    </thead>
                    <tbody>
                        {t.columns.map((c, i) => (
                            <tr key={c.sqlName}>
                                <td>{i + 1}</td>
                                <td>{c.sqlName}</td>
                                <td>{c.name}</td>
                                <td><span className="type-code">{c.type}</span></td>
                                <td>{c.sample}</td>
                            </tr>
                        ))}
                    </tbody>
                </table>

                {t.indexes && t.indexes.length > 0 && (
                    <React.Fragment>
                        <h5 className="mt-4 text-secondary">Indexes</h5>
                        <table className="table table-bordered table-sm">
                            <thead>
                                <tr><th width="5%">#</th><th>Index Name</th><th>Columns</th><th>Type</th><th>Remark</th></tr>
                            </thead>
                            <tbody>
                                {t.indexes.map((idxObj, i) => (
                                    <tr key={idxObj.name}>
                                        <td>{i + 1}</td>
                                        <td>{idxObj.name}</td>
                                        <td>{idxObj.columns}</td>
                                        <td>{idxObj.type}</td>
                                        <td>{idxObj.remark}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </React.Fragment>
                )}

                {t.constraints && t.constraints.length > 0 && (
                    <React.Fragment>
                        <h5 className="mt-4 text-secondary">Constraints</h5>
                        <table className="table table-bordered table-sm">
                            <thead>
                                <tr><th width="5%">#</th><th>Constraint</th><th>Column</th><th>Ref Table</th><th>Ref Column</th><th>Remark</th></tr>
                            </thead>
                            <tbody>
                                {t.constraints.map((c, i) => (
                                    <tr key={c.name}>
                                        <td>{i + 1}</td>
                                        <td>{c.name}</td>
                                        <td>{c.columns}</td>
                                        <td>{c.refTable}</td>
                                        <td>{c.refCols}</td>
                                        <td>{c.remark}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </React.Fragment>
                )}
            </div>
        );

        const App = () => (
            <div className="container-fluid">
                <div className="row">
                    <Sidebar />
                    <div className="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                        <div className="preface page-break">
                            <h1 className="display-4 fw-bold text-dark">{data.name}</h1>
                            <h3 className="text-muted">Database Design Document</h3>
                        </div>

                        <div className="table-wrap">
                            <h3 className="mb-4 text-primary">Summary of Concepts</h3>
                            <WordCloud tables={data.tables} />
                        </div>

                        <TableIndex />

                        <div className="mt-5">
                            {data.tables.map((t, idx) => <TableDetail key={t.name} t={t} idx={idx} />)}
                        </div>
                    </div>
                </div>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
