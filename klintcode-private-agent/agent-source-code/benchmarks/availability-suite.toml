# KlintCode Model Availability Evaluation Suite
# Tests nemotron-3-super on core Coding Agent workflows

[suite]
name = "availability-eval"
description = "KlintCode model availability evaluation"
version = "1.0"

[[cases]]
name = "simple-greeting"
task = "tasks/simple-greeting"
workflow = "ksml-modeling"
expect = "completed"
timeout_secs = 600

[[cases]]
name = "school-service-3obj"
task = "tasks/school-service"
workflow = "ksml-modeling"
expect = "completed"
timeout_secs = 600

[[cases]]
name = "context-overflow-reject"
task = "tasks/context-overflow-test"
workflow = "ksml-modeling"
expect = "preflight_rejected"
timeout_secs = 30

[[cases]]
name = "moving-company-10obj"
task = "tasks/moving-company-10obj"
workflow = "ksml-modeling"
expect = "completed"
timeout_secs = 600

[[cases]]
name = "moving-company-20obj"
task = "tasks/moving-company-20obj"
workflow = "ksml-modeling"
expect = "completed"
timeout_secs = 900

[[cases]]
name = "moving-company-30obj"
task = "tasks/moving-company-30obj"
workflow = "ksml-modeling"
expect = "completed"
timeout_secs = 1200

[[cases]]
name = "school-service-rust"
task = "tasks/school-service-rust"
workflow = "ksml-rust-gen"
expect = "completed"
timeout_secs = 900
build_target = "rust-lib-core"
patches = { 'rusqlite = { version = "0.32"' = 'rusqlite = { version = "0.40"' }
