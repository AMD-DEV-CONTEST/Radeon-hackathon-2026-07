<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ED1C24"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1060" height="300" fill="#ffffff"/>
  <text x="20" y="30" font-size="17" font-weight="700" fill="#16181d">End-to-end pipeline — URL in, distribution package out</text>
  <text x="20" y="50" font-size="11" fill="#5b6472">single local process · durable job queue · restart-resumable · zero cloud</text>

  <g font-size="11">
    <g>
      <rect x="20" y="80" width="130" height="74" rx="10" fill="#f5f6f8" stroke="#dfe3e8"/>
      <text x="32" y="102" font-weight="700" fill="#ED1C24">1 · INGEST</text>
      <text x="32" y="120" fill="#16181d">YouTube / Rumble</text>
      <text x="32" y="136" fill="#5b6472">word-level transcript,</text>
      <text x="32" y="150" fill="#5b6472">no full download</text>
    </g>
    <g>
      <rect x="170" y="80" width="130" height="74" rx="10" fill="#f5f6f8" stroke="#dfe3e8"/>
      <text x="182" y="102" font-weight="700" fill="#ED1C24">2 · SIGNALS</text>
      <text x="182" y="120" fill="#16181d">chat velocity z≥2</text>
      <text x="182" y="136" fill="#16181d">comment clusters</text>
      <text x="182" y="150" fill="#5b6472">"clip it" · topic shifts</text>
    </g>
    <g>
      <rect x="320" y="80" width="130" height="74" rx="10" fill="#fdeeee" stroke="#ED1C24"/>
      <text x="332" y="102" font-weight="700" fill="#ED1C24">3 · LLM SCORE</text>
      <text x="332" y="120" fill="#16181d">Gemma 4 12B (ROCm)</text>
      <text x="332" y="136" fill="#5b6472">hook + self-contained</text>
      <text x="332" y="150" fill="#5b6472">60–120 s enforced</text>
    </g>
    <g>
      <rect x="470" y="80" width="130" height="74" rx="10" fill="#f5f6f8" stroke="#dfe3e8"/>
      <text x="482" y="102" font-weight="700" fill="#ED1C24">4 · BOUNDARY</text>
      <text x="482" y="120" fill="#16181d">whisper timestamps</text>
      <text x="482" y="136" fill="#5b6472">silence troughs</text>
      <text x="482" y="150" fill="#5b6472">&lt;−40 dBFS +150 ms</text>
    </g>
    <g>
      <rect x="620" y="80" width="130" height="74" rx="10" fill="#fdeeee" stroke="#ED1C24"/>
      <text x="632" y="102" font-weight="700" fill="#ED1C24">5 · REFRAME</text>
      <text x="632" y="120" fill="#16181d">VLM active speaker</text>
      <text x="632" y="136" fill="#5b6472">scene cuts + turns</text>
      <text x="632" y="150" fill="#5b6472">5-anchor crop, EMA</text>
    </g>
    <g>
      <rect x="770" y="80" width="130" height="74" rx="10" fill="#fdeeee" stroke="#ED1C24"/>
      <text x="782" y="102" font-weight="700" fill="#ED1C24">6 · RENDER</text>
      <text x="782" y="120" fill="#16181d">karaoke subtitles</text>
      <text x="782" y="136" fill="#16181d">AMF / VAAPI encode</text>
      <text x="782" y="150" fill="#5b6472">AV1 · HEVC · H264</text>
    </g>
    <g>
      <rect x="920" y="80" width="120" height="74" rx="10" fill="#f5f6f8" stroke="#dfe3e8"/>
      <text x="932" y="102" font-weight="700" fill="#ED1C24">7 · SHIP</text>
      <text x="932" y="120" fill="#16181d">captions+hashtags</text>
      <text x="932" y="136" fill="#5b6472">webhook / LinkedIn</text>
      <text x="932" y="150" fill="#5b6472">virality score</text>
    </g>
  </g>
  <g stroke="#ED1C24" stroke-width="2" fill="none">
    <line x1="150" y1="117" x2="166" y2="117" marker-end="url(#ar)"/>
    <line x1="300" y1="117" x2="316" y2="117" marker-end="url(#ar)"/>
    <line x1="450" y1="117" x2="466" y2="117" marker-end="url(#ar)"/>
    <line x1="600" y1="117" x2="616" y2="117" marker-end="url(#ar)"/>
    <line x1="750" y1="117" x2="766" y2="117" marker-end="url(#ar)"/>
    <line x1="900" y1="117" x2="916" y2="117" marker-end="url(#ar)"/>
  </g>

  <g font-size="10.5">
    <rect x="20" y="190" width="1020" height="86" rx="10" fill="#16181d"/>
    <text x="36" y="214" fill="#ffffff" font-weight="700">AMD Radeon GPU (ROCm) — one card does everything</text>
    <text x="36" y="236" fill="#c9ced8">llama.cpp HIP: Gemma 4 chat+vision · harrier embeddings · whisper.cpp ASR</text>
    <text x="36" y="256" fill="#c9ced8">FFmpeg hardware encoders: av1_amf/hevc_amf (Windows) · av1_vaapi/hevc_vaapi (Linux) · GPU pool serialized (sem=1)</text>
  </g>
</svg>
