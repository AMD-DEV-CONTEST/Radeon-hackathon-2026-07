<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 340" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1060" height="340" fill="#ffffff"/>
  <text x="20" y="30" font-size="17" font-weight="700" fill="#16181d">Engagement signal: live-chat velocity (messages/min) → candidate windows</text>
  <text x="20" y="50" font-size="11" fill="#5b6472">60 s rolling window · 15 s step · median baseline · z ≥ 2 flags a spike · spikes seed LLM-scored candidate windows</text>

  <g transform="translate(60,70)">
    <line x1="0" y1="220" x2="960" y2="220" stroke="#dfe3e8" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="0" y2="220" stroke="#dfe3e8" stroke-width="1.5"/>
    <g font-size="10" fill="#5b6472">
      <text x="-34" y="224">0</text>
      <text x="-34" y="168">40</text>
      <text x="-34" y="113">80</text>
      <text x="-38" y="58">120</text>
      <text x="-38" y="4">160</text>
      <text x="0" y="240">0:00</text>
      <text x="228" y="240">20:00</text>
      <text x="468" y="240">40:00</text>
      <text x="708" y="240">60:00</text>
      <text x="920" y="240">80:00</text>
    </g>
    <line x1="0" y1="165" x2="960" y2="165" stroke="#5b6472" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="966" y="169" font-size="10" fill="#5b6472">median baseline</text>
    <line x1="0" y1="70" x2="960" y2="70" stroke="#ED1C24" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="966" y="74" font-size="10" fill="#ED1C24">z = 2 threshold</text>

    <rect x="300" y="0" width="70" height="220" fill="#ED1C24" opacity="0.08"/>
    <rect x="640" y="0" width="80" height="220" fill="#ED1C24" opacity="0.08"/>
    <text x="305" y="-6" font-size="10" fill="#ED1C24">clip window A</text>
    <text x="645" y="-6" font-size="10" fill="#ED1C24">clip window B</text>

    <path d="M0,170 L40,162 L80,168 L120,158 L160,166 L200,160 L240,150 L280,120 L310,40 L340,26 L370,90 L400,150 L440,162 L480,158 L520,164 L560,156 L600,148 L640,96 L680,20 L720,60 L760,140 L800,158 L840,164 L880,160 L920,166 L960,162"
      fill="none" stroke="#16181d" stroke-width="2.5"/>
    <circle cx="340" cy="26" r="5" fill="#ED1C24"/>
    <circle cx="680" cy="20" r="5" fill="#ED1C24"/>
    <text x="350" y="20" font-size="10.5" font-weight="700" fill="#ED1C24">spike z=4.1 → LLM scores the moment</text>
    <text x="690" y="14" font-size="10.5" font-weight="700" fill="#ED1C24">spike z=5.3</text>
  </g>
</svg>
