# MetaHub 主机 Nginx：仅 /deck/ 静态站，不碰 :3000 New-API
# 安装：sudo cp nginx-metahub-deck.conf /etc/nginx/sites-available/botversex-deck
#       sudo ln -sf /etc/nginx/sites-available/botversex-deck /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html;

    location /deck/ {
        alias /var/www/botversex-deck/;
        index investor-deck.html;
        try_files $uri $uri/ /deck/investor-deck.html;
    }

    location = /deck {
        return 301 /deck/investor-deck.html;
    }

    # 根路径不反代 3000，避免与 MetaHub 混用；需要时可自行加 location /
    location / {
        return 404;
    }
}
