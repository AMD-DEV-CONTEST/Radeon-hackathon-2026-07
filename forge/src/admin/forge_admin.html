<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forge 3 Fleet Administration Interface</title>
    <style>
        :root {
            --bg: #0b0f19;
            --panel: #111827;
            --border: #1f2937;
            --accent: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --purple: #a78bfa;
            --text-main: #f3f4f6;
            --text-dim: #9ca3af;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            background: var(--panel);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        header .title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 { 
            font-size: 1.1rem; 
            font-weight: 700; 
            color: var(--accent); 
            letter-spacing: 1.5px; 
        }
