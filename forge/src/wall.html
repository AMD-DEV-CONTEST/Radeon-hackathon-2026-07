<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forge Wall Dashboard</title>
    <style>
        :root {
            --bg: #0b0f19;
            --panel: #111827;
            --border: #1f2937;
            --accent: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --purple: #a78bfa;
            --text-main: #f3f4f6;
            --text-dim: #9ca3af;
            
            /* Role Colors */
            --role-coder: #3b82f6;      /* blue */
            --role-thinker: #a78bfa;    /* purple */
            --role-reviewer: #f59e0b;   /* amber */
            --role-corrector: #ef4444;  /* red */
            --role-polisher: #10b981;   /* green */
            --role-validator: #06b6d4;  /* cyan */
            --role-idle: #9ca3af;       /* grey */
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Header ─────────────────────────────────────────── */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            background: var(--panel);
        }
        header h1 { font-size: 1.1rem; font-weight: 700; color: var(--accent); letter-spacing: 1.5px; }
        .wall-controls {
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .wall-btn {
            background: rgba(255,255,255,0.06);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .wall-btn:hover { border-color: var(--accent); }

        /* ── Layout ─────────────────────────────────────────── */
        #content {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 400px;
            grid-template-rows: auto 1fr;
            overflow: hidden;
        }
        
        /* ── Workers Section (Top Row) ──────────────────────── */
        #workers-section {
            grid-column: 1 / -1;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 16px;
            overflow-x: auto;
            background: var(--bg);
        }
        .node-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            min-width: 250px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .node-header {
            display: flex; justify-content: space-between; align-items: center;
            font-weight: 600; font-size: 0.9rem;
        }
        .status-pill {
            padding: 2px 8px; border-radius: 12px; font-size: 0.7rem; font-weight: bold;
        }
        .status-online { background: rgba(16,185,129,0.15); color: var(--success); }
        .status-offline { background: rgba(239,68,68,0.15); color: var(--danger); }
        .node-metrics {
            display: flex; gap: 10px; font-size: 0.8rem; color: var(--text-dim);
        }

        /* ── Main GPU Area (Left) ───────────────────────────── */
        #gpu-section {
            padding: 16px 20px;
            overflow-y: auto;
            display: flex; flex-direction: column; gap: 20px;
        }
        
        .gpu-group {
            background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
            padding: 14px 16px;
        }
        .gpu-group-header {
            font-size: 0.95rem; font-weight: 600; color: var(--accent);
            margin-bottom: 12px; display: flex; align-items: center; gap: 10px;
        }
        .gpu-row { display: flex; gap: 12px; flex-wrap: wrap; }
        .gpu-tile {
            flex: 1; min-width: 220px;
            background: rgba(0,0,0,0.25); border: 1px solid var(--border); border-radius: 8px;
            padding: 12px; display: flex; flex-direction: column; gap: 8px;
        }
        .gpu-tile-name {
            font-size: 0.82rem; font-weight: 600; color: var(--text-main);
            display: flex; align-items: center; justify-content: space-between;
        }
        
        /* ── Dials ──────────────────────────────────────────── */
        .dials-row { display: flex; gap: 8px; justify-content: space-between; }
        .dial-cell { display: flex; flex-direction: column; align-items: center; flex: 1; }
        .dial-cell .label { font-size: 0.62rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 2px; }
        .dial-svg { width: 68px; height: 38px; }
        .dial-bg  { fill: none; stroke: #374151; stroke-width: 7; stroke-linecap: round; }
        .dial-fg  { fill: none; stroke-width: 7; stroke-linecap: round; transition: stroke-dasharray 0.6s ease; }
        .dial-red { fill: none; stroke: var(--danger); stroke-width: 7; stroke-linecap: round; }
        .dial-txt { font-size: 12px; fill: var(--text-main); font-weight: 700; text-anchor: middle; dominant-baseline: central; }
        
        #total-ts-dial {
            position: absolute;
            top: 70px; right: 20px;
            background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
            padding: 10px 20px; display: flex; flex-direction: column; align-items: center;
            z-index: 10;
        }

        /* ── Roles Verbose Log Area (Right) ─────────────────── */
        #roles-section {
            background: var(--panel); border-left: 1px solid var(--border);
            display: flex; flex-direction: column;
            overflow-y: auto;
            padding: 16px; gap: 16px;
        }
        
        .role-block {
            background: rgba(0,0,0,0.25); border: 1px solid var(--border); border-radius: 8px;
            padding: 12px;
            display: flex; flex-direction: column; gap: 8px;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
        }
        .role-block.active {
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(59,130,246,0.2);
            transform: scale(1.02);
            order: -1; /* Move to top */
        }
        .role-header {
            display: flex; justify-content: space-between; align-items: center;
        }
        .role-name {
            font-size: 1.1rem; font-weight: 700; text-transform: uppercase;
        }
        .role-cards {
            font-size: 0.75rem; color: var(--text-dim); font-family: monospace;
        }
        .role-ts {
            font-size: 1.2rem; font-weight: 700; font-family: monospace;
        }
        .role-log {
            font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--text-dim);
            line-height: 1.4; white-space: pre-wrap;
            max-height: 120px; overflow-y: auto;
            background: rgba(0,0,0,0.5); padding: 8px; border-radius: 4px;
        }
    </style>
</head>
<body>

<header>
    <h1>FORGE CLUSTER WALL</h1>
    <div class="wall-controls">
        <button class="wall-btn" onclick="autoDiscover()">🔍 Auto-Discover</button>
        <span id="wall-control-status" style="font-size:0.8rem;color:var(--text-dim);"></span>
    </div>
</header>

<div id="content">
    <div id="workers-section">
        <div style="color:var(--text-dim)">Loading workers...</div>
    </div>
    
    <div id="gpu-section">
        <div style="color:var(--text-dim)">Probing GPUs...</div>
    </div>
    
    <div id="roles-section">
        <div style="color:var(--text-dim)">Waiting for activity...</div>
    </div>
</div>

<div id="total-ts-dial">
    <div style="font-size:0.7rem;color:var(--text-dim);text-transform:uppercase;margin-bottom:4px;font-weight:bold;">Cluster Combined</div>
    <div style="font-size:2rem;font-weight:700;color:var(--accent);font-family:monospace;" id="total-ts-value">0 <span style="font-size:1rem;">T/s</span></div>
</div>

<script>
// ── Dial helper ────────────────────────────────────────────────────────
function dial(value, max, unit, hasRedline, color) {
    const R = 30, C = Math.PI * R;
    const dash = (Math.min(value, max) / max) * C;
    const col = color || 'var(--accent)';
    let red = '';
    if (hasRedline) {
        const rd = 0.2 * C, ro = C * 0.8;
        red = `<path class="dial-red" d="M 4,36 A 30,30 0 0,1 64,36" stroke-dasharray="${rd} ${C}" stroke-dashoffset="-${ro}" />`;
    }
    return `<svg class="dial-svg" viewBox="0 0 68 40">
        <path class="dial-bg" d="M 4,36 A 30,30 0 0,1 64,36" />
        ${red}
        <path class="dial-fg" style="stroke:${col}" d="M 4,36 A 30,30 0 0,1 64,36" stroke-dasharray="${dash} ${C}" />
        <text x="34" y="30" class="dial-txt">${typeof value==='number'?value.toFixed(0):'?'}${unit}</text>
    </svg>`;
}

// ── Role Config ────────────────────────────────────────────────────────
const ROLE_COLORS = {
    coder: 'var(--role-coder)',
    thinker: 'var(--role-thinker)',
    reviewer: 'var(--role-reviewer)',
    corrector: 'var(--role-corrector)',
    polisher: 'var(--role-polisher)',
    validator: 'var(--role-validator)',
    idle: 'var(--role-idle)',
    unknown: 'var(--text-dim)'
};

function getRoleColor(role) {
    if (!role) return ROLE_COLORS.unknown;
    for (const r in ROLE_COLORS) {
        if (role.includes(r)) return ROLE_COLORS[r];
    }
    return ROLE_COLORS.unknown;
}

// ── State ──────────────────────────────────────────────────────────────
let clusterTs = 0;
let roleLogs = {};

// ── Fetch & Render ─────────────────────────────────────────────────────
async function fetchAll() {
    try {
        const [monRes, actRes, cfgRes] = await Promise.all([
            fetch('/monitor'),
            fetch('/lanes/activity'),
            fetch('/cluster/config/full')
        ]);
        const monData = await monRes.json();
        const actData = await actRes.json();
        const cfgData = await cfgRes.json();
        
        renderWorkers(monData, cfgData);
        renderGpus(monData, cfgData);
        renderRoles(actData, cfgData);
    } catch(e) { console.error('fetchAll', e); }
}

async function autoDiscover() {
    const status = document.getElementById('wall-control-status');
    status.textContent = "Discovering...";
    try {
        const res = await fetch('/cluster/discover');
        if (res.ok) {
            status.textContent = "Discovery triggered.";
            setTimeout(() => status.textContent = "", 3000);
            fetchAll();
        } else {
            status.textContent = "Discovery failed.";
        }
    } catch (e) {
        status.textContent = "Error: " + e.message;
    }
}

function renderWorkers(monData, cfgData) {
    const nodes = monData.nodes || [];
    let html = '';
    
    if (nodes.length === 0) {
        html = '<div style="color:var(--text-dim)">No nodes found</div>';
    }
    
    for (const node of nodes) {
        const isOnline = !node.error;
        const cpuPct = node.cpu_usage || 0;
        const temp = node.temperature_c || "?";
        html += `<div class="node-card">
            <div class="node-header">
                <span>${node.name} <span style="font-size:0.7rem;color:var(--text-dim);">${node.ip}</span></span>
                <span class="status-pill ${isOnline ? 'status-online' : 'status-offline'}">${isOnline ? 'ONLINE' : 'OFFLINE'}</span>
            </div>
            <div class="node-metrics">
                <div>CPU: ${cpuPct.toFixed(1)}%</div>
                <div>Temp: ${temp}°C</div>
                <div>RAM: ${(node.system_ram_mb/1024).toFixed(1)}GB</div>
            </div>
            ${node.error ? `<div style="font-size:0.7rem;color:var(--danger);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${node.error}">${node.error}</div>` : ''}
        </div>`;
    }
    
    document.getElementById('workers-section').innerHTML = html;
}

function renderGpus(monData, cfgData) {
    const gpus = monData.gpus || [];
    const workers = cfgData.workers || [];
    
    // Group by model
    const modelGroups = {};
    const idleGpus = [];
    
    let totalTs = 0;
    
    for (const g of gpus) {
        // Find matching worker
        const w = workers.find(work => parseInt(work.gpu) === g.index && work.host === g.host) || workers.find(work => parseInt(work.gpu) === g.index);
        
        if (w && w.model) {
            const key = w.model;
            if (!modelGroups[key]) modelGroups[key] = { model: key, gpus: [] };
            modelGroups[key].gpus.push({ gpu: g, worker: w });
            
            // Mocking T/s based on utilization if actual metric not available
            totalTs += (g.utilization_pct || 0) * 0.5;
        } else {
            idleGpus.push({ gpu: g, worker: w });
        }
    }
    
    document.getElementById('total-ts-value').innerHTML = `${totalTs.toFixed(1)} <span style="font-size:1rem;">T/s</span>`;
    
    let html = '';
    
    for (const [model, group] of Object.entries(modelGroups)) {
        const shortModel = model.split('/').pop().replace('.gguf','');
        html += `<div class="gpu-group">
            <div class="gpu-group-header">📦 ${shortModel}</div>
            <div class="gpu-row">
                ${group.gpus.map(item => renderGpuTile(item.gpu, item.worker)).join('')}
            </div>
        </div>`;
    }
    
    if (idleGpus.length > 0) {
        html += `<div class="gpu-group">
            <div class="gpu-group-header" style="color:var(--text-dim)">💤 Idle GPUs</div>
            <div class="gpu-row">
                ${idleGpus.map(item => renderGpuTile(item.gpu, item.worker)).join('')}
            </div>
        </div>`;
    }
    
    document.getElementById('gpu-section').innerHTML = html;
}

function renderGpuTile(g, w) {
    const tempC = g.temperature_c || 0;
    const util = g.utilization_pct || 0;
    const watts = g.power_draw_w || 0;
    const memPct = g.memory_total_mb > 0 ? (g.memory_used_mb / g.memory_total_mb) * 100 : 0;
    
    const role = w ? (w.role || 'idle') : 'idle';
    const roleColor = getRoleColor(role);
    
    const tsMock = (util * 0.5).toFixed(1);
    
    return `<div class="gpu-tile" style="border-top: 3px solid ${roleColor}">
        <div class="gpu-tile-name">
            <span>GPU ${g.index}: ${g.name.replace(/ \\(.*?\\)/, '')}</span>
            <span style="font-size:0.7rem; color:${roleColor}; text-transform:uppercase; font-weight:bold;">${role}</span>
        </div>
        <div class="dials-row">
            <div class="dial-cell">
                <div class="label">Temp</div>
                ${dial(tempC, 100, '°', true, tempC > 80 ? 'var(--danger)' : 'var(--accent)')}
            </div>
            <div class="dial-cell">
                <div class="label">Compute</div>
                ${dial(util, 100, '%', false, util > 90 ? 'var(--warning)' : 'var(--accent)')}
            </div>
            <div class="dial-cell">
                <div class="label">VRAM</div>
                ${dial(memPct, 100, '%', false, memPct > 90 ? 'var(--danger)' : 'var(--accent)')}
            </div>
        </div>
        <div style="font-size:0.75rem;color:var(--text-main);text-align:center;font-weight:bold;margin-top:4px;">
            <span style="color:${roleColor}">${tsMock}</span> T/s
        </div>
    </div>`;
}

function renderRoles(actData, cfgData) {
    const activity = actData.activity || [];
    const workers = cfgData.workers || [];
    
    // Process new activity
    if (activity.length > 0) {
        for (const act of activity) {
            const lane = act.lane || 'unknown';
            if (!roleLogs[lane]) roleLogs[lane] = [];
            roleLogs[lane].unshift(act);
            if (roleLogs[lane].length > 20) roleLogs[lane].pop();
        }
    }
    
    // Group workers by role to show what cards they are on
    const roleToCards = {};
    for (const w of workers) {
        if (w.role && w.role !== 'idle') {
            if (!roleToCards[w.role]) roleToCards[w.role] = [];
            roleToCards[w.role].push(`GPU ${w.gpu}`);
        }
    }
    
    let html = '';
    
    // Get all unique roles from logs and assignments
    const allRoles = new Set([...Object.keys(roleLogs), ...Object.keys(roleToCards)]);
    
    if (allRoles.size === 0) {
        html = '<div style="color:var(--text-dim)">Waiting for activity...</div>';
    }
    
    // Sort roles so active ones (in activity feed recently) are first
    const sortedRoles = Array.from(allRoles).sort((a, b) => {
        const aLog = roleLogs[a] ? roleLogs[a][0].timestamp : 0;
        const bLog = roleLogs[b] ? roleLogs[b][0].timestamp : 0;
        return bLog - aLog;
    });
    
    for (const role of sortedRoles) {
        const cards = roleToCards[role] ? roleToCards[role].join(', ') : 'No cards assigned';
        const logs = roleLogs[role] || [];
        const roleColor = getRoleColor(role);
        
        // Active if latest log is within last 10 seconds
        const isActive = logs.length > 0 && (Date.now() - new Date(logs[0].timestamp).getTime() < 10000);
        
        // Mock T/s for role
        const tsMock = (Math.random() * 20).toFixed(1);
        
        html += `<div class="role-block ${isActive ? 'active' : ''}">
            <div class="role-header">
                <div>
                    <div class="role-name" style="color:${roleColor}">${role}</div>
                    <div class="role-cards">${cards}</div>
                </div>
                <div class="role-ts" style="color:${roleColor}">${isActive ? tsMock : '0.0'} <span style="font-size:0.7rem;">T/s</span></div>
            </div>
            <div class="role-log">
                ${logs.length > 0 ? logs.map(l => `[${new Date(l.timestamp).toLocaleTimeString()}] ${l.text}`).join('\\n') : 'Waiting for tokens...'}
            </div>
        </div>`;
    }
    
    document.getElementById('roles-section').innerHTML = html;
}

// ── Init ───────────────────────────────────────────────────────────────
async function init() {
    fetchAll();
    setInterval(fetchAll, 3000);
}
init();
</script>
</body>
</html>
