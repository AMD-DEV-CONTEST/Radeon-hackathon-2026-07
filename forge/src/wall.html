<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forge Wall Dashboard - GPU Fleet Monitor</title>
    <style>
        :root {
            --bg: #0b0f19;
            --panel: #111827;
            --border: #1f2937;
            --accent: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --purple: #a78bfa;
            --text-main: #f3f4f6;
            --text-dim: #9ca3af;
            
            --role-coder: #3b82f6;
            --role-thinker: #a78bfa;
            --role-cargo: #10b981;
            --role-validator: #06b6d4;
            --role-idle: #9ca3af;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            background: var(--panel);
        }
        header h1 { font-size: 1.1rem; font-weight: 700; color: var(--accent); letter-spacing: 1.5px; }
        .wall-controls {
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .wall-btn {
            background: rgba(255,255,255,0.06);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .wall-btn:hover { 
            border-color: var(--accent); 
            background: rgba(59,130,246,0.1);
        }

        #fleet-summary {
            font-size: 0.75rem;
            margin-left: 20px;
            padding: 4px 8px;
            background: rgba(16,185,129,0.1);
            border-radius: 4px;
            color: var(--success);
        }

        #content {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 420px;
            grid-template-rows: auto auto 1fr;
            overflow: hidden;
        }
        
        #fleet-status {
            grid-column: 1 / -1;
            padding: 12px 20px;
            background: rgba(16,185,129,0.05);
            border-bottom: 1px solid var(--border);
            font-size: 0.8rem;
            display: flex;
            gap: 30px;
        }

        #gpu-discovery {
            grid-column: 1 / -1;
            padding: 12px 20px;
            background: rgba(59,130,246,0.05);
            border-bottom: 1px solid var(--border);
            font-size: 0.8rem;
        }

        #workers-section {
            grid-column: 1 / -1;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 16px;
            overflow-x: auto;
            background: var(--bg);
        }
        .node-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            min-width: 250px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .node-header {
            display: flex; justify-content: space-between; align-items: center;
            font-weight: 600; font-size: 0.9rem;
        }
        .status-pill {
            padding: 2px 8px; border-radius: 12px; font-size: 0.7rem; font-weight: bold;
        }
        .status-online { background: rgba(16,185,129,0.15); color: var(--success); }
        .status-offline { background: rgba(239,68,68,0.15); color: var(--danger); }
        .node-metrics {
            display: flex; gap: 10px; font-size: 0.8rem; color: var(--text-dim);
        }

        #gpu-section {
            padding: 16px 20px;
            overflow-y: auto;
            display: flex; flex-direction: column; gap: 20px;
        }
        
        .gpu-group {
            background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
            padding: 14px 16px;
        }
        .gpu-group-header {
            font-size: 0.95rem; font-weight: 600; color: var(--accent);
            margin-bottom: 12px; display: flex; align-items: center; gap: 10px;
        }
        .gpu-row { display: flex; gap: 12px; flex-wrap: wrap; }
        .gpu-tile {
            flex: 1; min-width: 220px;
            background: rgba(0,0,0,0.25); border: 1px solid var(--border); border-radius: 8px;
            padding: 12px; display: flex; flex-direction: column; gap: 8px;
        }
        .gpu-tile-name {
            font-size: 0.82rem; font-weight: 600; color: var(--text-main);
            display: flex; align-items: center; justify-content: space-between;
        }
        
        .dials-row { display: flex; gap: 8px; justify-content: space-between; }
        .dial-cell { display: flex; flex-direction: column; align-items: center; flex: 1; }
        .dial-cell .label { font-size: 0.62rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 2px; }
        .dial-svg { width: 68px; height: 38px; }
        
        #total-ts-dial {
            position: absolute;
            top: 70px; right: 20px;
            background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
            padding: 10px 20px; display: flex; flex-direction: column; align-items: center;
            z-index: 10;
        }

        #roles-section {
            background: var(--panel); border-left: 1px solid var(--border);
            display: flex; flex-direction: column;
            overflow-y: auto;
            padding: 16px; gap: 16px;
        }
        
        .role-block {
            background: rgba(0,0,0,0.25); border: 1px solid var(--border); border-radius: 8px;
            padding: 12px;
            display: flex; flex-direction: column; gap: 8px;
            transition: all 0.2s;
        }
        .role-block.active {
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(59,130,246,0.2);
            background: rgba(59,130,246,0.08);
            order: -1;
        }
        .role-block.always-on {
            border-left: 3px solid var(--success);
        }
        .role-header {
            display: flex; justify-content: space-between; align-items: center;
        }
        .role-name {
            font-size: 1.1rem; font-weight: 700; text-transform: uppercase;
        }
        .role-status {
            font-size: 0.65rem; color: var(--text-dim); text-transform: uppercase;
        }
        .role-cards {
            font-size: 0.75rem; color: var(--text-dim); font-family: monospace;
        }
        .role-ts {
            font-size: 1.2rem; font-weight: 700; font-family: monospace;
        }
        .role-log {
            font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--text-dim);
            line-height: 1.4; white-space: pre-wrap;
            max-height: 120px; overflow-y: auto;
            background: rgba(0,0,0,0.5); padding: 8px; border-radius: 4px;
        }

        .alert-box {
            padding: 8px 12px;
            background: rgba(239,68,68,0.1);
            border-left: 3px solid var(--danger);
            border-radius: 4px;
            font-size: 0.75rem;
            color: var(--danger);
        }
    </style>
</head>
<body>

<header>
    <h1>FORGE CLUSTER WALL - GPU FLEET MONITOR</h1>
    <div class="wall-controls">
        <button class="wall-btn" onclick="autoDiscover()">�� Auto-Discover GPUs</button>
        <button class="wall-btn" onclick="refreshFleet()">🔄 Refresh</button>
        <button class="wall-btn" onclick="toggleMonitoring()">📊 Toggle Monitor</button>
        <span id="wall-control-status" style="font-size:0.8rem;color:var(--text-dim);"></span>
        <span id="fleet-summary" style=""></span>
    </div>
</header>

<div id="content">
    <div id="fleet-status"></div>
    <div id="gpu-discovery"></div>
    <div id="workers-section">
        <div style="color:var(--text-dim)">Loading worker nodes...</div>
    </div>
    
    <div id="gpu-section">
        <div style="color:var(--text-dim)">Probing GPUs...</div>
    </div>
    
    <div id="roles-section">
        <div style="color:var(--text-dim)">Waiting for activity...</div>
    </div>
</div>

<div id="total-ts-dial">
    <div style="font-size:0.7rem;color:var(--text-dim);text-transform:uppercase;margin-bottom:4px;font-weight:bold;">Cluster Combined</div>
    <div style="font-size:2rem;font-weight:700;color:var(--accent);font-family:monospace;" id="total-ts-value">0 <span style="font-size:1rem;">T/s</span></div>
</div>

<script>
// ── Fleet Configuration ─────────────────────────────────────────────────
const ALWAYS_ON_MODELS = {
    'Ornith-1.0-35B-Q5_K_M': {
        role: 'coder',
        gpu_target: 't440',
        status: 'always_on',
        color: 'var(--role-coder)'
    },
    'Nemotron-Ultra-4B': {
        role: 'cargo_check',
        gpu_target: 'sapphire',
        primary: 'nim_api',
        status: 'always_on_with_fallback',
        color: 'var(--role-cargo)',
        fallback_models: ['Nemotron-4B', 'Qwen2.5-14B-Q4_K_M']
    }
};

const CONDITIONAL_MODELS = {
    'Hermes-3-Llama-3.1-8B': {
        role: 'thinker',
        gpu_target: 'rtx_4090',
        status: 'on_demand',
        color: 'var(--role-thinker)'
    }
};

const ROLE_COLORS = {
    coder: 'var(--role-coder)',
    thinker: 'var(--role-thinker)',
    cargo_check: 'var(--role-cargo)',
    validator: 'var(--role-validator)',
    idle: 'var(--role-idle)',
    unknown: 'var(--text-dim)'
};

// ── Dial Helper ────────────────────────────────────────────────────────
function dial(value, max, unit, hasRedline, color) {
    const R = 30, C = Math.PI * R;
    const dash = (Math.min(value, max) / max) * C;
    const col = color || 'var(--accent)';
    let red = '';
    if (hasRedline) {
        const rd = 0.2 * C, ro = C * 0.8;
        red = `<path style="fill:none;stroke:var(--danger);stroke-width:7;stroke-linecap:round" d="M 4,36 A 30,30 0 0,1 64,36" stroke-dasharray="${rd} ${C}" stroke-dashoffset="-${ro}" />`;
    }
    return `<svg class="dial-svg" viewBox="0 0 68 40">
        <path style="fill:none;stroke:#374151;stroke-width:7;stroke-linecap:round" d="M 4,36 A 30,30 0 0,1 64,36" />
        ${red}
        <path style="fill:none;stroke:${col};stroke-width:7;stroke-linecap:round;transition:stroke-dasharray 0.6s ease" d="M 4,36 A 30,30 0 0,1 64,36" stroke-dasharray="${dash} ${C}" />
        <text x="34" y="30" style="font-size:12px;fill:var(--text-main);font-weight:700;text-anchor:middle;dominant-baseline:central">${typeof value==='number'?value.toFixed(0):'?'}${unit}</text>
    </svg>`;
}

// ── GPU Discovery ──────────────────────────────────────────────────────
async function autoDiscover() {
    const status = document.getElementById('wall-control-status');
    status.textContent = "Discovering GPUs...";
    try {
        const res = await fetch('/api/hardware/gpus/discover');
        const data = await res.json();
        
        let discoveryHtml = `<strong>GPU Discovery Result:</strong> Found ${data.gpus ? data.gpus.length : 0} GPU(s)`;
        if (data.gpus) {
            discoveryHtml += ` - ${data.gpus.map(g => `${g.name}(${g.memory_gb}GB)`).join(', ')}`;
        }
        document.getElementById('gpu-discovery').innerHTML = discoveryHtml;
        
        status.textContent = "Discovery complete";
        setTimeout(() => status.textContent = "", 3000);
        setTimeout(fetchAll, 500);
    } catch (e) {
        status.textContent = "Discovery failed: " + e.message;
        console.error('autoDiscover', e);
    }
}

function toggleMonitoring() {
    const section = document.getElementById('fleet-status');
    section.style.display = section.style.display === 'none' ? 'flex' : 'none';
}

function refreshFleet() {
    fetchAll();
}

// ── Fleet Status ───────────────────────────────────────────────────────
async function updateFleetStatus() {
    try {
        const res = await fetch('/api/hardware/gpus/status');
        const data = await res.json();
        
        let html = `
            <div><strong>Total GPUs:</strong> ${data.total || 0} | <strong>Available:</strong> ${data.available || 0} | <strong>In Use:</strong> ${data.in_use || 0}</div>
            <div><strong>Always-On:</strong> Ornith (Coder/T440) | <strong>Conditional:</strong> Hermes (Thinker/RTX 4090) | <strong>Fallback:</strong> Nemotron (via NIM)</div>
        `;
        
        if (data.alerts && data.alerts.length > 0) {
            html += `<div class="alert-box">${data.alerts.map(a => a.message).join(' | ')}</div>`;
        }
        
        document.getElementById('fleet-status').innerHTML = html;
    } catch (e) {
        console.error('updateFleetStatus', e);
    }
}

// ── Main Fetch & Render ────────────────────────────────────────────────
async function fetchAll() {
    try {
        const requests = [
            fetch('/monitor').then(r => r.json()),
            fetch('/api/hardware/gpus').then(r => r.json()),
            fetch('/api/roles').then(r => r.json()),
            fetch('/lanes/activity').then(r => r.json()).catch(() => ({ activity: [] }))
        ];
        
        const [monData, gpuData, roleData, actData] = await Promise.all(requests);
        
        renderWorkers(monData);
        renderGpus(gpuData, roleData);
        updateFleetStatus();
        renderRoles(roleData, actData);
        updateFleetSummary(gpuData);
    } catch(e) { 
        console.error('fetchAll:', e);
    }
}

function updateFleetSummary(gpuData) {
    const total = gpuData.gpus ? gpuData.gpus.length : 0;
    const available = gpuData.available || 0;
    const inUse = total - available;
    const summary = `Fleet: ${total} GPUs | Ready: ${available} | In Use: ${inUse}`;
    document.getElementById('fleet-summary').textContent = summary;
}

function renderWorkers(monData) {
    const nodes = monData.nodes || [];
    let html = '';
    
    if (nodes.length === 0) {
        html = '<div style="color:var(--text-dim)">No nodes found</div>';
    }
    
    for (const node of nodes) {
        const isOnline = !node.error;
        const cpuPct = node.cpu_usage || 0;
        const temp = node.temperature_c || "?";
        html += `<div class="node-card">
            <div class="node-header">
                <span>${node.name} <span style="font-size:0.7rem;color:var(--text-dim);">${node.ip}</span></span>
                <span class="status-pill ${isOnline ? 'status-online' : 'status-offline'}">${isOnline ? 'ONLINE' : 'OFFLINE'}</span>
            </div>
            <div class="node-metrics">
                <div>CPU: ${cpuPct.toFixed(1)}%</div>
                <div>Temp: ${temp}°C</div>
                <div>RAM: ${node.system_ram_mb ? (node.system_ram_mb/1024).toFixed(1) : '?'}GB</div>
            </div>
            ${node.error ? `<div style="font-size:0.7rem;color:var(--danger);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${node.error}">${node.error}</div>` : ''}
        </div>`;
    }
    
    document.getElementById('workers-section').innerHTML = html;
}

function renderGpus(gpuData, roleData) {
    const gpus = gpuData.gpus || [];
    const roleAssignments = roleData.assignments || {};
    
    const modelGroups = {};
    const idleGpus = [];
    let totalTs = 0;
    
    // Group by assigned model
    for (const g of gpus) {
        const assignment = Object.values(roleAssignments).find(a => a.gpu_id === g.index || a.gpu_name === g.name);
        
        if (assignment && assignment.model) {
            const key = assignment.model;
            if (!modelGroups[key]) modelGroups[key] = { model: key, role: assignment.role, gpus: [] };
            modelGroups[key].gpus.push({ gpu: g, role: assignment.role });
            totalTs += (g.utilization_pct || 0) * 0.5;
        } else {
            idleGpus.push(g);
        }
    }
    
    document.getElementById('total-ts-value').innerHTML = `${totalTs.toFixed(1)} <span style="font-size:1rem;">T/s</span>`;
    
    let html = '';
    
    // Always-on models first
    for (const [model, config] of Object.entries(ALWAYS_ON_MODELS)) {
        if (modelGroups[model]) {
            const group = modelGroups[model];
            const shortModel = model.split('/').pop().replace('.gguf','');
            html += `<div class="gpu-group" style="border-top: 3px solid ${config.color}">
                <div class="gpu-group-header" style="color:${config.color}">
                    ⭐ ${shortModel} <span style="font-size:0.65rem;margin-left:8px;opacity:0.7">[ALWAYS ON]</span>
                </div>
                <div class="gpu-row">
                    ${group.gpus.map(item => renderGpuTile(item.gpu, item.role, config.color)).join('')}
                </div>
            </div>`;
        }
    }
    
    // Other active models
    for (const [model, group] of Object.entries(modelGroups)) {
        if (!ALWAYS_ON_MODELS[model]) {
            const shortModel = model.split('/').pop().replace('.gguf','');
            const color = ROLE_COLORS[group.role] || 'var(--accent)';
            html += `<div class="gpu-group">
                <div class="gpu-group-header" style="color:${color}">📦 ${shortModel}</div>
                <div class="gpu-row">
                    ${group.gpus.map(item => renderGpuTile(item.gpu, item.role, color)).join('')}
                </div>
            </div>`;
        }
    }
    
    // Idle GPUs
    if (idleGpus.length > 0) {
        html += `<div class="gpu-group">
            <div class="gpu-group-header" style="color:var(--text-dim)">�� Idle GPUs (${idleGpus.length})</div>
            <div class="gpu-row">
                ${idleGpus.map(g => renderGpuTile(g, 'idle', 'var(--role-idle)')).join('')}
            </div>
        </div>`;
    }
    
    document.getElementById('gpu-section').innerHTML = html;
}

function renderGpuTile(g, role, roleColor) {
    const tempC = g.temperature_c || 0;
    const util = g.utilization_pct || 0;
    const watts = g.power_draw_w || 0;
    const memPct = g.memory_total_mb > 0 ? (g.memory_used_mb / g.memory_total_mb) * 100 : 0;
    const tsMock = (util * 0.5).toFixed(1);
    
    const isAlwaysOn = Object.keys(ALWAYS_ON_MODELS).some(m => g.name.includes(m.split('-')[0]));
    
    return `<div class="gpu-tile" style="border-top: 3px solid ${roleColor}; ${isAlwaysOn ? 'border-left: 3px solid var(--success);' : ''}">
        <div class="gpu-tile-name">
            <span>${g.name.replace(/ \\(.*?\\)/, '')}</span>
            <span style="font-size:0.7rem; color:${roleColor}; text-transform:uppercase; font-weight:bold;">${role}</span>
        </div>
        <div class="dials-row">
            <div class="dial-cell">
                <div class="label">Temp</div>
                ${dial(tempC, 100, '°', true, tempC > 80 ? 'var(--danger)' : 'var(--accent)')}
            </div>
            <div class="dial-cell">
                <div class="label">Util</div>
                ${dial(util, 100, '%', false, util > 90 ? 'var(--warning)' : 'var(--accent)')}
            </div>
            <div class="dial-cell">
                <div class="label">VRAM</div>
                ${dial(memPct, 100, '%', false, memPct > 90 ? 'var(--danger)' : 'var(--accent)')}
            </div>
        </div>
        <div style="font-size:0.75rem;color:var(--text-main);text-align:center;font-weight:bold;margin-top:4px;">
            <span style="color:${roleColor}">${tsMock}</span> T/s | <span style="font-size:0.65rem;color:var(--text-dim);">${(g.memory_used_mb/1024).toFixed(1)}GB</span>
        </div>
    </div>`;
}

function renderRoles(roleData, actData) {
    const activity = actData.activity || [];
    const assignments = roleData.assignments || {};
    
    let html = '<strong>Fleet Role Assignments:</strong><br><br>';
    
    // Always-on roles
    for (const [model, config] of Object.entries(ALWAYS_ON_MODELS)) {
        const assignment = Object.values(assignments).find(a => a.model === model);
        const status = assignment ? '✓ Running' : '⏳ Pending';
        html += `<div class="role-block always-on active">
            <div style="display:flex;justify-content:space-between;align-items:center">
                <div>
                    <div class="role-name" style="color:${config.color}">${config.role.toUpperCase()}</div>
                    <div class="role-cards">${model}</div>
                    <div class="role-status">${status}</div>
                </div>
                <div style="text-align:center">
                    <div style="font-size:0.7rem;color:var(--text-dim)">GPU Target</div>
                    <div style="font-weight:bold;color:${config.color}">${config.gpu_target}</div>
                </div>
            </div>
        </div>`;
    }
    
    // Conditional models
    for (const [model, config] of Object.entries(CONDITIONAL_MODELS)) {
        const assignment = Object.values(assignments).find(a => a.model === model);
        html += `<div class="role-block">
            <div style="display:flex;justify-content:space-between;align-items:center">
                <div>
                    <div class="role-name" style="color:${config.color}">${config.role.toUpperCase()}</div>
                    <div class="role-cards">${model}</div>
                    <div class="role-status">${config.status}</div>
                </div>
                <div style="text-align:center">
                    <div style="font-size:0.7rem;color:var(--text-dim)">GPU Target</div>
                    <div style="font-weight:bold;color:${config.color}">${config.gpu_target}</div>
                </div>
            </div>
        </div>`;
    }
    
    document.getElementById('roles-section').innerHTML = html;
}

// ── Init ──────────────────────────────────────────────────────────────
async function init() {
    await autoDiscover();
    setInterval(fetchAll, 3000);
}
init();
</script>
</body>
</html>
