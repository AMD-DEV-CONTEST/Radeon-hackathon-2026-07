<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qualification Lab | Forge 3</title>
    <style>
        :root {
            --bg: #0b0f19;
            --panel: #111827;
            --border: #1f2937;
            --accent: #3b82f6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --purple: #a78bfa;
            --text-main: #f3f4f6;
            --text-dim: #9ca3af;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            line-height: 1.55;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            background: var(--panel);
        }
        header h1 { 
            font-size: 1.1rem; 
            font-weight: 700;
            color: var(--accent); 
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        .subtitle { 
            color: var(--text-dim); 
            font-size: 0.85rem; 
            margin-left: 12px;
        }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .btn {
            background: rgba(255,255,255,0.06);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
        }
        .btn:hover { 
            border-color: var(--accent); 
            background: rgba(59,130,246,0.1);
        }
        #content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        h2 { 
            font-size: 1rem; 
            color: var(--accent); 
            margin-bottom: 0.75rem; 
            border-bottom: 1px solid var(--border); 
            padding-bottom: 0.5rem; 
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        h3 { 
            font-size: 0.95rem; 
            margin-bottom: 0.5rem; 
            color: var(--text-main);
            font-weight: 600;
        }
        .family-section {
            margin-bottom: 2.5rem;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 1.25rem;
            align-items: start;
        }
        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            transition: all 0.2s;
        }
        .card:hover {
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(59,130,246,0.15);
        }
        .status-badge {
            display: inline-block;
            padding: 0.3rem 0.75rem;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 700;
            margin-right: 0.5rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .badge-success { background: rgba(16,185,129,0.15); color: var(--success); border: 1px solid var(--success); }
        .badge-warning { background: rgba(245,158,11,0.15); color: var(--warning); border: 1px solid var(--warning); }
        .badge-danger { background: rgba(239,68,68,0.15); color: var(--danger); border: 1px solid var(--danger); }
        .tool-badge {
            background: rgba(59,130,246,0.1);
            color: var(--accent);
            border: 1px solid rgba(59,130,246,0.3);
            padding: 0.6rem 0.8rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; margin-bottom: 1rem; }
        th, td { text-align: left; padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--border); font-size: 0.8rem; }
        th { color: var(--text-dim); font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; font-size: 0.7rem; }
        .metric-label { color: var(--text-dim); font-size: 0.8rem; }
        .metric-value { font-weight: 600; color: var(--text-main); font-family: monospace; }
        .run-list {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.3);
        }
        .run-list table { margin: 0; }
        .run-list th { 
            position: sticky; 
            top: 0; 
            background: var(--panel); 
            z-index: 1; 
            border-bottom: 2px solid var(--border); 
        }
        .btn-small {
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.25rem 0.6rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.7rem;
            transition: all 0.2s;
        }
        .btn-small:hover { 
            background: rgba(59,130,246,0.1);
            border-color: var(--accent);
        }
        #modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(4px);
            z-index: 999;
            display: none;
            align-items: center;
            justify-content: center;
        }
        #modal-content {
            background: var(--panel);
            border: 1px solid var(--border);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            border-radius: 10px;
            padding: 1.5rem;
            width: 90%;
            max-width: 900px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }
        #modal-header { 
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border);
        }
        #modal-title {
            color: var(--accent);
            font-weight: 600;
        }
        #modal-body { overflow-y: auto; }
        #modal-body pre {
            background: rgba(0,0,0,0.5);
            padding: 1rem;
            border-radius: 6px;
            overflow-x: auto;
            color: #a5d6ff;
            font-family: monospace;
            font-size: 0.8rem;
            white-space: pre-wrap;
            line-height: 1.5;
            border: 1px solid var(--border);
        }
        .close-btn { 
            cursor: pointer;
            color: var(--danger);
            font-weight: bold;
            font-size: 1.5rem;
            transition: all 0.2s;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }
        .close-btn:hover {
            background: rgba(239,68,68,0.1);
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
    </style>
</head>
<body>
    <header>
        <div style="display: flex; align-items: center;">
            <h1>Qualification Lab</h1>
            <span class="subtitle">Evidence-Based Qualification for AI Worker Roles</span>
        </div>
        <div class="controls">
            <button class="btn" onclick="refreshData()">🔄 Refresh</button>
            <button class="btn" onclick="exportReport()">📊 Export</button>
            <span id="status-indicator" style="font-size:0.8rem;color:var(--text-dim);margin-left:10px;"></span>
        </div>
    </header>
    
    <div id="content">
        <div id="loading" style="color: var(--accent); text-align: center; padding: 40px; font-size: 1rem;">
            <div style="margin-bottom: 10px;">🔬 Loading qualification scorecards...</div>
            <div style="font-size: 0.8rem; color: var(--text-dim);">Analyzing fleet cognitive profiles</div>
        </div>
        <div id="families-container"></div>
    </div>

    <div id="modal-overlay" onclick="closeModal()">
        <div id="modal-content" onclick="event.stopPropagation()">
            <div id="modal-header">
                <h3 id="modal-title">Failure Snapshot</h3>
                <div class="close-btn" onclick="closeModal()">&times;</div>
            </div>
            <div id="modal-body">
                <pre id="modal-pre"></pre>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/qualification-lab';

        async function jget(path) {
            const endpoints = [API_BASE + path, '/qualification-lab/api' + path, '/api' + path];
            for (const endpoint of endpoints) {
                try {
                    const r = await fetch(endpoint, { cache: 'no-store' });
                    if (r.ok) return r.json();
                } catch(e) { console.warn('Failed:', endpoint); }
            }
            throw new Error('All API endpoints failed');
        }
        
        function refreshData() {
            const status = document.getElementById('status-indicator');
            status.textContent = 'Refreshing...';
            status.style.color = 'var(--accent)';
            init();
        }
        
        function exportReport() {
            alert('Export functionality coming soon!\\n\\nWill export qualification data as JSON/CSV.');
        }

        function getFamily(name) {
            name = name.toLowerCase();
            if (name.includes('ornith')) return 'Ornith';
            if (name.includes('hermes')) return 'Hermes';
            if (name.includes('gemma')) return 'Gemma';
            if (name.includes('llama') || name.includes('nemotron')) return 'Llama / Nemotron';
            if (name.includes('phi')) return 'Phi';
            if (name.includes('qw')) return 'Qwen';
            return 'Other';
        }

        function fmtPct(v) {
            return (v === null || v === undefined) ? '—' : (v * 100).toFixed(1) + '%';
        }

        function showModal(title, content) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-pre').textContent = content || "No output provided.";
            document.getElementById('modal-overlay').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
        }
        window.showModal = showModal;

        async function init() {
            try {
                const statusIndicator = document.getElementById('status-indicator');
                statusIndicator.textContent = 'Loading...';
                statusIndicator.style.color = 'var(--accent)';
                
                const data = await jget('/compare');
                document.getElementById('loading').style.display = 'none';
                
                statusIndicator.textContent = 'Ready';
                statusIndicator.style.color = 'var(--success)';
                setTimeout(() => statusIndicator.textContent = '', 3000);
                
                if (!data.ok || !data.scorecards || data.scorecards.length === 0) {
                    document.getElementById('families-container').innerHTML = \`
                        <div style="text-align:center;padding:60px;color:var(--text-dim);">
                            <div style="font-size:3rem;margin-bottom:20px;">📊</div>
                            <div style="font-size:1.1rem;margin-bottom:10px;">No Scorecards Found</div>
                            <div style="font-size:0.85rem;">Run qualification tests to populate this dashboard</div>
                        </div>
                    \`;
                    return;
                }

                const families = {};
                for (const card of data.scorecards) {
                    const fam = getFamily(card.model_name || 'unknown');
                    if (!families[fam]) families[fam] = [];
                    families[fam].push(card);
                }

                const famKeys = Object.keys(families).sort();
                let html = '';
                
                for (const fam of famKeys) {
                    const cards = families[fam];
                    cards.sort((a,b) => (a.model_name||'').localeCompare(b.model_name||''));

                    html += \`<div class="family-section"><h2>Family: \${fam}</h2><div class="grid-container">\`;

                    for (const c of cards) {
                        const metrics = c.first_pass || {};
                        const guardrailed = c.guardrailed || null;
                        const hasGuardrail = guardrailed && guardrailed.total_runs > 0;
                        const isQual = c.qualification_state === 'Qualified';

                        html += \`<div class="card">
                            <h3>\${c.model_name}</h3>
                            <div style="margin-bottom:1rem;">
                                <span class="status-badge \${isQual ? 'badge-success' : 'badge-danger'}">\${c.qualification_state}</span>
                                <span class="status-badge badge-warning">\${c.quantization || 'Unknown'}</span>
                            </div>\`;

                        if (hasGuardrail) {
                            html += \`<div class="tool-badge"><span>🛠️ Tool Corrected: Normalizer fixed first-pass errors</span></div>\`;
                        }

                        html += \`<table>
                            <tr><td class="metric-label">Backend</td><td class="metric-value">\${c.runtime_backend}</td></tr>
                            <tr><td class="metric-label">Ranking Score</td><td class="metric-value">\${(c.standard_suite_ranking_score||0).toFixed(4)}</td></tr>
                            <tr><td class="metric-label">Req Recall</td><td class="metric-value">\${fmtPct(metrics.mean_requirement_recall)}</td></tr>
                            <tr><td class="metric-label">Constraint Recall</td><td class="metric-value">\${fmtPct(metrics.mean_hard_constraint_recall)}</td></tr>
                            <tr><td class="metric-label">Accuracy</td><td class="metric-value">\${fmtPct(metrics.mean_claim_disposition_accuracy)}</td></tr>
                        </table>\`;

                        if (c.runs && c.runs.length > 0) {
                            html += \`<h4 style="font-size:0.85rem;margin-top:1rem;margin-bottom:0.5rem;color:var(--text-main);">Granular Test Runs</h4>
                            <div class="run-list"><table>
                                <thead><tr><th>Test ID</th><th>Status</th><th>Failure Reason</th><th>Snapshot</th></tr></thead>
                                <tbody>\`;
                            for (const r of c.runs) {
                                if (r.repeat > 0) continue;
                                const passed = r.validator_success && r.expected_outcome_match && !r.hard_failure;
                                const statusClass = passed ? 'badge-success' : 'badge-danger';
                                const statusText = passed ? 'PASS' : 'FAIL';
                                const reason = (r.failure_class && r.failure_class !== 'none') ? r.failure_class : (passed ? '−' : 'Mismatch');
                                const rawOutput = encodeURIComponent(r.raw_output || '');
                                
                                html += \`<tr>
                                    <td style="font-family:monospace;font-size:0.75rem;">\${r.fixture_id}</td>
                                    <td><span class="status-badge \${statusClass}" style="margin:0;">\${statusText}</span></td>
                                    <td style="color:\${!passed ? 'var(--danger)' : 'var(--text-dim)'};">\${reason}</td>
                                    <td>\${!passed ? \`<button class="btn-small" onclick="showModal('\${r.fixture_id}', decodeURIComponent('\${rawOutput}'))">View</button>\` : '−'}</td>
                                </tr>\`;
                            }
                            html += \`</tbody></table></div>\`;
                        }
                        html += \`</div>\`;
                    }
                    html += \`</div></div>\`;
                }

                document.getElementById('families-container').innerHTML = html;

            } catch (err) {
                console.error('Qualification Lab Error:', err);
                document.getElementById('loading').innerHTML = \`
                    <div style="color:var(--danger);text-align:center;padding:40px;">
                        <div style="font-size:2rem;margin-bottom:15px;">⚠️</div>
                        <div style="font-size:1.1rem;margin-bottom:10px;">Error Loading Data</div>
                        <div style="font-size:0.85rem;color:var(--text-dim);">\${err.message}</div>
                        <button class="btn" onclick="init()" style="margin-top:20px;">🔄 Retry</button>
                    </div>
                \`;
                const statusIndicator = document.getElementById('status-indicator');
                statusIndicator.textContent = 'Error';
                statusIndicator.style.color = 'var(--danger)';
            }
        }

        init();
        setInterval(() => { if (document.visibilityState === 'visible') init(); }, 30000);
    </script>
</body>
</html>
