[pytest]
markers =
    integration: requires a live local vLLM server at http://localhost:8000/v1 serving config.inference.primary_model
    eval: quality-regression gate over the compiled RAG artifact; skips when artifacts/bunker_rag_mipro.json is absent
    perf: performance-regression gates for the local vLLM server and AMD/NVIDIA GPU (TTFT, tokens/s, VRAM); thresholds overridable via BUNKER_PERF_* env vars
