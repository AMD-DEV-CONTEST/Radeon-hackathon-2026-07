[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "repository-analysis-agent"
version = "0.1.0"
description = "Privacy-first local code repository intelligence agent for AMD Radeon GPU"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "tree-sitter>=0.22",
    "tree-sitter-python>=0.22",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0",
    "FlagEmbedding>=1.2",
    "rich>=13.7",
]

[project.optional-dependencies]
gpu = ["torch"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
raa = "src.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
