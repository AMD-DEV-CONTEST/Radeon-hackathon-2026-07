<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RepositoryAnalysisAgent</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="sidebar-header">
            <h1 class="logo">RepositoryAnalysisAgent</h1>
            <button class="btn-new-chat" id="btnNewChat" title="New conversation">+ New</button>
        </div>

        <div class="repo-panel">
            <div class="repo-input-row">
                <input type="text" id="repoPathInput" class="repo-input" placeholder="/path/to/repo" title="Repository path">
            </div>
            <div class="repo-buttons">
                <button id="btnIndex" class="btn-index" title="Index repository">Index</button>
                <button id="btnReindex" class="btn-reindex" title="Force re-index">Re-index</button>
            </div>
        </div>

        <div class="repo-status" id="repoStatus">
            <div class="status-row">
                <span class="status-dot" id="healthDot"></span>
                <span id="healthText">Checking...</span>
            </div>
            <div class="status-row repo-path" id="repoPathText"></div>
            <div class="status-row" id="indexStatus"></div>
        </div>
        <div class="file-browser" id="fileBrowser">
            <div class="file-browser-header">Files</div>
            <div class="file-tree" id="fileTree"></div>
        </div>
        <div class="session-list" id="sessionList">
            <div class="session-list-header">Recent</div>
            <div class="sessions" id="sessions"></div>
        </div>
    </aside>

    <main class="chat-area">
        <div class="chat-header">
            <span class="model-name" id="modelName"></span>
        </div>
        <div class="messages" id="messages">
            <div class="welcome">
                <div class="welcome-icon">&#128269;</div>
                <h2>RepositoryAnalysisAgent</h2>
                <p>Privacy-first local code intelligence. Ask anything about this codebase.</p>
            </div>
        </div>
        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="chatInput" placeholder="Ask about this codebase..." rows="1"></textarea>
                <button id="btnSend" class="btn-send" title="Send">&#8593;</button>
                <button id="btnStop" class="btn-stop" title="Stop generating" style="display:none;">&#9632;</button>
            </div>
            <div class="input-hint">Agent uses tools to search and read code. Responses are generated locally.</div>
        </div>
    </main>
</div>
<script src="/static/app.js"></script>
</body>
</html>
