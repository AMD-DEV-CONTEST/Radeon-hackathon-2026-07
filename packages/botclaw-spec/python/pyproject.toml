[project]
name = "botclaw-spec"
version = "0.0.1"
description = "BotClaw contract spec (Python / Pydantic) — M0 stub"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["botclaw_spec*"]
