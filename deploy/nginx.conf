# 反向代理：公网 80 端口 → web 容器 8000
# 注意：不要在公网暴露 ComfyUI 的 8188 端口，只暴露 80/443
server {
    listen 80;
    server_name _;

    client_max_body_size 100m;        # 允许上传较大的角色图/参考图
    proxy_read_timeout 600s;          # SDXL/MusicGen 长任务不超时
    proxy_send_timeout 600s;

    # 公网直接暴露时强烈建议开启基本认证（可选）：
    # 1) 生成密码文件：htpasswd -c deploy/htpasswd admin
    # 2) 取消下面两行注释
    # auth_basic "IndieGen Restricted";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

