# 独立游戏 AI 资产平台 · 部署编排（P5）
#
# 说明：
# - ComfyUI 默认在宿主机运行（GPU/ROCm 直通最省事，见 scripts/deploy_host.sh），
#   web 容器通过 host-gateway 访问宿主机的 8188 端口；
# - 有域名 + HTTPS 时，把 443 端口映射打开，并按 README「域名与 HTTPS」配置证书。
#
# 用法：cd deploy && docker compose up -d --build

services:
  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      COMFY_URL: ${COMFY_URL:-http://host.docker.internal:8188}
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      # - "${HTTPS_PORT:-443}:443"   # 配置好证书后放开，并启用 nginx.conf 中的 443 server
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./htpasswd:/etc/nginx/.htpasswd:ro   # 可选：公网基本认证（见 nginx.conf 注释）
    depends_on:
      - web
