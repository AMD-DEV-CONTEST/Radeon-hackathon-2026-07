server {
    listen 80;
    server_name _;

    auth_basic "UnionAgents";
    auth_basic_user_file /etc/nginx/.htpasswd;

    root /var/www/canvas;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /stream/ {
        proxy_pass http://127.0.0.1:8001/stream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
    }
}
