[package]
name = "uas-canvas"
version = "0.6.1"
edition = "2021"
description = "UAS Canvas 明线前端 — Windows 原生指挥舱，实时数据驱动"

[dependencies]
eframe = "0.31"
egui = "0.31"
chrono = "0.4"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
