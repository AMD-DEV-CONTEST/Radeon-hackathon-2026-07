id: ILS-R001
name: Context Required
level: mandatory
phase: intake
rule: >
  Every task must have a non-empty context.goal field before dispatch.
  Tasks without context.goal are rejected at intake.
failure_mode: reject
requires_user_confirmation: never
comment_zh: >
  任务必须有上下文目标。没有 context.goal 的任务无法判断 scope，
  agent 会凭空猜测意图，导致越权或偏离目标。
  迁移自 rules.py check_rule1_context_required。
