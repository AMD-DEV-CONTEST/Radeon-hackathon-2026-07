# ILS-R007: Task Description Must Specify Pipeline Wire Points
# Severity: advisory
# Gate: ILS-G001 (Target Object)

## Rule
Every feature-implementation task description MUST explicitly name:
1. The exact function/file to modify (e.g. "orchestrator/main.py create_task()")
2. The call site (e.g. "call decompose() before INSERT INTO tasks")
3. The verification command (e.g. "POST /tasks with intent_packet, expect 200")

## Why
Phase 6.1 L3/L4 asked for "design docs". Agent produced design docs.
If they'd said "wire into create_task pipeline", the outcome would
have been code, not docs. Agents take descriptions literally.

## Examples

Bad: "Design participants schema and dynamic role derivation"
Good: "Create iron_law/participants.py with schema, then import and
       call derive_roles() in orchestrator/main.py create_task()
       before INSERT INTO tasks. Verify via POST /tasks."

