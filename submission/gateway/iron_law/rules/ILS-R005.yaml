id: ILS-R005
name: Acceptance Check Required
level: mandatory
phase: intake
rule: >
  Every task must have an acceptance_check field.
  acceptance_check.type must not conflict with required_capabilities.agent_type.
  Forbidden: pnpm build / npm build for non-Node agents.
failure_mode: reject
requires_user_confirmation: never
comment_zh: >
  任务必须有验收标准。没有 acceptance_check 的任务完成后无法验收。
  安全校验：防止用前端 build 命令验收 Python 服务。
  迁移自 rules.py check_rule5_acceptance_required。
