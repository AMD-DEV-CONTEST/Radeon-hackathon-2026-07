id: ILS-R003
name: Task Granularity
level: mandatory
phase: intake
rule: >
  Single task estimated effort must not exceed 1 hour.
  Tasks with estimated_hours > 1.0 must be decomposed into subtasks.
  Heuristic: description with 3+ serial step connectors triggers warning.
failure_mode: warn_if_auto_fixable_else_reject
requires_user_confirmation: conditional
comment_zh: >
  单任务估时不超过 1 小时。大任务必须拆分。
  启发式检测：描述中出现 3 个以上串行步骤连接词（然后、接着、再然后等）
  视为疑似大任务，发出警告。
  迁移自 rules.py check_rule3_task_granularity。
