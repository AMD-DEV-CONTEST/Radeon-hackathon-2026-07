case_memory_entry:
  intent_pattern: string
  correction_pattern: string
  decomposition_dag: dag_ref
  failure_mode: string
  gate_outcome:
    type: map
    key: gate_id
    value: "pass | fail"
  rule_candidate_id: "string | null"
prohibited_content:
  - free_form_knowledge_answers
  - new_scope_proposals
  - content_mistakable_for_active_rules
comment_zh: >
  Case Memory 存的是类似需求怎么拆的经验，不是知识问答。
  rule_candidate_id 只存引用，不存文本，防止 candidate 和 active rule 边界模糊。
