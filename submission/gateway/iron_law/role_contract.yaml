role_contract:
  leader:
    may_assign: true
    may_review: true
    may_integrate_plan: true
    may_touch_primary_code: false
  contributor:
    must_report_evidence: true
    must_not_expand_scope: true
    must_not_modify_active_rules: true
  assignment_authority:
    may_assign_primary_code_access:
      - orchestrator
      - human_leader
    self_assignment: prohibited
    audit_required: true
comment_zh: >
  Leader 带队推进 ≠ 抢主代码席位。
  assignment_authority 防止 agent 自我授权越权。
