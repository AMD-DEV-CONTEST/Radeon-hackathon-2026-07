[project]
name = "unionagents"
version = "0.1.0"
description = "MVP orchestrator for the Union multi-agent automation system."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "anthropic>=0.30.0",
]

[tool.uvicorn]
factory = false

[tool.setuptools.packages.find]
include = ["orchestrator*", "streaming_gateway*", "worker*", "iron_law*"]
