<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">HighwayEnv DQN pipeline</title>
  <desc id="desc">A four-stage workflow from HighwayEnv simulation through DQN training and seeded evaluation to metrics and video, accelerated by AMD Radeon GPU and ROCm.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071425"/>
      <stop offset="0.55" stop-color="#102842"/>
      <stop offset="1" stop-color="#173a5b"/>
    </linearGradient>
    <linearGradient id="amd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8343f"/>
      <stop offset="1" stop-color="#ff7043"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#173d60"/>
      <stop offset="1" stop-color="#102e49"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto">
      <path d="M0 0 L16 8 L0 16 Z" fill="#66d9ff"/>
    </marker>
    <style>
      .title { font: 700 62px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .subtitle { font: 400 27px Arial, Helvetica, sans-serif; fill: #adc9df; }
      .step { font: 700 20px Arial, Helvetica, sans-serif; fill: #66d9ff; letter-spacing: 2px; }
      .node-title { font: 700 34px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .node-copy { font: 400 21px Arial, Helvetica, sans-serif; fill: #c7dae8; }
      .node-key { font: 700 21px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .footer-main { font: 700 27px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .footer-copy { font: 400 19px Arial, Helvetica, sans-serif; fill: #ffe7df; }
      .arrow { fill: none; stroke: #66d9ff; stroke-width: 7; stroke-linecap: round; marker-end: url(#arrow); }
      .connector-dot { fill: #66d9ff; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#background)"/>
  <circle cx="1770" cy="-40" r="370" fill="#226795" opacity="0.28"/>
  <circle cx="1830" cy="-30" r="210" fill="#2e8ab8" opacity="0.22"/>
  <path d="M0 0 H22 V1080 H0 Z" fill="#ef3340"/>

  <text x="100" y="115" class="title">HighwayEnv DQN Pipeline</text>
  <text x="104" y="166" class="subtitle">From online driving simulation to reproducible evidence on AMD ROCm</text>

  <g filter="url(#shadow)">
    <rect x="90" y="300" width="380" height="400" rx="30" fill="url(#node)" stroke="#2e648a" stroke-width="2"/>
    <rect x="550" y="300" width="380" height="400" rx="30" fill="url(#node)" stroke="#2e648a" stroke-width="2"/>
    <rect x="1010" y="300" width="380" height="400" rx="30" fill="url(#node)" stroke="#2e648a" stroke-width="2"/>
    <rect x="1470" y="300" width="380" height="400" rx="30" fill="url(#node)" stroke="#2e648a" stroke-width="2"/>
  </g>

  <path class="arrow" d="M475 500 H530"/>
  <path class="arrow" d="M935 500 H990"/>
  <path class="arrow" d="M1395 500 H1450"/>
  <circle class="connector-dot" cx="497" cy="500" r="7"/>
  <circle class="connector-dot" cx="957" cy="500" r="7"/>
  <circle class="connector-dot" cx="1417" cy="500" r="7"/>

  <!-- Simulation icon: road lanes and vehicle -->
  <g transform="translate(145 350)">
    <rect x="0" y="0" width="270" height="104" rx="17" fill="#0b2237" stroke="#3c779f"/>
    <path d="M0 52 H270" stroke="#87a8bd" stroke-width="3" stroke-dasharray="18 14"/>
    <rect x="55" y="28" width="68" height="34" rx="9" fill="#ef3340"/>
    <circle cx="70" cy="65" r="7" fill="#071425"/>
    <circle cx="108" cy="65" r="7" fill="#071425"/>
    <rect x="175" y="62" width="57" height="27" rx="7" fill="#66d9ff" opacity="0.75"/>
  </g>
  <text x="130" y="493" class="step">01  SIMULATION</text>
  <text x="130" y="545" class="node-title">HighwayEnv</text>
  <text x="130" y="590" class="node-key">highway-fast-v0</text>
  <text x="130" y="628" class="node-copy">Online observations</text>
  <text x="130" y="662" class="node-copy">Actions, rewards, next states</text>

  <!-- Training icon: replay buffer feeding network -->
  <g transform="translate(605 350)">
    <rect x="0" y="18" width="68" height="68" rx="12" fill="#1d5074" stroke="#66d9ff"/>
    <rect x="18" y="0" width="68" height="68" rx="12" fill="#173f60" stroke="#66d9ff"/>
    <path d="M104 51 H144" stroke="#66d9ff" stroke-width="5" marker-end="url(#arrow)"/>
    <circle cx="176" cy="22" r="14" fill="#ef3340"/>
    <circle cx="176" cy="80" r="14" fill="#ef3340"/>
    <circle cx="232" cy="51" r="14" fill="#66d9ff"/>
    <path d="M188 25 L219 45 M188 75 L219 57" stroke="#c7dae8" stroke-width="4"/>
  </g>
  <text x="590" y="493" class="step">02  DQN TRAINING</text>
  <text x="590" y="545" class="node-title">Learn Q-values</text>
  <text x="590" y="590" class="node-key">Replay buffer + TD loss</text>
  <text x="590" y="628" class="node-copy">256 x 256 MLP policy</text>
  <text x="590" y="662" class="node-copy">PyTorch on ROCm GPU</text>

  <!-- Evaluation icon: two policy lanes and check -->
  <g transform="translate(1065 350)">
    <rect x="0" y="4" width="196" height="36" rx="18" fill="#1d5074"/>
    <rect x="0" y="66" width="196" height="36" rx="18" fill="#1d5074"/>
    <circle cx="22" cy="22" r="10" fill="#87a8bd"/>
    <circle cx="22" cy="84" r="10" fill="#66d9ff"/>
    <path d="M218 55 l18 18 34 -40" fill="none" stroke="#47df9a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="1050" y="493" class="step">03  EVALUATION</text>
  <text x="1050" y="545" class="node-title">Seeded comparison</text>
  <text x="1050" y="590" class="node-key">Random vs DQN</text>
  <text x="1050" y="628" class="node-copy">20 episodes, seeds 100-119</text>
  <text x="1050" y="662" class="node-copy">Deterministic inference</text>

  <!-- Output icon: chart plus video frame -->
  <g transform="translate(1525 350)">
    <rect x="0" y="0" width="132" height="104" rx="14" fill="#0b2237" stroke="#3c779f"/>
    <rect x="24" y="64" width="18" height="22" rx="3" fill="#87a8bd"/>
    <rect x="57" y="42" width="18" height="44" rx="3" fill="#66d9ff"/>
    <rect x="90" y="20" width="18" height="66" rx="3" fill="#ef3340"/>
    <rect x="155" y="0" width="112" height="104" rx="14" fill="#0b2237" stroke="#3c779f"/>
    <path d="M194 29 L194 75 L233 52 Z" fill="#ffffff"/>
  </g>
  <text x="1510" y="493" class="step">04  METRICS &amp; VIDEO</text>
  <text x="1510" y="545" class="node-title">Reproducible evidence</text>
  <text x="1510" y="590" class="node-key">Reward + collision + latency</text>
  <text x="1510" y="628" class="node-copy">JSON evaluation metrics</text>
  <text x="1510" y="662" class="node-copy">Random and DQN MP4 videos</text>

  <g filter="url(#shadow)">
    <rect x="305" y="820" width="1310" height="128" rx="64" fill="url(#amd)"/>
  </g>
  <text x="960" y="870" text-anchor="middle" class="footer-main">AMD Radeon GPU  |  ROCm / HIP  |  PyTorch</text>
  <text x="960" y="910" text-anchor="middle" class="footer-copy">GPU-accelerated DQN training and policy inference with explicit runtime evidence</text>
</svg>
