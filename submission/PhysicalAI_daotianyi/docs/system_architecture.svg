<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">PhysicalAI-ROCm system architecture</title>
  <desc id="desc">Two simulation pipelines share AMD Radeon GPU and ROCm infrastructure and produce metrics, videos, and reproducibility evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081426"/>
      <stop offset="1" stop-color="#142d4a"/>
    </linearGradient>
    <linearGradient id="amd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef3340"/>
      <stop offset="1" stop-color="#ff7a45"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#65d1ff"/>
    </marker>
    <style>
      .title { font: 700 38px Arial, sans-serif; fill: #fff; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #a9c5df; }
      .lane-title { font: 700 24px Arial, sans-serif; fill: #fff; }
      .box-title { font: 700 18px Arial, sans-serif; fill: #fff; }
      .box-copy { font: 400 14px Arial, sans-serif; fill: #c9deef; }
      .chip { font: 700 15px Arial, sans-serif; fill: #fff; }
      .arrow { fill: none; stroke: #65d1ff; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1400" height="760" rx="28" fill="url(#bg)"/>
  <text x="64" y="66" class="title">PhysicalAI-ROCm</text>
  <text x="64" y="98" class="subtitle">Reproducible simulation, learning, control, and evidence on AMD Radeon GPU</text>

  <g filter="url(#shadow)">
    <rect x="55" y="140" width="1290" height="230" rx="22" fill="#122b45" stroke="#2b587a"/>
    <rect x="55" y="402" width="1290" height="230" rx="22" fill="#122b45" stroke="#2b587a"/>
  </g>

  <text x="82" y="180" class="lane-title">Demo 1 - HighwayEnv DQN</text>
  <g>
    <rect x="85" y="215" width="205" height="105" rx="16" fill="#1b4362"/>
    <text x="108" y="249" class="box-title">Online Simulation</text>
    <text x="108" y="277" class="box-copy">Kinematic observations</text>
    <text x="108" y="299" class="box-copy">Five discrete actions</text>

    <rect x="375" y="215" width="205" height="105" rx="16" fill="#1b4362"/>
    <text x="398" y="249" class="box-title">DQN Training</text>
    <text x="398" y="277" class="box-copy">Replay buffer + TD loss</text>
    <text x="398" y="299" class="box-copy">Stable-Baselines3</text>

    <rect x="665" y="215" width="205" height="105" rx="16" fill="#1b4362"/>
    <text x="688" y="249" class="box-title">Seeded Evaluation</text>
    <text x="688" y="277" class="box-copy">Random vs learned policy</text>
    <text x="688" y="299" class="box-copy">20 episodes</text>

    <rect x="955" y="215" width="300" height="105" rx="16" fill="#183953"/>
    <text x="978" y="249" class="box-title">Evidence</text>
    <text x="978" y="277" class="box-copy">Reward, collision, latency</text>
    <text x="978" y="299" class="box-copy">JSON metrics + MP4 video</text>
  </g>
  <path class="arrow" d="M290 267 H365"/><path class="arrow" d="M580 267 H655"/><path class="arrow" d="M870 267 H945"/>

  <text x="82" y="442" class="lane-title">Demo 2 - Genesis Franka Target Following</text>
  <g>
    <rect x="85" y="477" width="205" height="105" rx="16" fill="#1b4362"/>
    <text x="108" y="511" class="box-title">Target Trajectory</text>
    <text x="108" y="539" class="box-copy">3D figure-eight path</text>
    <text x="108" y="561" class="box-copy">Deterministic seed</text>

    <rect x="375" y="477" width="205" height="105" rx="16" fill="#1b4362"/>
    <text x="398" y="511" class="box-title">Inverse Kinematics</text>
    <text x="398" y="539" class="box-copy">Franka hand target</text>
    <text x="398" y="561" class="box-copy">Seven joint positions</text>

    <rect x="665" y="477" width="205" height="105" rx="16" fill="#1b4362"/>
    <text x="688" y="511" class="box-title">PD Simulation</text>
    <text x="688" y="539" class="box-copy">Four physics steps/frame</text>
    <text x="688" y="561" class="box-copy">Off-screen rendering</text>

    <rect x="955" y="477" width="300" height="105" rx="16" fill="#183953"/>
    <text x="978" y="511" class="box-title">Evidence</text>
    <text x="978" y="539" class="box-copy">Tracking error + IK time</text>
    <text x="978" y="561" class="box-copy">JSON metrics + MP4 video</text>
  </g>
  <path class="arrow" d="M290 529 H365"/><path class="arrow" d="M580 529 H655"/><path class="arrow" d="M870 529 H945"/>

  <g filter="url(#shadow)">
    <rect x="362" y="668" width="676" height="58" rx="29" fill="url(#amd)"/>
  </g>
  <text x="700" y="704" text-anchor="middle" class="chip">AMD Radeon GPU  |  ROCm / HIP  |  PyTorch  |  Genesis AMD GPU backend</text>
</svg>
