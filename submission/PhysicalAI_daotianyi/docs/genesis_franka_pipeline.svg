<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Genesis Franka target-following pipeline</title>
  <desc id="desc">A five-stage workflow from target trajectory generation through inverse kinematics, PD control, rendering, and metrics and video, accelerated by AMD Radeon GPU and Genesis.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071425"/><stop offset="0.55" stop-color="#102842"/><stop offset="1" stop-color="#173a5b"/></linearGradient>
    <linearGradient id="amd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e8343f"/><stop offset="1" stop-color="#ff7043"/></linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#173d60"/><stop offset="1" stop-color="#102e49"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.32"/></filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0 L14 7 L0 14 Z" fill="#66d9ff"/></marker>
    <style>
      .title { font: 700 60px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .subtitle { font: 400 27px Arial, Helvetica, sans-serif; fill: #adc9df; }
      .step { font: 700 18px Arial, Helvetica, sans-serif; fill: #66d9ff; letter-spacing: 1.5px; }
      .node-title { font: 700 28px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .node-key { font: 700 19px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .node-copy { font: 400 18px Arial, Helvetica, sans-serif; fill: #c7dae8; }
      .footer-main { font: 700 27px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .footer-copy { font: 400 19px Arial, Helvetica, sans-serif; fill: #ffe7df; }
      .arrow { fill: none; stroke: #66d9ff; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1920" height="1080" fill="url(#background)"/><circle cx="1770" cy="-40" r="370" fill="#226795" opacity="0.28"/><circle cx="1830" cy="-30" r="210" fill="#2e8ab8" opacity="0.22"/><path d="M0 0 H22 V1080 H0 Z" fill="#ef3340"/>
  <text x="100" y="115" class="title">Genesis Franka Pipeline</text><text x="104" y="166" class="subtitle">From deterministic target motion to measurable robot-control evidence on AMD GPU</text>
  <g filter="url(#shadow)"><rect x="55" y="300" width="325" height="410" rx="28" fill="url(#node)" stroke="#2e648a" stroke-width="2"/><rect x="425" y="300" width="325" height="410" rx="28" fill="url(#node)" stroke="#2e648a" stroke-width="2"/><rect x="795" y="300" width="325" height="410" rx="28" fill="url(#node)" stroke="#2e648a" stroke-width="2"/><rect x="1165" y="300" width="325" height="410" rx="28" fill="url(#node)" stroke="#2e648a" stroke-width="2"/><rect x="1535" y="300" width="325" height="410" rx="28" fill="url(#node)" stroke="#2e648a" stroke-width="2"/></g>
  <path class="arrow" d="M390 478 L412 500 L390 522"/><path class="arrow" d="M760 478 L782 500 L760 522"/><path class="arrow" d="M1130 478 L1152 500 L1130 522"/><path class="arrow" d="M1500 478 L1522 500 L1500 522"/>
  <g transform="translate(102 344)"><path d="M18 62 C62 2 118 2 152 62 C186 122 242 122 286 62 C242 2 186 2 152 62 C118 122 62 122 18 62 Z" fill="none" stroke="#66d9ff" stroke-width="7" stroke-linecap="round"/><circle cx="245" cy="39" r="17" fill="#ef3340"/><circle cx="245" cy="39" r="7" fill="#ffb0a5"/></g>
  <text x="92" y="494" class="step">01  TARGET TRAJECTORY</text><text x="92" y="544" class="node-title">3D figure-eight path</text><text x="92" y="588" class="node-key">Deterministic seed 42</text><text x="92" y="624" class="node-copy">Sinusoidal fruit position</text><text x="92" y="655" class="node-copy">300-frame trajectory</text>
  <g transform="translate(487 338)"><circle cx="40" cy="98" r="18" fill="#66d9ff"/><circle cx="106" cy="52" r="16" fill="#66d9ff"/><circle cx="180" cy="83" r="16" fill="#66d9ff"/><path d="M40 98 L106 52 L180 83" fill="none" stroke="#c7dae8" stroke-width="14" stroke-linecap="round"/><path d="M196 83 H247" stroke="#c7dae8" stroke-width="11" stroke-linecap="round"/><circle cx="272" cy="83" r="20" fill="#ef3340"/><path d="M260 83 h24 M272 71 v24" stroke="#ffffff" stroke-width="4"/></g>
  <text x="462" y="494" class="step">02  INVERSE KINEMATICS</text><text x="462" y="544" class="node-title">Solve hand pose</text><text x="462" y="588" class="node-key">Genesis position IK</text><text x="462" y="624" class="node-copy">Target 8 cm above fruit</text><text x="462" y="655" class="node-copy">Seven arm-joint targets</text>
  <g transform="translate(850 350)"><path d="M12 80 H62 L88 28 L126 126 L157 56 L192 91 H282" fill="none" stroke="#66d9ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="80" r="10" fill="#ef3340"/><circle cx="282" cy="91" r="10" fill="#47df9a"/></g>
  <text x="832" y="494" class="step">03  PD CONTROL</text><text x="832" y="544" class="node-title">Track joint targets</text><text x="832" y="588" class="node-key">Position feedback</text><text x="832" y="624" class="node-copy">Four physics steps/frame</text><text x="832" y="655" class="node-copy">Stable end-effector motion</text>
  <g transform="translate(1232 340)"><rect x="0" y="0" width="210" height="128" rx="18" fill="#0b2237" stroke="#3c779f" stroke-width="2"/><circle cx="105" cy="64" r="35" fill="#173d60" stroke="#66d9ff" stroke-width="7"/><circle cx="105" cy="64" r="15" fill="#ef3340"/><path d="M210 35 L276 8 V120 L210 93 Z" fill="#1d5074" stroke="#66d9ff" stroke-width="3"/></g>
  <text x="1202" y="494" class="step">04  RENDERING</text><text x="1202" y="544" class="node-title">Off-screen camera</text><text x="1202" y="588" class="node-key">Genesis GPU renderer</text><text x="1202" y="624" class="node-copy">960 x 540 frames</text><text x="1202" y="655" class="node-copy">Headless MP4 recording</text>
  <g transform="translate(1580 346)"><rect x="0" y="0" width="135" height="114" rx="14" fill="#0b2237" stroke="#3c779f"/><path d="M20 86 L50 60 L78 70 L112 29" fill="none" stroke="#66d9ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="112" cy="29" r="8" fill="#ef3340"/><rect x="155" y="0" width="126" height="114" rx="14" fill="#0b2237" stroke="#3c779f"/><path d="M198 30 V84 L246 57 Z" fill="#ffffff"/></g>
  <text x="1572" y="494" class="step">05  METRICS &amp; VIDEO</text><text x="1572" y="544" class="node-title">Reproducible output</text><text x="1572" y="588" class="node-key">Error + IK latency</text><text x="1572" y="624" class="node-copy">JSON metrics record</text><text x="1572" y="655" class="node-copy">Franka-following MP4</text>
  <g filter="url(#shadow)"><rect x="305" y="820" width="1310" height="128" rx="64" fill="url(#amd)"/></g><text x="960" y="870" text-anchor="middle" class="footer-main">AMD Radeon GPU  |  Genesis AMD GPU Backend  |  ROCm / HIP</text><text x="960" y="910" text-anchor="middle" class="footer-copy">GPU-accelerated simulation, inverse kinematics, physics, and off-screen rendering</text>
</svg>
