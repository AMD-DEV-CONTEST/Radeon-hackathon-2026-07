[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fluxreel"
version = "0.2.0"
description = "FluxReel — AMD GPU short-video studio: manage remote server, tunnel, model downloads, video generation"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32.0",
    "Pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "pyperclip>=1.8.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
fluxreel = "fluxreel.cli:main"
