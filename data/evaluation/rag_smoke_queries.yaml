- id: profile_circular_crop
  query: "Will important parts of this image be lost in a circular avatar crop?"
  enabled_packs: [profile_basics]
  expected_any_tags: [circle-crop, safe-area, edge-clipping]

- id: profile_small_text
  query: "Will the words and thin logo details remain readable at a small avatar size?"
  enabled_packs: [profile_basics]
  expected_any_tags: [small-text, thin-lines, small-size]

- id: privacy_hidden_location
  query: "Could this avatar file reveal where the photo was taken even if no location is visible?"
  enabled_packs: [privacy_safety]
  expected_any_tags: [exif, gps, geolocation]

- id: privacy_visible_badge
  query: "The background contains an employee badge. What information could it expose?"
  enabled_packs: [privacy_safety]
  expected_any_tags: [badge, name, employer, pii]

- id: professional_github_upload
  query: "What image format and size should I use for a GitHub profile picture?"
  enabled_packs: [global_professional_context]
  expected_any_tags: [github, file-format, file-size, dimensions]

- id: professional_discord_context
  query: "Can I use a different avatar for one Discord server without changing my primary avatar?"
  enabled_packs: [global_professional_context]
  expected_any_tags: [discord, per-server, context]

- id: professional_cartoon_rights
  query: "I prefer a cartoon-style avatar but want to reduce copyright risk. What artwork sources should I choose?"
  enabled_packs: [global_professional_context]
  expected_any_tags: [cartoon, copyright, license, permission, original-art]

- id: culture_bat
  query: "Does a bat motif have a documented association in Chinese art?"
  enabled_packs: [open_chinese_symbolism]
  expected_any_tags: [bat, blessings, chinese-art]

- id: culture_lotus
  query: "What contextual associations can a lotus carry in Chinese decorative art?"
  enabled_packs: [open_chinese_symbolism]
  expected_any_tags: [lotus, purity, harmony, chinese-art]
