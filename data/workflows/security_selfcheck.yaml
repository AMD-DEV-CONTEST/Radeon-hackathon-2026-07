id: security_selfcheck
title: 涉密与 AI 合规自检工作流
description: 允许的 AI 工具与数据外发约束自检
keywords:
- 安全自检
- 合规自检
- 涉密自检
engine: private_local
version: '1.0'
steps:
- id: ai
  label: 允许的 AI 工具
  type: tool
  tool: kb_search
  args:
    query: 涉密文档 AI 工具 PrivateLocalAgent
- id: privacy
  label: 数据外发约束
  type: tool
  tool: kb_search
  args:
    query: 客户名单 微信 明文密码
- id: note
  label: 写入合规备忘
  type: tool
  tool: write_note
  args:
    note: 已完成涉密/AI合规自检：仅本地 Agent，禁止公网粘贴机密。
requirement: ''
exports:
- yaml
- json
- dify
- langchain
