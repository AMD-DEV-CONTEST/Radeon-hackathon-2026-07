# profile_basics: 8 cards

- text: "Circular avatar frames remove the image corners. Keep faces, logos, and essential marks inside a centered safe area."
  pack: profile_basics
  source: xianglens_original
  tags: [circle-crop, safe-area, composition, corners]

- text: "A large source image can look clear while failing at avatar size. Review 32, 48, and 64 pixel previews before selecting it."
  pack: profile_basics
  source: xianglens_original
  tags: [small-size, preview, clarity, downscale]

- text: "Fine text and thin strokes often disappear when an image is reduced to avatar size. Do not make them carry the image's main meaning."
  pack: profile_basics
  source: xianglens_original
  tags: [small-text, thin-lines, legibility, downscale]

- text: "Multiple faces or competing objects become difficult to distinguish in a small avatar. A single primary focal subject is easier to recognize."
  pack: profile_basics
  source: xianglens_original
  tags: [multiple-subjects, focal-point, recognition, composition]

- text: "A subject that occupies only a small part of the frame may lose recognizability after downscaling. Increase subject occupancy without clipping it."
  pack: profile_basics
  source: xianglens_original
  tags: [subject-size, occupancy, recognition, framing]

- text: "A busy background adds competing edges and colors around the subject. A simpler background usually preserves separation at small sizes."
  pack: profile_basics
  source: xianglens_original
  tags: [busy-background, separation, small-size, composition]

- text: "Low contrast between the subject and background weakens the subject silhouette. Check separation in both light and dark interface themes."
  pack: profile_basics
  source: xianglens_original
  tags: [contrast, silhouette, background, light-theme, dark-theme]

- text: "A face or logo touching an image edge is vulnerable to crop adjustments. Leave visible breathing room around the primary subject."
  pack: profile_basics
  source: xianglens_original
  tags: [edge-clipping, margin, crop, framing]

# privacy_safety: 8 cards

- text: "An image file may contain GPS coordinates in embedded metadata. Inspect and remove geolocation fields before sharing an avatar."
  pack: privacy_safety
  source: exiftool_gps_tags
  tags: [exif, gps, geolocation, metadata, location]

- text: "EXIF metadata may record the camera make and model, capture time, and editing software. Remove fields that are unnecessary for the avatar's purpose."
  pack: privacy_safety
  source: exiftool_exif_tags
  tags: [exif, device-model, timestamp, software, metadata]

- text: "A visible QR code may encode a destination, contact detail, or identifier that is unreadable at a glance. Decode it before deciding whether the image is safe to share."
  pack: privacy_safety
  source: xianglens_original
  tags: [qr-code, link, identifier, disclosure]

- text: "A visible work or event badge may disclose a person's name, employer, role, or identifier. Crop or obscure it unless that disclosure is intentional."
  pack: privacy_safety
  source: nist_sp_800_122
  tags: [badge, name, employer, pii, disclosure]

- text: "Screens and documents in the background may expose email addresses, conversations, client names, or project details. Inspect the entire frame, not only the main subject."
  pack: privacy_safety
  source: xianglens_original
  tags: [screen, document, email, background, disclosure]

- text: "Street signs, transit maps, building names, and distinctive landmarks may reveal a location even when GPS metadata is absent."
  pack: privacy_safety
  source: xianglens_original
  tags: [street-sign, landmark, location, visual-disclosure]

- text: "A metadata-stripped derivative reduces hidden-data exposure but does not remove visible text, badges, screens, or landmarks. Run both metadata and visual checks."
  pack: privacy_safety
  source: xianglens_original
  tags: [safe-copy, metadata-removal, visible-risk, defense-in-depth]

- text: "Keep original avatar uploads only as long as the active task requires, and give the user a clear deletion control. Short retention reduces unnecessary privacy exposure."
  pack: privacy_safety
  source: nist_privacy_framework
  tags: [retention, deletion, user-control, data-minimization]

# global_professional_context: 10 cards

- text: "GitHub accepts PNG, JPG, or GIF profile pictures under 1 MB and smaller than 3000 by 3000 pixels. It recommends an image around 500 by 500 pixels for quality rendering."
  pack: global_professional_context
  source: github_profile_reference
  tags: [github, file-format, file-size, dimensions, upload]

- text: "A GitHub profile picture helps identify a user in pull requests, comments, contribution pages, and graphs. It should remain recognizable in repeated small appearances."
  pack: global_professional_context
  source: github_personalize_profile
  tags: [github, pull-request, comments, contributions, recognition]

- text: "GitHub includes a crop step when a new profile picture is uploaded. Check the cropped result instead of relying only on the source image."
  pack: global_professional_context
  source: github_personalize_profile
  tags: [github, crop, upload, preview]

- text: "GitHub states that details added to a public profile are visible to all GitHub users. Choose an avatar with a broad and international audience in mind."
  pack: global_professional_context
  source: github_profile_reference
  tags: [github, public-profile, audience, visibility]

- text: "LinkedIn requires a profile photo to reflect the member's likeness, although an illustration or artistic rendering of that person may be acceptable."
  pack: global_professional_context
  source: linkedin_photo_guidelines
  tags: [linkedin, likeness, illustration, policy]

- text: "LinkedIn may remove profile photos made solely from items such as a company logo, landscape, animal, words, flag, or another person's likeness."
  pack: global_professional_context
  source: linkedin_photo_guidelines
  tags: [linkedin, prohibited-image, logo, landscape, policy]

- text: "LinkedIn lets a member crop, reposition, resize, rotate, and set visibility for a profile photo. Review both the crop and audience setting before saving."
  pack: global_professional_context
  source: linkedin_photo_management
  tags: [linkedin, crop, visibility, audience, editing]

- text: "Discord per-server profiles let Nitro users set a different avatar for each server. The primary user avatar remains in servers without a server-specific avatar."
  pack: global_professional_context
  source: discord_per_server_profiles
  tags: [discord, per-server, context, identity, nitro]

- text: "Discord server avatars accept JPG, PNG, and GIF files up to 8 MB. After upload, the user can crop, center, and rotate the image."
  pack: global_professional_context
  source: discord_per_server_profiles
  tags: [discord, file-format, file-size, crop, upload]

- text: "Discord user profiles support uploaded PNG images and GIF avatars, with animated GIF avatars available to Nitro subscribers."
  pack: global_professional_context
  source: discord_custom_profiles
  tags: [discord, png, gif, animation, nitro]

# open_chinese_symbolism: 6 cards

- text: "The Met describes bats in Chinese art as symbols of blessings that often appear among longevity motifs. This art-historical association is contextual, not a universal reading of modern avatars."
  pack: open_chinese_symbolism
  source: met_longevity_chinese_art
  tags: [bat, blessings, longevity, chinese-art, contextual]

- text: "The Met connects peaches in Chinese art with stories of immortality and the Queen Mother of the West. This documented association does not predict how every viewer interprets a peach image."
  pack: open_chinese_symbolism
  source: met_longevity_chinese_art
  tags: [peach, immortality, longevity, chinese-art, contextual]

- text: "The Met presents cranes among Chinese longevity motifs and in imagery associated with the god of longevity. The association is historically situated rather than universal."
  pack: open_chinese_symbolism
  source: met_longevity_chinese_art
  tags: [crane, longevity, chinese-art, contextual]

- text: "A Smithsonian teaching guide documents bamboo in Chinese decorative art as associated with scholarly virtues, endurance, and long life. It should not be used to infer an avatar owner's personality."
  pack: open_chinese_symbolism
  source: smithsonian_cloisonne_symbols
  tags: [bamboo, endurance, scholar, chinese-art, contextual]

- text: "A Smithsonian teaching guide documents lotus associations with purity and harmony in Chinese decorative art. These meanings depend on cultural and historical context."
  pack: open_chinese_symbolism
  source: smithsonian_cloisonne_symbols
  tags: [lotus, purity, harmony, chinese-art, contextual]

- text: "A Smithsonian teaching guide describes the dragon in Chinese decorative art as associated with rain, power, and imperial imagery. This context does not establish one universal modern meaning."
  pack: open_chinese_symbolism
  source: smithsonian_cloisonne_symbols
  tags: [dragon, rain, power, imperial, chinese-art, contextual]
