name: CI/CD

on:
  push:
    branches: ["main", "add-parceltracking"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Build with Maven
        run: ./mvnw -B package -DskipTests
        working-directory: ./parceltracking

      - name: Run tests
        run: ./mvnw -B test
        working-directory: ./parceltracking

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./parceltracking
          file: ./parceltracking/Dockerfile
          push: true
          tags: ghcr.io/malu2555/parceltracking:latest
