name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    name: Unit tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Unit tests
        run: make test-unit

  all:
    name: Full suite
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # `make test-all` runs every layer: unit, integration, eval, perf,
      # security, negative-path, compile, and BDD. On GitHub-hosted runners
      # (no GPU, no local vLLM on :8000) the perf tests degrade gracefully:
      # test_inference_latency_within_limits skips when the server is down and
      # test_vram_usage_under_limit mocks the rocm-smi/nvidia-smi subprocess,
      # so PRs still gate on the deterministic mock-based checks.
      - name: Full suite
        run: make test-all
