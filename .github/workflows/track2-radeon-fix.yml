name: track2-radeon-fix tests

on:
  pull_request:
    paths:
      - "Track2-radeon-fix/**"
      - ".github/workflows/track2-radeon-fix.yml"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Track2-radeon-fix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
