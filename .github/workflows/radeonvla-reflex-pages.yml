name: Deploy RadeonVLA-Reflex website

on:
  push:
    branches:
      - submission/track3-visiobotlab-radeonvla-reflex
    paths:
      - .github/workflows/radeonvla-reflex-pages.yml
      - track3_VisioBotLab_RadeonVLA-Reflex/website/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout submission branch
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: track3_VisioBotLab_RadeonVLA-Reflex/website/package-lock.json

      - name: Install locked dependencies
        working-directory: track3_VisioBotLab_RadeonVLA-Reflex/website
        run: npm ci

      - name: Type-check and build
        working-directory: track3_VisioBotLab_RadeonVLA-Reflex/website
        run: npm run check

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: track3_VisioBotLab_RadeonVLA-Reflex/website/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
