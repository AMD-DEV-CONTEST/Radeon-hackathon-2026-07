# Server settings
server.port=8080
server.servlet.context-path=/api

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/linguabot}
spring.data.mongodb.auto-index-creation=true

# JWT Configuration
linguabot.jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLXNlY3JldC1rZXktZm9yLWxpbmd1YWJvdC1wcm9kdWN0aW9uLXJlYWR5LWp3dC10b2tlbi1nZW5lcmF0aW9u}
# Expiration: 24 hours (86400000 ms)
linguabot.jwt.expirationMs=86400000

# Gemini AI Integration Configuration (Direct HTTP API Client)
linguabot.gemini.apiKey=${GEMINI_API_KEY}
linguabot.gemini.apiUrl=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent

# Spring AI OpenAI Configuration
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.linguabot=DEBUG
