<!DOCTYPE html>
<html>
<head>
    <title>Search Results</title>
    <script>
        function performSearch(query) {
            fetch('/api/search?q=' + query)
                .then(r => r.json())
                .then(data => displayResults(data));
        }
    </script>
</head>
<body>
    <h1>Search Results</h1>
    <div id="results"></div>
</body>
</html>
