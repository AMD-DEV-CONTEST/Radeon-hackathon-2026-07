world_name: "Qingxi Rift"
world_name_zh: "青汐灵隙"
tagline: "In the cracks of a modern city, spirit energy flows through six affinities — and anyone may awaken a domain of their own."
ip_policy: >
  Never use names, places, or distinctive proper nouns from existing
  copyrighted anime/games/films (including but not limited to any
  well-known black-cat fairy franchises). All characters must be original.

affinities:
  - id: form
    name: "Form"
    name_zh: "形"
    description: "Reshaping matter and outer form."
    visual_keywords: ["shapeshift silhouette", "clay-like matter", "shadow morph"]
  - id: mind
    name: "Mind"
    name_zh: "念"
    description: "Willpower, runes and psychic interference."
    visual_keywords: ["runes", "psychic ripples", "pale blue glow"]
  - id: life
    name: "Life"
    name_zh: "生"
    description: "Growth, healing and vitality."
    visual_keywords: ["vines", "healing motes", "emerald light"]
  - id: matter
    name: "Matter"
    name_zh: "质"
    description: "Density, metal and gravity textures."
    visual_keywords: ["metal crystal", "gravity rings", "ore sheen"]
  - id: void
    name: "Void"
    name_zh: "空"
    description: "Spatial rifts and folded space."
    visual_keywords: ["spatial rift", "folded paper space", "deep purple cracks"]
  - id: time
    name: "Time"
    name_zh: "时"
    description: "Afterimages, delay and frozen instants."
    visual_keywords: ["afterimages", "amber freeze", "clock pendulum motifs"]

spirit_domain:
  name: "Spirit Domain"
  name_zh: "灵域"
  description: "The character's inner ability space, shaping combat posture and effect aesthetics."

style_guide:
  art: "anime character portrait, clean lineart, cel shading, expressive eyes, detailed hair, masterpiece"
  avoid: "photorealistic, NSFW, logo, watermark, text artifacts, extra fingers, blurry"

banned_substrings:
  - "罗小黑"
  - "老君"
  - "无限"
  - "Luo Xiaohei"
  - "The Legend of Luo Xiaohei"
