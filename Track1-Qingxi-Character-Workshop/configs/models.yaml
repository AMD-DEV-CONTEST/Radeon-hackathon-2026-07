llm:
  # 7B: much better JSON format adherence for demos. ~15GB FP16.
  # VRAM plan: LLM is unloaded before SDXL loads (see orchestrator),
  # so 24GB is enough even though the two never coexist.
  # Fallback if 24GB still tight: Qwen/Qwen2.5-3B-Instruct (~6GB).
  model_id: Qwen/Qwen2.5-7B-Instruct
  max_new_tokens: 1536
  temperature: 0.7

image:
  # Prefer a clearly licensed anime SDXL checkpoint; override on cloud after smoke test
  model_id: "cagliostrolab/animagine-xl-3.1"
  width: 832
  height: 1216
  steps: 30
  guidance: 6.0
  ref_scale: 0.65
  dtype: fp16
  enable_attention_slicing: true
  enable_vae_tiling: true
  lora_path: null
  lora_scale: 0.8
