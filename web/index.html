<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indie Game Asset Studio</title>
<link rel="stylesheet" href="/static/style.css?v=2">
</head>
<body>
<header>
  <div class="brand">
    <h1>INDIEGEN<span>·</span>ASSET STUDIO</h1>
    <p>独立游戏 AI 资产全链路生成 · 已接入 7 个工作流（W1 概念 → W7 3D）</p>
  </div>
</header>
<main>
  <section class="panel" id="form-panel">
    <h2>生成任务</h2>
    <div id="workflow-select"></div>
    <form id="job-form">
      <div id="dynamic-fields"></div>
      <div id="image-upload" class="hidden">
        <label for="server-image">选择服务器已有图片（输入/输出目录）</label>
        <div class="row">
          <select id="server-image"><option value="">— 上传新文件 —</option></select>
          <button type="button" id="refresh-files" class="ghost">刷新</button>
        </div>
        <label for="image-file">或上传本地图片</label>
        <input type="file" id="image-file" accept="image/*">
      </div>
      <div id="batch-field">
        <label for="batch-name">批次名称（同一批资产共用一个名字，留空自动按时间）</label>
        <input type="text" id="batch-name" placeholder="例如：废土酒吧">
      </div>
      <button type="submit" id="submit-btn" disabled>提交任务</button>
    </form>
  </section>
  <section class="panel" id="job-panel">
    <h2>任务列表</h2>
    <ul id="job-list"></ul>
    <div id="job-detail" class="hidden">
      <h3 id="detail-title"></h3>
      <div id="detail-status"></div>
      <div id="detail-preview"></div>
      <div id="detail-params"></div>
    </div>
  </section>
</main>
<script src="/static/app.js?v=2"></script>
</body>
</html>
