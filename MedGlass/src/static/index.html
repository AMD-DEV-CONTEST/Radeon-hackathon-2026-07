<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo App — MedGlass</title>
  <link rel="stylesheet" href="/static/style.css?v=4">
  <link rel="icon" type="image/png" href="/static/logo.png">
  <style>
    @font-face {
      font-family: "IBM Plex Sans";
      src: url("/static/fonts/plex-sans.woff2") format("woff2");
      font-weight: 100 1000;
      font-display: swap;
    }
    @font-face {
      font-family: "IBM Plex Mono";
      src: url("/static/fonts/plex-mono.woff2") format("woff2");
      font-weight: 400 500;
      font-display: swap;
    }
  </style>
</head>
<body>
  <svg style="display:none" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-logo" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 1.5A10.5 10.5 0 1 0 22.5 12 10.51 10.51 0 0 0 12 1.5Zm4 11.75h-2.75V16a1.25 1.25 0 0 1-2.5 0v-2.75H8a1.25 1.25 0 0 1 0-2.5h2.75V8a1.25 1.25 0 0 1 2.5 0v2.75H16a1.25 1.25 0 0 1 0 2.5Z"/>
    </symbol>
    <symbol id="i-notes" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5" y="3.5" width="14" height="17" rx="2.5"/><path d="M8.8 7.5h6.4M8.8 11.5h6.4M8.8 15.5h3.6"/>
    </symbol>
    <symbol id="i-live" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2.5 12h3l2.5-6.5 4 13 2.5-6.5h7"/>
    </symbol>
    <symbol id="i-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>
    </symbol>
    <symbol id="i-camera" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 8h2.2l1.6-2.2a1.6 1.6 0 0 1 1.3-.7h5.8a1.6 1.6 0 0 1 1.3.7L18 8h2a1.5 1.5 0 0 1 1.5 1.5V18a1.5 1.5 0 0 1-1.5 1.5H4A1.5 1.5 0 0 1 2.5 18V9.5A1.5 1.5 0 0 1 4 8Z"/><circle cx="12" cy="13.5" r="3.4"/>
    </symbol>
    <symbol id="i-swap" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 8h11m0 0-3-3m3 3-3 3M16 16H5m0 0 3 3m-3-3 3-3"/>
    </symbol>
    <symbol id="i-link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 14a4.5 4.5 0 0 0 6.3 0l2.4-2.4a4.5 4.5 0 0 0-6.4-6.4L11.2 6.3M14 10a4.5 4.5 0 0 0-6.3 0l-2.4 2.4a4.5 4.5 0 0 0 6.4 6.4l1.1-1.1"/>
    </symbol>
    <symbol id="i-logout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 4H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h2M15 8l4 4-4 4m4-4H9"/>
    </symbol>
    <symbol id="i-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.56-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.09a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.09a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.56 1.03Z"/>
    </symbol>
  </svg>

  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-logo" src="/static/logo.png" alt="MedGlass" onload="this.style.display='';var m=document.getElementById('brand-mark');if(m)m.style.display='none';" onerror="this.style.display='none'">
        <div class="logo" id="brand-mark"><svg><use href="#i-logo"/></svg></div>
        <div>
          <div class="brand-name">MedGlass</div>
          <div class="brand-sub">Clinical Scribe</div>
        </div>
      </div>
      <nav class="nav">
        <div class="nav-label">Workspace</div>
        <a href="/"><svg><use href="#i-notes"/></svg><span>Patient Notes</span></a>
        <a href="/live" class="active"><svg><use href="#i-live"/></svg><span>Demo App</span></a>
      </nav>
      <div class="sidebar-foot">
        <div class="user-chip">
          <div class="user-info">
            <div class="user-name">clinician</div>
            <div class="user-role">Clinician</div>
          </div>
          <div class="settings-wrap">
            <button class="settings-btn" id="btn-settings" title="Settings"><svg><use href="#i-settings"/></svg></button>
            <div class="settings-menu" id="settings-menu" hidden>
              <div class="settings-item static">Signed in as <b id="settings-user">clinician</b></div>
              <button class="settings-item danger" id="btn-logout"><svg><use href="#i-logout"/></svg> Sign out</button>
            </div>
          </div>
        </div>
      </div>
    </aside>

    <div class="main">
      <div class="topbar">
        <div>
          <div class="crumb">MedGlass / Demo App</div>
          <h1>Demo App</h1>
        </div>
      </div>

      <div class="content">
        <div class="live-grid">
          <div>
            <div class="card">
              <div class="card-head">
                <svg class="ic"><use href="#i-mic"/></svg>
                <h2>Record session</h2>
                <span class="hint" id="audio-state">not recording</span>
              </div>
              <div class="card-body">
                <div class="cam-wrap">
                  <video id="cam-preview" autoplay muted playsinline hidden></video>
                  <div class="cam-off" id="cam-off"><svg><use href="#i-mic"/></svg><span>Microphone ready — press Start session</span></div>
                </div>
                <div class="control-row" style="margin-top:12px">
                  <button id="btn-start" class="btn primary"><svg><use href="#i-mic"/></svg><span>Start session</span></button>
                  <button id="btn-photo" class="btn" title="Add a patient photo (stock)"><svg><use href="#i-camera"/></svg><span>Add photo</span></button>
                </div>
                <div class="photo-strip" id="photo-strip"></div>
                <div class="live-transcript" id="live-transcript" hidden>
                  <div class="lt-label">Live transcript</div>
                  <div class="lt-body" id="live-transcript-body"></div>
                </div>
                <div class="demo-msg" id="demo-msg" hidden></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/app.js?v=4"></script>
</body>
</html>
