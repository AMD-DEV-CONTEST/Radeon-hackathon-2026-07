[package]
name = "cesarops-forge-v2"
version = "0.2.0"
edition = "2021"
description = "Self-Healing Knowledge Translator — autonomous developer agent with diagnostic loop"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
