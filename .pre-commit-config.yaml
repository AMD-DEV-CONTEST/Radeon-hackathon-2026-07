# Development conventions: run `pre-commit install` after cloning.
# Ensures lint + formatting are enforced before every commit.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml
      # Prevent committing secrets
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=2000"]
