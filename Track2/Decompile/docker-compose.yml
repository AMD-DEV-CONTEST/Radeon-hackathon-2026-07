services:
  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    volumes: ["./backend:/app"]
  web:
    build: .
    command: npm run dev
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes: [".:/app", "/app/node_modules"]
    depends_on: [api]
