<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Autotuner project poster</title>
  <desc id="desc">Poster for a local agent that improves language model serving performance on AMD Radeon GPUs and exports reproducible evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a12"/>
      <stop offset="0.62" stop-color="#11162a"/>
      <stop offset="1" stop-color="#230d14"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3c4f"/>
      <stop offset="1" stop-color="#ff9f38"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ff4a50" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ff4a50" stop-opacity="0"/>
    </radialGradient>
    <filter id="softshadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .eyebrow { font: 800 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #ffad72; letter-spacing: 4px; }
      .body { font: 500 21px Inter, ui-sans-serif, system-ui, sans-serif; fill: #aab3cd; }
      .step { font: 800 22px Inter, ui-sans-serif, system-ui, sans-serif; fill: #ffffff; }
      .card { fill: #151b2d; stroke: #303a5b; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <ellipse cx="1660" cy="180" rx="420" ry="360" fill="url(#glow)"/>
  <ellipse cx="260" cy="1020" rx="460" ry="330" fill="#315aff" opacity="0.07"/>

  <text x="90" y="86" class="eyebrow">TRACK 2  |  AGENTIC AI  |  AMD RADEON + ROCm</text>
  <text x="88" y="238" class="sans" style="font-size:138px;font-weight:900;fill:#ffffff;letter-spacing:-7px">AUTOTUNER</text>
  <rect x="92" y="270" width="780" height="10" rx="5" fill="url(#hot)"/>
  <text x="92" y="338" class="sans" style="font-size:38px;font-weight:750;fill:#ffffff">The agent that makes its own deployment faster.</text>
  <text x="92" y="382" class="body">Private local inference. Controlled experiments. Reproducible Radeon evidence.</text>

  <g transform="translate(92 470)" filter="url(#softshadow)">
    <rect width="470" height="390" rx="30" class="card"/>
    <text x="34" y="56" class="eyebrow">THE PROBLEM</text>
    <text x="34" y="110" class="sans" style="font-size:31px;font-weight:800;fill:#ffffff">Local AI needs scarce</text>
    <text x="34" y="150" class="sans" style="font-size:31px;font-weight:800;fill:#ffffff">performance expertise.</text>
    <text x="34" y="210" class="body">Attention, cache, quantization,</text>
    <text x="34" y="242" class="body">batch capacity, memory, and</text>
    <text x="34" y="274" class="body">speculative decoding interact.</text>
    <text x="34" y="332" class="sans" style="font-size:22px;font-weight:750;fill:#ff9f70">Autotuner turns that loop into a product.</text>
  </g>

  <g transform="translate(610 438)">
    <rect x="0" y="0" width="700" height="470" rx="38" fill="#0f1424" stroke="#414c70" stroke-width="2"/>
    <text x="42" y="62" class="eyebrow">THE SELF TUNING LOOP</text>

    <circle cx="86" cy="125" r="26" fill="url(#hot)"/>
    <text x="78" y="133" class="sans" style="font-size:22px;font-weight:900;fill:#ffffff">1</text>
    <text x="132" y="132" class="step">Profile the active Radeon serving stack</text>

    <path d="M86 151 L86 185" stroke="#ff7651" stroke-width="5"/>
    <circle cx="86" cy="213" r="26" fill="url(#hot)"/>
    <text x="78" y="221" class="sans" style="font-size:22px;font-weight:900;fill:#ffffff">2</text>
    <text x="132" y="220" class="step">Ask the local model for a hypothesis</text>

    <path d="M86 239 L86 273" stroke="#ff7651" stroke-width="5"/>
    <circle cx="86" cy="301" r="26" fill="url(#hot)"/>
    <text x="78" y="309" class="sans" style="font-size:22px;font-weight:900;fill:#ffffff">3</text>
    <text x="132" y="308" class="step">Benchmark one allowlisted candidate</text>

    <path d="M86 327 L86 361" stroke="#ff7651" stroke-width="5"/>
    <circle cx="86" cy="389" r="26" fill="url(#hot)"/>
    <text x="78" y="397" class="sans" style="font-size:22px;font-weight:900;fill:#ffffff">4</text>
    <text x="132" y="396" class="step">Accept, reject, learn, and repeat</text>

    <path d="M600 388 C650 388 650 122 600 122" fill="none" stroke="#ff7651" stroke-width="4"/>
    <path d="M600 122 l18 -10 l0 20 z" fill="#ff7651"/>
  </g>

  <g transform="translate(1360 470)" filter="url(#softshadow)">
    <rect width="470" height="390" rx="30" class="card"/>
    <text x="34" y="56" class="eyebrow">THE OUTPUT</text>
    <text x="34" y="112" class="sans" style="font-size:34px;font-weight:850;fill:#ffffff">A preset you can use.</text>
    <text x="34" y="168" class="body">01  Winning serving configuration</text>
    <text x="34" y="208" class="body">02  Human readable engineering report</text>
    <text x="34" y="248" class="body">03  Visual experiment dashboard</text>
    <text x="34" y="288" class="body">04  Raw logs, telemetry, and profile</text>
    <rect x="34" y="326" width="402" height="3" fill="url(#hot)"/>
    <text x="34" y="365" class="sans" style="font-size:20px;font-weight:750;fill:#ffb27f">Every speed claim keeps its evidence.</text>
  </g>

  <g transform="translate(92 934)">
    <rect width="1738" height="86" rx="25" fill="#11182a" stroke="#2d3755" stroke-width="2"/>
    <text x="34" y="54" class="sans" style="font-size:25px;font-weight:800;fill:#ffffff">LOCAL MODEL</text>
    <text x="254" y="54" class="body">chooses</text>
    <text x="366" y="54" class="sans" style="font-size:25px;font-weight:800;fill:#ffffff">BOUNDED EXPERIMENT</text>
    <text x="682" y="54" class="body">produces</text>
    <text x="812" y="54" class="sans" style="font-size:25px;font-weight:800;fill:#ffffff">MEASURED RESULT</text>
    <text x="1082" y="54" class="body">exports</text>
    <text x="1182" y="54" class="sans" style="font-size:25px;font-weight:800;fill:#ffffff">PR READY PRESET + REPORT</text>
  </g>
</svg>
