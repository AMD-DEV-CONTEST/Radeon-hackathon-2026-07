<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Autotuner system architecture</title>
  <desc id="desc">A private local tuning loop where a Radeon hosted model selects bounded serving candidates, benchmarks them, applies constraints, and exports evidence.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b14"/>
      <stop offset="0.55" stop-color="#11172a"/>
      <stop offset="1" stop-color="#180d14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3f4e"/>
      <stop offset="1" stop-color="#ff9d3c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff7750"/>
    </marker>
    <style>
      .label { font: 700 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #eef2ff; }
      .small { font: 500 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #a7b0ca; }
      .micro { font: 700 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #ffad72; letter-spacing: 2px; }
      .box { fill: #151b2e; stroke: #303a5b; stroke-width: 2; }
      .flow { fill: none; stroke: #ff7750; stroke-width: 4; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="1370" cy="100" r="230" fill="#ff3f4e" opacity="0.07"/>
  <circle cx="150" cy="840" r="260" fill="#4568ff" opacity="0.07"/>

  <text x="90" y="92" class="micro">PRIVATE LOCAL PERFORMANCE ENGINEERING</text>
  <text x="90" y="155" style="font:800 54px Inter,ui-sans-serif,system-ui,sans-serif;fill:#ffffff">Autotuner on AMD Radeon</text>
  <text x="90" y="198" style="font:500 21px Inter,ui-sans-serif,system-ui,sans-serif;fill:#a7b0ca">The model serves the workload and helps tune the deployment that serves the model.</text>

  <g filter="url(#shadow)">
    <rect x="90" y="280" width="260" height="170" rx="24" class="box"/>
    <rect x="440" y="280" width="300" height="170" rx="24" class="box"/>
    <rect x="830" y="280" width="300" height="170" rx="24" class="box"/>
    <rect x="1220" y="280" width="290" height="170" rx="24" class="box"/>
  </g>

  <text x="120" y="320" class="micro">01 WORKLOAD</text>
  <text x="120" y="360" class="label">Fixed prompt suite</text>
  <text x="120" y="390" class="small">Concurrency</text>
  <text x="120" y="416" class="small">Generation length</text>

  <text x="470" y="320" class="micro">02 RADEON SERVING</text>
  <text x="470" y="360" class="label">Local vLLM candidate</text>
  <text x="470" y="390" class="small">ROCm attention and cache</text>
  <text x="470" y="416" class="small">Quantization and scheduler</text>

  <text x="860" y="320" class="micro">03 MEASUREMENT</text>
  <text x="860" y="360" class="label">Benchmark and profile</text>
  <text x="860" y="390" class="small">Tokens, latency, errors</text>
  <text x="860" y="416" class="small">rocprofv3 and Radeon telemetry</text>

  <text x="1250" y="320" class="micro">04 CONSTRAINT GATE</text>
  <text x="1250" y="360" class="label">Accept or reject</text>
  <text x="1250" y="390" class="small">Quality floor</text>
  <text x="1250" y="416" class="small">Latency and reliability limits</text>

  <path d="M350 365 C385 365 405 365 440 365" class="flow"/>
  <path d="M740 365 C775 365 795 365 830 365" class="flow"/>
  <path d="M1130 365 C1165 365 1185 365 1220 365" class="flow"/>

  <g filter="url(#shadow)">
    <rect x="330" y="570" width="370" height="190" rx="28" fill="#211821" stroke="#6d3542" stroke-width="2"/>
    <rect x="900" y="570" width="370" height="190" rx="28" fill="#151b2e" stroke="#303a5b" stroke-width="2"/>
  </g>

  <text x="365" y="615" class="micro">LOCAL RADEON AGENT</text>
  <text x="365" y="660" style="font:800 28px Inter,ui-sans-serif,system-ui,sans-serif;fill:#ffffff">Choose the next experiment</text>
  <text x="365" y="696" class="small">Reads measured history</text>
  <text x="365" y="723" class="small">Returns one allowlisted candidate and hypothesis</text>

  <text x="935" y="615" class="micro">REPRODUCIBLE OUTPUT</text>
  <text x="935" y="660" style="font:800 28px Inter,ui-sans-serif,system-ui,sans-serif;fill:#ffffff">Preset, report, dashboard</text>
  <text x="935" y="696" class="small">Raw JSON, logs, telemetry, profile</text>
  <text x="935" y="723" class="small">Configuration diff ready for review</text>

  <path d="M1365 450 C1365 530 1275 530 1275 665 L1270 665" class="flow"/>
  <path d="M1220 470 C1120 525 930 515 700 620" class="flow"/>
  <path d="M515 570 C515 505 590 500 590 450" class="flow"/>

  <rect x="90" y="820" width="1420" height="2" fill="url(#accent)" opacity="0.8"/>
  <text x="90" y="858" class="small">No hosted model required</text>
  <text x="525" y="858" class="small">No model generated commands</text>
  <text x="1020" y="858" class="small">Every decision keeps evidence</text>
</svg>
