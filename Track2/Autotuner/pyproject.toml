[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radeon-autotuner"
version = "0.1.0"
description = "A local agent that tunes language model serving on AMD Radeon GPUs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Team Autotuner" }
]
dependencies = []

[project.scripts]
autotuner = "autotuner.cli:main"

[tool.setuptools.packages.find]
include = ["autotuner*"]

[tool.setuptools.package-data]
"autotuner.data" = ["*.json"]
