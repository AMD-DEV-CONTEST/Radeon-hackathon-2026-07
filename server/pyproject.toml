[project]
name = "server"
version = "0.1.0"
description = "AgentVox FastAPI backend"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16.0",
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "langgraph>=1.2.10",
    "psycopg2-binary>=2.9.12",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.10.0",
    "python-jose[cryptography]>=3.5.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.52.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["E501"]
