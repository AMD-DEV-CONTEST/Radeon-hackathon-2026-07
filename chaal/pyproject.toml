[project]
name = "chaal"
version = "0.1.0"
description = "Quadruped locomotion trained end to end on a single AMD Radeon GPU"
requires-python = ">=3.10"
dependencies = [
    "genesis-world>=1.3.0",
    "rsl-rl-lib>=5.4.0",
    "typer>=0.12",
]

[project.scripts]
chaal = "chaal.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
