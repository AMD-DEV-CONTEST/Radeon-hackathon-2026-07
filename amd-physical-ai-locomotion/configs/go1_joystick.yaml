# Run configuration for the default quadruped task.
#
# These mirror the fields the code reads; the tuned PPO hyperparameters
# themselves come from mujoco_playground.config.locomotion_params.brax_ppo_config
# for this env name, so we do not duplicate them here.
#
# Quadruple options confirmed present in the Playground locomotion registry:
#   Go1JoystickFlatTerrain   (default, quadruped)
#   Go1JoystickRoughTerrain
#   G1JoystickFlatTerrain    (humanoid, alternative)
#   BerkeleyHumanoidJoystickFlatTerrain

env_name: Go1JoystickFlatTerrain
seed: 0

# Leave num_timesteps null to use Playground's tuned value (200M for Go1
# joystick). Set a small number (e.g. 200000) for a smoke test.
num_timesteps: null

# Headless render backend (AMD ROCm blog default).
mujoco_gl: osmesa
require_gpu: true
