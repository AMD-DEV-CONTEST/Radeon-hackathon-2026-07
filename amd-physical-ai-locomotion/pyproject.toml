[project]
name = "amd-physical-ai-locomotion"
version = "0.1.0"
description = "Quadruped/humanoid locomotion RL on AMD Radeon GPUs with ROCm (MuJoCo Playground / MJX-JAX)."
requires-python = ">=3.10"
readme = "README.md"

# NOTE: jax[rocm] is intentionally NOT a declared dependency here. The ROCm
# JAX wheel is ROCm-version specific and is installed out-of-band via
# scripts/00_verify_rocm.sh. See README.md.
dependencies = [
    "mujoco>=3.2.0",
    "mujoco-mjx>=3.2.0",
    "brax>=0.10.5",
    "mujoco-playground>=0.0.4",
    "ml_collections>=0.1.1",
    "etils>=1.7.0",
    "mediapy>=1.2.0",
    "tensorboardX>=2.6",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[tool.setuptools]
packages = ["src"]
