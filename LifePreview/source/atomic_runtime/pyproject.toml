[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "douyin-atomic-runtime"
version = "0.1.0"
description = "Runtime compatibility and historical upcasting for atomic operations"
requires-python = ">=3.11,<3.13"
dependencies = [
  "douyin-creative-shared-contracts==0.1.0",
]

[project.optional-dependencies]
test = [
  "pytest==8.3.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/atomic_runtime"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src", "../shared_contracts/src"]
