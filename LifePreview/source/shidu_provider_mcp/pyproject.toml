[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "douyin-shidu-provider-mcp"
version = "0.1.0"
description = "书单试读 Search/Reader MCP 本地网关"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "mcp>=1.28,<2",
  "opencc-python-reimplemented==0.1.7",
]

[project.scripts]
shidu-provider-mcp = "shidu_provider_mcp.gateway:main"

[tool.setuptools]
packages = ["shidu_provider_mcp"]

[tool.setuptools.package-dir]
shidu_provider_mcp = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
