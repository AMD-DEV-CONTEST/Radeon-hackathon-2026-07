# 分层模型路由：按任务复杂度把 agent 映射到不同级别的模型。
# 所有条目统一走 OpenAI-compatible 协议，因此远端 API 与本地推理可混用。
# 修改本文件即可整体换模型，无需改动任何 agent 代码。
#
# 当前配置只使用中台模型目录中锁定的两个官方模型 ID：
#   - 文本/结构化任务：阿里云百炼 Token Plan 的 qwen3.7-plus。
#   - 视觉质检：智谱 Coding Plan 的 glm-4.6v。
# Key 由 Creative Hub 加密保存并按具体任务注入，不再依赖后台手工环境变量。

tiers:
  # 高阶创意：故事圣经/人物设计/(可选)分镜。决定全剧质量，用最强模型。
  creative:
    provider: qwen
    base_url: https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
    api_key_env: QWEN_API_KEY
    model: qwen3.7-plus
    temperature: 0.7
    max_tokens: 16384

  # 通用结构化：场景设计/分镜表/改写。
  structure:
    provider: qwen
    base_url: https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
    api_key_env: QWEN_API_KEY
    model: qwen3.7-plus
    temperature: 0.4
    max_tokens: 16384          # 分镜大输出; 关思考后不再被推理吃掉预算(实测 399s→99s 且 JSON 完整)
    disable_thinking: true     # ★分镜/改写=结构化抽取, 关 GLM 推理: 更快 + 不截断 JSON + 不掐连接

  # 批量轻量：拆书/格式清洗/批量翻译(action_en)。量大，想省钱可换更便宜的 GLM。
  bulk:
    provider: qwen
    base_url: https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
    api_key_env: QWEN_API_KEY
    model: qwen3.7-plus
    temperature: 0.2
    max_tokens: 8192
    disable_thinking: true     # 拆书/翻译=格式化任务, 关推理更快更稳

  # 多模态视觉质检。★方案1(2026-06-22, headless)★ 质检视觉直调 GLM-4.6V SDK, 走【编程套餐 coding 端点】
  #   (与文本同端点同 key, 用户知情接受同款封号风险)。整条质检闭环已内化进 reviewer+pipeline,
  #   run.py 端到端自动跑、不依赖 Claude 窗口/MCP。覆盖确认: coding 端点支持 glm-4.6v/4.5v 视觉(出干净 JSON)。
  #   (旧"混合模式"=经 zai-mcp-server MCP 由 Claude Code 调, 已被方案1取代; 想切回设 review.vision_backend。)
  vision:
    provider: zhipu
    base_url: https://open.bigmodel.cn/api/coding/paas/v4
    api_key_env: ZHIPU_API_KEY
    model: glm-4.6v         # 编程套餐最强视觉; 直调 SDK 做关键帧/视频/整片质检
    temperature: 0.1
    max_tokens: 4096
    supports_vision: true

  # 文生图：人物参考图 / 场景参考图(智谱 CogView, 云端)。走 /images/generations。
  # ★注★ CogView 文生图【不在编程套餐内】, 仍走标准端点吃按量余额(余额空会 1113)。
  #   但角色锚现默认 assets.char_backend=qwen_local(本地 Qwen-Image base 自产), 已基本不依赖 CogView;
  #   仅多视图/表情拼图等会回退它。要用 CogView 需在标准端点充值。
  image:
    provider: zhipu
    base_url: https://open.bigmodel.cn/api/paas/v4/
    api_key_env: ZHIPU_API_KEY
    model: cogview-3-flash   # 临时(cogview-4 配额 429): 免费档; 配额恢复后改回 cogview-4-250304
