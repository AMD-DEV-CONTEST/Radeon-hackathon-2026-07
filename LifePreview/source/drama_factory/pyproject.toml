[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "douyin-drama-factory"
version = "0.1.0"
description = "File-backed novel-to-short-drama production pipeline for douyi_mcp"
requires-python = ">=3.11,<3.13"
dependencies = [
  "beautifulsoup4==4.14.3",
  "douyin-atomic-runtime==0.1.0",
  "douyin-creative-shared-contracts==0.1.0",
  "ebooklib==0.20",
  "lxml==6.0.2",
  "openai==2.17.0",
  "pypdf==6.6.2",
  "python-docx==1.2.0",
  "PyYAML==6.0.3",
  "requests==2.32.5",
]

[project.optional-dependencies]
test = [
  "pytest==8.3.4",
]

[project.entry-points."douyin.atomic_runtime.capabilities"]
drama = "drama.atomic_plugin:build_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/drama"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
filterwarnings = ["error"]
markers = [
  "real_provider: requires an explicitly enabled local Wan/Comfy GPU worker",
]
