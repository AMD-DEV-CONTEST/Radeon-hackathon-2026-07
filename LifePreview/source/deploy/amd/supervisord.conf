[unix_http_server]
file=%(ENV_AMD_ROOT)s/pids/supervisor.sock
chmod=0700

[supervisord]
nodaemon=false
pidfile=%(ENV_AMD_ROOT)s/pids/supervisord.pid
logfile=%(ENV_AMD_ROOT)s/logs/supervisord.log
childlogdir=%(ENV_AMD_ROOT)s/logs

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(ENV_AMD_ROOT)s/pids/supervisor.sock

[program:search-mcp]
command=/bin/bash -lc 'exec "$AMD_PROVIDER_BIN/shidu-provider-mcp" search --profile "$SHIDU_PROVIDER_MCP_PROFILE"'
directory=%(ENV_AMD_RELEASE_DIR)s
autostart=false
autorestart=unexpected
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=%(ENV_AMD_ROOT)s/logs/search-mcp.log
redirect_stderr=true

[program:reader-mcp]
command=/bin/bash -lc 'exec "$AMD_PROVIDER_BIN/shidu-provider-mcp" reader --profile "$SHIDU_PROVIDER_MCP_PROFILE"'
directory=%(ENV_AMD_RELEASE_DIR)s
autostart=false
autorestart=unexpected
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=%(ENV_AMD_ROOT)s/logs/reader-mcp.log
redirect_stderr=true

[program:comfyui]
command=/bin/bash -lc 'exec $AMD_ROCM_PYTHON "$AMD_COMFY_DIR/main.py" --listen 127.0.0.1 --port 18188 --disable-auto-launch --disable-all-custom-nodes --highvram --cache-none --reserve-vram 2 --input-directory "$AMD_ROOT/input" --output-directory "$AMD_ROOT/output" --user-directory "$AMD_ROOT/user" --database-url "sqlite:///$AMD_ROOT/user/comfyui.db"'
directory=%(ENV_AMD_COMFY_DIR)s
environment=HIP_VISIBLE_DEVICES="0",ROCR_VISIBLE_DEVICES="0"
autostart=false
autorestart=unexpected
startsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=%(ENV_AMD_ROOT)s/logs/comfyui.log
redirect_stderr=true

[program:shidu-api]
command=/bin/bash -lc 'exec "$AMD_BIN/shidu-api"'
directory=%(ENV_AMD_RELEASE_DIR)s
autostart=false
autorestart=unexpected
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=%(ENV_AMD_ROOT)s/logs/shidu-api.log
redirect_stderr=true

[program:vertical-slice-worker]
command=/bin/bash -lc 'exec "$AMD_BIN/shidu-amd-vertical-slice-worker" --poll-seconds 2'
directory=%(ENV_AMD_RELEASE_DIR)s
autostart=false
autorestart=unexpected
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=%(ENV_AMD_ROOT)s/logs/vertical-slice-worker.log
redirect_stderr=true

[program:research-worker]
command=/bin/bash -lc 'exec "$AMD_BIN/creative-hub-shidu-research-worker" --poll-interval 2'
directory=%(ENV_AMD_RELEASE_DIR)s
autostart=false
autorestart=unexpected
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=%(ENV_AMD_ROOT)s/logs/research-worker.log
redirect_stderr=true

[program:factory-core]
command=/bin/bash -lc 'exec "$AMD_BIN/creative-hub-dag-worker" --poll-interval 2'
directory=%(ENV_AMD_RELEASE_DIR)s
environment=CREATIVE_HUB_DAG_WORKER_PROFILE="factory-core",CREATIVE_HUB_DAG_WORKER_ID="factory-core-0"
autostart=false
autorestart=unexpected
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=%(ENV_AMD_ROOT)s/logs/factory-core.log
redirect_stderr=true

[program:video-local]
command=/bin/bash -lc 'exec "$AMD_BIN/creative-hub-dag-worker" --poll-interval 2 --gpu-index 0 --total-vram-mib "$AMD_GPU_TOTAL_VRAM_MIB" --free-vram-mib "$AMD_GPU_FREE_VRAM_MIB" --device-type cuda --model-digest "$AMD_KEYFRAME_MODEL_DIGEST" --model-digest "$AMD_VIDEO_MODEL_DIGEST" --workflow-digest "$AMD_KEYFRAME_WORKFLOW_DIGEST" --workflow-digest "$AMD_VIDEO_WORKFLOW_DIGEST" --custom-node-environment-digest "$AMD_KEYFRAME_NODE_ENV_DIGEST" --custom-node-environment-digest "$AMD_VIDEO_NODE_ENV_DIGEST" --implementation-manifest-digest "$AMD_KEYFRAME_IMPLEMENTATION_DIGEST" --implementation-manifest-digest "$AMD_VIDEO_IMPLEMENTATION_DIGEST"'
directory=%(ENV_AMD_RELEASE_DIR)s
environment=CREATIVE_HUB_DAG_WORKER_PROFILE="shidu-video-local",CREATIVE_HUB_DAG_WORKER_ID="video-local-0",HIP_VISIBLE_DEVICES="0",ROCR_VISIBLE_DEVICES="0"
autostart=false
autorestart=unexpected
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=%(ENV_AMD_ROOT)s/logs/video-local.log
redirect_stderr=true

[program:quality-control]
command=/bin/bash -lc 'exec "$AMD_BIN/creative-hub-dag-worker" --poll-interval 2'
directory=%(ENV_AMD_RELEASE_DIR)s
environment=CREATIVE_HUB_DAG_WORKER_PROFILE="quality-control",CREATIVE_HUB_DAG_WORKER_ID="quality-control-0",CREATIVE_HUB_QC_BACKEND_ENTRYPOINT="creative_hub.quality_cloud:build_qwen_quality_backend"
autostart=false
autorestart=unexpected
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=%(ENV_AMD_ROOT)s/logs/quality-control.log
redirect_stderr=true

[program:web]
command=/bin/bash -lc 'exec npm exec -- vite preview --host 127.0.0.1 --port 14289 --strictPort'
directory=%(ENV_AMD_WEB_DIR)s
autostart=false
autorestart=unexpected
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=%(ENV_AMD_ROOT)s/logs/web.log
redirect_stderr=true
