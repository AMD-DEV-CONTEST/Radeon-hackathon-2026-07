[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "radeon-code-agent"
version = "0.1.0"
description = "Inference-only repository repair agent for AMD Radeon Track 2"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "fire>=0.7,<1",
  "openai>=1.68,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
]

[project.scripts]
radeon-fix = "radeon_fix:main"

[tool.setuptools]
py-modules = [
  "mini_swe_runner",
  "radeon_fix",
  "track2_aider_entrypoint",
  "track2_api_probe",
  "track2_context_extract",
  "track2_dataset",
  "track2_demo",
  "track2_eval",
  "track2_harness_benchmark",
  "track2_prepare",
  "track2_qwen_code",
  "track2_runtime",
  "track2_swebench_harness",
]

[tool.setuptools.packages.find]
include = ["swe_experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
