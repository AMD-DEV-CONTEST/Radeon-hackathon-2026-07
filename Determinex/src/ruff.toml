target-version = "py311"
line-length = 100

# Not our code, and not our style debt.
#
#   work/                       ProgramBench eval scratch. Every subtree under it is a
#                               VENDORED UPSTREAM CHECKOUT (jq's own Python, etc.) that we
#                               unpack to run a benchmark against. 1,065 of the repo's 1,876
#                               diagnostics live here, so leaving it in means our real style
#                               debt is 57% noise and nobody reads the list.
#   assurance/demo_workspaces/  generated demo artifacts, including a .ipynb ruff cannot even
#                               parse. Regenerated by the harness, never hand-edited.
#
# This is deliberately NOT a blanket "make the linter quiet" exclusion: scripts/, tests/,
# determinex_trainer/ and rosetta/ stay in scope and still report 808 diagnostics, which are
# real and are recorded as debt rather than suppressed.
#   scripts/fine_tuning/venv/  a vendored virtualenv. UNTRACKED, so CI never sees it -- but
#                              ruff does, locally, which made every local count disagree with
#                              the count CI would produce. ruff excludes `.venv` by default
#                              and this one is not named that.
#   corpus/programbench/per_tool_overrides/  and  corpus/programbench/locked/
#                              VENDORED UPSTREAM CHECKOUTS. per_tool_overrides READS like a
#                              directory of our recipes and is ~142,750 files of which ~420
#                              are ours -- our compile.sh sits INSIDE a complete upstream
#                              tree. Linting it made CI's `ruff --fix` rewrite eleven
#                              conftest.py files, and the ones under osgeo__gdal / gromacs /
#                              duckdb are upstream's own (`from osgeo import gdal`), not ours.
#                              Excluded WHOLE, deliberately: publish_mirror allowlists this
#                              tree by basename for exactly this reason -- a blocklist leaks
#                              every upstream file nobody thought to name.
#                              corpus/programbench/families/ is NOT excluded; those 32
#                              scaffold generators are ours and stay linted.
exclude = [
    "work",
    "assurance/demo_workspaces",
    "scripts/fine_tuning/venv",
    "corpus/programbench/per_tool_overrides",
    "corpus/programbench/locked",
]

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long (formatter handles this)
    "B008",  # function call in default argument
    "B905",  # zip() without explicit strict
    "UP007", # X | Y union syntax (keep compat with 3.9)

    # E402 (module import not at top of file). MEASURED, not assumed: of the 166 files that
    # trip it, 159 (95%) do a bootstrap that MUST run before the import -- sys.path.insert so
    # `scripts/` resolves at all, load_dotenv, stdout.reconfigure(encoding=) -- and 2 more are
    # conditional/optional imports. Only 5 are genuinely scattered imports:
    #   determinex_trainer/merge_lora_to_ollama.py, scripts/determinex_cloak/__init__.py,
    #   scripts/mass_run_v2_aggregate.py, +2. Those are debt and are recorded as debt.
    # Enforcing the rule repo-wide would mean 366 noqa comments on a pattern the layout
    # requires, which trains everyone to stop reading the list. Classification script:
    # scratchpad e402_cause.py; re-run it before assuming this ratio still holds.
    "E402",
]

[lint.per-file-ignores]
"scripts/hive/*.py" = ["B"]
"dataset_generation/*.py" = ["ALL"]

[format]
quote-style = "double"
indent-style = "space"
