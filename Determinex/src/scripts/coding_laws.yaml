meta:
  title: "Determinex Coding Laws — Fix Pattern Reference"
  purpose: >
    Injected into Architect (planner) and Builder (patch generator) prompts. Canonical fix
    patterns for every common Python bug class found in real open-source repositories.
    When diagnosing a bug, scan the relevant category and apply the canonical fix.
    Rules apply regardless of identifier obfuscation — recognize patterns by STRUCTURE
    and SEMANTICS, not by name.
  injection_targets: [architect, builder]
  last_updated: "2026-05-03"
  law_count: 248

categories:

  - id: 1
    name: "Return Value Assignment — Most Common Silent Bug Class"
    laws:
      - id: LAW-001
        tags: [str, immutable, return-value, string-methods]
        rule: >
          str.replace(), str.strip(), str.lower(), str.upper(), str.lstrip(), str.rstrip() —
          strings are immutable. The return value IS the result. Always assign:
          s = s.replace(old, new). Calling without assignment is a no-op.
      - id: LAW-002
        tags: [re, regex, return-value, immutable]
        rule: >
          re.sub(), re.subn() return new strings. Always assign: s = re.sub(pat, rep, s).
      - id: LAW-003
        tags: [list, sort, sorted, in-place, return-value]
        rule: >
          list.sort() modifies in-place and returns None. sorted() returns a new list and does NOT
          modify in-place. lst = lst.sort() → lst is now None. Use lst.sort() OR lst = sorted(lst).
      - id: LAW-004
        tags: [list, in-place, return-value, append, extend]
        rule: >
          list.append(), list.extend(), list.insert(), list.remove(), list.reverse() modify
          in-place and return None. Never assign their return value.
      - id: LAW-005
        tags: [dict, update, in-place, return-value, merge]
        rule: >
          dict.update() modifies in-place, returns None. {**d1, **d2} creates a new merged dict
          (d2 wins conflicts). d |= other (Python 3.9+) merges in-place.
      - id: LAW-006
        tags: [set, in-place, return-value]
        rule: >
          set.add(), set.discard(), set.update(), set.remove() modify in-place, return None.
          set | other returns a new set.
      - id: LAW-007
        tags: [bytes, bytearray, return-value, immutable]
        rule: >
          bytes.replace(), bytearray.replace() return new objects. Always assign.
      - id: LAW-008
        tags: [pathlib, Path, return-value]
        rule: >
          pathlib.Path operations — .resolve(), .with_suffix(), .with_name(), .relative_to(),
          .parent — all return new Path objects. Always assign.
      - id: LAW-009
        tags: [frozenset, tuple, sorted, reversed, iterator, return-value]
        rule: >
          frozenset(), tuple(), sorted(), reversed() always return new objects.
          reversed() returns an iterator — wrap in list() to reuse.
      - id: LAW-010
        tags: [pandas, DataFrame, inplace, return-value]
        rule: >
          Pandas: df.sort_values(), df.dropna(), df.fillna(), df.rename(), df.reset_index(),
          df.drop(), df.astype(), df.merge(), df.join() return new DataFrames by default
          (unless inplace=True). Always assign the result OR use inplace=True.
      - id: LAW-011
        tags: [sympy, immutable, return-value]
        rule: >
          SymPy: ALL sympy operations return new expressions — expr.subs(), simplify(), expand(),
          factor(), collect(), cancel(), trigsimp(). SymPy objects are immutable.
          ALWAYS assign: expr = expr.subs(x, 1).
      - id: LAW-012
        tags: [collections, OrderedDict, Counter, deque, return-value]
        rule: >
          collections.OrderedDict, collections.Counter, collections.deque operations: check each
          method — .appendleft() is in-place; .copy() returns new; .most_common() returns a list.

  - id: 2
    name: "Numpy Array Views vs. Copies — In-Place Modification"
    laws:
      - id: LAW-013
        tags: [numpy, view, copy, slice-assignment, chararray, FITS]
        rule: >
          np.ndarray.replace(), np.char.replace(), chararray.replace() return NEW arrays. The
          return value must be assigned. For a standalone variable: arr = arr.replace(...).
          For a VIEW into a larger structure (FITS column, structured array field, record array):
          use SLICE ASSIGNMENT: arr[:] = arr.replace(...). Simple arr = arr.replace(...) rebinds
          the local name but does NOT write back to the underlying buffer.
      - id: LAW-014
        tags: [numpy, view, copy, slice, fancy-indexing, boolean-indexing]
        rule: >
          Array slicing creates a VIEW (shares memory): view = arr[1:5]. Modifying view modifies
          arr. Fancy indexing (arr[[0,1,2]]) and boolean indexing (arr[mask]) always create
          COPIES. .copy() always creates a copy.
      - id: LAW-015
        tags: [numpy, slice-assignment, in-place, rebind]
        rule: >
          To modify an array in-place use SLICE ASSIGNMENT: arr[:] = new_values writes into the
          existing buffer. Simple arr = new_values rebinds the local name — the original array is
          unaffected. Critical for array views and function arguments.
      - id: LAW-016
        tags: [numpy, reshape, view, copy]
        rule: >
          np.reshape() returns a VIEW when possible (C-contiguous input). On non-contiguous arrays
          it returns a copy. Always assign the result; never rely on reshape modifying in-place.
      - id: LAW-017
        tags: [numpy, structured-array, record-array, view, field-access]
        rule: >
          Structured / record arrays: field access record['field'] returns a VIEW. Assigning into
          it record['field'][:] = data writes back. record['field'] = data may or may not
          depending on the dtype and assignment target context.
      - id: LAW-018
        tags: [numpy, squeeze, expand_dims, transpose, view]
        rule: >
          np.squeeze(), np.expand_dims(), np.transpose(), arr.T return views. Always assign.
      - id: LAW-019
        tags: [numpy, function-argument, slice-assignment, in-place]
        rule: >
          When a function receives an array parameter and the calling code expects the array to be
          modified in-place: the function must use slice assignment (param[:] = ...) not simple
          rebinding (param = ...).
      - id: LAW-020
        tags: [numpy, comparison, array-equal, boolean-array]
        rule: >
          np.array_equal(a, b) for element-wise equality check that returns a single bool. a == b
          returns an element-wise boolean array — don't use in if.

  - id: 3
    name: "Regular Expressions"
    laws:
      - id: LAW-021
        tags: [re, regex, case-insensitive, IGNORECASE]
        rule: >
          For case-insensitive matching: use re.compile(pattern, re.IGNORECASE) or the (?i) inline
          flag at the START of the pattern string. NEVER use character classes like [Aa],
          [Rr][Ee][Aa][Dd] for case-insensitivity — they match ONE character at a time, not words.
          (?i:READ SERR) applies the flag only to the enclosed group.
      - id: LAW-022
        tags: [re, regex, match, search, anchor]
        rule: >
          re.match() anchors to the START of the string. re.search() finds a match ANYWHERE in
          the string. The bug is often using match() when search() is needed (or vice versa).
      - id: LAW-023
        tags: [re, regex, fullmatch, validation]
        rule: >
          re.fullmatch() requires the ENTIRE string to match the pattern. Use for validation.
          Missing this causes partial matches to pass validation.
      - id: LAW-024
        tags: [re, regex, DOTALL, multiline]
        rule: >
          re.DOTALL (or re.S) makes . match newlines too. Without it, . stops at \n. For patterns
          that must span multiple lines: add re.DOTALL.
      - id: LAW-025
        tags: [re, regex, MULTILINE, anchors]
        rule: >
          re.MULTILINE (or re.M) makes ^ and $ match start/end of each LINE, not just the whole
          string. Without it, ^ and $ only match the very start/end.
      - id: LAW-026
        tags: [re, regex, greedy, non-greedy]
        rule: >
          Greedy vs. non-greedy: .* is greedy (matches as much as possible). .*? is non-greedy
          (matches as little as possible). Bug: .* consumes too much, misses the intended capture.
      - id: LAW-027
        tags: [re, regex, compile, performance]
        rule: >
          re.compile() with flags is more efficient than passing flags to every call. When the same
          pattern is used repeatedly, always compile it.
      - id: LAW-028
        tags: [re, regex, named-groups]
        rule: >
          Named groups: (?P<name>...) in pattern, m.group('name') to retrieve. Positional m.group(1)
          breaks when group order changes. Prefer named groups.
      - id: LAW-029
        tags: [re, regex, escape, user-input]
        rule: >
          re.escape(s) is required when treating user input or dynamic strings as literal pattern
          content (not regex syntax).
      - id: LAW-030
        tags: [re, regex, findall, groups]
        rule: >
          re.findall() with ONE group returns a list of strings of that group. With MULTIPLE groups
          returns a list of tuples. With NO groups returns a list of entire match strings.
      - id: LAW-031
        tags: [re, regex, split, groups]
        rule: >
          re.split(pattern, string) — if the pattern contains a group, the group's content is
          included in the split result list. Often surprising.

  - id: 4
    name: "Exception Handling"
    laws:
      - id: LAW-032
        tags: [exception, except, specificity]
        rule: >
          except Exception: catches all non-system-exiting exceptions. except BaseException: also
          catches KeyboardInterrupt, SystemExit, GeneratorExit. Always be as specific as possible
          about which exception to catch.
      - id: LAW-033
        tags: [exception, bare-except, KeyboardInterrupt]
        rule: >
          Bare except: catches EVERYTHING including KeyboardInterrupt. Almost always wrong.
          Use except Exception: at minimum.
      - id: LAW-034
        tags: [exception, raise, traceback, re-raise]
        rule: >
          raise (no args) re-raises the current exception preserving the original traceback.
          raise e creates a new traceback from the current line. Prefer bare raise inside except
          blocks to preserve context.
      - id: LAW-035
        tags: [exception, chaining, from, context, cause]
        rule: >
          Exception chaining: raise NewError("msg") from original_error preserves cause.
          raise NewError("msg") from None explicitly suppresses the chain. Using raise NewError
          without from implicitly chains via __context__.
      - id: LAW-036
        tags: [exception, try, finally, cleanup]
        rule: >
          try/finally — the finally block runs even on return, break, or continue. Code in finally
          that reads function return values won't see them correctly. Use for cleanup only.
      - id: LAW-037
        tags: [exception, try, else]
        rule: >
          try/except/else — the else block runs ONLY if no exception was raised in try. Use it
          for code that should only run on success, keeping it visually separate from the try body.
      - id: LAW-038
        tags: [exception, anti-pattern, silent, swallow]
        rule: >
          Catching broad exceptions and returning defaults can hide real bugs:
          except Exception: return None. This is a common anti-pattern in library code that
          silently swallows errors.
      - id: LAW-039
        tags: [exception, ExceptionGroup, asyncio, Python311]
        rule: >
          ExceptionGroup (Python 3.11+) for handling multiple concurrent exceptions from TaskGroup
          or asyncio.gather(). Use except* TypeError syntax to catch from a group.
      - id: LAW-040
        tags: [exception, ValueError, TypeError, correct-type]
        rule: >
          ValueError vs TypeError: ValueError for wrong value of the right type; TypeError for
          wrong type entirely. Raising the wrong one is a common bug.

  - id: 5
    name: "OOP: Classes, Inheritance, Properties"
    laws:
      - id: LAW-041
        tags: [oop, super, __init__, inheritance]
        rule: >
          super().__init__() must be called in subclass __init__ BEFORE using any parent
          attributes. Missing super().__init__() leaves parent state uninitialized.
      - id: LAW-042
        tags: [oop, super, __init__, parameter, kwargs]
        rule: |
          To ADD a parameter to a subclass __init__: add it with a default, use it locally, then
          pass remaining kwargs to super(). Both the signature AND the super() call need updating.
          Missing either one breaks the parameter chain:
            def __init__(self, new_param=None, **kwargs):
                self.new_param = new_param
                super().__init__(**kwargs)
      - id: LAW-043
        tags: [oop, __init__, attribute, parameter, signature]
        rule: >
          Adding self.new_attr = None inside __init__ is NOT the same as adding new_attr=None as
          a PARAMETER. The former adds an attribute (with fixed default); the latter makes the
          parameter PASSABLE by callers. Bug: caller passes new_attr=x, gets TypeError because the
          parameter doesn't exist in the signature.
      - id: LAW-044
        tags: [oop, property, getter, setter]
        rule: >
          @property defines a getter. Without @name.setter, assignment raises AttributeError.
          The setter name MUST match the property name exactly.
      - id: LAW-045
        tags: [oop, classmethod, staticmethod, cls]
        rule: >
          @classmethod receives the CLASS as first arg (cls). @staticmethod receives no implicit
          first arg. Choosing wrong affects subclass behavior: classmethod returns an instance of
          the SUBCLASS when called on it; staticmethod does not.
      - id: LAW-046
        tags: [oop, __slots__, dynamic-attributes]
        rule: >
          __slots__ prevents adding dynamic attributes not in the list. A class with __slots__
          cannot have a __dict__ by default. Setting unlisted attributes raises AttributeError.
      - id: LAW-047
        tags: [oop, MRO, multiple-inheritance, super]
        rule: >
          MRO (Method Resolution Order): Python uses C3 linearization. super() follows MRO. In
          multiple/diamond inheritance, super() ensures each class in the chain is called once.
      - id: LAW-048
        tags: [oop, __new__, __init__, instance-creation]
        rule: >
          __new__ creates the instance (must return it). __init__ initializes it (must return
          None). Bug: __new__ that doesn't call super().__new__(cls) returns the wrong type.
      - id: LAW-049
        tags: [oop, __repr__, __str__]
        rule: >
          __repr__ should return a string that could recreate the object. __str__ is for human
          display. If only __repr__ is defined, Python uses it for both.
      - id: LAW-050
        tags: [oop, __eq__, __hash__, NotImplemented]
        rule: >
          __eq__ returning NotImplemented (not raising) lets Python try the other operand's __eq__.
          Define __hash__ whenever you define __eq__, or set __hash__ = None for mutable classes
          (making them unhashable).
      - id: LAW-051
        tags: [oop, __getattr__, __getattribute__, infinite-recursion]
        rule: >
          __getattr__ is called only when normal attribute lookup FAILS. __getattribute__ is called
          for EVERY attribute access. Infinite recursion in __getattribute__: calling self.x
          triggers __getattribute__ again. Use object.__getattribute__(self, 'x').
      - id: LAW-052
        tags: [oop, abc, abstractmethod, instantiation]
        rule: >
          Abstract methods: @abc.abstractmethod requires subclasses to implement before
          instantiation. Instantiating with unimplemented abstract methods raises TypeError.
      - id: LAW-053
        tags: [oop, dataclass, default_factory, mutable-default]
        rule: >
          @dataclass auto-generates __init__, __repr__, __eq__. Mutable default values MUST use
          field(default_factory=list) NOT field(default=[]) (raises ValueError).
      - id: LAW-054
        tags: [oop, class-attribute, shared-state, mutable]
        rule: >
          Class-level mutable attributes are SHARED by all instances: class Foo: items = [] — ALL
          instances share the same list. Always initialize per-instance in __init__: self.items = [].

  - id: 6
    name: "Mutable Default Arguments"
    laws:
      - id: LAW-055
        tags: [mutable-default, function-default, list, dict, set]
        rule: |
          NEVER use mutable objects as default arguments: def f(x=[]), def f(x={}), def f(x=set()).
          The default object is created ONCE at function definition time and shared across all calls.
          Use None and create inside:
            def f(x=None):
                if x is None:
                    x = []
      - id: LAW-056
        tags: [mutable-default, or-operator, falsy, None]
        rule: >
          def f(x=None): x = x or [] — beware: or treats 0, False, "" as falsy too. Prefer
          explicit if x is None: x = [] when those values are valid inputs.
      - id: LAW-057
        tags: [mutable-default, __init__, instance, shared-state]
        rule: >
          This bug is subtle in methods: def __init__(self, data=[]) — ALL instances share the
          same default list object. Any mutation of self.data in one instance affects all.

  - id: 7
    name: "None and Boolean Comparisons"
    laws:
      - id: LAW-058
        tags: [None, comparison, is, equality]
        rule: >
          Always use is None / is not None for None checks. NEVER use == None or != None.
          The == operator can be overloaded (pandas/numpy override it to return arrays).
      - id: LAW-059
        tags: [None, truthiness, falsy, zero, empty]
        rule: >
          if x: is False for None, 0, 0.0, "", [], {}, set(). Use if x is not None: when you
          want to allow 0, False, or empty collections as valid values.
      - id: LAW-060
        tags: [None, truthiness, not, empty]
        rule: >
          if not x: catches None, 0, "", [], {} in one expression — correct for "missing or empty"
          semantics, wrong if 0 or False are valid non-empty values.
      - id: LAW-061
        tags: [numpy, pandas, array-truthiness, any, all]
        rule: >
          Numpy/pandas array truthiness: if arr: raises ValueError for multi-element arrays.
          Use arr.any(), arr.all(), len(arr) > 0, or arr.size > 0.
      - id: LAW-062
        tags: [bool, truthiness, is-True, equality]
        rule: >
          if x == True: → use if x:. if x is True: checks the exact object True, not truthiness.
          Almost never what you want.
      - id: LAW-063
        tags: [numpy, NDData, mask, is-None, attribute-check]
        rule: >
          operand.mask is None vs operand is None: when the object has a .mask attribute (NDData,
          masked arrays), the intent is usually to check if the MASK is absent, not whether the
          object itself is None.

  - id: 8
    name: "Type Checking and Conversion"
    laws:
      - id: LAW-064
        tags: [isinstance, type, subclass, type-check]
        rule: >
          isinstance(x, (A, B)) checks for either type and includes subclasses. type(x) is A
          checks EXACT type only, excluding subclasses. Prefer isinstance unless you explicitly
          want to exclude subclasses.
      - id: LAW-065
        tags: [division, floor-division, Python3, integer]
        rule: >
          Python 3: / is always float division. // is floor division (returns int for int inputs).
          3/2 = 1.5, 3//2 = 1. Common bug in code ported from Python 2.
      - id: LAW-066
        tags: [str, bytes, decode, encode, conversion]
        rule: >
          str(b'bytes') → "b'bytes'" (includes b'' prefix). .decode('utf-8') → 'bytes' (the string
          content). Use .decode() to convert bytes to str.
      - id: LAW-067
        tags: [bytes, conversion, int-list, encode]
        rule: >
          bytes(n) creates n zero bytes. bytes([65, 66]) creates from int list. bytes('text',
          'utf-8') is equivalent to 'text'.encode('utf-8').
      - id: LAW-068
        tags: [int, float, round, ceil, floor, truncation]
        rule: >
          int("3") converts string to int. int(3.7) truncates (→ 3). round(3.7) → 4.
          math.ceil(3.2) → 4. math.floor(3.7) → 3. Be explicit about which behavior is intended.
      - id: LAW-069
        tags: [bool, int, subclass, arithmetic]
        rule: >
          bool is a subclass of int. True == 1 and False == 0 are both True. This can cause subtle
          bugs in comparisons and arithmetic.
      - id: LAW-070
        tags: [enum, comparison, value]
        rule: >
          Enum comparisons: MyEnum.VALUE == 'string' is always False; compare with
          MyEnum.VALUE.value == 'string' or use MyEnum('string') to get the enum member.

  - id: 9
    name: "Iteration and Generators"
    laws:
      - id: LAW-071
        tags: [generator, exhausted, one-pass, list]
        rule: >
          Generators are exhausted after ONE pass. gen = (x for x in range(10)) → after list(gen),
          iterating again gives nothing. If you need multiple passes, use a list.
      - id: LAW-072
        tags: [dict, view, mutation, RuntimeError, iteration]
        rule: >
          dict.keys(), dict.values(), dict.items() return VIEWS (Python 3). They reflect mutations
          to the dict. Iterating while mutating the dict → RuntimeError. Fix: iterate over
          list(d.keys()).
      - id: LAW-073
        tags: [zip, map, filter, reversed, iterator, lazy, Python3]
        rule: >
          zip(), map(), filter(), reversed() return ITERATORS in Python 3 (lazy). Wrap in list()
          to materialize. They are exhausted after one pass.
      - id: LAW-074
        tags: [zip, zip_longest, shortest, itertools]
        rule: >
          zip(*iterables) stops at the SHORTEST iterable. Use itertools.zip_longest() to fill
          missing values with None (or a specified fill value).
      - id: LAW-075
        tags: [enumerate, start, 1-indexed]
        rule: >
          enumerate(iterable, start=0) — the start parameter sets the initial count value.
          enumerate(items, 1) for 1-indexed counting.
      - id: LAW-076
        tags: [generator, yield-from, StopIteration, send, throw]
        rule: >
          yield from iterable delegates to a sub-generator and forwards send()/throw() calls.
          Do NOT manually raise StopIteration inside a generator (Python 3.7+: this causes a
          RuntimeError instead of stopping cleanly).
      - id: LAW-077
        tags: [list, iteration, mutation, skip-elements]
        rule: >
          Modifying a list while iterating over it directly skips elements. Always iterate over
          a copy for item in list_copy: or build a new list with comprehension.
      - id: LAW-078
        tags: [itertools, chain, flatten, from_iterable]
        rule: >
          itertools.chain.from_iterable(iterable_of_iterables) lazily flattens one level.
          itertools.chain(*iterables) takes multiple iterables directly as arguments.

  - id: 10
    name: "Numeric Operations and Precision"
    laws:
      - id: LAW-079
        tags: [float, precision, isclose, comparison]
        rule: >
          Floating point is inexact: 0.1 + 0.2 != 0.3. For comparison use math.isclose(a, b,
          rel_tol=1e-9). In tests: assert abs(a - b) < tolerance.
      - id: LAW-080
        tags: [decimal, Decimal, exact-arithmetic, financial]
        rule: >
          decimal.Decimal for exact base-10 arithmetic (financial, parsing). More expensive than
          float but avoids representation errors.
      - id: LAW-081
        tags: [numpy, integer, overflow, int64, arbitrary-precision]
        rule: >
          Python int has arbitrary precision. Numpy integers DO overflow: np.int32(2**31) wraps
          silently. Use np.int64 or Python int when overflow is possible.
      - id: LAW-082
        tags: [nan, IEEE754, isnan, comparison]
        rule: >
          nan != nan is True (IEEE 754). Use math.isnan() or np.isnan() to test for NaN.
          x is float('nan') does NOT work (nan objects are not singletons).
      - id: LAW-083
        tags: [division-by-zero, ZeroDivisionError, numpy, inf, nan]
        rule: >
          Division by zero: Python raises ZeroDivisionError for int/float. Numpy produces inf or
          nan silently. Check with np.isinf(), np.isnan().
      - id: LAW-084
        tags: [round, banker-rounding, round-half-up, decimal]
        rule: >
          round(2.5) = 2 in Python 3 (banker's rounding: round to even). round(3.5) = 4. For
          traditional rounding: math.floor(x + 0.5) or decimal.ROUND_HALF_UP.
      - id: LAW-085
        tags: [abs, numpy, complex, arrays]
        rule: >
          abs() for Python scalars. np.abs() for arrays. They differ on complex numbers — both
          return magnitude. Use the numpy version for arrays.

  - id: 11
    name: "Strings and Bytes"
    laws:
      - id: LAW-086
        tags: [str, join, concatenation, performance, O(n)]
        rule: >
          ''.join(list_of_strings) is O(n). Repeated string concatenation in a loop s = s + piece
          is O(n²). Always use join for building strings in loops.
      - id: LAW-087
        tags: [str, split, whitespace, empty-strings]
        rule: >
          str.split(sep) with explicit separator preserves empty strings. str.split() with no args
          splits on ANY whitespace sequence and removes empty strings.
      - id: LAW-088
        tags: [str, splitlines, line-endings, CRLF]
        rule: >
          str.splitlines() handles \n, \r\n, \r, and Unicode line separators. str.split('\n') only
          splits on \n and preserves empty strings at line ends.
      - id: LAW-089
        tags: [str, startswith, endswith, tuple, prefix]
        rule: >
          str.startswith() and str.endswith() accept a TUPLE of prefixes/suffixes:
          s.startswith(('http://', 'https://')). More efficient than multiple or-checks.
      - id: LAW-090
        tags: [str, f-string, format, repr, alignment]
        rule: >
          f"{val!r}" uses repr(), f"{val!s}" uses str(), f"{val!a}" uses ascii(). f"{val:.2f}"
          formats float to 2 decimal places. f"{val:>10}" right-aligns in 10 chars.
      - id: LAW-091
        tags: [str, textwrap, dedent, multiline, indentation]
        rule: >
          textwrap.dedent() removes common leading whitespace from multiline strings. Useful for
          triple-quoted strings in indented code.
      - id: LAW-092
        tags: [str, bytes, encode, decode, boundary, Python3]
        rule: >
          Bytes and str are different types in Python 3. b'hello' == 'hello' is always False.
          Must explicitly encode/decode at the boundary.
      - id: LAW-093
        tags: [open, file, binary, encoding, newline, utf-8]
        rule: >
          open() default mode is 'r' (text). For binary: 'rb', 'wb'. Text mode applies newline
          translation (platform-specific). Binary mode does not. Always specify encoding='utf-8'
          for cross-platform text files.

  - id: 12
    name: "Dictionaries and Collections"
    laws:
      - id: LAW-094
        tags: [dict, get, default, KeyError]
        rule: >
          dict.get(key, default) returns default if key is missing without raising KeyError.
          dict[key] raises KeyError. Use .get() defensively.
      - id: LAW-095
        tags: [dict, setdefault, grouping, default]
        rule: >
          dict.setdefault(key, default) sets AND returns the default if key is missing, otherwise
          returns the existing value — atomically. Useful for grouping:
          d.setdefault(key, []).append(item).
      - id: LAW-096
        tags: [collections, defaultdict, factory, missing-key]
        rule: >
          collections.defaultdict(factory) — accessing a missing key calls factory() to create the
          default. More efficient than setdefault for repeated access patterns.
      - id: LAW-097
        tags: [collections, Counter, frequency, most_common]
        rule: >
          collections.Counter for frequency counting. Can be added/subtracted. .most_common(n)
          for top-n. counter.update(iterable) adds counts.
      - id: LAW-098
        tags: [collections, deque, maxlen, FIFO, circular-buffer]
        rule: >
          collections.deque(maxlen=N) — fixed-size FIFO queue. Appending beyond maxlen drops the
          oldest element automatically.
      - id: LAW-099
        tags: [dict, pop, default, KeyError]
        rule: >
          dict.pop(key, default) removes and returns the value; returns default if absent (avoids
          KeyError). dict.pop(key) with no default raises KeyError if absent.
      - id: LAW-100
        tags: [dict, in-operator, keys, values, items]
        rule: >
          in operator on dict checks KEYS: key in d. To check values: value in d.values(). To
          check key-value pair: (k, v) in d.items().

  - id: 13
    name: "File I/O, Paths, and Serialization"
    laws:
      - id: LAW-101
        tags: [file, context-manager, with, open, close]
        rule: >
          Always use context managers for files: with open(path) as f:. Guarantees closure even
          on exception.
      - id: LAW-102
        tags: [pathlib, Path, os.path, compose, mkdir]
        rule: >
          pathlib.Path is preferred over os.path for new code. Paths compose with /: Path('/tmp')
          / 'data' / 'file.txt'. Methods: .read_text(), .write_text(), .read_bytes(), .exists(),
          .mkdir(parents=True, exist_ok=True), .glob('*.py').
      - id: LAW-103
        tags: [tempfile, NamedTemporaryFile, TemporaryDirectory, cleanup]
        rule: >
          tempfile.NamedTemporaryFile(delete=False) — must manually close and delete.
          tempfile.TemporaryDirectory() as context manager handles cleanup automatically.
      - id: LAW-104
        tags: [json, dumps, loads, dump, load, file]
        rule: >
          JSON: json.dumps(obj) → str; json.loads(s) parses str; json.dump(obj, fp) writes to
          file; json.load(fp) reads from file. Common bug: calling json.loads on a dict.
      - id: LAW-105
        tags: [json, serialization, custom-encoder, datetime, numpy]
        rule: >
          json.dumps() fails on: datetime, bytes, numpy arrays, custom objects. Fix: use a custom
          encoder json.dumps(obj, cls=MyEncoder) or default=str for quick conversions.
      - id: LAW-106
        tags: [yaml, safe_load, arbitrary-code-execution, security]
        rule: >
          yaml.load(data) can execute arbitrary code. ALWAYS use yaml.safe_load(data) or
          yaml.load(data, Loader=yaml.FullLoader).
      - id: LAW-107
        tags: [pickle, security, RCE, untrusted-input]
        rule: >
          pickle.loads() from untrusted input is a remote code execution vulnerability. Never
          unpickle data from untrusted sources.
      - id: LAW-108
        tags: [csv, writer, newline, Windows, encoding]
        rule: >
          csv.writer — open files with newline='' on Windows to prevent double newlines:
          open(path, 'w', newline='', encoding='utf-8').

  - id: 14
    name: "Imports and Scope"
    laws:
      - id: LAW-109
        tags: [import, from-import, dynamic, rebind]
        rule: >
          from module import name binds name at import time. If module.name is reassigned later,
          your local binding doesn't update. For dynamic access: import module; module.name.
      - id: LAW-110
        tags: [import, circular-import, ImportError, deferred-import]
        rule: >
          Circular imports: A imports B, B imports A → ImportError. Fix: move imports inside
          functions (deferred import), restructure modules, or use TYPE_CHECKING guard.
      - id: LAW-111
        tags: [import, TYPE_CHECKING, type-annotation, circular]
        rule: >
          if TYPE_CHECKING: from module import Type — type-only import, avoids circular imports
          for type annotations at runtime. Use from __future__ import annotations to defer
          annotation evaluation.
      - id: LAW-112
        tags: [scope, global, module-level, assignment, shadow]
        rule: >
          global x inside a function — allows assigning to a module-level variable. Without
          global, assignment creates a LOCAL variable that shadows the module-level one.
      - id: LAW-113
        tags: [scope, nonlocal, closure, nested-function]
        rule: >
          nonlocal x in nested functions — access and assign to the enclosing function's local
          variable. Without it, assignment creates a new innermost-scope local.
      - id: LAW-114
        tags: [import, __all__, star-import, public-api]
        rule: >
          __all__ in a module defines what from module import * exports. If missing, all public
          names (no leading underscore) are exported.

  - id: 15
    name: "Async/Await and Concurrency"
    laws:
      - id: LAW-115
        tags: [async, await, coroutine, event-loop]
        rule: >
          await can only be used inside async def. Calling an async function without await returns
          a COROUTINE OBJECT, not the result — and the coroutine never runs.
      - id: LAW-116
        tags: [asyncio, run, event-loop, top-level]
        rule: >
          asyncio.run(coro) — runs a coroutine to completion in a new event loop. Do NOT call when
          already inside an event loop (use await coro directly there).
      - id: LAW-117
        tags: [asyncio, gather, wait, shield, concurrent]
        rule: >
          asyncio.gather(*coros) runs coroutines concurrently; asyncio.wait() allows partial
          completion checks. asyncio.shield() protects a coroutine from cancellation.
      - id: LAW-118
        tags: [asyncio, create_task, background, concurrent]
        rule: >
          asyncio.create_task() schedules a coroutine to run "in the background". Unlike await,
          it doesn't pause the current coroutine — it continues immediately.
      - id: LAW-119
        tags: [threading, GIL, CPU-bound, IO-bound, ProcessPoolExecutor]
        rule: >
          Thread safety: The GIL means only one thread executes Python bytecode at a time, but it
          releases during I/O. For CPU-bound parallelism: ProcessPoolExecutor. For I/O-bound:
          ThreadPoolExecutor or asyncio.
      - id: LAW-120
        tags: [threading, Lock, deadlock, context-manager, with]
        rule: >
          threading.Lock() — always use with lock: to guarantee release on exception. Deadlock:
          thread A holds lock1, waits for lock2; thread B holds lock2, waits for lock1. Always
          acquire locks in the SAME ORDER across threads.
      - id: LAW-121
        tags: [threading, race-condition, atomic, GIL, thread-local]
        rule: >
          Race condition: read-modify-write without synchronization. counter += 1 is NOT atomic
          at the bytecode level — GIL can switch between the read and write. Use threading.Lock
          or threading.local() for thread-local state.
      - id: LAW-122
        tags: [queue, Queue, get, timeout, block, Empty]
        rule: >
          queue.Queue.get() blocks by default. Use get(timeout=N) or get(block=False) (raises
          queue.Empty) to avoid hanging.

  - id: 16
    name: "Decorators and Metaprogramming"
    laws:
      - id: LAW-123
        tags: [functools, wraps, decorator, __name__, traceback]
        rule: >
          @functools.wraps(func) on a wrapper preserves __name__, __doc__, __module__, etc.
          Without it, all decorated functions appear as the wrapper's name in tracebacks and help().
      - id: LAW-124
        tags: [functools, lru_cache, cache, hashable, side-effects]
        rule: >
          @functools.lru_cache(maxsize=128) caches results. Arguments must be hashable. Side
          effects inside cached functions are dangerous — cache hits skip the side effect entirely.
          Use cache_clear() to invalidate.
      - id: LAW-125
        tags: [decorator, stacking, order, bottom-up]
        rule: >
          Decorator stacking applies bottom-up: @A \n @B \n def f() → A(B(f)). The decorator
          closest to the function is applied first. Order matters.
      - id: LAW-126
        tags: [functools, singledispatch, dispatch, first-argument]
        rule: >
          @functools.singledispatch — register implementations per argument type.
          @fn.register(int) adds an int-specific implementation. Dispatch is on the FIRST argument.
      - id: LAW-127
        tags: [oop, __init_subclass__, plugin, registration, metaclass]
        rule: >
          __init_subclass__(cls, **kwargs) is called when a class is subclassed. Good for
          plugin/registration patterns without metaclasses.
      - id: LAW-128
        tags: [contextlib, contextmanager, yield, __enter__, __exit__]
        rule: >
          Context managers via @contextlib.contextmanager must yield exactly once. Code before
          yield = __enter__. Code after yield = __exit__. If an exception occurs in the with
          block, it is raised at the yield point.

  - id: 17
    name: "Testing and Mocking"
    laws:
      - id: LAW-129
        tags: [mock, patch, import-site, where-used, where-defined]
        rule: >
          mock.patch('module.ClassName') patches where the name is USED, not where it is DEFINED.
          If module_a.py does from module_b import Foo, patch 'module_a.Foo', not 'module_b.Foo'.
      - id: LAW-130
        tags: [mock, assert_called_once_with, assert_any_call, call_args_list]
        rule: >
          mock.assert_called_once_with(...) checks the mock was called exactly once with those
          args. mock.assert_any_call(...) checks it was called at least once with those args.
          mock.call_args_list has ALL calls.
      - id: LAW-131
        tags: [mock, side_effect, exception, sequence]
        rule: >
          mock.side_effect = SomeException() makes the mock raise on call. side_effect as a LIST
          returns values in sequence (raising StopIteration when exhausted — unless list contains
          exceptions).
      - id: LAW-132
        tags: [pytest, raises, exc_info, message]
        rule: >
          pytest.raises(ExceptionType) as exc_info: — the code that should raise MUST be inside
          the with block. Check the message: assert "expected text" in str(exc_info.value).
      - id: LAW-133
        tags: [pytest, parametrize, parameter-names, tuple]
        rule: >
          pytest.mark.parametrize("arg1, arg2", [(v1, v2), (v3, v4)]) — argument names must match
          the test function parameter names EXACTLY (comma-separated string or tuple/list).
      - id: LAW-134
        tags: [pytest, conftest, fixture, scope, directory]
        rule: >
          conftest.py fixtures are available without importing to all tests in the same directory
          and all subdirectories.
      - id: LAW-135
        tags: [test, isolation, shared-state, order-dependent]
        rule: >
          Test isolation: each test should be fully independent. Shared state via class attributes
          or module globals between tests causes order-dependent failures.
      - id: LAW-136
        tags: [pytest, monkeypatch, setattr, auto-undo]
        rule: >
          monkeypatch.setattr(module, 'name', value) for pytest patching. Auto-undone after the
          test. Prefer over mock.patch in pytest tests for simplicity.

  - id: 18
    name: "Django Patterns"
    laws:
      - id: LAW-137
        tags: [django, ORM, queryset, lazy, database]
        rule: >
          Django ORM lazy evaluation: Model.objects.filter(...) doesn't hit the database until
          iterated, sliced, passed to list(), or accessed with .count(), .exists(), .get(). A
          queryset is a lazy query builder.
      - id: LAW-138
        tags: [django, ORM, queryset, count, exists, performance]
        rule: >
          queryset.count() uses SQL COUNT — more efficient than len(list(queryset)). queryset.exists()
          uses SQL EXISTS — more efficient than .count() > 0.
      - id: LAW-139
        tags: [django, ORM, N+1, select_related, prefetch_related]
        rule: >
          N+1 query: accessing a related object in a loop without prefetching causes one query per
          iteration. Fix: select_related('fk_field') for ForeignKey (JOIN); prefetch_related('m2m_field')
          for ManyToMany (separate query + cache).
      - id: LAW-140
        tags: [django, ORM, get_or_create, defaults, lookup]
        rule: >
          get_or_create(defaults={...}, **lookup) — lookup kwargs form the WHERE clause; defaults
          are used ONLY on CREATE. Returns (instance, created_bool).
      - id: LAW-141
        tags: [django, request, POST, QueryDict, immutable, copy]
        rule: >
          request.POST is an immutable QueryDict. To modify: data = request.POST.copy().
      - id: LAW-142
        tags: [django, URL, reverse, args, kwargs]
        rule: >
          URL reversing: reverse('view-name', args=[pk]) — must match the URL pattern's argument
          count and types exactly. Use reverse('view-name', kwargs={'pk': pk}) for clarity.
      - id: LAW-143
        tags: [django, signals, post_save, sender, created, raw]
        rule: >
          Django signals: post_save sender is the model CLASS. instance is the object. created=True
          only on INSERT, False on UPDATE. Use raw=False check to skip fixture loads.
      - id: LAW-144
        tags: [django, migrations, makemigrations, migrate, CI]
        rule: >
          Django migrations: makemigrations generates migration files; migrate applies them. Missing
          migration → schema/model mismatch at runtime. Run makemigrations --check in CI.
      - id: LAW-145
        tags: [django, ORM, ordering, Meta, performance, N+1]
        rule: >
          Meta.ordering causes an ORDER BY on every query for that model. This can cause N+1 issues
          and unexpected joins. Override with .order_by() when not needed.

  - id: 19
    name: "SQLAlchemy Patterns"
    laws:
      - id: LAW-146
        tags: [sqlalchemy, session, transaction, commit, rollback, flush]
        rule: >
          SQLAlchemy sessions: use session for transactions. session.add(obj) + session.commit()
          to persist. session.rollback() on failure. session.flush() syncs to DB without committing.
      - id: LAW-147
        tags: [sqlalchemy, lazy-loading, DetachedInstanceError, eager-loading]
        rule: >
          Lazy loading: accessing obj.relationship outside a session triggers a new query. After
          session close: DetachedInstanceError. Fix: use joined or subquery loading, or access
          within the session.
      - id: LAW-148
        tags: [sqlalchemy, query, filter, filter_by, expression]
        rule: >
          session.query(Model).filter(Model.col == val) uses expressions. .filter_by(col=val) uses
          keyword args. .filter() is more flexible and composable.
      - id: LAW-149
        tags: [sqlalchemy, Column, nullable, NOT-NULL, Alembic, migration]
        rule: >
          Column(nullable=False) adds a NOT NULL constraint in the ORM schema. Must create and
          apply an Alembic migration to add the constraint to the actual database.
      - id: LAW-150
        tags: [sqlalchemy, relationship, back_populates, bidirectional]
        rule: >
          relationship('Model', back_populates='attr') — both sides of the relationship must define
          back_populates pointing to each other. Missing one causes inconsistent state.

  - id: 20
    name: "Pandas/DataFrame Patterns"
    laws:
      - id: LAW-151
        tags: [pandas, loc, iloc, label, position, index]
        rule: >
          df.loc[row, col] uses LABELS. df.iloc[row, col] uses INTEGER POSITIONS. Confusing them
          — especially when the index is non-integer — causes wrong row/column selection.
      - id: LAW-152
        tags: [pandas, assignment, Series, index-alignment, NaN]
        rule: >
          df['new_col'] = series — if Series, alignment is by INDEX (not position). Misaligned
          index → NaN for unmatched rows. If you want position alignment, use .values or
          .to_numpy().
      - id: LAW-153
        tags: [pandas, chained-indexing, SettingWithCopyWarning, loc]
        rule: >
          Chained indexing: df[col][row] = val may not modify the original DataFrame
          (SettingWithCopyWarning). Use df.loc[row, col] = val for safe in-place modification.
      - id: LAW-154
        tags: [pandas, groupby, apply, multi-index, reset_index]
        rule: >
          df.groupby().apply(func) — func receives a sub-DataFrame for each group. The resulting
          index can be multi-level. Use .reset_index() when a flat index is needed.
      - id: LAW-155
        tags: [pandas, merge, how, inner, left, outer, NaN]
        rule: >
          df.merge(other, on='key', how='inner') — inner keeps rows with key in BOTH. how='left'
          keeps all rows from left, fills unmatched with NaN. how='outer' keeps all rows.
      - id: LAW-156
        tags: [pandas, concat, ignore_index, index-reset]
        rule: >
          pd.concat([df1, df2], ignore_index=True) — ignore_index=True resets the index to 0..N.
          Without it, original indices are preserved (may cause duplicates).
      - id: LAW-157
        tags: [pandas, copy, deep, slice, SettingWithCopyWarning]
        rule: >
          df.copy(deep=True) (default) duplicates data. df.copy(deep=False) shares the underlying
          data. ALWAYS use .copy() before modifying a slice to avoid SettingWithCopyWarning.
      - id: LAW-158
        tags: [pandas, apply, axis, applymap, map, element-wise]
        rule: >
          df.apply(func, axis=0) applies func to COLUMNS. axis=1 applies to ROWS. For element-wise:
          df.applymap(func) (deprecated in newer pandas; use df.map(func)).
      - id: LAW-159
        tags: [pandas, explode, list-column, reset_index]
        rule: >
          df.explode('col') expands list-valued column into one row per element. Index is
          repeated — use .reset_index(drop=True) after.

  - id: 21
    name: "Scipy / Scientific Stack"
    laws:
      - id: LAW-160
        tags: [scipy, optimize, minimize, scalar, objective]
        rule: >
          scipy.optimize.minimize() — objective function must return a SCALAR. If it returns an
          array, wrap in .item() or float().
      - id: LAW-161
        tags: [scipy, sparse, dense, toarray, todense, arithmetic]
        rule: >
          scipy.sparse matrices: arithmetic between sparse and dense often requires explicit
          conversion. .toarray() or .todense() to convert to dense.
      - id: LAW-162
        tags: [scipy, signal, convolve, fftconvolve, performance]
        rule: >
          scipy.signal.convolve() for small kernels; scipy.signal.fftconvolve() for large kernels
          (orders of magnitude faster due to FFT).
      - id: LAW-163
        tags: [scipy, stats, named-tuple, statistic, pvalue]
        rule: >
          scipy.stats functions return named tuples (statistic, pvalue, ...). Always unpack or use
          attribute access: result.statistic, result.pvalue.

  - id: 22
    name: "Numpy Linear Algebra / Matrix Operations"
    laws:
      - id: LAW-164
        tags: [numpy, matmul, dot, at-operator, element-wise]
        rule: >
          np.dot(A, B) and A @ B compute matrix multiplication. * is element-wise. @ is preferred
          in Python 3.5+ for clarity.
      - id: LAW-165
        tags: [numpy, matrix, scalar-fill, constant-assignment, bug-pattern]
        rule: >
          Matrix constant-fill bug: matrix_slice = 1 (scalar fills the entire submatrix with ones)
          vs matrix_slice = computed_variable (preserves the computed data). In matrix building
          functions, = 1 instead of = variable is a common bug that loses structure. ALWAYS check:
          should this be assigning a COMPUTED VARIABLE or a CONSTANT?
      - id: LAW-166
        tags: [numpy, vstack, hstack, concatenate, axis]
        rule: >
          np.vstack() concatenates along axis=0 (adds rows). np.hstack() along axis=1 (adds
          columns). np.concatenate([a, b], axis=N) is the general form.
      - id: LAW-167
        tags: [numpy, broadcasting, reshape, newaxis, ValueError]
        rule: >
          Broadcasting: dimensions compared right-to-left. Size 1 is compatible with any size
          (broadcasts). Non-1 sizes that differ → ValueError. Use np.newaxis or reshape() to
          align dimensions.
      - id: LAW-168
        tags: [numpy, zeros, ones, dtype, initialization]
        rule: >
          np.zeros((n, m)) — float64 by default. np.zeros((n, m), dtype=int) for integer.
          Initializing with ones when zeros is expected (or vice versa) is a common bug.
      - id: LAW-169
        tags: [numpy, linalg, lstsq, return-tuple, residuals]
        rule: >
          np.linalg.lstsq() returns (solution, residuals, rank, singular_values) — the residuals
          may be empty if rank < N or M < N. Always check the return tuple.

  - id: 23
    name: "Matplotlib / Visualization"
    laws:
      - id: LAW-170
        tags: [matplotlib, savefig, show, order, blank]
        rule: >
          plt.savefig() must be called BEFORE plt.show(). After show(), the figure is cleared
          and savefig saves a blank image.
      - id: LAW-171
        tags: [matplotlib, subplots, axes, 2D-array, squeeze, flat]
        rule: >
          fig, ax = plt.subplots() for single axes. fig, axes = plt.subplots(R, C) for grid —
          axes is a 2D array; use axes.flat to iterate, or squeeze=False to always get 2D.
      - id: LAW-172
        tags: [matplotlib, OOP, state-machine, multiple-axes]
        rule: >
          Use OOP interface (ax.set_title(), ax.plot()) not state-machine interface (plt.title(),
          plt.plot()) when working with multiple axes or subplots.
      - id: LAW-173
        tags: [matplotlib, close, all, memory-leak, figure]
        rule: >
          plt.close('all') after tests/loops to prevent figure accumulation and memory leaks.
      - id: LAW-174
        tags: [matplotlib, backend, Agg, headless, non-interactive]
        rule: >
          Backends: non-interactive backends (Agg, pdf, svg) don't open windows. Required in
          headless/server environments. Set before import: matplotlib.use('Agg') or via matplotlibrc.

  - id: 24
    name: "Web / HTTP (requests, httpx, Flask, FastAPI)"
    laws:
      - id: LAW-175
        tags: [requests, raise_for_status, HTTPError, 4xx, 5xx]
        rule: >
          requests.get(url).raise_for_status() raises HTTPError on 4xx/5xx. Without it, the
          response object is returned regardless of status — errors are silently ignored.
      - id: LAW-176
        tags: [requests, timeout, hang, library]
        rule: >
          Always specify timeout=N in requests calls. Default is None (hang forever). Omitting
          timeout in library code can cause processes to hang indefinitely.
      - id: LAW-177
        tags: [requests, json, text, content, headers, response]
        rule: >
          response.json() parses JSON body. response.text is raw string. response.content is raw
          bytes. response.headers is a case-insensitive dict.
      - id: LAW-178
        tags: [flask, request, args, form, json, files]
        rule: >
          Flask request.args — query string params. request.form — POST form data. request.json
          — JSON body (requires Content-Type: application/json). request.files — uploaded files.
      - id: LAW-179
        tags: [flask, fastapi, URL, route, parameter, type-mismatch, 404, 422]
        rule: >
          Flask/FastAPI URL parameters must match route definition exactly. Type mismatch between
          route pattern and function parameter causes 404 or 422.

  - id: 25
    name: "Serialization Edge Cases"
    laws:
      - id: LAW-180
        tags: [json, loads, load, file-object, str, filepath-bug]
        rule: >
          json.loads() expects a str (or bytes in Python 3.6+). json.load() expects a file object.
          Common bug: json.loads(filepath) — passes a path STRING as JSON content.
      - id: LAW-181
        tags: [json, dumps, indent, sort_keys, pretty-print, stable]
        rule: >
          json.dumps(obj, indent=2) for pretty-printing. sort_keys=True for stable output
          (important for diffs and caching).
      - id: LAW-182
        tags: [xml, ElementTree, defusedxml, security, entity-expansion]
        rule: >
          xml.etree.ElementTree.parse() is NOT safe for untrusted XML (billion laughs, entity
          expansion attacks). Use defusedxml for untrusted input.

  - id: 26
    name: "Architectural Patterns: WHERE to Find the Bug"
    laws:
      - id: LAW-183
        tags: [architecture, call-stack, wrong-output, trace]
        rule: >
          If a method produces WRONG OUTPUT without raising an error, the bug may be in the method
          itself OR in any function it calls. Trace the call stack from the failing assertion
          BACKWARD through the call chain.
      - id: LAW-184
        tags: [architecture, return-type, intermediate, call-chain]
        rule: >
          When function A calls B calls C and the output is wrong: check C's RETURN TYPE and VALUE
          first, then B's USAGE of C's return, then A's usage of B's return. The bug is often in
          how an intermediate function handles the value from the one it calls.
      - id: LAW-185
        tags: [architecture, wrong-location, caller, widen-search]
        rule: >
          If the Architect identifies function X as the bug location but tests still fail: the bug
          may be in a function that CALLS X, or in how X's return value is USED by its caller.
          Widen the search to callers.
      - id: LAW-186
        tags: [architecture, silent-noop, return-value, local-copy]
        rule: >
          "Silent no-op" bug pattern: code runs without error but has no effect. Causes: (1) return
          value of immutable operation discarded, (2) assignment targets wrong local variable instead
          of the original, (3) method modifies a local copy not the passed-in object.
      - id: LAW-187
        tags: [architecture, parameter, constructor, super, signature]
        rule: >
          When adding a new PARAMETER to a class constructor: BOTH the subclass __init__ signature
          AND the super().__init__() call must be updated. Missing either one silently ignores the
          parameter or raises TypeError.
      - id: LAW-188
        tags: [architecture, case-insensitive, re-compile, IGNORECASE, location]
        rule: >
          For case-insensitive parsing fixes: the correct location is the re.compile() call (add
          re.IGNORECASE), NOT the pattern string itself. Changing the pattern string to use character
          classes is fragile and error-prone.
      - id: LAW-189
        tags: [architecture, matrix, scalar-constant, bug-location, computed-variable]
        rule: >
          Matrix/array constant-assignment bug location: look for lines where a MATRIX SLICE is
          assigned a SCALAR CONSTANT (like = 1 or = 0) inside a function that builds a matrix from
          computed sub-results. The likely fix is replacing the scalar with the computed variable.
      - id: LAW-190
        tags: [architecture, parser, variant, regex, string-comparison]
        rule: >
          When a file-format parser doesn't handle a variant (e.g., uppercase vs lowercase commands,
          D-exponent vs E-exponent): the fix is usually in the regex or string comparison, not in
          the data transformation logic.
      - id: LAW-191
        tags: [architecture, file-specific, keyword-scoring, specific-file]
        rule: >
          When the issue mentions a SPECIFIC FILE (e.g., "the bug is in fitsrec.py"): prioritize
          that file above all others, even if keyword scoring ranks another file higher.
      - id: LAW-192
        tags: [architecture, FAIL_TO_PASS, test-module, source-module]
        rule: >
          When the FAIL_TO_PASS tests reference a module (e.g., test_rst.py): the bug is almost
          certainly in the corresponding source module (e.g., rst.py), not in a shared utility or
          base class.

  - id: 27
    name: "Cloak Mode: Reading Obfuscated Code"
    laws:
      - id: LAW-193
        tags: [cloak, obfuscation, structure, semantics, x_NNNN]
        rule: >
          When identifiers are obfuscated (x_NNNN tokens): recognize bug patterns by CODE STRUCTURE
          and OPERATION TYPE, not by name. x_1234.replace(x_5678, x_9012) is a .replace() call
          — the in-place-vs-copy rule applies regardless of names.
      - id: LAW-194
        tags: [cloak, missing-assignment, no-op, return-value]
        rule: >
          A discarded method call with no assignment: obj.method(arg) on its own line with no =
          — this is almost certainly a "missing assignment" bug if the method returns a new object.
      - id: LAW-195
        tags: [cloak, matrix, scalar-constant, x_NNNN, variable]
        rule: >
          A matrix slice assigned a scalar constant: x_1234[x_5678:, x_9012:] = 1 in a
          matrix-building function — suspect this should be = x_variable to preserve computed data.
      - id: LAW-196
        tags: [cloak, IGNORECASE, re-compile, SEARCH-block, pattern-variable]
        rule: >
          When the Architect says "add re.IGNORECASE": if the SEARCH block targets a pattern STRING
          variable, look for the re.compile(...) call that USES that variable and add re.IGNORECASE
          to that compile call instead.
      - id: LAW-197
        tags: [cloak, in-place, slice-assignment, view, structured-array]
        rule: >
          For in-place array fixes in Cloak mode: if the description says "assign the result back",
          the REPLACE must use x_array[:] = x_array.method(...) NOT x_array = x_array.method(...)
          when the array is a view into a structured/record array.
      - id: LAW-198
        tags: [cloak, symbol-guide, semantic-key, x_NNNN, method-names]
        rule: >
          Use the symbol guide (semantic key) to map x_NNNN tokens to their functional meaning
          when available. Even without it: method names like .replace(), .compile(), np.vstack(),
          super().__init__() are not obfuscated — use them to identify the pattern.

  - id: 28
    name: "SEARCH/REPLACE Quality Rules"
    laws:
      - id: LAW-199
        tags: [search-replace, indentation, whitespace, exact-match]
        rule: >
          SEARCH must match the source CHARACTER FOR CHARACTER — same indentation, spacing, and
          inline comments. A single whitespace difference causes application failure.
      - id: LAW-200
        tags: [search-replace, size, small, uniqueness, context]
        rule: >
          Keep SEARCH small: 2-6 lines. Smaller SEARCH = higher match probability. Include just
          enough context to uniquely identify the location (1 unique-ish line is often enough; add
          context lines only if the line appears more than once in the file).
      - id: LAW-201
        tags: [search-replace, buggy-in-SEARCH, fixed-in-REPLACE]
        rule: >
          The BUGGY code goes in SEARCH. The FIXED code goes in REPLACE. Never include the fix in
          SEARCH or the bug in REPLACE.
      - id: LAW-202
        tags: [search-replace, one-line-fix, context, uniqueness]
        rule: >
          For a one-line fix: SEARCH = buggy line + 1 context line above or below for uniqueness.
          REPLACE = same structure with ONLY the buggy line corrected.
      - id: LAW-203
        tags: [search-replace, signature, super, two-lines, parameter]
        rule: >
          When changing a function signature to add a parameter: one SEARCH/REPLACE block captures
          the def line AND the super().__init__() call together (2 lines), changing both at once.
      - id: LAW-204
        tags: [search-replace, multiple-blocks, independent, order]
        rule: >
          Multiple SEARCH/REPLACE blocks are allowed for multiple separate locations. Each block is
          applied independently. Order matters if blocks are in the same region.
      - id: LAW-205
        tags: [search-replace, cloak, verbatim, x_NNNN, no-translation]
        rule: >
          In Cloak mode: ALL tokens in SEARCH must be the EXACT x_NNNN form from the shown source.
          Do NOT expand or translate x_NNNN tokens in SEARCH. Do NOT substitute real Python
          identifiers from your training knowledge. Copy VERBATIM.
      - id: LAW-206
        tags: [search-replace, minimal, no-full-file, no-full-function]
        rule: >
          Do not output the entire file or the entire function body in REPLACE. Output ONLY the
          changed lines and minimal context.
      - id: LAW-207
        tags: [search-replace, import, single-purpose, separate-block]
        rule: >
          When adding a new IMPORT: put it in a separate SEARCH/REPLACE block from the logic
          change. Keep blocks single-purpose.
      - id: LAW-208
        tags: [search-replace, indentation, Python, SyntaxError, semantic]
        rule: >
          Indentation in REPLACE must match the surrounding code. Python's indentation is semantic
          — wrong indentation produces a SyntaxError or wrong nesting.

  - id: 29
    name: "Versioning and Compatibility"
    laws:
      - id: LAW-209
        tags: [python-version, f-string, walrus, match-case, ExceptionGroup]
        rule: >
          Check Python version before using features: f-strings (3.6+), walrus := (3.8+),
          match/case (3.10+), ExceptionGroup (3.11+), tomllib in stdlib (3.11+).
      - id: LAW-210
        tags: [python-version, sys.version_info, platform.python_version]
        rule: >
          sys.version_info >= (3, 8) for version checks. platform.python_version() returns a
          version string.
      - id: LAW-211
        tags: [deprecated, DeprecationWarning, replacement-api, suppress]
        rule: >
          Deprecated APIs often still work but print DeprecationWarnings. The fix is to use the
          replacement API, not to suppress the warning.
      - id: LAW-212
        tags: [__future__, annotations, forward-reference, lazy]
        rule: >
          __future__ imports: from __future__ import annotations — makes all annotations lazy
          (strings). Required in some codebases for forward references without quotes.

  - id: 30
    name: "Astropy / Domain-Specific Patterns"
    laws:
      - id: LAW-213
        tags: [astropy, units, Quantity, to, value]
        rule: >
          Astropy units: Quantity * unit creates a Quantity. Unit arithmetic is tracked.
          value.to(target_unit) converts. Missing .value when a plain float is expected is common.
      - id: LAW-214
        tags: [astropy, FITS, record-array, view, chararray, replace]
        rule: >
          Astropy FITS: record array field access returns a view. field[:] = data writes back.
          chararray .replace() returns a new array — must assign back with field[:] =.
      - id: LAW-215
        tags: [astropy, WCS, coordinate, frame, icrs]
        rule: >
          Astropy WCS: coordinate transformations are lossy if the wrong frame is used. Always
          specify frame explicitly: SkyCoord(ra, dec, frame='icrs').
      - id: LAW-216
        tags: [astropy, Table, Column, view, underlying-array]
        rule: >
          Astropy Table: table['col'] returns a Column (view). Modifying it modifies the table.
          table['col'].data gives the underlying numpy array.
      - id: LAW-217
        tags: [astropy, separability, _coord_matrix, _cstack, _cdot, scalar-constant]
        rule: >
          Astropy modeling separability: _coord_matrix builds a separability matrix for a single
          model. _cstack computes the & operator between two separability results. _cdot computes
          |. The bug in separability code is often in _cstack/_cdot where a computed sub-matrix is
          replaced with a scalar constant.
      - id: LAW-218
        tags: [astropy, RST, header_rows, three-changes, start_line]
        rule: |
          Astropy RST table header_rows fix requires THREE changes, not one:
          (1) Remove SimpleRSTData.start_line = 3 (the class attribute line, NOT just change it).
          (2) RST.__init__: change to def __init__(self, header_rows=None): and call
              super().__init__(delimiter_pad=None, bookend=False, header_rows=header_rows),
              then add self.data.start_line = 2 + len(self.header.header_rows) after super().
          (3) RST.write: change lines = [lines[1]] + lines + [lines[1]] to
              idx = len(self.header.header_rows); lines = [lines[idx]] + lines + [lines[idx]].
          ALL THREE must be in the patch — partial fixes fail the tests.
      - id: LAW-219
        tags: [astropy, QDP, case-insensitive, two-changes, _line_type, _get_tables]
        rule: |
          Astropy QDP case-insensitive fix requires TWO changes, not one:
          (1) _line_type: re.compile(_type_re) → re.compile(_type_re, re.IGNORECASE).
          (2) _get_tables_from_qdp_file: if v == "NO": → if v.upper() == "NO":.
          BOTH changes are required. Fixing only the regex compile is insufficient.

  - id: 31
    name: "URL Validation and Sphinx Option Parsing"
    laws:
      - id: LAW-220
        tags: [django, URLValidator, IPv6, TypeError, None, hostname, two-bugs]
        rule: |
          Django URLValidator two-bug fix: django/core/validators.py, URLValidator.__call__:
          Bug 1 (else: branch) — urlsplit(value).netloc can raise ValueError: Invalid IPv6 URL
          for inputs like '////]@N.AN'. Wrap in try/except ValueError: raise ValidationError(...).
          Bug 2 (AFTER the try/else, unconditional) — len(urlsplit(value).hostname) raises
          TypeError when hostname is None (empty netloc). Fix: assign
          hostname = urlsplit(value).hostname then guard if hostname is not None and len(hostname) > 253.
          Canonical fix:
            try:
                host_match = re.search(r'^\[(.+)\](?::\d{1,5})?$', urlsplit(value).netloc)
            except ValueError:
                raise ValidationError(self.message, code=self.code, params={'value': value})
            hostname = urlsplit(value).hostname
            if hostname is not None and len(hostname) > 253:
                raise ValidationError(self.message, code=self.code, params={'value': value})
      - id: LAW-221
        tags: [sphinx, option_desc_re, bracket, character-class, single-file]
        rule: >
          Sphinx option_desc_re excludes [: sphinx/domains/std.py — option_desc_re uses
          [^\s=[]+  which excludes [ from option name characters. Fix: change to [^\s=]+
          (remove [ from the excluded character class). Single-line, single-file change.

  - id: 32
    name: "Django ORM and QuerySet Patterns"
    laws:
      - id: LAW-222
        tags: [django, ORM, queryset, lazy, filter, exclude, annotate, assign]
        rule: >
          QuerySet.filter() / exclude() / annotate() are lazy — they return a NEW queryset, never
          mutate in place. Always assign: qs = qs.filter(active=True).
      - id: LAW-223
        tags: [django, ORM, F, atomic-update, race-condition]
        rule: >
          Model.objects.update(field=F('field') + 1) is atomic (single SQL UPDATE). obj.field += 1;
          obj.save() is NOT atomic. Fix race conditions with F() in update().
      - id: LAW-224
        tags: [django, ORM, select_related, prefetch_related, assign, new-queryset]
        rule: >
          select_related() and prefetch_related() return a NEW queryset — must be assigned.
          qs.select_related('author') does nothing unless qs = qs.select_related('author').
      - id: LAW-225
        tags: [django, ORM, get_or_create, tuple, unpack]
        rule: >
          QuerySet.get_or_create() returns (instance, created_bool) — always unpack. obj =
          Model.objects.get_or_create(...) assigns a tuple, not a Model instance.

  - id: 33
    name: "Python Exception Chaining and Context"
    laws:
      - id: LAW-226
        tags: [exception, chaining, __cause__, __context__, raise-from-None, test]
        rule: >
          raise X from None suppresses context. raise X from e sets __cause__. raise X inside
          except e: sets __context__ (implicit). Tests asserting __cause__ vs __context__ will
          fail if you use the wrong form. Read the test carefully.
      - id: LAW-227
        tags: [contextlib, contextmanager, yield, exception, suppress, transform]
        rule: >
          contextlib.contextmanager: exceptions inside the with block re-raise at the yield. Wrap
          yield in try/except to suppress or transform them.

  - id: 34
    name: "Matplotlib Figure and Widget State"
    laws:
      - id: LAW-228
        tags: [matplotlib, Figure, clear, clf, mouse_grabber, RangeSlider, AttributeError]
        rule: >
          Figure.clf() / Figure.clear() clears axes but does NOT reset figure.canvas.mouse_grabber.
          When a widget (RangeSlider, Button) lives in a cleared axes, mouse_grabber still points
          to the dead widget → AttributeError on next mouse event. Fix: set
          self.canvas.mouse_grabber = None inside Figure.clear() BEFORE clearing axes.
          Location: lib/matplotlib/figure.py, method Figure.clear().
      - id: LAW-229
        tags: [matplotlib, HiDPI, dpi, _device_pixel_ratio, pickle, double-scaling]
        rule: >
          HiDPI: Figure.dpi is logical dpi. _device_pixel_ratio holds the scale. On
          pickle/unpickle, divide saved dpi by device_pixel_ratio before canvas setup to avoid
          double-scaling.

  - id: 35
    name: "Requests Library HTTP Edge Cases"
    laws:
      - id: LAW-230
        tags: [requests, PreparedRequest, fragment, RFC3986, URL]
        rule: >
          PreparedRequest.prepare_url() strips URL fragments (#anchor) before sending. RFC 3986:
          fragments are client-side only. Tests checking fragments survive round-trip will fail by
          design. Adjust the assertion — check prepared.url for the fragment before send.
      - id: LAW-231
        tags: [requests, prepend_scheme_if_needed, scheme-less, normalize]
        rule: >
          requests.utils.prepend_scheme_if_needed() expects // at the start of scheme-less URLs.
          Bare hostnames (no //) may be mis-parsed. Normalize before passing.

  - id: 36
    name: "pytest Fixture and Collection Patterns"
    laws:
      - id: LAW-232
        tags: [pytest, raises, match, re.search, message-format]
        rule: >
          pytest.raises(ExcType, match=r"pattern") uses re.search on str(exc). Pattern matches
          anywhere in the string. Update match if message format changed.
      - id: LAW-233
        tags: [pytest, tmp_path, pathlib, str-cast]
        rule: >
          tmp_path is pathlib.Path, not str. Cast with str(tmp_path) when needed.
      - id: LAW-234
        tags: [pytest, fixture, scope, session, mutation, isolation]
        rule: >
          scope='session' fixtures are created ONCE per session — mutations persist across tests.
          Use scope='function' for isolation, or deepcopy the shared resource.
      - id: LAW-235
        tags: [pytest, monkeypatch, setattr, import-site, patch-location]
        rule: >
          monkeypatch.setattr('module.attr', value) patches the module-level name. If the target
          did from module import attr, patch at the import site:
          monkeypatch.setattr('target_module.attr', value).

  - id: 37
    name: "scikit-learn API Contracts"
    laws:
      - id: LAW-236
        tags: [sklearn, fit_transform, TransformerMixin, AttributeError]
        rule: >
          .fit_transform() exists on TransformerMixin subclasses ONLY. Calling it on a bare
          estimator raises AttributeError. Call .fit() then .transform() separately.
      - id: LAW-237
        tags: [sklearn, check_array, sparse, accept_sparse, ValueError]
        rule: >
          check_array(X, accept_sparse=False) raises ValueError on sparse input. Set
          accept_sparse=True if the estimator must handle sparse matrices.
      - id: LAW-238
        tags: [sklearn, clone, deepcopy, fitted-state, coef_]
        rule: >
          sklearn.base.clone(estimator) creates a new unfitted instance — does NOT copy .coef_,
          .feature_importances_, etc. Use copy.deepcopy() to preserve fitted state.

  - id: 38
    name: "General Python Stdlib Edge Cases"
    laws:
      - id: LAW-239
        tags: [os.path, join, absolute, discard, leading-slash]
        rule: >
          os.path.join(a, b): if b starts with /, a is discarded entirely. os.path.join('/foo',
          '/bar') == '/bar'. Strip leading slashes from user input paths.
      - id: LAW-240
        tags: [dict, update, None, merge, spread]
        rule: >
          dict.update(other) returns None. merged = dict1.update(dict2) is None. Use merged =
          {**dict1, **dict2} or mutate then use dict1.
      - id: LAW-241
        tags: [datetime, utcnow, naive, timezone-aware, TypeError, UTC]
        rule: >
          datetime.datetime.utcnow() returns a NAIVE datetime (no tzinfo). Use
          datetime.datetime.now(datetime.timezone.utc) for timezone-aware code. Comparing naive
          and aware datetimes raises TypeError.

  - id: 39
    name: "Dead Code and Unreachable Statements (Critical)"
    laws:
      - id: LAW-242
        tags: [dead-code, unreachable, return, e-step, bug-pattern, critical]
        rule: |
          NEVER place executable code after a return statement in the same branch. Code after
          return is unreachable — it silently does nothing. The _e_step bug pattern:
            # WRONG — _e_step is unreachable dead code:
            return log_resp.argmax(axis=1)
            _, log_resp = self._e_step(X)   ← never executes

            # CORRECT — run _e_step before the return:
            _, log_resp = self._e_step(X)
            return log_resp.argmax(axis=1)
          When moving code, always check: does the moved statement execute BEFORE the return?
          This is the most common model error — appearing to "move" code when actually deleting it.
      - id: LAW-243
        tags: [dead-code, comment-intent, return, e-step, always-final]
        rule: >
          When a # comment says: do X at the end, do NOT interpret that as "X can go after
          return". Comments describe INTENT. The comment "always do a final e-step to guarantee
          labels are consistent" means run _e_step, THEN return the result. The e-step IS the
          return value.

  - id: 40
    name: "Flask and WSGI Config Patterns"
    laws:
      - id: LAW-244
        tags: [flask, tomllib, tomli, binary-mode, rb, config, from_file]
        rule: |
          tomllib (Python 3.11+ stdlib) and tomli (third-party backport) require files opened in
          BINARY mode ('rb'), not text mode ('r'). Flask's config.from_file() opens in text mode
          by default. Fix: when load is tomllib.load or tomli.load, open in 'rb':
            mode = "rb" if getattr(load, "__module__", "").startswith("tom") else "r"
            with open(filename, mode) as f:
                obj = load(f)
          Or add a mode parameter: config.from_file("config.toml", tomllib.load, mode="rb").

  - id: 41
    name: "Sphinx autodoc __all__ Handling"
    laws:
      - id: LAW-245
        tags: [sphinx, autodoc, __all__, None, empty-list, is-None, falsy]
        rule: >
          if not self.__all__ is falsy for BOTH None (not set) AND [] (explicitly empty). These
          have different meanings: __all__ = None → not set, document all members; __all__ = []
          → explicitly empty, document NO members. Fix: if self.__all__ is None to distinguish
          absent from empty.

  - id: 42
    name: "pytest Skip and Module-Level Guards"
    laws:
      - id: LAW-246
        tags: [pytest, skip, allow_module_level, module-scope, TypeError, f_locals, f_globals]
        rule: >
          pytest.skip() called at module level (outside any test function) raises TypeError unless
          allow_module_level=True. The check for module-level execution: frame.f_locals is
          frame.f_globals — True only at module scope (locals == globals). When the issue says
          "calling pytest.skip() at module level should be an error", the fix is to detect module
          scope and raise a descriptive exception BEFORE the Skipped is raised. The guard: if not
          allow_module_level and frame.f_locals is frame.f_globals: raise.

  - id: 43
    name: "SymPy and Mathematical Libraries"
    laws:
      - id: LAW-247
        tags: [sympy, decompose, separate, sort, dict-order, insertion-order]
        rule: >
          When a function returns a list from a dict (.values()), dict value order in Python 3.7+
          is insertion order, but may not be the canonical mathematical ordering. SymPy's
          decompose(poly, separate=True) returned values in dict insertion order — not sorted. If
          a test compares the returned list directly, sort by canonical key:
          return sorted(list(poly_dict.values()), key=default_sort_key).
      - id: LAW-248
        tags: [sympy, ImportError, wrong-module, groebner, strategies-tree]
        rule: >
          SymPy import errors: ImportError: cannot import name 'X' from 'Y' means the name doesn't
          exist in that module. Do NOT add an import to make the code compile if the name doesn't
          exist — find where the functionality actually lives or implement it. groebner is NOT in
          sympy.strategies.tree — adding that import will fail at runtime.
