[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radeonpilot"
version = "0.1.0"
description = "RadeonPilot: multi-agent ROCm inference-ops console for AMD Radeon GPUs (AMD Hackathon 2026 Track 2)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "RadeonPilot Team" }]
dependencies = [
    "gradio>=6.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
radeonpilot = ["py.typed"]
