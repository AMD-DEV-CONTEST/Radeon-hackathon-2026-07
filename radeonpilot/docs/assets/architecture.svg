<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="900" viewBox="0 0 1560 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#ed1c24"/>
    </marker>
    <style>
      text { font-family: Helvetica, Arial, sans-serif; fill: #e8edf5; }
      .title { font-size: 30px; font-weight: bold; fill: #ffffff; }
      .accent { fill: #ed1c24; }
      .box { fill: #131c2e; stroke: #26334d; stroke-width: 2; rx: 12; }
      .boxhl { fill: #1a2740; stroke: #ed1c24; stroke-width: 2.5; }
      .lbl { font-size: 19px; font-weight: bold; fill: #61dafb; }
      .sub { font-size: 15px; fill: #cfd9e8; }
      .agent { fill: #1f3050; stroke: #33507e; stroke-width: 2; }
      .agentt { font-size: 16px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
      .agentd { font-size: 12.5px; fill: #9fb0c8; text-anchor: middle; }
      .wire { stroke: #ed1c24; stroke-width: 3; fill: none; }
      .wireg { stroke: #4a90d9; stroke-width: 2.5; fill: none; stroke-dasharray: 7 5; }
      .tag { font-size: 13px; fill: #7f8ca3; }
    </style>
  </defs>
  <rect width="1560" height="900" fill="#0b1220"/>
  <text x="40" y="52" class="title">Radeon<tspan class="accent">Pilot</tspan> — Agent Architecture</text>
  <text x="40" y="80" class="tag">Multi-agent ROCm inference operations · every generation served by the local Radeon endpoint</text>

  <!-- Gradio UI -->
  <rect x="40" y="120" width="330" height="120" class="box"/>
  <text x="60" y="155" class="lbl">Gradio Ops Console</text>
  <text x="60" y="182" class="sub">chat · diagnose · knowledge</text>
  <text x="60" y="205" class="sub">audit &amp; runtime badge</text>
  <text x="60" y="227" class="tag">127.0.0.1:7860</text>

  <!-- Python controller -->
  <rect x="40" y="300" width="330" height="220" class="box"/>
  <text x="60" y="335" class="lbl">Python Controller</text>
  <text x="60" y="365" class="sub">• deterministic tools</text>
  <text x="72" y="387" class="tag">rocm-smi · amd-smi · endpoint probes</text>
  <text x="60" y="414" class="sub">• local BM25 RAG (knowledge corpus)</text>
  <text x="60" y="441" class="sub">• SQLite memory + audit</text>
  <text x="60" y="468" class="sub">• permission gates (least privilege)</text>
  <text x="60" y="497" class="tag">src/radeonpilot</text>

  <!-- Pi bridge -->
  <rect x="460" y="120" width="640" height="400" class="boxhl"/>
  <text x="480" y="158" class="lbl">Localhost Pi Bridge (Node 22, Pi Agent Harness 0.83.0)</text>
  <text x="480" y="182" class="tag">loopback-only · tools disabled · evidence-pack input · strict JSON contracts</text>

  <rect x="490" y="210" width="275" height="70" class="agent"/>
  <text x="627" y="238" class="agentt">EnvDoctor</text>
  <text x="627" y="260" class="agentd">GPU / ROCm health diagnosis</text>

  <rect x="795" y="210" width="275" height="70" class="agent"/>
  <text x="932" y="238" class="agentt">DeployPlanner</text>
  <text x="932" y="260" class="agentd">engine, context, launch flags</text>

  <rect x="490" y="300" width="275" height="70" class="agent"/>
  <text x="627" y="328" class="agentt">BenchmarkRunner</text>
  <text x="627" y="350" class="agentd">interprets measured records only</text>

  <rect x="795" y="300" width="275" height="70" class="agent"/>
  <text x="932" y="328" class="agentt">OptimAnalyst</text>
  <text x="932" y="350" class="agentd">evidence-cited optimizations</text>

  <text x="780" y="412" class="tag" text-anchor="middle">four specialists in parallel</text>
  <rect x="580" y="430" width="400" height="70" class="agent"/>
  <text x="780" y="458" class="agentt">OpsCommander</text>
  <text x="780" y="480" class="agentd">synthesis + approval-gated action plan</text>

  <!-- Endpoint + GPU -->
  <rect x="1160" y="120" width="360" height="150" class="box"/>
  <text x="1180" y="155" class="lbl">Model Endpoint</text>
  <text x="1180" y="185" class="sub">OpenAI-compatible API</text>
  <text x="1180" y="210" class="sub">llama.cpp (HIP) · Qwen3-8B GGUF</text>
  <text x="1180" y="235" class="tag">127.0.0.1:8000 · F16 + Q4_K_M</text>

  <rect x="1160" y="320" width="360" height="150" class="boxhl"/>
  <text x="1180" y="355" class="lbl">AMD Radeon GPU</text>
  <text x="1180" y="385" class="sub">gfx1100 · 48 GB VRAM · ROCm 7.2.1</text>
  <text x="1180" y="412" class="sub">attestation: amd-smi occupancy</text>
  <text x="1180" y="440" class="tag">RADEON ATTESTED badge</text>

  <!-- Knowledge -->
  <rect x="460" y="580" width="640" height="120" class="box"/>
  <text x="480" y="615" class="lbl">Local Knowledge Corpus (RAG source)</text>
  <text x="480" y="645" class="sub">ROCm diagnostics · deployment playbook · optimisation policy</text>
  <text x="480" y="670" class="sub">benchmark protocol · safety &amp; permission policy</text>

  <!-- Memory -->
  <rect x="40" y="580" width="330" height="120" class="box"/>
  <text x="60" y="615" class="lbl">SQLite Ops Memory</text>
  <text x="60" y="645" class="sub">multi-turn sessions · snapshots</text>
  <text x="60" y="670" class="sub">redacted JSONL audit trail</text>

  <!-- Benchmark evidence -->
  <rect x="1160" y="580" width="360" height="120" class="box"/>
  <text x="1180" y="615" class="lbl">Benchmark Evidence</text>
  <text x="1180" y="645" class="sub">baseline / optimized / quantized JSON</text>
  <text x="1180" y="670" class="sub">raw samples + prompt hash + attestation</text>

  <!-- wires -->
  <path d="M205,240 L205,300" class="wire" marker-end="url(#arrow)"/>
  <path d="M370,400 L460,340" class="wire" marker-end="url(#arrow)"/>
  <path d="M627,280 L735,430" class="wireg"/>
  <path d="M932,280 L825,430" class="wireg"/>
  <path d="M627,370 L735,435" class="wireg"/>
  <path d="M932,370 L825,435" class="wireg"/>
  <path d="M1100,320 L1160,220" class="wire" marker-end="url(#arrow)"/>
  <path d="M1340,270 L1340,320" class="wire" marker-end="url(#arrow)"/>
  <path d="M205,520 L205,580" class="wireg" marker-end="url(#arrow)"/>
  <path d="M780,520 L780,580" class="wireg" marker-end="url(#arrow)"/>
  <path d="M1340,470 L1340,580" class="wireg" marker-end="url(#arrow)"/>

  <text x="40" y="860" class="tag">Fail-closed pi mode: bridge or endpoint failure never substitutes demo output · demo mode is labelled GPU UNATTESTED</text>
</svg>
