[project]
name = "autoflow"
version = "0.6.0"
description = "AutoFlow Compiler - 自然语言驱动 -> OpenAdapt Bundle 自动化系统 (MVP)"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "rich>=13.7",
    "requests>=2.31",
    "PyYAML>=6.0",
    "openai>=1.30",
    "pynput>=1.8",
    "pyautogui>=0.9.54",
    "pypdf>=5.0",
    "keyring>=25.0",
    "pywinauto>=0.6.9",
]

[project.optional-dependencies]
replay = [
    "pyautogui>=0.9.54",
    "Pillow>=10.0",
    "pyperclip>=1.8",
]
registry = [
    "sentence-transformers>=2.7",
]
dev = [
    "pytest>=8.0",
    "reportlab>=4.0",
]

[project.scripts]
autoflow = "autoflow.cli:app"
autoflow-gui = "autoflow.webapp:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["autoflow*"]

[tool.setuptools.package-data]
autoflow = ["webui/*.html", "webui/*.css", "webui/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
