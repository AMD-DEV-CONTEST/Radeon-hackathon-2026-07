  <section class="page-heading"><p class="eyebrow">任务中心</p><h1>告诉电脑你要的最终结果</h1><p>AutoFlow 会持续观察、操作并验证；运行记录只保留在这个页面。</p></section>
  <section class="command-card"><label for="command">这次要电脑完成什么？</label><div class="composer"><textarea id="command" rows="3" placeholder="例如：打开酷狗音乐，搜索周杰伦的歌并播放"></textarea><button id="send" type="button">开始 <span>→</span></button></div><div class="examples"><button>打开酷狗音乐</button><button>打开下载文件夹</button><button>把 D:\资料里的 PDF 转成 TXT 保存到 D:\输出</button></div><label class="silent-toggle"><input id="silent-mode" type="checkbox" checked><span><strong>后台优先</strong><small>默认静默操作控件；只有快捷键或坐标步骤会短暂切换窗口</small></span></label><p class="hint">执行中可以留在本页查看进度。任务结束后只显示黑色最终答复。</p></section>
  <section id="conversation" class="conversation" aria-live="polite"><article class="message assistant"><div class="avatar">A</div><div><strong>任务区已准备好</strong><p>输入一个明确的最终目标即可。模型设置请前往“模型中心”。</p></div></article></section>
</main><div id="toast" class="toast"></div><script src="/agent.js" defer></script></body></html>
