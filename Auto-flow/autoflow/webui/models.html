<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>模型中心 · AutoFlow</title>
  <link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/pages.css"><link rel="stylesheet" href="/model-center.css">
</head>
<body><main class="shell">
  <header><a class="brand" href="/"><span>A</span> AutoFlow</a><nav><a href="/">首页</a><a href="/agent.html">任务中心</a><a class="active" href="/models.html">模型中心</a></nav><div id="ai-status" class="local"><i></i>读取中</div></header>
  <section class="page-heading"><p class="eyebrow">模型中心</p><h1>先选服务商，再填它真正需要的内容</h1><p>每个入口都标明凭证要求。Key 只保存在 Windows 凭据库，不写入项目文件或日志。</p></section>
  <section class="model-layout">
    <div><div class="section-title"><h2>1. 选择服务商</h2><span id="provider-count">读取中</span></div><div id="provider-grid" class="provider-grid"></div></div>
    <aside class="provider-form">
      <p class="eyebrow">2. 配置连接</p><h2 id="provider-title">请选择服务商</h2><p id="provider-description">左侧会明确显示每个服务商所需内容。</p>
      <label id="api-key-label" for="api-key">API Key</label><input id="api-key" type="password" autocomplete="off" placeholder="粘贴完整 Key">
      <div id="base-url-field" hidden><label for="base-url">API 接口地址（必填）</label><input id="base-url" type="url" placeholder="https://example.com/v1"></div>
      <div id="manual-model-field" hidden><label id="manual-model-label" for="manual-model">模型 ID（必填）</label><input id="manual-model" type="text" placeholder="填写模型或 Endpoint ID"></div>
      <details><summary>可选：额外 Account / Project ID</summary><label for="account-id">Account / Project ID</label><input id="account-id" type="text" autocomplete="off"><label for="account-header">对应请求头名称</label><input id="account-header" type="text" value="X-Account-ID"></details>
      <button id="connect-provider" class="wide-button" type="button">连接并验证</button><small id="model-note">尚未连接</small>
    </aside>
  </section>
  <section id="model-picker" class="model-picker" hidden><div><p class="eyebrow">3. 选择具体模型</p><h2>账号返回的可用模型</h2><p>当前选择：<strong id="current-model">—</strong></p></div><select id="model-select"></select></section>
  <section class="disconnect-row"><button id="disconnect-key" class="danger-link" type="button" hidden>断开当前连接并删除本机凭据</button></section>
</main><div id="toast" class="toast"></div><script src="/models.js" defer></script></body></html>
