model:
  name: "microsoft/Phi-3-mini-4k-instruct"
  quantize: "4bit"          # none | 4bit | 8bit
  max_new_tokens: 1024
  temperature: 0.3
  top_p: 0.9
  device: "auto"            # auto | cuda | cpu

agent:
  max_iterations: 12
  verbose: true
  use_planner: true

memory:
  max_history: 20
  vector_store_path: "./data/chroma_db"

rag:
  chunk_size: 512
  chunk_overlap: 64
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  persist_path: "./data/chroma_rag"

tools:
  enable_python: true
  enable_web: false         # set true only if you want online search
  enable_fs: true
  enable_rag: true
