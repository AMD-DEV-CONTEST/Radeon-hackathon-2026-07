[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radeon-agents"
version = "1.0.0"
description = "Intelligent local multi-agent framework optimized for AMD Radeon GPUs and ROCm"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "RadeonAgents Team"}
]
keywords = ["ai", "agents", "rocm", "amd", "radeon", "llm", "local-inference"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.3.0",
    "transformers>=4.43.0",
    "accelerate>=0.33.0",
    "bitsandbytes>=0.43.1",
    "sentence-transformers>=3.0.1",
    "chromadb>=0.5.3",
    "gradio>=4.44.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.8.0",
    "rich>=13.7.1",
    "huggingface_hub>=0.24.0",
]

[project.optional-dependencies]
web = ["duckduckgo-search>=6.2.0"]
dev = ["pytest>=8.3.0"]

[project.scripts]
radeon-agents = "src.ui.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.md"]
