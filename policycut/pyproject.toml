[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policycut"
version = "1.0.0"
description = "PolicyCut: local, policy-driven privacy video redaction editor (AMD Radeon / ROCm)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PolicyCut Team" }]
keywords = ["privacy", "video", "redaction", "pii", "rocm", "amd"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Topic :: Multimedia :: Video",
    "Topic :: Security",
]

dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "numpy",
    "opencv-python-headless",
    "python-multipart",
]

[project.optional-dependencies]
# Heavy ML stack. On AMD Radeon Cloud, torch comes preinstalled from ROCm
# wheels — do NOT pip install torch there (see requirements-rocm.txt).
ml = [
    "transformers>=4.44",
    "accelerate",
    "scipy",
    "huggingface_hub",
    "presidio-analyzer",
    "spacy",
]
dev = [
    "pytest",
    "httpx",
]

[tool.setuptools.packages.find]
include = ["policycut*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
