<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PolicyCut — Processing</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <a href="index.html" class="btn ghost sm">&larr; Projects</a>
    <span class="brand"><span class="brand-dot"></span>PolicyCut</span>
    <span id="proj-name" class="muted"></span>
    <span class="spacer"></span>
    <span id="gpu-chip" class="chip"><span class="dot"></span><span>…</span></span>
    <span class="badge-local">&#128274; Local processing only</span>
  </header>

  <main class="page" style="max-width:900px;">
    <div id="error-banner" class="banner error hidden"></div>
    <div id="cancel-banner" class="banner warn hidden">Job was cancelled.</div>

    <section class="panel">
      <div class="row" style="margin-bottom:12px;">
        <h1 class="grow" id="page-title">Analyzing video</h1>
        <button id="btn-cancel" class="btn danger sm">Cancel</button>
        <button id="btn-retry" class="btn primary sm hidden">Retry</button>
      </div>

      <div class="progress blue" style="height:10px;"><div class="fill" id="overall-fill"></div></div>
      <div class="row" style="margin-top:8px;">
        <span id="current-msg" class="grow muted small">Waiting for job…</span>
        <span id="overall-pct" class="mono small">0%</span>
      </div>

      <hr class="sep">

      <div class="row wrap" style="align-items:flex-start; gap:24px;">
        <div style="flex:1 1 300px; min-width:260px;">
          <h3>Stages</h3>
          <ul class="stage-list" id="stage-list"></ul>
        </div>
        <div style="flex:1 1 380px; min-width:300px;">
          <h3>Metrics</h3>
          <div class="stat-tiles" style="margin-bottom:12px;">
            <div class="stat-tile"><div class="v" id="m-elapsed">0:00</div><div class="k">Elapsed</div></div>
            <div class="stat-tile"><div class="v" id="m-eta">—</div><div class="k">ETA</div></div>
            <div class="stat-tile"><div class="v" id="m-gpu" style="font-size:13px;">—</div><div class="k">GPU</div></div>
          </div>
          <table class="data" id="metrics-table">
            <thead>
              <tr><th>Stage</th><th>Wall s</th><th>FPS</th><th>Peak VRAM MB</th><th>Precision</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/processing.js"></script>
</body>
</html>
