name: Radeon-hackathon-2026-07
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy
  - scipy
  - gymnasium
  - tensorboard
  - pyyaml
  - tqdm
  - pytest
  - h5py
  - pip
  - pip:
      # ROCm wheels for Linux x86_64.  Keep this as an *extra* index so the
      # remaining project dependencies continue to resolve from PyPI.
      - --extra-index-url https://download.pytorch.org/whl/rocm6.4
      - torch==2.9.1+rocm6.4
      - torchvision==0.24.1+rocm6.4
      - torchaudio==2.9.1+rocm6.4
      - genesis-world[render]
      - cleanrl
      - onnx
      - opencv-python
