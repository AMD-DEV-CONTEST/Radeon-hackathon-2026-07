# ============================================================
# AMD AI Studio — Docker Compose 配置
# 一键启动包含 ROCm GPU 加速的完整环境
# 用法: docker compose up -d
# ============================================================

version: "3.9"

services:
  amd-ai-studio:
    build:
      context: .
      dockerfile: Dockerfile
    image: amd-ai-studio:latest
    container_name: amd-ai-studio
    restart: unless-stopped

    # ── ROCm GPU 透传 ──
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - render
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN

    # ── 网络 ──
    ports:
      - "7860:7860"    # Gradio Web UI
      - "8000:8000"    # API 服务（预留）
    network_mode: host

    # ── 卷挂载 ──
    volumes:
      # 模型缓存（持久化，避免重复下载）
      - type: volume
        source: hf-cache
        target: /workspace/.cache/huggingface
      - type: volume
        source: modelscope-cache
        target: /workspace/.cache/modelscope
      # 输出目录
      - type: volume
        source: outputs
        target: /workspace/amd-ai-studio/outputs
      # 代码热重载（开发模式）
      - type: bind
        source: .
        target: /workspace/amd-ai-studio
        consistency: cached

    # ── 环境变量 ──
    environment:
      # ROCm 优化
      - HSA_OVERRIDE_GFX_VERSION=11.0.0
      - HIP_VISIBLE_DEVICES=0
      - ROCR_VISIBLE_DEVICES=0
      - GPU_MAX_HW_QUEUES=2
      - FLASH_ATTENTION_TRITON_AMD_ENABLE=TRUE
      # 国内镜像（按需启用）
      # - HF_ENDPOINT=https://hf-mirror.com
      # - MODELSCOPE_CACHE=/workspace/.cache/modelscope
      # 启动参数
      - HOST=0.0.0.0
      - PORT=7860
      - SHARE=false

    # ── 资源限制 ──
    deploy:
      resources:
        reservations:
          devices:
            - driver: amd
              capabilities: [gpu]

    # ── 健康检查 ──
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # ── 日志 ──
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

volumes:
  hf-cache:
  modelscope-cache:
  outputs: